version = 1

# Tagged as tests so analyzer rules meant for shipped code (no-op stubs,
# assert-shaped "redundant" literals) stop grading the harness files.
test_patterns = ["test/**", "lib/**/test/**"]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  # Without these DeepSource assumes browser scripts and flags every
  # top-level `function` in a CommonJS module as global-scope pollution —
  # the repo's dominant false-positive class (see PR #307's review round).
  environment = ["nodejs"]
  module_system = "commonjs"

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "docker"
enabled = true
