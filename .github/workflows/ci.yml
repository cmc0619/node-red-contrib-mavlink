name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node_version: 20.19.0
          - os: ubuntu-latest
            node_version: 22.13.0
          # Windows leg earns its place: the CRLF bug (#101) reached main
          # because every job ran on Linux. .gitattributes is the fix; this is
          # what would have caught it.
          - os: windows-latest
            node_version: 22.13.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Ships-only, high and above. Dev advisories do not reach a user, and the
      # known moderate xml2js chain is accepted in SECURITY.md — gating on those
      # would mean a permanently red job nobody reads (#106).
      - name: Audit shipped dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

      - name: Package contents
        run: npm pack --dry-run

      - name: Node-RED package validation
        if: matrix.node_version == '22.13.0' && matrix.os == 'ubuntu-latest'
        run: npm run validate:node-red

  package-install:
    name: Package and install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack, install, and deploy without optional native dependencies
        shell: bash
        run: |
          archive="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          install_root="$RUNNER_TEMP/package-install"
          npm install \
            --prefix "$install_root" \
            --omit=dev \
            --omit=optional \
            "$RUNNER_TEMP/$archive" \
            node-red@4.1.11 \
            node-red-node-test-helper@0.3.6
          MAVLINK_PACKAGE_ROOT="$install_root/node_modules/@cmc0619/node-red-contrib-mavlink" \
            NODE_PATH="$install_root/node_modules" \
            node --test integration/node-red-smoke.test.js

  node-red-runtime:
    name: Node-RED ${{ matrix.node_red }} (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: 20.19.0
            node_red: 4.1.11
          - node_version: 22.13.0
            node_red: 5.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Select Node-RED runtime
        env:
          NODE_RED_VERSION: ${{ matrix.node_red }}
        run: npm install --no-save --package-lock=false "node-red@$NODE_RED_VERSION"

      - name: Verify selected runtime
        env:
          NODE_RED_VERSION: ${{ matrix.node_red }}
        run: |
          node -e 'const actual=require("node-red/package.json").version; if (actual !== process.env.NODE_RED_VERSION) throw new Error("expected Node-RED " + process.env.NODE_RED_VERSION + ", got " + actual)'

      - name: Deploy and redeploy smoke
        run: npm run test:runtime
