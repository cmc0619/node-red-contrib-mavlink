name: Refresh MAVLink seed

# On-demand refresh of the stamped seed blob from upstream XML, committed
# straight to the branch it runs on — gated on the full test suite passing
# against the fresh seed, so an upstream XML change cannot land main red.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'mavlink/mavlink ref (branch, tag, or SHA)'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate seed
        env:
          # Pass dispatch input via env so it is never interpolated into the shell script.
          MAVLINK_REF: ${{ inputs.ref || 'master' }}
        run: node scripts/generate-seed.js --repo mavlink/mavlink --ref "$MAVLINK_REF"

      - name: Test against the fresh seed
        run: npm test

      - name: Commit the refreshed seed
        run: |
          if [ -z "$(git status --porcelain -- seed/)" ]; then
            echo "Seed unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/
          git commit -m 'chore(seed): refresh MAVLink dialect seed'
          git push
