name: Refresh MAVLink seed

# Weekly auto-refresh of seed/mavlink.seed.gz from upstream XML.
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'mavlink/mavlink ref (branch, tag, or SHA)'
        required: false
        default: 'master'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate seed
        run: node scripts/generate-seed.js --repo mavlink/mavlink --ref "${{ inputs.ref || 'master' }}"

      - name: Open PR when the seed changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(seed): refresh MAVLink dialect seed'
          title: 'chore(seed): refresh MAVLink dialect seed'
          body: |
            Automated refresh of `seed/mavlink.seed.gz` from `mavlink/mavlink`.

            Stamp and commit are inside the blob manifest (`stamp`, `commit`, `fetchedAt`).
            One file change — not a tree of XML/JSON dialects.
          branch: chore/refresh-mavlink-seed
          delete-branch: true
          add-paths: |
            seed/mavlink.seed.gz
            seed/README.md
