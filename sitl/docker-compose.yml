# Five ArduPilot + five PX4 + companion + payload SITL instances.
# Usage:
#   docker compose --profile sitl up -d --build
#   docker compose --profile sitl --profile nodered up -d --build
#
# Node-RED (host or nodered profile) should bind 0.0.0.0:
#   AP GCS 14550→14551 | PX4 GCS 14560→14561
#   AP companion 14540→14541 | PX4 companion 14542→14543
#   AP payload 14570→14571 (sysid 31; PX4 payload 32 reserved)
# Vehicles send to the Compose bridge gateway; a 127.0.0.1 bind misses that path.

x-ap: &ap
  build:
    context: .
    dockerfile: Dockerfile.ardupilot
  image: nrc-mavlink-ap-sitl:local
  profiles: ["sitl"]
  restart: unless-stopped
  depends_on:
    prepare-logs:
      condition: service_completed_successfully
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &ap-env
    OUT_HOST: host.docker.internal
    OUT_PORT: "14550"

x-px4: &px4
  # Official prebuilt SIH image, pinned to the digest validated with this
  # entrypoint (v1.18.0-beta1 / Hub latest as of 2026-07-08). Lab wiring is the
  # mounted entrypoint — do not float on :latest.
  image: px4io/px4-sitl@sha256:bab4270c4849b7027df4bd760c79d743d738c81d7830dde14c4cc5714f781216
  entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-px4.sh"]
  profiles: ["sitl"]
  restart: unless-stopped
  depends_on:
    prepare-logs:
      condition: service_completed_successfully
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &px4-env
    OUT_HOST: host.docker.internal
    OUT_PORT: "14560"
    PX4_SIM_MODEL: sihsim_quadx
    HEADLESS: "1"

services:
  # Create host log dirs as the invoking user before vehicles mount them.
  # Otherwise Docker creates root-owned bind sources and the unprivileged
  # sitl/px4 users cannot write DataFlash / ulogs.
  prepare-logs:
    profiles: ["sitl"]
    image: busybox:1.36
    container_name: nrc-prepare-logs
    user: "0:0"
    volumes:
      - ./logs:/logs
    command:
      - sh
      - -c
      - |
        set -eu
        for d in ap-1 ap-2 ap-3 ap-4 ap-5 \
                 px4-11 px4-12 px4-13 px4-14 px4-15 \
                 ap-companion-20 px4-companion-21 \
                 ap-payload-31; do
          mkdir -p "/logs/$$d"
        done
        chmod -R a+rwX /logs

  ap-1:
    <<: *ap
    container_name: nrc-ap-1
    environment:
      <<: *ap-env
      SYSID: "1"
      INSTANCE: "0"
    volumes:
      - ./logs/ap-1:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  ap-2:
    <<: *ap
    container_name: nrc-ap-2
    environment:
      <<: *ap-env
      SYSID: "2"
      INSTANCE: "1"
    volumes:
      - ./logs/ap-2:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  ap-3:
    <<: *ap
    container_name: nrc-ap-3
    environment:
      <<: *ap-env
      SYSID: "3"
      INSTANCE: "2"
    volumes:
      - ./logs/ap-3:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  ap-4:
    <<: *ap
    container_name: nrc-ap-4
    environment:
      <<: *ap-env
      SYSID: "4"
      INSTANCE: "3"
    volumes:
      - ./logs/ap-4:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  ap-5:
    <<: *ap
    container_name: nrc-ap-5
    environment:
      <<: *ap-env
      SYSID: "5"
      INSTANCE: "4"
    volumes:
      - ./logs/ap-5:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  px4-11:
    <<: *px4
    container_name: nrc-px4-11
    environment:
      <<: *px4-env
      SYSID: "11"
      INSTANCE: "0"
    volumes:
      - ./logs/px4-11:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  px4-12:
    <<: *px4
    container_name: nrc-px4-12
    environment:
      <<: *px4-env
      SYSID: "12"
      INSTANCE: "1"
    volumes:
      - ./logs/px4-12:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  px4-13:
    <<: *px4
    container_name: nrc-px4-13
    environment:
      <<: *px4-env
      SYSID: "13"
      INSTANCE: "2"
    volumes:
      - ./logs/px4-13:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  px4-14:
    <<: *px4
    container_name: nrc-px4-14
    environment:
      <<: *px4-env
      SYSID: "14"
      INSTANCE: "3"
    volumes:
      - ./logs/px4-14:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  px4-15:
    <<: *px4
    container_name: nrc-px4-15
    environment:
      <<: *px4-env
      SYSID: "15"
      INSTANCE: "4"
    volumes:
      - ./logs/px4-15:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  ap-companion-20:
    <<: *ap
    container_name: nrc-ap-companion-20
    environment:
      <<: *ap-env
      SYSID: "20"
      INSTANCE: "10"
      OUT_PORT: "14540"
    volumes:
      - ./logs/ap-companion-20:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  # Payload-class AP: --gimbal + mount/camera defaults for mavlink-payload SITL.
  # Isolated sysid/ports so GCS fleet examples never share the link (same idea
  # as companion 20). PX4 payload sysid 32 is reserved — SIH has no gimbal/camera.
  ap-payload-31:
    <<: *ap
    container_name: nrc-ap-payload-31
    environment:
      <<: *ap-env
      SYSID: "31"
      INSTANCE: "20"
      OUT_PORT: "14570"
      ENABLE_GIMBAL: "1"
      EXTRA_DEFAULTS: "/params/ap-payload-gimbal.parm"
    volumes:
      - ./logs/ap-payload-31:/logs
      - ./params/ap-logging.parm:/params/ap-logging.parm:ro
      - ./params/copter.parm:/params/copter.parm:ro
      - ./params/ap-payload-gimbal.parm:/params/ap-payload-gimbal.parm:ro
      - ./scripts/entrypoint-ap.sh:/usr/local/bin/entrypoint-ap.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro

  px4-companion-21:
    <<: *px4
    container_name: nrc-px4-companion-21
    environment:
      <<: *px4-env
      SYSID: "21"
      INSTANCE: "10"
      OUT_PORT: "14542"
    volumes:
      - ./logs/px4-companion-21:/logs
      - ./scripts/entrypoint-px4.sh:/usr/local/bin/entrypoint-px4.sh:ro
      - ./scripts/resolve-out-host.sh:/usr/local/bin/resolve-out-host.sh:ro
      - ./params/px4-logging.env:/params/px4-logging.env:ro

  nodered:
    profiles: ["nodered"]
    image: nodered/node-red:4.0
    container_name: nrc-nodered
    restart: unless-stopped
    # Host network so example flows binding 0.0.0.0:14550/14560/… receive
    # SITL UDP that vehicles send to the Compose bridge gateway.
    # Editor: http://127.0.0.1:1880
    network_mode: host
    environment:
      TZ: UTC
    volumes:
      - nodered-data:/data
      - ../:/opt/node-red-contrib-mavlink:ro
      - ./nodered/install-and-start.sh:/install-and-start.sh:ro
    entrypoint: ["/bin/bash", "/install-and-start.sh"]

volumes:
  nodered-data:
