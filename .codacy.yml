---
# Codacy skips the test tree (owner ruling, 2026-08-12).
#
# The trigger was `detect-non-literal-fs-filename` raised as *critical
# Security* against a test that reads `nodes/*.html` to check them. Those
# rules exist for code that handles untrusted input; a test reading the
# repo's own source files by construction handles none. The finding was
# unfixable on its own terms, too — a sweep that takes a literal filename
# stops covering the files added after it was written, which is the only
# reason to have one.
#
# Scope note: Codacy's config excludes *paths*, not categories, so this
# takes the test tree out of Codacy's analysis entirely rather than out of
# its Security category alone. Duplication is the other metric affected,
# and losing it there is no loss — near-identical arrange/act/assert blocks
# are how a test file is supposed to read.
#
# `examples/**` is out for the same reason one step further along: the flows
# are saved Node-RED JSON, not source. Every one of them repeats the same
# node scaffolding — that is what makes them readable side by side — so the
# duplication metric measures the format rather than the work, and there is
# no code in them for a security rule to be right about.
#
# Runtime and editor code is untouched by this: `lib/**`, `nodes/**` and
# `integration/**` are still fully analysed, and they are where a real
# security finding would matter.
exclude_paths:
  # Both spellings, measured, because Codacy's glob engine anchors them
  # differently and each alone leaves a test tree analysed. `test/**` is
  # root-anchored and missed `lib/codec/test/` for months (found 2026-08-14 —
  # 21 of 31 hits for one broken PMD pattern were in that directory alone).
  # The obvious fix, `**/test/**` alone, then *un*-excluded the root tree on
  # the very next push — the leading `**/` requires at least one parent
  # directory, and six critical-Security findings against `test/` came back
  # within the hour. The pair covers both anchorings.
  - 'test/**'
  - '**/test/**'
  - 'examples/**'
