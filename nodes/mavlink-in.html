<script type="text/javascript">
  (function () {
    /** @type {Object<string, {messages:Array, enums:Object, dialect:string}>} */
    var _msgCatalogByKey = {};
    var _msgRequestSeq = 0;

    function loadMessagesCatalog(cb) {
      // mavlink-in is wire-only (no Build tier): the bound Connection's Vehicle
      // Profile is the sole catalog source (§6). No connection / no profile
      // resolves to an empty catalog — never a silent `ardupilotmega`.
      var target = RED.mavlink.resolveCatalogTarget({ isBuild: false });
      var seq = ++_msgRequestSeq;
      if (_msgCatalogByKey[target.key]) {
        cb(_msgCatalogByKey[target.key]);
        return;
      }
      if (!target.query) {
        var emptyCatalog = { messages: [], enums: {}, dialect: '' };
        _msgCatalogByKey[target.key] = emptyCatalog;
        cb(emptyCatalog);
        return;
      }
      $.getJSON(RED.mavlink.adminApiUrl('/mavlink/build/messages'), target.query, function (data) {
        if (seq !== _msgRequestSeq) return;
        var catalog = {
          messages: data.messages || [],
          enums: data.enums || {},
          dialect: data.dialect || target.dialect,
        };
        _msgCatalogByKey[target.key] = catalog;
        cb(catalog);
      }).fail(function () {
        if (seq !== _msgRequestSeq) return;
        cb({ messages: [], enums: {}, dialect: target.dialect });
      });
    }

    function buildMessageDropdown(node, catalog) {
      var sel = $('#node-input-message');
      var current = sel.val();
      var saved = node.message !== undefined && node.message !== null
        ? String(node.message)
        : '';
      var prefer = current || saved;

      sel.empty();
      sel.append($('<option></option>').val('').text('All messages'));
      for (var i = 0; i < (catalog.messages || []).length; i++) {
        var entry = catalog.messages[i];
        var $opt = $('<option></option>').val(entry.name).text(entry.label);
        if (entry.description) $opt.attr('title', entry.description);
        sel.append($opt);
      }
      if (prefer && !sel.find('option[value="' + prefer + '"]').length) {
        sel.append($('<option></option>').val(prefer).text(prefer + ' (not in dialect)'));
      }
      if (prefer) sel.val(prefer);
      function syncMessageTitle() {
        var tip = sel.find('option:selected').attr('title') || '';
        if (tip) sel.attr('title', tip);
        else sel.removeAttr('title');
      }
      syncMessageTitle();
      sel.off('change.mavMsgTip').on('change.mavMsgTip', syncMessageTitle);
    }

    function refreshMessageOptions(node) {
      loadMessagesCatalog(function (catalog) {
        buildMessageDropdown(node, catalog);
      });
    }

    RED.nodes.registerType('mavlink-in', {
      category: 'mavlink',
      color: '#6ea6d7',
      defaults: {
        name:        { value: '' },
        connection:  { value: '', type: 'mavlink-connection', required: true },
        message:     { value: '' },
        sysid:       { value: '', validate: RED.mavlink.validateUint8(0) },
        compid:      { value: '' },
        changedOnly: { value: false },
        rateLimit:   { value: 0 },
      },
      inputs: 0,
      outputs: 1,
      outputLabels: ['decoded message'],
      icon: 'font-awesome/fa-arrow-down',
      paletteLabel: 'mavlink in',
      label: function () {
        var label = this.name || this.message || 'mavlink in';
        return label;
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        var node = this;
        if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
          RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        }
        $('#node-input-connection').on('change', function () {
          refreshMessageOptions(node);
        });
        refreshMessageOptions(node);
        if (RED.mavlink && RED.mavlink.loadEnumsCatalog) {
          RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
            RED.mavlink.fillCompIdSelect(
              $('#node-input-compid'),
              (catalog.enums || {}).MAV_COMPONENT || [],
              { allowEmpty: true, emptyLabel: 'Any component', saved: node.compid }
            );
          });
        }
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <hr/>
  <div class="form-row">
    <label for="node-input-message"><i class="fa fa-filter"></i> Message</label>
    <select id="node-input-message" style="width:70%"></select>
  </div>
  <div class="form-row">
    <label for="node-input-sysid"><i class="fa fa-filter"></i> Sysid</label>
    <input type="number" id="node-input-sysid" min="0" max="255" placeholder="blank = all" style="width:80px">
  </div>
  <div class="form-row">
    <label for="node-input-compid"><i class="fa fa-filter"></i> Compid</label>
    <select id="node-input-compid" style="width:80px"></select>
  </div>
  <hr/>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-changedOnly" style="width:auto">
    <label for="node-input-changedOnly" style="width:auto"> Changed only</label>
  </div>
  <div class="form-row">
    <label for="node-input-rateLimit"><i class="fa fa-tachometer"></i> Rate limit</label>
    <input type="number" id="node-input-rateLimit" placeholder="0" min="0" step="0.1" style="width:80px">
    <span> msg/s (0 = unlimited)</span>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-in">
  <p>Subscribe to decoded MAVLink traffic from a Connection.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd>Message name, e.g. <code>HEARTBEAT</code>.</dd>
    <dt>payload <span class="property-type">object</span></dt>
    <dd>Decoded field values keyed by field name (snake_case).</dd>
    <dt>sysid <span class="property-type">number</span></dt>
    <dd>Source system id.</dd>
    <dt>compid <span class="property-type">number</span></dt>
    <dd>Source component id.</dd>
    <dt>trusted <span class="property-type">boolean</span></dt>
    <dd>Whether the frame passed signing verification on the connection.</dd>
  </dl>
  <h3>Details</h3>
  <p><b>Message</b>, <b>Sysid</b>, and <b>Compid</b> filters are all optional;
  leave blank to match all traffic on the connection.</p>
  <p><b>Changed only</b>: only forward a message when its field values differ
  from the previous delivery for the same (message, sysid, compid) tuple.</p>
  <p><b>Rate limit</b>: maximum messages per second per (message, sysid, compid)
  tuple; 0 means unlimited.</p>
</script>
