<script type="text/javascript">
  (function () {
    /** Messages catalog request sequence (DESIGN.md §6 shared loadCatalog). */
    var _msgCatalog = { seq: 0 };

    function loadMessagesCatalog(cb) {
      // mavlink-in is wire-only (no Build tier): the bound Connection's Vehicle
      // Profile is the sole catalog source (§6). No connection / no profile
      // resolves to an empty catalog — never a silent `ardupilotmega`.
      RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, cb, {
        isBuild: false,
        listKey: 'messages'
      });
    }

    /** Catalog the loader last handed this dialog — rows paint from this. */
    var _currentMsgCatalog = null;

    /**
     * Fill one row's select from the catalog, keeping whatever it already
     * shows. A row can be added before the catalog arrives (or while a
     * Connection change is reloading it), so painting is separate from adding
     * and every existing row is repainted when a catalog lands.
     *
     * @param {JQuery} $sel  the row's select
     * @param {string} [saved]  value to select, when restoring a saved row
     */
    function paintRow($sel, saved) {
      var want = saved !== undefined ? saved : $sel.val();
      RED.mavlink.fillEnumSelect($sel, (_currentMsgCatalog || {}).messages || [], {
        saved: want,
        preferLive: false,
        allowEmpty: true,
        emptyLabel: '— select message —',
        valueKey: 'name',
        titleNamespace: 'mavMsgTip',
        triggerChange: false
      });
    }

    function refreshMessageOptions() {
      loadMessagesCatalog(function (catalog) {
        _currentMsgCatalog = catalog;
        $('#mav-in-messages').editableList('items').each(function () {
          paintRow($(this).find('select'));
        });
      });
    }

    RED.nodes.registerType('mavlink-in', {
      category: 'mavlink',
      color: '#6ea6d7',
      defaults: {
        name:        { value: '' },
        connection:  { value: '', type: 'mavlink-connection', required: true },
        // A list, not a single name (#211). An empty list matches every
        // message, which is what a blank single filter used to mean. The
        // runtime subscribes straight off this array, so the ring guarantees
        // the shape oneditsave produces: an array of non-blank names.
        messages:    {
          value: [],
          validate: function (v, _opt) {
            if (!Array.isArray(v)) return 'must be a list of message names';
            return v.every(function (name) {
              return !RED.mavlink.isBlank(name);
            }) || 'must not contain a blank message name';
          },
        },
        sysid:       { value: '', validate: RED.mavlink.validateUint8(0) },
        compid:      { value: '', validate: RED.mavlink.validateUint8(0) },
        changedOnly: { value: false },
        // Comma-separated decoded field names. A token that is not a field
        // name — a stray comma, a space mid-name — can never match a decoded
        // field, and under changed-only that suppresses the stream after one
        // delivery; red it at deploy instead.
        changedFields: {
          value: '',
          validate: function (v, _opt) {
            if (RED.mavlink.isBlank(v)) return true;
            return String(v).split(',').every(function (token) {
              return /^[A-Za-z_][A-Za-z0-9_]*$/.test(token.trim());
            }) || 'must be comma-separated field names';
          },
        },
        fieldName:   {
          value: '',
          validate: function (v, _opt) {
            if (RED.mavlink.isBlank(v)) return true;
            return /^[A-Za-z_][A-Za-z0-9_]*$/.test(String(v).trim())
              || 'must be a single field name';
          },
        },
        fieldValue:  { value: '' },
        rateLimit:   {
          value: 0,
          validate: function (v) {
            // Blank/number = global Hz; otherwise comma NAME=Hz pairs, with an
            // optional bare Hz default among them. Every token must be
            // *complete*: an empty token (a stray comma) or an empty value
            // (`ATTITUDE=`) is rejected here rather than silently becoming
            // "unlimited" at runtime — a typo must not quietly delete the
            // limit the operator asked for. Number('') is 0, so the emptiness
            // checks have to come before the numeric one.
            var raw = String(v === undefined || v === null ? '' : v).trim();
            if (!raw) return true;
            return raw.split(',').every(function (token) {
              var part = token.trim();
              if (!part) return false;
              var eq = part.indexOf('=');
              var name = eq === -1 ? '' : part.slice(0, eq).trim();
              var value = eq === -1 ? part : part.slice(eq + 1).trim();
              if (eq !== -1 && !name) return false;
              if (!value) return false;
              var hz = Number(value);
              return Number.isFinite(hz) && hz >= 0;
            });
          },
        },
      },
      inputs: 0,
      outputs: 1,
      outputLabels: ['decoded message'],
      icon: 'font-awesome/fa-arrow-down',
      paletteLabel: 'in',
      label: function () {
        if (this.name) return this.name;
        var list = this.messages || [];
        if (list.length === 1) return list[0];
        if (list.length > 1) return list[0] + ' +' + (list.length - 1);
        return 'mavlink in';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        var node = this;
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');

        // §6: the compare-fields row only exists while Changed only is on.
        function refreshChangedFieldsRow() {
          $('#row-in-changedFields').toggle($('#node-input-changedOnly').is(':checked'));
        }
        $('#node-input-changedOnly').on('change', refreshChangedFieldsRow);
        refreshChangedFieldsRow();
        // Message filters (#211): one catalog-backed select per row. Same
        // stock widget the Connection and Fan-out dialogs use for their lists.
        var $messages = $('#mav-in-messages');
        $messages.editableList({
          addButton: 'add message',
          removable: true,
          sortable: true,
          height: 'auto',
          addItem: function (container, _index, data) {
            var $sel = $('<select>', { style: 'width:100%;' }).appendTo(container);
            paintRow($sel, (data && data.name) || '');
          },
        });
        (node.messages || []).forEach(function (name) {
          $messages.editableList('addItem', { name: name });
        });

        $('#node-input-connection').on('change', refreshMessageOptions);
        refreshMessageOptions();
        RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
          RED.mavlink.fillCompIdSelect(
            $('#node-input-compid'),
            (catalog.enums || {}).MAV_COMPONENT || [],
            { allowEmpty: true, emptyLabel: 'Any component', saved: node.compid }
          );
        });
      },

      oneditsave: function () {
        // Blank rows and duplicates are dropped rather than refused: a blank
        // row is an unfinished thought, and a name repeated twice would
        // subscribe twice and deliver the message twice.
        var seen = {};
        var names = [];
        $('#mav-in-messages').editableList('items').each(function () {
          var name = String($(this).find('select').val() || '').trim();
          if (!name || seen[name]) return;
          seen[name] = true;
          names.push(name);
        });
        this.messages = names;
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <hr/>
  <div class="form-row">
    <label style="vertical-align:top;"><i class="fa fa-filter"></i> Messages</label>
    <div style="display:inline-block;width:70%;">
      <ol id="mav-in-messages"></ol>
    </div>
  </div>
  <div class="form-tips" style="margin-bottom:8px;">
    Leave the list empty to receive every message. The Sysid, Compid and rate
    settings below apply to all of them.
  </div>
  <div class="form-row">
    <label for="node-input-sysid"><i class="fa fa-filter"></i> Sysid</label>
    <input type="number" id="node-input-sysid" min="0" max="255" placeholder="blank = all" style="width:80px">
  </div>
  <div class="form-row">
    <label for="node-input-compid"><i class="fa fa-filter"></i> Compid</label>
    <select id="node-input-compid" style="width:80px"></select>
  </div>
  <hr/>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-changedOnly" style="width:auto">
    <label for="node-input-changedOnly" style="width:auto"> Changed only</label>
  </div>
  <div class="form-row" id="row-in-changedFields">
    <label for="node-input-changedFields"><i class="fa fa-list"></i> Compare fields</label>
    <input type="text" id="node-input-changedFields" placeholder="blank = all fields except timestamps">
  </div>
  <div class="form-row">
    <label for="node-input-fieldName"><i class="fa fa-crosshairs"></i> Field</label>
    <input type="text" id="node-input-fieldName" placeholder="(any)" style="width:140px">
    <label for="node-input-fieldValue" style="width:auto;margin-left:6px">=</label>
    <input type="text" id="node-input-fieldValue" placeholder="(present)" style="width:120px">
  </div>
  <div class="form-row">
    <label for="node-input-rateLimit"><i class="fa fa-tachometer"></i> Rate limit</label>
    <input type="text" id="node-input-rateLimit" placeholder="0" style="width:220px">
    <span> Hz, or NAME=Hz pairs (0 = unlimited)</span>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-in">
  <p>Subscribe to decoded MAVLink traffic from a Connection.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd>Message name, e.g. <code>HEARTBEAT</code>.</dd>
    <dt>payload <span class="property-type">object</span></dt>
    <dd>Decoded field values keyed by field name (snake_case).</dd>
    <dt>sysid <span class="property-type">number</span></dt>
    <dd>Source system id.</dd>
    <dt>compid <span class="property-type">number</span></dt>
    <dd>Source component id.</dd>
    <dt>trusted <span class="property-type">boolean | undefined</span></dt>
    <dd><code>true</code> when the frame passed signing verification.
      <code>false</code> marks a frame admitted <i>despite</i> being untrusted —
      an unsigned sender on the allowlist while signing is required, or any
      frame accepted under <b>Accept invalid signatures</b>. On a plain unsigned
      link the property is <b>absent</b>, because signing was never in play and
      the frame is neither vouched for nor suspect. Gate on
      <code>msg.trusted === false</code> to drop the explicitly untrusted;
      testing for <code>!== true</code> also rejects every frame on an unsigned
      link.</dd>
  </dl>
  <h3>Details</h3>
  <p><b>Messages</b>, <b>Sysid</b>, and <b>Compid</b> filters are all optional;
  leave the list empty and the ids blank to match all traffic on the connection.</p>
  <p>The status badge shows <code>&lt;count&gt; &lt;MESSAGE&gt;</code> — messages
  delivered since deploy, then the name of the one that just arrived. The count
  is node-wide, not per message name, and resets on deploy.</p>
  <p>The badge is written at most four times a second, so on a faster stream it
  jumps rather than ticking every frame. Frames arriving between writes are
  still counted, and a trailing write lands within a quarter second of the last
  one — so when traffic stops the badge settles on the true total rather than
  freezing part-way.</p>
  <p><b>Changed only</b>: only forward a message when its field values differ
  from the previous delivery for the same (message, sysid, compid) tuple.
  <b>Compare fields</b> restricts the comparison to the listed fields (comma
  separated). Blank compares every field <i>except</i> the timestamps
  (<code>time_boot_ms</code>, <code>time_usec</code>, <code>time_unix_usec</code>,
  <code>timestamp</code>), which advance on every frame and would otherwise make
  every message look changed and pass the whole stream. Naming a timestamp in
  <b>Compare fields</b> compares it verbatim, so the clock is reachable when you
  actually want it — and a message whose only fields are timestamps delivers
  once.</p>
  <p><b>Field</b>: pass only messages where the named field exists — and, when
  a value is given, equals it (compared as strings, so enums and 64-bit values
  work naturally). Example: <code>base_mode</code> = <code>217</code>.</p>
  <p><b>Rate limit</b>: maximum messages per second per (message, sysid, compid)
  tuple; 0 means unlimited. Either one Hz number for everything, or comma
  <code>NAME=Hz</code> pairs — <code>ATTITUDE=2, GLOBAL_POSITION_INT=1</code> —
  with an optional bare number among them as the default for unlisted names.
  Every token must be complete — a stray comma or an empty value
  (<code>ATTITUDE=</code>) is rejected in the editor, so a typo cannot quietly
  remove a limit. The editor validates the shape; the runtime trusts the saved
  config (§2).</p>
</script>
