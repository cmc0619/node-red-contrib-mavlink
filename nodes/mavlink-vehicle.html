<script type="text/javascript">
  (function () {
    RED.nodes.registerType('mavlink-vehicle', {
      category: 'config',
      defaults: {
        name:                  { value: '' },
        vehicleFamily:         { value: 'generic', required: true },
        firmware:              { value: 'ardupilot', required: true },
        dialect:               { value: 'ardupilotmega', required: true },
        dialectRevision:       { value: 'seed', required: true },
        /* Legacy fields kept so old flows still load; unused in the editor. */
        dialectSource:         { value: 'bundled' },
        customDialectPath:     { value: '' },
        paramDefsUrl:          { value: '' },
        defaultTargetSystem:   { value: 1, validate: RED.mavlink.validateUint8(0) },
        defaultTargetComponent:{ value: 1, validate: RED.mavlink.validateUint8(0) }
      },
      label: function () {
        return this.name || 'MAVLink Vehicle Profile';
      },
      oneditprepare: function () {
        const node = this;

        function mavlinkAdminUrl(path) {
          if (RED.mavlink && RED.mavlink.adminApiUrl) {
            return RED.mavlink.adminApiUrl(path);
          }
          return path;
        }

        const $dialect = $('#node-config-input-dialect');
        const $revision = $('#node-config-input-dialectRevision');
        const $firmware = $('#node-config-input-firmware');
        const $status = $('#mav-catalog-status');
        const FIRMWARE_DIALECT = { ardupilot: 'ardupilotmega', px4: 'development', custom: 'common' };
        let library = [];

        function dialectRow(name) {
          for (let i = 0; i < library.length; i++) {
            if (library[i].name === name) return library[i];
          }
          return null;
        }

        function populateDialects(prefer) {
          const names = library.map(function (d) { return d.name; });
          $dialect.empty();
          if (!names.length) {
            ['ardupilotmega', 'common', 'minimal'].forEach(function (d) {
              $('<option>').val(d).text(d).appendTo($dialect);
            });
          } else {
            names.forEach(function (d) {
              $('<option>').val(d).text(d).appendTo($dialect);
            });
          }
          const want = prefer || node.dialect || 'ardupilotmega';
          if (!$dialect.find('option[value="' + want + '"]').length) {
            $('<option>').val(want).text(want).appendTo($dialect);
          }
          $dialect.val(want);
          populateRevisions(node.dialectRevision || 'seed');
        }

        function populateRevisions(prefer) {
          const row = dialectRow($dialect.val());
          const versions = (row && row.versions) || [{ id: 'seed', label: 'Seed (shipped)' }];
          $revision.empty();
          versions.forEach(function (v) {
            $('<option>').val(v.id).text(v.label)
              .attr('data-kind', v.kind || '')
              .attr('data-entry', v.entryFile || '')
              .appendTo($revision);
          });
          const want = prefer || 'seed';
          if ($revision.find('option[value="' + want + '"]').length) {
            $revision.val(want);
          } else {
            $revision.val(versions[0].id);
          }
        }

        function loadLibrary(done) {
          $.getJSON(mavlinkAdminUrl('/mavlink/xml-catalog'))
            .done(function (data) {
              library = (data && data.dialects) || [];
              $status.text(library.length ? '' : 'Dialect library empty — Update catalog when online.');
              if (done) done();
            })
            .fail(function () {
              library = [];
              $status.text('Dialect library unavailable.');
              if (done) done();
            });
        }

        $dialect.on('change', function () {
          populateRevisions('seed');
        });

        $firmware.on('change', function () {
          const want = FIRMWARE_DIALECT[$firmware.val()];
          if (want && $dialect.find('option[value="' + want + '"]').length) {
            $dialect.val(want);
            populateRevisions('seed');
          }
        });

        $('#mav-catalog-update').on('click', function (e) {
          e.preventDefault();
          $status.text('Downloading MAVLink XML from mavlink/mavlink...');
          $.ajax({
            url: mavlinkAdminUrl('/mavlink/xml-catalog/update'),
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({})
          })
            .done(function () {
              $status.text('Catalog updated.');
              const keepDialect = $dialect.val();
              const keepRev = $revision.val();
              loadLibrary(function () {
                populateDialects(keepDialect);
                populateRevisions(keepRev);
              });
            })
            .fail(function (xhr) {
              const msg = (xhr && xhr.responseJSON && xhr.responseJSON.error) || 'download failed';
              $status.text('Update failed: ' + msg);
            });
        });

        $('#mav-catalog-compare').on('click', function (e) {
          e.preventDefault();
          const dialect = $dialect.val();
          const rev = $revision.val();
          const opt = $revision.find('option:selected');
          const entry = opt.attr('data-entry') || (dialect + '.xml');
          if (!rev || rev === 'seed') {
            $status.text('Pick a downloaded date to compare against the seed.');
            return;
          }
          $status.text('Comparing ' + entry + ' with seed...');
          $.getJSON(mavlinkAdminUrl('/mavlink/xml-catalog/compare'), { file: entry, snapshot: rev })
            .done(function (data) {
              const c = data && data.comparison;
              if (!c) {
                $status.text('No comparison available.');
                return;
              }
              if (c.error) {
                $status.text(entry + ': ' + c.error);
                return;
              }
              if (!c.bundledExists) {
                $status.text(entry + ': not present in the seed (new dialect).');
                return;
              }
              if (!c.comparable || !c.diff) {
                $status.text(entry + ': seed exists (deeper diff unavailable).');
                return;
              }
              const d = c.diff;
              $status.text(
                entry + ' vs seed — messages: +' + d.addedMessages.length + ' / -' + d.removedMessages.length +
                ' / changed ' + d.changedMessages.length + '; enums: +' + d.addedEnums.length +
                ' / -' + d.removedEnums.length + '.'
              );
            })
            .fail(function (xhr) {
              const msg = (xhr && xhr.responseJSON && xhr.responseJSON.error) || 'comparison failed';
              $status.text('Comparison failed: ' + msg);
            });
        });

        loadLibrary(function () {
          populateDialects(node.dialect);
        });

        if (RED.mavlink && RED.mavlink.loadEnumsCatalog) {
          RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
            RED.mavlink.fillCompIdSelect(
              $('#node-config-input-defaultTargetComponent'),
              (catalog.enums || {}).MAV_COMPONENT || [],
              { saved: node.defaultTargetComponent }
            );
          });
        }
      },
      oneditsave: function () {
        /* Dialect + revision is the authority; clear legacy path fields. */
        this.dialectSource = 'bundled';
        this.customDialectPath = '';
      }
    });
  })();
</script>

<script type="text/html" data-template-name="mavlink-vehicle">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="SITL Copter">
  </div>
  <div class="form-tips" style="margin-bottom:8px;">
    Describes the vehicle being <em>addressed</em>. Who this runtime <em>is</em> on the wire lives
    on the <b>Local Identity</b> config node.
  </div>
  <div class="form-row">
    <label for="node-config-input-vehicleFamily">Vehicle</label>
    <select id="node-config-input-vehicleFamily">
      <option value="generic">Generic / unknown</option>
      <option value="copter">Copter</option>
      <option value="plane">Plane</option>
      <option value="rover">Rover</option>
      <option value="boat">Boat</option>
      <option value="sub">Sub</option>
      <option value="antenna-tracker">Antenna Tracker</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-firmware">Firmware</label>
    <select id="node-config-input-firmware">
      <option value="ardupilot">ArduPilot</option>
      <option value="px4">PX4</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-defaultTargetSystem">Target SysID</label>
    <input type="number" id="node-config-input-defaultTargetSystem" min="0" max="255">
  </div>
  <div class="form-row">
    <label for="node-config-input-defaultTargetComponent">Target CompID</label>
    <select id="node-config-input-defaultTargetComponent"></select>
  </div>
  <div class="form-row" style="margin-bottom:4px;">
    <a href="#" id="node-mav-advanced-toggle" style="color:inherit;">
      <i class="fa fa-caret-right"></i> Advanced
    </a>
  </div>
  <div class="mav-advanced" style="display:none;">
    <div class="form-row">
      <label for="node-config-input-dialect">Dialect</label>
      <select id="node-config-input-dialect" style="width:70%;"></select>
    </div>
    <div class="form-row">
      <label for="node-config-input-dialectRevision">Version</label>
      <select id="node-config-input-dialectRevision" style="width:70%;"></select>
    </div>
    <div class="form-tips">
      Pick a dialect, then a date. <b>Seed</b> is the offline copy shipped with the package.
      <b>Update catalog</b> downloads a newer snapshot when you have internet; it appears as another date.
    </div>
    <div class="form-row" style="margin-left:104px;">
      <button id="mav-catalog-update" class="red-ui-button">Update catalog</button>
      <button id="mav-catalog-compare" class="red-ui-button">Compare with seed</button>
    </div>
    <div class="form-tips" id="mav-catalog-status" style="min-height:1em;"></div>
    <div class="form-row">
      <label for="node-config-input-paramDefsUrl">Param defs URL</label>
      <input type="text" id="node-config-input-paramDefsUrl" placeholder="(optional) PX4 / custom parameter metadata URL">
    </div>
    <div class="form-tips">
      Optional URL to firmware parameter definitions (PX4 / custom stacks). Leave
      blank for ArduPilot — its per-family metadata URL is derived at runtime.
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      $('#node-mav-advanced-toggle').on('click', function (e) {
        e.preventDefault();
        var $adv = $('.mav-advanced');
        var $icon = $(this).find('i');
        if ($adv.is(':visible')) {
          $adv.hide();
          $icon.removeClass('fa-caret-down').addClass('fa-caret-right');
        } else {
          $adv.show();
          $icon.removeClass('fa-caret-right').addClass('fa-caret-down');
        }
      });
    })();
  </script>
</script>

<script type="text/html" data-help-name="mavlink-vehicle">
  <p>A <b>Vehicle Profile</b> describes the vehicle being <em>addressed</em>: dialect, firmware,
  default target ids, and vehicle family for mode tables and parameter metadata.</p>
  <p>It owns nothing about the local side — source SysID/CompID, heartbeat identity, and signing
  belong to the <b>Local Identity</b> config node. Selecting a Vehicle Profile can never change
  who this Node-RED runtime is on the wire.</p>
  <h3>Dialect library</h3>
  <p>Dialects come from the shipped <b>seed</b> (offline) or a dated catalog download. Pick the
  dialect name, then the version date. There is no separate custom-path mode — once XML is in
  the library it is a pulldown entry.</p>
  <h3>Details</h3>
  <ul>
    <li><b>Vehicle</b> — family for mode tables and parameter metadata.</li>
    <li><b>Firmware</b> — ArduPilot, PX4, or custom (suggests a dialect).</li>
    <li><b>Target SysID / CompID</b> — defaults blank palette fields inherit on wire tiers.</li>
    <li><b>Dialect / Version</b> — Advanced: seed or a downloaded snapshot date.</li>
  </ul>
</script>
