<script type="text/javascript">
  (function () {
    /**
     * Editor-side uint8 validator for target ids. Blank is allowed (runtime
     * applies the default). Target ids allow 0 (broadcast); source ids do not.
     */
    RED.nodes.registerType('mavlink-vehicle', {
      category: 'config',
      defaults: {
        name:                  { value: '' },
        vehicleFamily:         { value: 'generic', required: true },
        firmware:              { value: 'ardupilot', required: true },
        dialect:               { value: 'ardupilotmega', required: true },
        dialectSource:         { value: 'bundled' },
        customDialectPath:     {
          value: '',
          /* Require a path when the source is custom, so an empty path is
             caught in the editor rather than only at deploy time. */
          validate: function (v) {
            const src = $('#node-config-input-dialectSource').val() || this.dialectSource;
            if (src && src !== 'bundled') {
              return !!(v && String(v).trim());
            }
            return true;
          }
        },
        paramDefsUrl:          { value: '' },
        defaultTargetSystem:   { value: 1, validate: RED.mavlink.validateUint8(0) },
        defaultTargetComponent:{ value: 1, validate: RED.mavlink.validateUint8(0) }
      },
      label: function () {
        return this.name || 'MAVLink Vehicle Profile';
      },
      oneditprepare: function () {
        const node = this;

        function mavlinkAdminUrl(path) {
          if (RED.mavlink && RED.mavlink.adminApiUrl) {
            return RED.mavlink.adminApiUrl(path);
          }
          return path;
        }

        const $source   = $('#node-config-input-dialectSource');
        const $dialect  = $('#node-config-input-dialect');
        const $bundled  = $('#mav-bundled-dialect');
        const $firmware = $('#node-config-input-firmware');
        const $path     = $('#node-config-input-customDialectPath');
        const FALLBACK  = ['ardupilotmega', 'common', 'minimal'];

        /* Firmware → dialect suggestion (§6: fields are created by selection) */
        const FIRMWARE_DIALECT = { ardupilot: 'ardupilotmega', px4: 'development', custom: 'common' };

        function bundledSelection() {
          return $bundled.val() || (node.dialect && node.dialect !== 'custom' ? node.dialect : 'ardupilotmega');
        }

        function syncDialect() {
          $dialect.val($source.val() === 'bundled' ? bundledSelection() : 'custom');
        }

        function toggleRows() {
          const bundled = $source.val() === 'bundled';
          $('.mav-dialect-bundled').toggle(bundled);
          $('.mav-dialect-custom').toggle(!bundled);
          syncDialect();
        }

        /* §6: dialect dropdown uses name only (dialects are not enum entries). */
        function populateBundled(list) {
          $bundled.empty();
          (list && list.length ? list : FALLBACK).forEach(function (d) {
            $('<option>').val(d).text(d).appendTo($bundled);
          });
          const saved = (node.dialect && node.dialect !== 'custom') ? node.dialect : 'ardupilotmega';
          if (!$bundled.find('option[value="' + saved + '"]').length) {
            $('<option>').val(saved).text(saved).appendTo($bundled);
          }
          $bundled.val(saved);
        }

        /* Fetch bundled dialect list from the admin endpoint (§6 editor endpoint). */
        $.getJSON(mavlinkAdminUrl('/mavlink/dialects'))
          .done(function (data) { populateBundled(data && data.dialects); toggleRows(); })
          .fail(function ()     { populateBundled(null); toggleRows(); });

        $source.val(node.dialectSource === 'custom' ? 'custom' : 'bundled');
        $source.on('change', toggleRows);
        $bundled.on('change', syncDialect);

        /* Picking a firmware suggests its canonical dialect. */
        $firmware.on('change', function () {
          const want = FIRMWARE_DIALECT[$firmware.val()];
          if (want && $source.val() === 'bundled') {
            if (!$bundled.find('option[value="' + want + '"]').length) {
              $('<option>').val(want).text(want).appendTo($bundled);
            }
            $bundled.val(want);
            syncDialect();
          }
        });

        /* --- downloadable XML catalog picker (§4) ------------------------
           Downloaded XMLs are managed *Custom* paths: picking one fills the
           XML path field. This is not a third dialect source. */
        const $catalog = $('#mav-catalog-pick');
        const $catalogStatus = $('#mav-catalog-status');

        function loadCatalog() {
          $.getJSON(mavlinkAdminUrl('/mavlink/xml-catalog'))
            .done(function (data) {
              $catalog.empty();
              $('<option>').val('').text('-- downloaded XML (optional) --').appendTo($catalog);
              const snapshots = (data && data.snapshots) || [];
              let count = 0;
              snapshots.forEach(function (snap) {
                (snap.files || []).forEach(function (f) {
                  if (f.usable === false) { return; }
                  const when = snap.downloadedAt ? new Date(snap.downloadedAt).toISOString().slice(0, 10) : '';
                  const label = f.name + '  [' + snap.repo + '@' + snap.ref + ' ' + when + ']' +
                    (f.bundledExists ? ' (bundled exists)' : ' (not bundled)');
                  $('<option>').val(f.path).text(label)
                    .attr('data-file', f.name)
                    .attr('data-snapshot', snap.snapshotId)
                    .appendTo($catalog);
                  count += 1;
                });
              });
              $catalogStatus.text(count ? '' : 'No downloaded XML yet — use "Update catalog".');
            })
            .fail(function () {
              $catalogStatus.text('Catalog unavailable.');
            });
        }

        $catalog.on('change', function () {
          const p = $(this).val();
          if (p) {
            $path.val(p);
          }
        });

        $('#mav-catalog-update').on('click', function (e) {
          e.preventDefault();
          $catalogStatus.text('Downloading MAVLink XML from mavlink/mavlink...');
          $.ajax({
            url: mavlinkAdminUrl('/mavlink/xml-catalog/update'),
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({})
          })
            .done(function () {
              $catalogStatus.text('Downloaded. Pick a file below.');
              loadCatalog();
            })
            .fail(function (xhr) {
              const msg = (xhr && xhr.responseJSON && xhr.responseJSON.error) || 'download failed';
              $catalogStatus.text('Update failed: ' + msg);
            });
        });

        $('#mav-catalog-compare').on('click', function (e) {
          e.preventDefault();
          const opt = $catalog.find('option:selected');
          const file = opt.attr('data-file');
          const snapshot = opt.attr('data-snapshot');
          if (!file) {
            $catalogStatus.text('Pick a downloaded XML to compare.');
            return;
          }
          $catalogStatus.text('Comparing ' + file + ' with the bundled dialect...');
          $.getJSON(mavlinkAdminUrl('/mavlink/xml-catalog/compare'), snapshot ? { file: file, snapshot: snapshot } : { file: file })
            .done(function (data) {
              const c = data && data.comparison;
              if (!c) {
                $catalogStatus.text('No comparison available.');
                return;
              }
              if (c.error) {
                $catalogStatus.text(file + ': ' + c.error);
                return;
              }
              if (!c.bundledExists) {
                $catalogStatus.text(file + ': not present in the bundled dialects (new dialect).');
                return;
              }
              if (!c.comparable || !c.diff) {
                $catalogStatus.text(file + ': a bundled dialect exists (deeper diff unavailable).');
                return;
              }
              const d = c.diff;
              $catalogStatus.text(
                file + ' vs bundled — messages: +' + d.addedMessages.length + ' / -' + d.removedMessages.length +
                ' / changed ' + d.changedMessages.length + '; enums: +' + d.addedEnums.length + ' / -' + d.removedEnums.length + '.'
              );
            })
            .fail(function (xhr) {
              const msg = (xhr && xhr.responseJSON && xhr.responseJSON.error) || 'comparison failed';
              $catalogStatus.text('Comparison failed: ' + msg);
            });
        });

        loadCatalog();

        if (RED.mavlink && RED.mavlink.loadEnumsCatalog) {
          RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
            RED.mavlink.fillCompIdSelect(
              $('#node-config-input-defaultTargetComponent'),
              (catalog.enums || {}).MAV_COMPONENT || [],
              { saved: node.defaultTargetComponent }
            );
          });
        }
      },
      oneditsave: function () {
        /* Keep hidden `dialect` field in sync with the visible bundled picker. */
        const source = $('#node-config-input-dialectSource').val();
        const picked = $('#mav-bundled-dialect').val() ||
          (this.dialect && this.dialect !== 'custom' ? this.dialect : 'ardupilotmega');
        $('#node-config-input-dialect').val(source === 'bundled' ? picked : 'custom');
      }
    });
  })();
</script>

<script type="text/html" data-template-name="mavlink-vehicle">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="SITL Copter">
  </div>
  <div class="form-tips" style="margin-bottom:8px;">
    Describes the vehicle being <em>addressed</em>. Who this runtime <em>is</em> on the wire lives
    on the <b>Local Identity</b> config node.
  </div>
  <div class="form-row">
    <label for="node-config-input-vehicleFamily">Vehicle</label>
    <select id="node-config-input-vehicleFamily">
      <option value="generic">Generic / unknown</option>
      <option value="copter">Copter</option>
      <option value="plane">Plane</option>
      <option value="rover">Rover</option>
      <option value="boat">Boat</option>
      <option value="sub">Sub</option>
      <option value="antenna-tracker">Antenna Tracker</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-firmware">Firmware</label>
    <select id="node-config-input-firmware">
      <option value="ardupilot">ArduPilot</option>
      <option value="px4">PX4</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-defaultTargetSystem">Target SysID</label>
    <input type="number" id="node-config-input-defaultTargetSystem" min="0" max="255">
  </div>
  <div class="form-row">
    <label for="node-config-input-defaultTargetComponent">Target CompID</label>
    <select id="node-config-input-defaultTargetComponent"></select>
  </div>
  <div class="form-row" style="margin-bottom:4px;">
    <a href="#" id="node-mav-advanced-toggle" style="color:inherit;">
      <i class="fa fa-caret-right"></i> Advanced
    </a>
  </div>
  <div class="mav-advanced" style="display:none;">
    <div class="form-row">
      <label for="node-config-input-dialectSource">Dialect source</label>
      <select id="node-config-input-dialectSource">
        <option value="bundled">Bundled</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="form-row mav-dialect-bundled">
      <label for="mav-bundled-dialect">Bundled dialect</label>
      <select id="mav-bundled-dialect" style="width:60%;"></select>
    </div>
    <div class="form-row mav-dialect-custom" style="display:none;">
      <label for="node-config-input-customDialectPath">XML path</label>
      <input type="text" id="node-config-input-customDialectPath" placeholder="/path/to/custom.xml">
    </div>
    <div class="form-tips mav-dialect-custom" style="display:none;">
      A MAVLink XML file the Node-RED process can read. Its
      <code>&lt;include&gt;</code> graph is resolved from the file's own
      directory and compiled at runtime. Invalid XML or a missing include fails
      loudly (the profile marks itself invalid) rather than falling back.
    </div>
    <div class="form-row mav-dialect-custom" style="display:none;">
      <label for="mav-catalog-pick">Downloaded XML</label>
      <select id="mav-catalog-pick" style="width:60%;"></select>
    </div>
    <div class="form-row mav-dialect-custom" style="display:none; margin-left:104px;">
      <button id="mav-catalog-update" class="red-ui-button">Update catalog</button>
      <button id="mav-catalog-compare" class="red-ui-button">Compare with bundled</button>
    </div>
    <div class="form-tips mav-dialect-custom" id="mav-catalog-status" style="display:none; min-height:1em;"></div>
    <div class="form-row">
      <label for="node-config-input-paramDefsUrl">Param defs URL</label>
      <input type="text" id="node-config-input-paramDefsUrl" placeholder="(optional) PX4 / custom parameter metadata URL">
    </div>
    <div class="form-tips">
      Optional URL to firmware parameter definitions (PX4 / custom stacks). Leave
      blank for ArduPilot — its per-family metadata URL is derived at runtime.
    </div>
  </div>
  <!-- hidden persisted value keeps the saved dialect name across async dropdown loads -->
  <input type="hidden" id="node-config-input-dialect">
  <script type="text/javascript">
    (function () {
      $('#node-mav-advanced-toggle').on('click', function (e) {
        e.preventDefault();
        var $adv = $('.mav-advanced');
        var $icon = $(this).find('i');
        if ($adv.is(':visible')) {
          $adv.hide();
          $icon.removeClass('fa-caret-down').addClass('fa-caret-right');
        } else {
          $adv.show();
          $icon.removeClass('fa-caret-right').addClass('fa-caret-down');
        }
      });
    })();
  </script>
</script>

<script type="text/html" data-help-name="mavlink-vehicle">
  <p>A <b>Vehicle Profile</b> describes the vehicle being <em>addressed</em>: dialect, firmware,
  default target ids, and vehicle family for mode tables and parameter metadata.</p>
  <p>It owns nothing about the local side — source SysID/CompID, heartbeat identity, and signing
  belong to the <b>Local Identity</b> config node. Selecting a Vehicle Profile can never change
  who this Node-RED runtime is on the wire.</p>
  <h3>Vehicle family</h3>
  <p>Used for ArduPilot mode tables and parameter metadata. <b>Generic</b> applies no
  vehicle-specific metadata — correct for PX4, custom stacks, and unknown vehicles.</p>
  <h3>Firmware</h3>
  <ul>
    <li><b>ArduPilot</b> — selects <code>ardupilotmega</code> dialect and ArduPilot mode tables.</li>
    <li><b>PX4</b> — selects <code>development</code> dialect (PX4 emits development-only messages).</li>
    <li><b>Custom</b> — no firmware-specific behavior; dialect used as-is.</li>
  </ul>
  <h3>Target SysID / CompID</h3>
  <p>Default destination for outbound messages. Commonly <code>1</code>/<code>1</code> for the
  autopilot component.</p>
  <h3>Dialect source (Advanced)</h3>
  <ul>
    <li><b>Bundled</b> — one of the ten dialects loaded from <code>mavlink-mappings</code>.</li>
    <li><b>Custom</b> — a single <b>XML path</b> to a MAVLink dialect file the Node-RED process can
    read (local or mounted). Its <code>&lt;include&gt;</code> graph is resolved from the file's own
    directory and compiled at runtime. Invalid XML or a missing include fails loudly (the profile
    marks itself invalid) rather than falling back to a bundled dialect.</li>
  </ul>
  <h3>Downloaded XML catalog (Advanced)</h3>
  <p>Optionally download official MAVLink XML dialects into a local catalog under
  <code>&lt;userDir&gt;/mavlink/xml</code> and pick one here — it just fills the XML path above (a
  managed Custom path, not a replacement for bundled dialects). <b>Update catalog</b> downloads the
  latest set from <code>mavlink/mavlink</code>; <b>Compare with bundled</b> reports how the selected
  file differs from the same-named bundled dialect. Downloads are self-contained (every
  <code>&lt;include&gt;</code> is fetched together), so the runtime compiler never reaches the network.</p>
  <h3>Param defs URL (Advanced)</h3>
  <p>Optional URL to firmware parameter definitions for PX4 or custom stacks. Persisted on the
  profile for the Param node to consume; ArduPilot can leave it blank, as its per-family metadata
  URL is derived at runtime.</p>
</script>
