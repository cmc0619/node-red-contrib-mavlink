<script type="text/javascript">
  (function () {
    /**
     * The full peer-table emission set — must stay in sync with the event list
     * in lib/connection/peer-table.js's header (pinned by test).
     */
    const STATE_EVENTS = [
      'peer-new',
      'component-new',
      'heartbeat',
      'stale',
      'expired',
      'endpoint-added',
      'primary-changed',
      'multi-endpoint',
      'statustext',
      'armed-changed',
      'mode-changed',
      'landed-changed',
      'gps-fix-changed',
      'home-changed',
      'sensor-health-changed',
    ];

    /**
     * The saved string split exactly as the runtime splits it: no trimming and
     * no dropped empty tokens, so the ring judges the names the feed will
     * subscribe to.
     *
     * @param {*} raw
     * @returns {string[]}
     */
    function parseSavedEvents(raw) {
      return typeof raw === 'string' && raw !== '' ? raw.split(',') : [];
    }

    function buildEventsMultiSelect(node) {
      const $select = $('#mav-state-events-select');
      const saved = parseSavedEvents(node.events);
      $select.empty();
      for (let i = 0; i < STATE_EVENTS.length; i++) {
        const name = STATE_EVENTS[i];
        $select.append($('<option></option>').val(name).text(name));
      }
      // The saved picks select themselves; a name the list does not carry
      // selects nothing, and the saved value rides untouched (red-ringed by
      // the validator) until the operator re-picks through the change handler.
      $select.val(saved);
    }

    // The selection is the saved value, the full set included: the runtime
    // subscribes to exactly the names written here.
    function syncEventsHiddenFromSelect() {
      const raw = $('#mav-state-events-select').val();
      const values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      $('#node-input-events').val(values.join(','));
    }

    /**
     * The Filter rows belong to the snapshot: the feed emits every peer's
     * events. A hidden row never reds, so a value left from snapshot mode
     * cannot hold a feed node red over a field it never reads.
     *
     * @param {function(*, object=): (true|string)} validate
     * @returns {function(*, object=): (true|string)}
     */
    function snapshotFilter(validate) {
      return function (v, opt) {
        if (RED.mavlink.liveOr(this, '#node-input-mode', this.mode) === 'feed') return true;
        return validate.call(this, v, opt);
      };
    }

    RED.nodes.registerType('mavlink-state', {
      category: 'mavlink',
      paletteLabel: 'state',
      color: '#e6ffe6',
      defaults: {
        name: { value: '' },
        connection: { value: '', type: 'mavlink-connection', required: true },
        // Closed vocabulary: the mode select offers exactly these two.
        mode: { value: 'snapshot', validate: RED.mavlink.oneOf(['snapshot', 'feed']) },
        // Comma-joined picks from the members-only multi-select. Blank picks
        // nothing — a feed with no event to emit — so it reds; a token
        // STATE_EVENTS does not name, a padded one or an empty one included,
        // would subscribe to an event the peer table never emits, so it reds
        // too. The dialog always writes a string
        // (the hidden input joins the multi-select), so a non-string is
        // hand-edit drift the runtime's split(',') cannot read — it reds
        // rather than vouching for it. Only the feed reads the selection —
        // snapshot answers an input from the peer table — so a snapshot node
        // is not red-ringed over a field it never reads (same liveOr gating as
        // Move's stream rows).
        events: {
          value: 'stale,expired,statustext',
          validate(v, _opt) {
            if (RED.mavlink.liveOr(this, '#node-input-mode', this.mode) !== 'feed') return true;
            if (typeof v !== 'string') return 'is the comma-joined picks string, not a list';
            const picks = parseSavedEvents(v);
            if (picks.length === 0) return 'selects no event';
            return picks.every((name) => STATE_EVENTS.indexOf(name) !== -1) || 'names an event the peer table does not emit';
          }
        },
        /**
         * Source filters: blank is any. Sysid 0 is refused because the
         * Connection drops sysid-0 sources before State sees them
         * (DESIGN.md §14.138); compid 0 because no peer registers component 0
         * (§14.144). Either filter would match nothing.
         */
        targetSystem: { value: '', validate: snapshotFilter(RED.mavlink.validateUint8(1)) },
        targetComponent: { value: '', validate: snapshotFilter(RED.mavlink.validateUint8(1)) }
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-table',
      label() { return this.name || 'mavlink state'; },
      oneditprepare() {
        const node = this;
        buildEventsMultiSelect(node);
        $('#mav-state-events-select').on('change', syncEventsHiddenFromSelect);
        function refreshRows() {
          const feed = $('#node-input-mode').val() === 'feed';
          $('#row-state-events').toggle(feed);
          $('#row-state-filter-sysid, #row-state-filter-compid').toggle(!feed);
        }
        $('#node-input-mode').on('change', refreshRows);
        refreshRows();
        RED.mavlink.reloadCompIdSelect($('#node-input-targetComponent'), {
          initialSaved: node.targetComponent,
          emptyLabel: 'Any component',
        });
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-state">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-mode">Mode</label><select id="node-input-mode"><option value="snapshot">Snapshot on input</option><option value="feed">Event feed</option></select></div>
  <div class="form-row" id="row-state-events">
    <label for="mav-state-events-select">Events</label>
    <select id="mav-state-events-select" multiple="multiple" size="10" style="width:70%"></select>
    <input type="hidden" id="node-input-events">
  </div>
  <div class="form-row" id="row-state-filter-sysid"><label for="node-input-targetSystem">Filter sysid</label><input type="number" id="node-input-targetSystem" min="1" max="255"></div>
  <div class="form-row" id="row-state-filter-compid"><label for="node-input-targetComponent">Filter compid</label><select id="node-input-targetComponent"></select></div>
</script>

<script type="text/html" data-help-name="mavlink-state">
  <p>Reads the Connection-owned peer table. Snapshot mode emits the current peer-table view on input; feed mode emits selected transition and STATUSTEXT records as they arrive. Input to a feed node is a no-op — there is no snapshot to interleave into the event stream — so a stray input is dropped rather than raised as an error.</p>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue — snapshot peers (on input) or feed records as they arrive.</li>
    <li>Status — terminal status on every snapshot outcome (success or failure). Feed mode uses output 0 only for the event stream.</li>
  </ol>
  <h3>Snapshot filter</h3>
  <p><b>Filter sysid</b> and <b>Filter compid</b> narrow a snapshot to one vehicle or component; <code>msg.payload.sysid</code> and <code>msg.payload.compid</code> override them per input. They apply to snapshot mode only, so the dialog hides them in feed mode: a feed emits the events of every peer on the Connection.</p>
  <h3>Snapshot telemetry</h3>
  <p>Each snapshot component carries the last-received telemetry in canonical units; a key is <code>null</code> when its message has never been seen, and a field is <code>null</code> when the vehicle sent the wire sentinel for "unknown".</p>
  <ul>
    <li><code>position</code> — <code>lat</code>/<code>lon</code> degrees, <code>alt</code> m AMSL, <code>relativeAlt</code> m, <code>heading</code> degrees.</li>
    <li><code>gps</code> — <code>fixType</code> (GPS_FIX_TYPE), <code>satellites</code>.</li>
    <li><code>battery</code> — <code>id</code>, <code>voltage</code> V, <code>remaining</code> %, <code>current</code> A; SYS_STATUS carries no id/current, BATTERY_STATUS no voltage.</li>
    <li><code>home</code> — <code>lat</code>/<code>lon</code> degrees, <code>alt</code> m AMSL.</li>
    <li><code>gimbalManagers</code> — one entry per discovered <code>gimbalDeviceId</code>; each retains raw <code>information</code> capabilities and radian ranges plus <code>status</code> primary/secondary control IDs. Zero ownership IDs mean no owner, and State never selects or seizes a manager.</li>
    <li><code>autopilotVersion</code> — raw <code>flightSwVersion</code>, <code>boardVersion</code>, <code>vendorId</code>, and <code>productId</code>, plus the raw <code>capabilities</code> bitmask as a decimal string; <code>softwareVersion</code> decodes the standard major/minor/patch/releaseType bytes, and <code>flightCustomVersion</code> is the eight-byte custom value as lowercase hex.</li>
  </ul>
  <p>These are last-seen values, not live readings — gate on the <code>sections.*</code> ages (ms) for freshness.</p>
  <h3>Mode names</h3>
  <p>When the flight mode resolves through the mode-name ladder — the vehicle's own <code>AVAILABLE_MODES</code> table first (request it via the Command node's Request Message preset, message 435), then the bound profile's shipped table — a snapshot component gains <code>modeName</code> beside the raw <code>flightMode</code>, and a <code>mode-changed</code> feed record gains <code>fromName</code>/<code>toName</code>. An unresolved mode simply stays a number.</p>
</script>
