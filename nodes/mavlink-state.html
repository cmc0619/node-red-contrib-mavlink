<script type="text/javascript">
  (function () {
    /** Must stay in sync with lib/state DEFAULT_EVENTS (full peer-table set). */
    var STATE_EVENTS = [
      'peer-new',
      'component-new',
      'heartbeat',
      'stale',
      'expired',
      'endpoint-added',
      'primary-changed',
      'multi-endpoint',
      'profile-mismatch',
      'statustext',
      'armed-changed',
      'mode-changed',
      'landed-changed',
      'gps-fix-changed',
      'home-changed',
      'sensor-health-changed',
    ];

    function parseSavedEvents(raw) {
      if (Array.isArray(raw)) return raw.map(String);
      if (typeof raw === 'string' && raw.trim()) {
        return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      }
      return [];
    }

    function buildEventsMultiSelect(node) {
      var $select = $('#mav-state-events-select');
      var saved = parseSavedEvents(node.events);
      $select.empty();
      for (var i = 0; i < STATE_EVENTS.length; i++) {
        var name = STATE_EVENTS[i];
        $select.append($('<option></option>').val(name).text(name));
      }
      $select.val(saved.length ? saved : STATE_EVENTS);
    }

    function syncEventsHiddenFromSelect() {
      var raw = $('#mav-state-events-select').val();
      var values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      // The full selection IS the blank default — write it as blank, so an
      // open-and-save cannot freeze today's event list into the config (an
      // event lib/state grows later would silently fall out of a frozen list).
      $('#node-input-events').val(values.length === STATE_EVENTS.length ? '' : values.join(','));
    }

    RED.nodes.registerType('mavlink-state', {
      category: 'mavlink',
      paletteLabel: 'state',
      color: '#e6ffe6',
      defaults: {
        name: { value: '' },
        connection: { value: '', type: 'mavlink-connection', required: true },
        // Closed vocabulary: the mode select offers exactly these two.
        mode: { value: 'snapshot', validate: RED.mavlink.oneOf(['snapshot', 'feed']) },
        // Comma-joined picks from the members-only multi-select. Blank is the
        // full default set; a token STATE_EVENTS does not name would subscribe
        // to an event the peer table never emits, so it reds here instead.
        // The dialog always writes a string (the hidden input joins the
        // multi-select), so a non-string is hand-edit drift the runtime's
        // split(',') cannot read — it reds rather than vouching for it.
        events: {
          value: 'stale,expired,statustext',
          validate: function (v, _opt) {
            if (typeof v !== 'string') return 'is the comma-joined picks string, not a list';
            return parseSavedEvents(v).every(function (name) {
              return STATE_EVENTS.indexOf(name) !== -1;
            }) || 'names an event the peer table does not emit';
          }
        },
        targetSystem: { value: '', validate: RED.mavlink.validateUint8(0) },
        targetComponent: { value: '', validate: RED.mavlink.validateUint8(0) }
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-table',
      label: function () { return this.name || 'mavlink state'; },
      oneditprepare: function () {
        var node = this;
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        buildEventsMultiSelect(node);
        $('#mav-state-events-select').on('change', syncEventsHiddenFromSelect);
        syncEventsHiddenFromSelect();
        var enumLoadToken = { cancelled: false };
        node._mavEnumLoadToken = enumLoadToken;
        RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
          RED.mavlink.fillCompIdSelect(
            $('#node-input-targetComponent'),
            ((catalog || {}).enums || {}).MAV_COMPONENT || [],
            { allowEmpty: true, emptyLabel: 'Any component', saved: node.targetComponent }
          );
        }, enumLoadToken);
      },
      oneditsave: function () {
        if (this._mavEnumLoadToken) this._mavEnumLoadToken.cancelled = true;
        syncEventsHiddenFromSelect();
      },
      oneditcancel: function () {
        if (this._mavEnumLoadToken) this._mavEnumLoadToken.cancelled = true;
      }
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-state">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-mode">Mode</label><select id="node-input-mode"><option value="snapshot">Snapshot on input</option><option value="feed">Event feed</option></select></div>
  <div class="form-row">
    <label for="mav-state-events-select">Events</label>
    <select id="mav-state-events-select" multiple="multiple" size="10" style="width:70%"></select>
    <input type="hidden" id="node-input-events">
  </div>
  <div class="form-row"><label for="node-input-targetSystem">Filter sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255"></div>
  <div class="form-row"><label for="node-input-targetComponent">Filter compid</label><select id="node-input-targetComponent"></select></div>
</script>

<script type="text/html" data-help-name="mavlink-state">
  <p>Reads the Connection-owned peer table. Snapshot mode emits the current peer-table view on input; feed mode emits selected transition and STATUSTEXT records as they arrive. Input to a feed node is a no-op — there is no snapshot to interleave into the event stream — so a stray input is dropped rather than raised as an error.</p>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue — snapshot peers (on input) or feed records as they arrive.</li>
    <li>Status — terminal status on every snapshot outcome (success or failure). Feed mode uses output 0 only for the event stream.</li>
  </ol>
  <h3>Snapshot telemetry</h3>
  <p>Each snapshot component carries the last-received telemetry in canonical units; a key is <code>null</code> when its message has never been seen, and a field is <code>null</code> when the vehicle sent the wire sentinel for "unknown".</p>
  <ul>
    <li><code>position</code> — <code>lat</code>/<code>lon</code> degrees, <code>alt</code> m AMSL, <code>relativeAlt</code> m, <code>heading</code> degrees.</li>
    <li><code>gps</code> — <code>fixType</code> (GPS_FIX_TYPE), <code>satellites</code>.</li>
    <li><code>battery</code> — <code>id</code>, <code>voltage</code> V, <code>remaining</code> %, <code>current</code> A; SYS_STATUS carries no id/current, BATTERY_STATUS no voltage.</li>
    <li><code>home</code> — <code>lat</code>/<code>lon</code> degrees, <code>alt</code> m AMSL.</li>
  </ul>
  <p>These are last-seen values, not live readings — gate on the <code>sections.*</code> ages (ms) for freshness.</p>
  <h3>Mode names</h3>
  <p>When the flight mode resolves through the mode-name ladder — the vehicle's own <code>AVAILABLE_MODES</code> table first (request it via the Command node's Request Message preset, message 435), then the bound profile's shipped table — a snapshot component gains <code>modeName</code> beside the raw <code>flightMode</code>, and a <code>mode-changed</code> feed record gains <code>fromName</code>/<code>toName</code>. An unresolved mode simply stays a number.</p>
</script>
