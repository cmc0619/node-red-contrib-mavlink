<script type="text/javascript">
  (function () {
    RED.nodes.registerType('mavlink-out', {
      category: 'mavlink',
      color: '#6ea6d7',
      defaults: {
        name:       { value: '' },
        connection: { value: '', type: 'mavlink-connection', required: true },
        // The vocabulary is the shared BAND_OPTIONS list that paints the
        // select, so the ring cannot drift from what the dialog offers.
        band: {
          value: '2',
          validate: RED.mavlink.oneOf(RED.mavlink.BAND_OPTIONS.map((o) => o.value)),
        },
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-arrow-up',
      paletteLabel: 'out',
      label() {
        return this.name || 'mavlink out';
      },
      labelStyle() {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare() {
        RED.mavlink.fillBandSelect($('#node-input-band'), String(this.band));
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-out">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <div class="form-row">
    <label for="node-input-band"><i class="fa fa-sort-amount-asc"></i> Default band</label>
    <select id="node-input-band" style="width:200px"></select>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-out">
  <p>Enqueue a MAVLink message onto the Connection's outbound band queue.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The message to send, read in this order — the first that applies wins:
      <ol>
        <li>Build-tier envelope from <b>mavlink-build</b>: <code>{ message: { name, fields }, … }</code>.</li>
        <li>Topic shape: a non-blank <code>msg.topic</code> is the message name and
          <code>msg.payload</code> is its fields — what <b>mavlink-in</b> emits, so In → Out
          forwards a message as received.</li>
        <li><code>{ name, fields }</code> — decoded-shape message with wire-ready field values.
          A stock Inject sends <code>topic: ""</code>, which is blank and so reaches this shape.</li>
      </ol>
      Field names are the dialect's own, as <b>mavlink-in</b> delivers them (<code>target_system</code>,
      not <code>targetSystem</code>); a field under any other spelling is not in the message and the
      send fails with <code>invalid packet</code>.
    </dd>
    <dt class="optional">topic <span class="property-type">string</span></dt>
    <dd>Message name for the topic shape above.</dd>
    <dt class="optional">band <span class="property-type">number</span></dt>
    <dd>Queue band: 0 Emergency, 2 Control, 3 Streaming, 4 Bulk. Overrides the node default.
      Band 1 (Liveness) holds one frame per identity for the Connection's own HEARTBEAT, so any
      other frame sent there is replaced by the next heartbeat.</dd>
    <dt class="optional">target <span class="property-type">object</span></dt>
    <dd><code>{ sysid, compid }</code> — which peer the frame is routed to (its learned endpoint;
      sysid 0 or compid 0 fans out). It does not fill the message's own <code>target_*</code> fields.
      Absent, the frame goes out on the Connection's configured remote.</dd>
    <dt class="optional">identityId <span class="property-type">string</span></dt>
    <dd>Local identity override. Must be bound to the connection.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue — the original input message, fired once the message is accepted into the queue.</li>
    <li>Status — a status record on every terminal outcome.</li>
  </ol>
  <h3>Details</h3>
  <p>Set <code>msg.payload = false</code> to suppress the node silently.</p>
  <p>Continue fires only on success. Status carries a plain status record on every terminal outcome — there is no miswire refusal if status is wired back into an action input.</p>
</script>
