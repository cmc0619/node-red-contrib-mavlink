<script type="text/javascript">
  /**
   * A field's value as the operator currently has it: the live input while
   * this node's own dialog is on top, else the saved property. Same rule as
   * `steerAxisValidator`'s sibling reads and for the same reason — an empty
   * box is an answer, so `liveOr`'s fall-back-to-saved would hide a clearing.
   *
   * @param {object} owner  the node being validated
   * @param {string} name   config property, which is also the input id suffix
   * @returns {*}
   */
  function fieldValue(owner, name) {
    var $live = RED.mavlink.ownDialogField(owner, '#node-input-' + name);
    return $live ? $live.val() : owner[name];
  }

  /**
   * Which Move actions an ArduPilot vehicle actually has a handler for.
   *
   * Read across all six vehicles' GCS dispatch tables at source (§14
   * 2026-08-14), because a gate that hides an action is only as good as the
   * knowledge behind it — and two of the claims this table replaces were
   * wrong. The surprises are the load-bearing rows: **Blimp ignores the
   * joystick** (`handle_manual_control_axes` is a virtual with an empty body
   * and Blimp does not override it — the sticks are decoded, counted as a GCS
   * heartbeat, and discarded), while an **Antenna Tracker does move**, just
   * through Attitude and Manual rather than any position carrier. Neither
   * ArduPlane nor Rover has a `CONDITION_YAW` handler anywhere, so Turn is a
   * Copter-and-Sub action rather than an ArduPilot one.
   *
   * A family absent from this table — `unknown`, or a value a future profile
   * adds — gates nothing, because hiding requires knowledge.
   */
  // Everything but Turn — no CONDITION_YAW handler. A boat IS Rover firmware,
  // so the two families share the row rather than repeating it.
  var NO_YAW_ACTIONS = ['goto', 'steer', 'speed', 'attitude', 'manual'];
  var ARDUPILOT_FAMILY_ACTIONS = {
    copter: ['goto', 'steer', 'turn', 'speed', 'attitude', 'manual'],
    sub: ['goto', 'steer', 'turn', 'speed', 'attitude', 'manual'],
    // Plane also takes frame 7 only, and its handler reads `z` alone.
    plane: NO_YAW_ACTIONS,
    rover: NO_YAW_ACTIONS,
    boat: NO_YAW_ACTIONS,
    // handle_message is a bare switch; handle_command_int_packet has
    // DO_REPOSITION and NAV_TAKEOFF. Its capabilities() advertises three
    // setpoint messages it does not implement — not evidence of a handler.
    blimp: ['goto'],
    'antenna-tracker': ['attitude', 'manual'],
  };

  /** The wire each action rides, for the refusal message. */
  var ACTION_WIRE = {
    goto: 'DO_REPOSITION',
    steer: 'SET_POSITION_TARGET_LOCAL_NED',
    turn: 'CONDITION_YAW',
    speed: 'DO_CHANGE_SPEED',
    attitude: 'SET_ATTITUDE_TARGET',
    manual: 'MANUAL_CONTROL',
  };

  var ACTION_LABEL = {
    goto: 'Go to', steer: 'Steer', turn: 'Turn',
    speed: 'Speed', attitude: 'Attitude', manual: 'Manual',
  };

  var FAMILY_LABEL = {
    copter: 'Copter', plane: 'Plane', rover: 'Rover', boat: 'Boat',
    sub: 'Sub', blimp: 'Blimp', 'antenna-tracker': 'Antenna Tracker',
  };

  /**
   * What to do instead, per family — each one loses a different thing. Copter
   * and Sub have no entry because they refuse nothing, so `reason` never looks
   * them up; a family that starts refusing needs a line here, and the test
   * matrix is what catches its absence.
   */
  var NO_YAW_INSTEAD = 'give it a destination instead — Go to, or a Steer setpoint';
  var FAMILY_INSTEAD = {
    plane: 'a fixed wing has no guided yaw command at all (GUIDED_CHANGE_HEADING is the '
      + 'forward entry, not built), so turn it by giving it somewhere to go — Go to',
    rover: NO_YAW_INSTEAD,
    boat: NO_YAW_INSTEAD,
    blimp: 'DO_REPOSITION is the one motion message a Blimp implements — use Go to',
    'antenna-tracker': 'a tracker does not travel — point it with Attitude or Manual',
  };

  /**
   * The bound vehicle's Move surface: what it can act on, and why not.
   *
   * Family gating is ArduPilot-only on purpose. This matrix is ArduPilot's
   * per-vehicle dispatch; PX4 has one receiver with no vehicle branch in it,
   * and nothing here was measured against PX4 — so a PX4 profile gates on
   * firmware alone, as it did before.
   *
   * @param {object} [source]  saved config, for `validate`; omit inside a dialog
   * @returns {{family: string, gated: boolean, allows: function(string): boolean,
   *   reason: function(string): (string|null)}} `gated` is whether this matrix
   *   applies at all — a caller reshaping rows must ask it rather than infer it
   *   from some action happening to be allowed.
   */
  function moveFamilyGate(source) {
    var target = RED.mavlink.resolveCatalogTarget(source ? { source: source } : undefined);
    var family = target.vehicleFamily || '';
    var allowed = target.firmware === 'ardupilot' ? ARDUPILOT_FAMILY_ACTIONS[family] : null;
    function allows(action) {
      return !allowed || allowed.indexOf(action) !== -1;
    }
    return {
      family: family,
      gated: !!allowed,
      allows: allows,
      reason: function (action) {
        if (allows(action)) return null;
        return ACTION_LABEL[action] + ' has no handler on ArduPilot ' + FAMILY_LABEL[family]
          + ' — the vehicle never implements ' + ACTION_WIRE[action] + ' (§14), so the message '
          + 'goes out and nothing happens. Instead: ' + FAMILY_INSTEAD[family];
      },
    };
  }

  /**
   * A Steer group is all-or-nothing.
   *
   * Filling any axis makes this a position / velocity / acceleration setpoint —
   * the runtime derives the type_mask from which groups carry values — and the
   * axes left blank used to encode 0. Under that mask a 0 is a *commanded*
   * zero, not a blank: on an absolute local frame a blank position lands on the
   * EKF origin, a real place and rarely where the vehicle is, and a blank
   * velocity axis commands "hold zero" on an axis nobody mentioned. Group-level
   * optionality is what makes Steer work ("filling fields IS the mode"); within
   * a group it is a half-typed form, reachable by tabbing past two boxes.
   *
   * The runtime refuses these too now (owner ruling, 2026-08-14), so this is
   * the editor half of one rule rather than the only layer that holds it — the
   * dialog is where an operator finds out, before deploying a node that fails
   * every input.
   *
   * Position on **offset** is the one exemption, and it rests on measurement
   * rather than convenience: on LOCAL_OFFSET_NED a 0 is a zero *offset*, which
   * is no movement at all (§14 2026-08-05, the frame-7 probe). Filling one axis
   * is the whole point of that reference — QGC's guided altitude change fills
   * only z, and ArduPlane reads only z. lib/move/index.js draws the same line.
   * Velocity and acceleration get no such exemption on any frame: a zero rate
   * is a rate, whatever the origin is measured from.
   *
   * Siblings are read through `ownDialogField`, NOT `liveOr` (Codex, #284).
   * `liveOr` treats a blank live value as "no answer" and falls back to the
   * saved one — right for a field that inherits, wrong here, where an empty
   * box is the operator's answer. With `liveOr` a saved full triplet could
   * never be cleared: each cleared axis still read its siblings as filled, so
   * all three stayed red and there was no way to switch a position Steer to a
   * velocity one. Reproduced by execution before the fix, pinned below.
   *
   * @param {string[]} axes  the group's three field names
   * @param {string} name    which axis this validator guards
   * @param {string} label   how the refusal names the group
   * @returns {function(*, object): (boolean|string)} arity 2, so a returned
   *   reason counts as invalid rather than coercing truthy (§14)
   */
  var POSITION_AXES = ['north', 'east', 'up'];
  var VELOCITY_AXES = ['vNorth', 'vEast', 'vUp'];
  var ACCEL_AXES = ['aNorth', 'aEast', 'aUp'];

  function steerAxisValidator(axes, name, label) {
    return function (v, opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'goto') !== 'steer') return true;
      if (!RED.mavlink.isBlank(v)) return RED.validators.number(true).call(this, v, opt);
      if (label === 'position'
        && RED.mavlink.liveOr(this, '#node-input-reference', this.reference, 'world') === 'offset') {
        return true;
      }
      for (var i = 0; i < axes.length; i++) {
        if (axes[i] === name) continue;
        var $sibling = RED.mavlink.ownDialogField(this, '#node-input-' + axes[i]);
        var sibling = $sibling ? $sibling.val() : this[axes[i]];
        if (!RED.mavlink.isBlank(sibling)) {
          return 'is required once another ' + label + ' axis is filled — a blank axis is '
            + 'commanded 0 under the type_mask, not left alone';
        }
      }
      return true;
    };
  }

  /**
   * An Attitude angle is all-or-nothing with the other two.
   *
   * ATTITUDE_IGNORE is a single bit over the whole quaternion, so unlike the
   * body rates — which each have their own bit — there is no encoding for
   * "roll 10, yaw unsaid". A blank yaw used to reach the wire as 0, a commanded
   * heading of north the vehicle would swing to on a setpoint that carries no
   * ack to argue with. So filling any angle requires all three, and the runtime
   * refuses the same shape (lib/move/attitude.js).
   *
   * `yaw` is shared with Steer and Go to, so this only applies when the action
   * is Attitude — the same live-or-saved read every other action gate uses.
   *
   * @param {string} name  which angle this validator guards
   * @returns {function(*, object): (boolean|string)} arity 2 so a reason renders (§14)
   */
  function attitudeAngleValidator(name) {
    var ANGLES = ['roll', 'pitch', 'yaw'];
    return function (v, opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'attitude') {
        return RED.validators.number(true).call(this, v, opt);
      }
      if (!RED.mavlink.isBlank(v)) return RED.validators.number(true).call(this, v, opt);
      for (var i = 0; i < ANGLES.length; i++) {
        if (ANGLES[i] === name) continue;
        var $sibling = RED.mavlink.ownDialogField(this, '#node-input-' + ANGLES[i]);
        var sibling = $sibling ? $sibling.val() : this[ANGLES[i]];
        if (!RED.mavlink.isBlank(sibling)) {
          return 'is required once another angle is filled — the three share one ignore '
            + 'bit, so a blank angle is commanded 0 rather than left alone';
        }
      }
      return true;
    };
  }

  /**
   * A manual-control stick: required, -1..1.
   *
   * Required because the runtime refuses a blank axis (owner ruling,
   * 2026-08-14) — the INT16_MAX "not driven" sentinel is gone, so a node saved
   * with an empty stick would deploy clean and fail every input. The range is
   * enforced here because the wire is ±1000 and the operator surface is ±1 — a
   * 500 typed into a stick box is someone thinking in wire units, which would
   * scale to 500000 and clip. The runtime scales whatever it is handed (§2), so
   * this is the only layer that notices.
   *
   * @param {string} [axis]  passed only as 'z', by the one caller whose value is
   *   read — naming the other three would be arguments that never reach a branch
   * @returns {function(*, object): (boolean|string)} arity 2 so a reason renders (§14)
   */
  function stickValidator(axis) {
    return function (v, _opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'manual') return true;
      if (RED.mavlink.isBlank(v)) {
        return 'is required for Manual — MANUAL_CONTROL carries all four axes in every '
          + 'frame, and a blank one is refused rather than centred (0 is full reverse '
          + 'thrust on an ArduSub z axis, §14). Use the value that means "not moving" on '
          + 'this axis: 0 for pitch, roll and yaw, 0.5 for thrust on a Sub';
      }
      var n = Number(v);
      if (!Number.isFinite(n) || n < -1 || n > 1) {
        return 'must be -1..1 (stick deflection, not wire units)';
      }
      // ArduSub reads the thrust axis as 0..1000 with neutral **500**, not
      // −1000..1000 with neutral 0 like the other three (§14, source-read). The
      // ±1000 scaling is the dialect's own declaration for all four axes, so
      // the runtime keeps applying it uniformly — a per-family map is exactly
      // the unmeasured guess doctrine keeps off the wire, and #304 §5 item 4
      // is the rig run that would settle it.
      //
      // What that leaves is an operator surface that *lies* on a Sub: −1..1
      // reads as "0 is neutral", while 0 scales to 0 and lands on full reverse
      // vertical thrust (Codex, #303). With the blank sentinel gone there is no
      // escape hatch at all — every axis is sent — so this check is the only
      // thing between an operator's "neutral" and a dive. The editor is the
      // layer that knows the family, so it says so here. Negative values
      // have no representation at all on that axis; the rest of the range maps
      // straight through, with 0.5 as the neutral an operator means by 0.
      // `n <= 0`, not `n < 0`: 0 is the trap Codex named, because it is exactly
      // what an operator types for "neutral" on a −1..1 surface and exactly
      // what lands on full reverse. 0.5 is the neutral a Sub reads, so the
      // usable range there is (0, 1] and everything at or below 0 is refused.
      if (axis !== 'z' || n > 0) return true;
      if (!isArduSubProfile(this)) return true;
      return 'ArduSub reads the thrust axis as 0..1000 with neutral 0.5, not −1..1 with '
        + 'neutral 0 (§14) — a negative value has no wire representation there, and 0 is '
        + 'full reverse thrust rather than a stop. Use 0.5 for the neutral you mean by 0';
    };
  }

  /**
   * Whether the bound profile is an ArduPilot Sub — the one family whose
   * `MANUAL_CONTROL` z axis does not match the dialect's declared range.
   *
   * @param {object} owner  the node being validated
   * @returns {boolean}
   */
  function isArduSubProfile(owner) {
    var gate = moveFamilyGate(owner);
    return gate.gated && gate.family === 'sub';
  }

  // Dialect + Vehicle Profile validators are the shared Build-tier rule (§6);
  // Move's mode field is `delivery` and it has no firmware selector.
  var moveDefaults = Object.assign(
    {
      name: { value: '' },
      identity: { value: '' },
      // The dialog only ever offers the tiers DELIVERY_OPTIONS lists for the
      // chosen action, so a Steer node cannot be *set* to confirm through the
      // UI. A hand-edited flow can hold one, and the runtime does not refuse
      // it (AGENTS.md, input trust) — it falls through to the Send branch and
      // reports `sent`, which is true of the wire and misleading about the
      // tier. The editor knows both fields at deploy, so it says so here.
      delivery: {
        value: 'build',
        validate: function (v, _opt) {
          var action = RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer');
          // Same class of finding as steer × confirm below, and caught the same
          // way: the dialog never offers this pair (refreshDeliveryOptions
          // withdraws the tier for Offset), but a hand-edited flow can hold it
          // and the runtime would stream it happily. Every tick of an offset
          // setpoint is resolved against the vehicle's position at that moment,
          // so repeating one does not hold a target — it walks the vehicle
          // away until the TTL. Both fields are known at deploy, so the editor
          // says so rather than letting it fly.
          if (v === 'stream' && action === 'steer'
            && RED.mavlink.liveOr(this, '#node-input-reference', this.reference, 'world') === 'offset') {
            return 'Offset cannot stream — each setpoint is resolved against the vehicle\'s '
              + 'position at that moment, so a repeating offset walks it away instead of holding '
              + 'a target. Use Send, or switch the reference to World';
          }
          // Third of the same family, and found by the same lens: a MAV_CMD has
          // no streaming semantics, so the dialog never offers Stream for Turn
          // or Speed — but a hand-edited flow can hold it, and deliverCommand
          // would fall through to the Send branch and report `sent`. True of
          // the wire, a lie about the tier. Known at deploy, so said here.
          if (v === 'stream' && (action === 'turn' || action === 'speed')) {
            return 'a command cannot stream — ' + action + ' rides an acknowledged MAV_CMD, '
              + 'which is sent once and answered. Use Send, or Send & confirm to wait for '
              + 'the acknowledgement';
          }
          // Fourth instance of the family, so it is stated generally rather than
          // per action: only the acked actions have anything to wait for. Go
          // to rides DO_REPOSITION, Turn CONDITION_YAW, Speed DO_CHANGE_SPEED
          // — every one answers a COMMAND_ACK. Steer, Attitude and Manual are
          // setpoints and sticks, which no vehicle acknowledges, so a confirm
          // tier there would wait forever and the runtime reports `sent`.
          if (v !== 'confirm') return true;
          if (action === 'goto' || action === 'turn' || action === 'speed') return true;
          return 'this action cannot confirm — setpoints and sticks carry no COMMAND_ACK, so '
            + 'there is nothing to wait for. Use Send, or switch to Go to, Turn or Speed';
        },
      },
      // Action × Delivery derives the wire (§6 redesign, 2026-08-12): the
      // operator states an intent; carrier, message name, frame number, and
      // mask are code. goto = the acked guided goto (DO_REPOSITION as
      // COMMAND_INT on the command tiers, SET_POSITION_TARGET_GLOBAL_INT on
      // Stream); steer = setpoints, fire-and-forget.
      // A Steer node with every field blank has nothing to command: the mask
      // derives from which groups carry values, so all-blank is the all-ignore
      // packet PX4 logs as invalid. No *individual* field can be required —
      // filling fields IS the mode — but "at least one of them" can be, and
      // that is the rule. It reds on Action because Action is what makes the
      // fields mean anything; Go to reads none of them, so it never fires.
      // Two args so the reason renders (§14).
      action: {
        value: 'goto',
        validate: function (v, _opt) {
          // The vehicle half of §9 ruling 6's "red on saved": the dropdown
          // stops offering an action the bound vehicle has no handler for, and
          // a node that already held one keeps it and lands here. Every entry
          // is a message the vehicle accepts and does nothing with — no NAK on
          // the setpoint carriers, so without this the operator has no symptom
          // to read at all.
          var familyReason = moveFamilyGate(this).reason(v);
          if (familyReason) return familyReason;
          // CONDITION_YAW is an ArduPilot command and PX4 has no handler for it
          // (§14). The family table above answers the ArduPilot half; this is
          // the firmware half, which is all PX4 gets — its receiver has no
          // vehicle branch, so there is no family knowledge to gate on. The
          // message names the escape that works there: Steer's yaw field.
          if (v === 'turn') {
            var firmware = RED.mavlink.resolveCatalogTarget({ source: this }).firmware;
            if (firmware && firmware !== 'ardupilot') {
              return 'Turn is an ArduPilot command (CONDITION_YAW) and this profile is '
                + firmware + ' — on PX4, yaw with a Steer setpoint instead';
            }
            return true;
          }
          var owner = this;
          var filled = function (names) {
            return names.some(function (n) { return !RED.mavlink.isBlank(fieldValue(owner, n)); });
          };
          // Attitude has Steer's shape and needed Steer's rule: presence drives
          // ATTITUDE_TARGET_TYPEMASK, so an all-blank Attitude sets *every*
          // ignore bit — 199 — and commands nothing while the node still
          // reports `sent` or `streaming`. A setpoint carries no ack, so that
          // is the failure mode with no symptom, and the editor is the only
          // layer that can see it (Codex, #303).
          //
          // Manual needs no equivalent: every one of its four sticks is
          // required outright (stickValidator), so there is no all-blank form
          // left to catch. That changed with the INT16_MAX sentinel's removal —
          // an all-blank Manual used to be a real message, every axis
          // explicitly not driven, and now it is simply refused.
          if (v === 'attitude') {
            if (filled(['roll', 'pitch', 'yaw', 'rollRate', 'pitchRate', 'yawRate', 'thrust'])) {
              return true;
            }
            return 'Attitude needs at least one field filled — an angle, a body rate, or '
              + 'thrust. All-blank sets every ignore bit, so the vehicle is commanded nothing '
              + 'and no ack comes back to tell you';
          }
          if (v !== 'steer') return true;
          var hasPos = filled(['north', 'east', 'up']);
          var hasVel = filled(['vNorth', 'vEast', 'vUp']);
          var hasAcc = filled(['aNorth', 'aEast', 'aUp']);
          // Position + acceleration with no velocity is the one combination
          // the wire vocabulary does not carry (lib/move/frames.js MODES): no
          // named ArduPilot guided submode, no §14 measurement either way. A
          // setpoint gets no ack, so if the source read is right the operator
          // sees "sent" while the vehicle holds — the failure mode with no
          // symptom. Adding a velocity makes it a measured submode; so does
          // clearing the acceleration.
          if (hasPos && hasAcc && !hasVel) {
            return 'position + acceleration needs a velocity too — that pair alone has no '
              + 'guided submode on ArduPilot and is unmeasured (§14), and a setpoint carries '
              + 'no ack to tell you it was ignored';
          }
          // Every other combination is a mode: the type_mask carries an
          // independent ignore bit per group. So the rule left is that
          // *something* is filled.
          if (hasPos || hasVel || hasAcc) return true;
          if (filled(['yaw', 'yawRate'])) return true;
          return 'Steer needs at least one field filled — a position, a velocity, '
            + 'an acceleration, or a yaw';
        },
      },
      // Go to's one frame choice: altitude above home vs absolute MSL.
      altRef: { value: 'home' },
      // Steer's axes: world = LOCAL_NED everywhere; body adapts to the bound
      // firmware (AP BODY_OFFSET_NED vs PX4 BODY_NED, §14) and fails closed
      // without one. On the wire tiers the Connection's Vehicle Profile
      // supplies the firmware; on Build only the Vehicle Profile dialect
      // escape does — so Body on Build with a concrete dialect is a node
      // that deploys clean and refuses every input (Codex, #277), and the
      // editor must not offer that shape. Deploy-time validation reads the
      // saved values; the live read is own-dialog scoped (#217).
      reference: {
        value: 'world',
        validate: function (v, _opt) {
          var ref = RED.mavlink.liveOr(this, '#node-input-reference', v, 'world');
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'goto') !== 'steer') return true;
          // Offset on PX4 is measured inert — accepted and no motion at all,
          // burst and stream (§14 2026-08-05). The dropdown stops offering it
          // when the profile says PX4, but a node that already had it saved
          // must not be silently rewritten to World: that would change what
          // the operator configured without telling them. So the option stays
          // visible and reds here instead. Read from the saved config, not the
          // DOM — validate runs for every node at deploy, and only this node's
          // own dialog may be open.
          if (ref === 'offset'
            && RED.mavlink.resolveCatalogTarget({ source: this }).firmware === 'px4') {
            return 'Offset from here does nothing on PX4 — it accepts MAV_FRAME_LOCAL_OFFSET_NED '
              + 'and never acts on it (measured, §14). Use World, or Body (PX4 reads BODY_NED)';
          }
          // The mirror image on a fixed wing, and the same ruling: ArduPlane's
          // handler opens `if (coordinate_frame != MAV_FRAME_LOCAL_OFFSET_NED)
          // { return; }` (§14), so World and Body are the two that do nothing
          // there — silently, with no NAK. Offset is not a preference on a
          // plane, it is the only local frame there is.
          var planeGate = moveFamilyGate(this);
          if (ref !== 'offset' && planeGate.gated && planeGate.family === 'plane') {
            return 'a fixed wing accepts only MAV_FRAME_LOCAL_OFFSET_NED — ArduPlane\'s handler '
              + 'returns immediately on every other frame, with no NAK (§14). Use Offset from here';
          }
          if (ref !== 'body') return true;
          if (RED.mavlink.liveOr(this, '#node-input-delivery', this.delivery, 'build') !== 'build') return true;
          if (RED.mavlink.liveOr(this, '#node-input-dialect', this.dialect, '') === '__vehicle') return true;
          return 'Body on Build needs a firmware to adapt to — set Dialect to "from Vehicle Profile…", or use World';
        },
      },
      // Go to command-path params. Blank encodes the spec's no-change sentinel
      // at runtime (speed −1 = vehicle default, radius 0 = ignored, yaw NaN =
      // current heading mode — the command-preset blankParams convention).
      speed: { value: '', validate: RED.validators.number(true) },
      radius: { value: '', validate: RED.validators.number(true) },
      // MAV_DO_REPOSITION_FLAGS_CHANGE_MODE: flies the vehicle into guided —
      // a mode change, so an explicit opt-in, default off.
      changeMode: { value: false },
      // ── Turn (CONDITION_YAW) ──────────────────────────────────────────
      // Heading is required and bounded 0-360 because ArduCopter *answers
      // FAILED* outside that range (source-read 2026-08-13) — the vehicle is
      // the one refusing, so the editor is where an operator finds out before
      // flying. Two args so the reason renders (§14).
      heading: {
        value: '',
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'turn') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for Turn';
          var n = Number(v);
          return (Number.isFinite(n) && n >= 0 && n <= 360)
            || 'must be within [0, 360] degrees — ArduPilot answers FAILED outside it';
        },
      },
      turnRate: { value: '', validate: RED.validators.number(true) },
      // -1 ccw, 0 shortest, 1 cw — common.xml defines 0 as "shortest
      // direction", so the default is the dialect's, not one we invented.
      direction: { value: '0' },
      // Changes what the heading number means, so a strict boolean opt-in like

          ['send', 'Send'],
          ['stream', 'Stream']

      var ACTION_OPTIONS = [

        ['steer', 'Steer (setpoints, fire-and-forget)'],
        ['turn', 'Turn (heading, acknowledged)'],
        ['speed', 'Speed (change speed, acknowledged)'],
        ['attitude', 'Attitude (setpoints, fire-and-forget)'],
        ['manual', 'Manual (joystick sticks)']

        var isWire = !isBuild;
        var isStream = delivery === 'stream';
        // Go to's command path: DO_REPOSITION on Build/Send/Send & confirm.
        // Its params have no meaning on a streamed setpoint (runtime refuses
        // them there), so Stream withdraws the rows.
        var isCommandPath = isGoto && !isStream;
        var isBody = !isGoto && reference === 'body';
        var isOffset = !isGoto && reference === 'offset';
        var altRef = $('#node-input-altRef').val() || 'home';
        var tgt = RED.mavlink.applyCompanionTargetVisibility({
          isBuild: isBuild,
          identityId: isWire ? $('#node-input-identity').val() : '',
          targetSystemRow: '#row-move-targetSystem',
          targetComponentRow: '#row-move-targetComponent',
        });

        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuild,
          dialect: dialect,
          dialectRow: '#row-move-dialect',
          vehicleRow: '#row-move-vehicle',
          connectionRow: '#row-move-connection'
        });

        var show = moveRowVisibility({
          isWire: isWire, tgt: tgt, isGoto: isGoto, isSteer: isSteer, isTurn: isTurn,
          isSpeed: isSpeed, isAttitude: isAttitude, isManual: isManual,
          isCommandPath: isCommandPath, isStream: isStream, delivery: delivery,
          planeSteer: planeSteer, groups: groups
        });

        // MANUAL_CONTROL's addressing field is `target` — a system id, with no
        // target_component on the wire at all. So the compid row is withdrawn
        // for this action regardless of what the identity role would allow: an
        // operator must not be shown a control the message has no room for.
        //
        // Hidden directly, not through `show`: the target rows are the two this
        // function does NOT toggle from that object — applyCompanionTargetVisibility
        // owns them, and it ran above. Setting show.targetComponent here was a
        // no-op that left the row on screen (Gitar, #303).
        if (isManual) $('#row-move-targetComponent').hide();

        // Every key of `show` is a row suffix, so the toggles are a loop: a
        // key that reaches no toggle is the exact bug Gitar found in #303
        // (`show.targetComponent` was assigned and never read), and a loop
        // makes it unrepresentable rather than caught by review. The two
        // target rows are skipped because applyCompanionTargetVisibility
        // already toggled them above — listing them here would fight it.
        Object.keys(show).forEach(function (key) {
          if (HELPER_ROWS.indexOf(key) !== -1) return;
          $('#row-move-' + key).toggle(!!show[key]);
        });

        // Labels follow the reference so the operator never translates
        // MAVLink axis conventions in their head: the body reference is
        // heading relative (forward/right). Vertical inputs stay up-positive
        // everywhere (§ "NED is down-positive": the sign flips once, at
        // encode) — and the altitude label names the reference in force.
        // Offset qualifies the *position* triplet only: on frame 7 the rates
        // are plain NED, byte-identical in meaning to frame 1 (ArduCopter
        // source-read 2026-08-13), so velocity and acceleration keep their
        // world labels. isBody and isOffset are mutually exclusive — both read
        // the one reference select — so the qualifier composes safely.
        var fromHere = isOffset ? ' (from here)' : '';
        $('#label-move-north').text((isBody ? 'Metres forward' : 'Metres north') + fromHere);
        $('#label-move-east').text((isBody ? 'Metres right' : 'Metres east') + fromHere);
        $('#label-move-up').text('Metres up' + fromHere);
        // Go to's speed is "fly there at"; the Speed action's is "fly at from
        // now on". Same field, same units, different sentence.
        $('#label-move-speed').text(isSpeed ? 'Speed' : 'Ground speed');
        $('#label-move-vNorth').text(isBody ? 'Forward m/s' : 'North m/s');
        $('#label-move-vEast').text(isBody ? 'Right m/s' : 'East m/s');
        $('#label-move-aNorth').text(isBody ? 'Accel forward' : 'Accel north');
        $('#label-move-aEast').text(isBody ? 'Accel right' : 'Accel east');
        $('#label-move-alt').text(altRef === 'msl' ? 'Metres alt (MSL)' : 'Metres alt (above home)');
      }

      // Clearing a group clears its fields before the repaint, so the form and
      // the type_mask never disagree (see applyGroupDisclosure).
      STEER_GROUPS.forEach(function (entry) {
        $('#move-group-' + entry[0]).on('change', function () {
          var open = $(this).is(':checked');
          if (!disclosed) disclosed = seedDisclosure();
          disclosed[entry[0]] = open;
          if (!open) {
            entry[1].forEach(function (name) { $('#node-input-' + name).val(''); });
          }
          refreshVisibility();
        });
      });

      $('#node-input-action').on('change', refreshVisibility);
      $('#node-input-altRef').on('change', refreshVisibility);
      $('#node-input-reference').on('change', refreshVisibility);
      $('#node-input-delivery').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-identity').on('change', refreshVisibility);
      $('#node-input-dialect').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-vehicle').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-connection').on('change', function () {
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      RED.mavlink.populateDialectSelect($('#node-input-dialect'), { saved: node.dialect || '' });
      RED.mavlink.reloadTargetCompId(node);
      refreshVisibility();
    }
  });
</script>

<script type="text/html" data-help-name="mavlink-move">
  <p>Builds or sends vehicle movement commands. The operator picks an intent — <b>Action</b> × <b>Delivery</b> — and the wire message, frame number, and type_mask follow as code; you never enter a bitmask. Vertical inputs — altitude, climb, vertical acceleration — are entered up-positive everywhere; the node flips them once to MAVLink NED down-positive values. Yaw and yaw rate are entered in degrees (deg, deg/s) and converted exactly once to the radians on the wire.</p>
  <p><b>Go to</b> is the one-shot GCS-style guided goto. On Build, Send, and Send &amp; confirm it rides <code>MAV_CMD_DO_REPOSITION</code> as <code>COMMAND_INT</code> — the acked command path; on Stream it rides <code>SET_POSITION_TARGET_GLOBAL_INT</code> at rate, the same intent streamed. The <b>Altitude reference</b> is the only frame choice: <i>Above home</i> (frame 3) or <i>Absolute (MSL)</i> (frame 0). Latitude/longitude are entered in degrees; yaw is entered in degrees and converted once to the radians the dialect declares for DO_REPOSITION. Blank optional params send the spec's no-change sentinels, matching what QGC and MAVSDK transmit: blank <b>Ground speed</b> → −1 (vehicle default), blank <b>Loiter radius</b> → 0 (ignored, planes), blank <b>Yaw</b> → NaN (keep the current heading mode; an explicit 0 commands north). Ground speed, Loiter radius, and Change mode are command-path params — they hide on Stream delivery, and the runtime refuses their payload overrides on a streamed setpoint.</p>
  <p><b>Change mode</b> (Advanced) sets MAV_DO_REPOSITION_FLAGS_CHANGE_MODE, and the flag is the gate on both stacks (measured, §14 2026-08-12): the goto is accepted iff the flag is set or the vehicle is already in GUIDED (ArduPilot) / Hold (PX4), else it answers denied (2). It flies the vehicle into guided mode — a mode change, and therefore an explicit opt-in (checkbox, or boolean <code>msg.payload.changeMode</code>).</p>
  <p>On <b>Send &amp; confirm</b> delivery (Go to only — setpoints carry no acknowledgement) the node waits for the terminal COMMAND_ACK and reports it in the same vocabulary as <b>mavlink-command</b>: output 0 fires on <code>ACCEPTED</code> with an <code>accepted</code> record carrying <code>resultCode</code> 0; every other terminal result fails on output 1 with its MAV_RESULT name as the result — <code>denied</code>, <code>command_int_only</code>, <code>command_unsupported_mav_frame</code>, … — and its code, and a missing ack reports <code>unconfirmed</code> (§9: a missing ack is not a failure). The result IS the discriminator — branch on it with a switch. <code>TEMPORARILY_REJECTED</code> retries with back-off before failing. <b>ACK timeout</b> (blank = 10 s) bounds the wait. Every ack-confirmed record also carries the ack's <code>resultParam2</code> (command-specific detail, often the reason for a denial), and while the vehicle answers <code>IN_PROGRESS</code> the status badge shows the progress it reports. A broadcast target (sysid 0) is refused on this tier — one ack cannot answer for a fleet; use Send or <b>mavlink-fanout</b> broadcast for per-vehicle acknowledgements.</p>
  <p><b>Steer</b> sends <code>SET_POSITION_TARGET_LOCAL_NED</code> setpoints — the streaming/offboard path, fire-and-forget. The <b>Reference</b> picks the axes: <i>World (Local NED)</i> works on every firmware; <i>Body</i> adapts to the bound Vehicle Profile's firmware, because the two stacks read different body frames (measured, §14): ArduPilot reads BODY_OFFSET_NED (9) as the body-axis offset, while PX4 ignores 9 and reads BODY_NED (8) — and PX4 discards position in body frames, so body setpoints on PX4 carry velocity only. Without a firmware the body reference refuses rather than guess — a wrong frame number is silently dropped by the vehicle. Body labels read forward/right.</p>
  <p><i>Offset from here</i> is <code>MAV_FRAME_LOCAL_OFFSET_NED</code> (7): the position triplet is a world-axis offset added to wherever the vehicle currently is, so <b>Metres up</b> 10 with the other two blank climbs 10 m from here. Unlike World, a blank axis is legal and means a zero offset — no movement — rather than a coordinate, so single-axis moves are the normal use. This is the frame QGroundControl itself sends for a guided altitude change on ArduPilot, and the <b>only</b> local frame <b>ArduPlane</b> accepts at all (it reads the vertical component and ignores the rest) — World and Body do nothing on a fixed wing. ArduCopter, Rover and Sub apply all three axes. Velocity and acceleration are unaffected by the offset: on this frame they are plain NED rates, identical to World. <b>PX4 accepts frame 7 and never acts on it</b> (measured, §14), so the option is not offered when the Vehicle Profile says PX4. <b>Stream</b> delivery is not offered either — each setpoint is resolved against the vehicle's position at that moment, so a repeating offset walks the vehicle away instead of holding a target.</p>
  <p>Every Steer field is optional, because filling fields IS the mode: the type_mask derives from which groups carry values — position, velocity, acceleration, any combination of them (feed-forward), or yaw / yaw rate alone. Blank means mask-ignored; a value (including 0) means commanded. The editor requires at least one field, because an all-blank steer is the all-ignore packet PX4 logs as invalid.</p>
  <p>The <b>Fields</b> checkboxes — Position, Velocity, Acceleration, Yaw — decide which of those groups the form shows. They are disclosure only: nothing extra is saved, and the type_mask still derives from the values you enter. Clearing a box <b>clears that group's fields</b>, deliberately — a hidden field that still held a value would still be commanded, with nothing on screen to explain it. The boxes open themselves on whichever groups already carry values, so an imported flow shows what it sends.</p>
  <p><b>The Action list follows the vehicle.</b> When the bound Vehicle Profile names an ArduPilot family, actions that family has no handler for are not offered — an Antenna Tracker shows Attitude and Manual, a Blimp shows Go to, and Turn appears only on Copter and Sub, because neither ArduPlane nor Rover implements <code>CONDITION_YAW</code> (§14). These are all messages the vehicle <i>accepts</i> and then ignores, mostly with no NAK, so the dialog is the only place the difference can be seen. A profile whose family is <i>Unknown</i>, or no profile at all, offers everything: hiding requires knowledge. PX4 profiles are not gated by family either — that matrix is ArduPilot's per-vehicle dispatch, and PX4 has one receiver with no vehicle branch in it. A node that already holds a withheld action keeps it and reds at deploy with the reason, rather than being silently rewritten.</p>
  <p>On a <b>Plane</b> profile Steer collapses to a single field. ArduPlane's local-setpoint handler returns immediately on any frame that is not <code>LOCAL_OFFSET_NED</code> and then reads only the vertical component, so <i>World</i> and <i>Body</i> are withheld from the Reference list — and with <i>Offset from here</i> selected, <b>Metres up</b> is the whole form: a guided altitude change, which is exactly what QGroundControl offers a fixed wing beside goto. A node that already had World or Body saved keeps it and reds with the reason rather than being rewritten, so the form stays whatever the Reference actually says.</p>
  <p><b>Turn</b> sends <code>MAV_CMD_CONDITION_YAW</code> — and on ArduPilot it is the <i>only</i> working yaw. Both of the yaw fields the position carriers already carry are measured inert on ArduCopter (§14): <code>DO_REPOSITION</code>'s heading param is ignored outright, and a yaw-only setpoint stream holds heading instead of turning. ArduPilot's own test suite yaws in guided through this command. <b>Heading</b> is 0-360 degrees, absolute (0 = north) unless <b>Relative</b> (Advanced) is ticked, which makes it an offset from the current heading; the range is enforced here because the vehicle answers <code>FAILED</code> outside it. <b>Direction</b> defaults to the shortest way round, which is the dialect's own meaning for 0. Blank <b>Turn rate</b> (Advanced) leaves the vehicle's default. PX4 has no handler for this command, so the action refuses on a PX4 profile and points you at Steer's yaw field, which PX4 does honour.</p>
  <p><b>Speed</b> sends <code>MAV_CMD_DO_CHANGE_SPEED</code>, the guided speed change QGroundControl offers beside goto. <b>Speed type</b> picks which speed is being set — ground speed means something on every vehicle, airspeed is a fixed-wing concept, and climb/descent set the vertical rates. Blank <b>Speed</b> or <b>Throttle</b> (Advanced) sends the spec's -1 &ldquo;no change&rdquo;; -2 is the spec's &ldquo;return to default&rdquo; and you reach it by typing it. Both stacks and every moving vehicle family accept this command, so it asks no firmware question.</p>
  <p><b>Attitude</b> sends <code>SET_ATTITUDE_TARGET</code> — MAVSDK's offboard attitude path. You enter <b>Roll</b>, <b>Pitch</b> and <b>Yaw</b> in degrees and the node builds the quaternion the wire wants; you never type <code>q[4]</code>. Presence drives the mask exactly as it does on Steer: any angle commands the whole attitude (the wire has one ignore bit for all three), each body rate clears only its own bit, and <b>Thrust</b> is normalised 0..1 where an explicit 0 is a commanded zero rather than a blank. On <b>Stream</b> delivery the stream ends by <i>going quiet</i> — there is no braking packet, because zero thrust is a descent rather than a stop, and both stacks watch for setpoint silence themselves.</p>
  <p><b>Manual</b> sends <code>MANUAL_CONTROL</code>, the joystick message: QGroundControl's stick path, how ArduSub is flown, and one of the two ways an Antenna Tracker can be pointed. It is <i>not</i> how a Blimp moves — ArduPilot's Blimp never overrides the stick handler, whose base implementation is empty, so it decodes the message, counts it as a ground-station heartbeat, and discards it (§14). Sticks are entered <b>-1..1</b> and scale to the wire's ±1000 once, at encode. Two things differ from every other action. It addresses a <b>system only</b> — the message has no target component, so that row is hidden. And <b>a blank stick is a disabled axis, not a centred one</b>: it sends the dialect's <code>INT16_MAX</code> "axis is invalid" rather than 0. That matters — ArduSub reads the thrust axis as 0..1000 with neutral <i>500</i>, so an axis helpfully centred at 0 would command full reverse thrust. Leaving an axis blank means the vehicle is not driven on it at all, on any firmware. Ceasing to transmit is a real stop here: ArduSub's GCS failsafe disarms when stick messages stop arriving.</p>
  <p>Action and delivery reshape the form (§6): only the parameters for the selection are shown, and the Delivery options themselves follow the action — steer setpoints cannot confirm, so Send &amp; confirm is offered on Go to only. Stream rate (setpoints per second, Hz) and TTL (ms) appear only for Stream delivery.</p>
  <p>Output 0 continues only on success, once per input, and the result word IS the outcome, one meaning per word: <code>sent</code> (on the wire, nobody answers), <code>streaming</code> (setpoints flowing at rate), <code>stopped</code> (stream ended by the flow), <code>accepted</code> (the vehicle agreed — Go to confirm only). Output 1 carries the status record for every outcome.</p>
  <p>On <b>Stream</b> delivery a running stream ends three ways. When the <b>TTL</b> elapses the node sends the zero-velocity brake and reports on output 1 with <code>result: "expired"</code> and <code>sent</code> (setpoints handed to the connection — the streaming link may coalesce under backpressure, so this counts sends, not wire deliveries) — switch on <code>result === "expired"</code> to run whatever follows a timed move; deliberately not on output 0, since that port is a trigger and the stream's start already fired it. If the expiry brake send itself fails, <code>result</code> stays <code>"expired"</code> and the failure rides a <code>brakeError</code> field. An input of <code>{action: "stop"}</code> halts the stream, sends the brake, and completes like any input — output 0 fires once, and the status record carries <code>result: "stopped"</code> with <code>sent</code>; a stop with nothing streaming completes with <code>detail: "no stream"</code>, and the action is refused on Build and Send delivery. A <b>new input</b> replaces the stream as a direct handover — no brake between consecutive targets, matching GCS practice; retargeting a different vehicle brakes the abandoned target once the new stream is live. A redeploy closes the node and brakes. A stream that keeps running through send failures reports once per failure streak on output 1 and never quits on its own — the firmware's setpoint watchdog is the failsafe on a dead link.</p>
  <p><code>msg.payload</code> overrides speak the action-shaped vocabulary: <code>altRef</code> (<code>"home"</code>/<code>"msl"</code>, Go to), <code>reference</code> (<code>"world"</code>/<code>"body"</code>, Steer), <code>position</code> (<code>{lat, lon, alt}</code> on Go to, <code>{north, east, up}</code> on Steer), <code>velocity</code> and <code>accel</code> (<code>{north, east, up}</code>, Steer), <code>yaw</code>, <code>yawRate</code>, <code>speed</code>, <code>radius</code>, <code>changeMode</code> (boolean, Go to command path), <code>target</code> (<code>{sysid, compid}</code>), <code>rateHz</code> and <code>ttlMs</code> (Stream), <code>timeBootMs</code>, and <code>action: "stop"</code>. <code>msg.payload === false</code> suppresses the input silently (§9).</p>
  <p>On <b>Build</b> delivery the Dialect dropdown selects the bundled dialect used for catalogs; choose <i>from Vehicle Profile…</i> to inherit dialect and target defaults from a Vehicle Profile. On <b>Send</b>, <b>Send &amp; confirm</b>, or <b>Stream</b> delivery a Connection is required and the Identity determines addressing: a companion identity derives the target sysid from its airframe and pins compid to 1 (the autopilot).</p>
