<script type="text/javascript">
  (function () {
  /**
   * A field's value as the operator currently has it: the live input while
   * this node's own dialog is on top, else the saved property. Same rule as
   * `steerAxisValidator`'s sibling reads and for the same reason — an empty
   * box is an answer, so `liveOr`'s fall-back-to-saved would hide a clearing.
   *
   * @param {object} owner  the node being validated
   * @param {string} name   config property, which is also the input id suffix
   * @returns {*}
   */
  function fieldValue(owner, name) {
    const $live = RED.mavlink.ownDialogField(owner, `#node-input-${name}`);
    return $live ? $live.val() : owner[name];
  }

  /**
   * Which Move actions an ArduPilot vehicle actually has a handler for.
   *
   * Read across all six vehicles' GCS dispatch tables at source (§14
   * 2026-08-14), because a gate that hides an action is only as good as the
   * knowledge behind it — and two of the claims this table replaces were
   * wrong. The surprises are the load-bearing rows: **Blimp ignores the
   * joystick** (`handle_manual_control_axes` is a virtual with an empty body
   * and Blimp does not override it — the sticks are decoded, counted as a GCS
   * heartbeat, and discarded), while an **Antenna Tracker does move**, just
   * through Attitude and Manual rather than any position carrier. Neither
   * ArduPlane nor Rover has a `CONDITION_YAW` handler anywhere, so Turn is a
   * Copter-and-Sub action rather than an ArduPilot one.
   *
   * A family absent from this table — `unknown`, or a value a future profile
   * adds — gates nothing, because hiding requires knowledge.
   */
  // Everything but Turn — no CONDITION_YAW handler. A boat IS Rover firmware,
  // so the two families share the row rather than repeating it.
  const NO_YAW_ACTIONS = ['goto', 'steer', 'speed', 'attitude', 'manual'];
  const ARDUPILOT_FAMILY_ACTIONS = {
    copter: ['goto', 'steer', 'turn', 'speed', 'attitude', 'manual'],
    sub: ['goto', 'steer', 'turn', 'speed', 'attitude', 'manual'],
    // Plane also takes frame 7 only, and its handler reads `z` alone.
    plane: NO_YAW_ACTIONS,
    rover: NO_YAW_ACTIONS,
    boat: NO_YAW_ACTIONS,
    // handle_message is a bare switch; handle_command_int_packet has
    // DO_REPOSITION and NAV_TAKEOFF. Its capabilities() advertises three
    // setpoint messages it does not implement — not evidence of a handler.
    blimp: ['goto'],
    'antenna-tracker': ['attitude', 'manual'],
  };

  /** The wire each action rides, for the refusal message. */
  const ACTION_WIRE = {
    goto: 'DO_REPOSITION',
    steer: 'SET_POSITION_TARGET_LOCAL_NED',
    turn: 'CONDITION_YAW',
    speed: 'DO_CHANGE_SPEED',
    attitude: 'SET_ATTITUDE_TARGET',
    manual: 'MANUAL_CONTROL',
  };

  const ACTION_LABEL = {
    goto: 'Go to', steer: 'Steer', turn: 'Turn',
    speed: 'Speed', attitude: 'Attitude', manual: 'Manual',
  };

  const FAMILY_LABEL = {
    copter: 'Copter', plane: 'Plane', rover: 'Rover', boat: 'Boat',
    sub: 'Sub', blimp: 'Blimp', 'antenna-tracker': 'Antenna Tracker',
  };

  /**
   * What to do instead, per family — each one loses a different thing. Copter
   * and Sub have no entry because they refuse nothing, so `reason` never looks
   * them up; a family that starts refusing needs a line here, and the test
   * matrix is what catches its absence.
   */
  const NO_YAW_INSTEAD = 'give it a destination instead — Go to, or a Steer setpoint';
  const FAMILY_INSTEAD = {
    plane: 'a fixed wing has no guided yaw command at all (GUIDED_CHANGE_HEADING is the '
      + 'forward entry, not built), so turn it by giving it somewhere to go — Go to',
    rover: NO_YAW_INSTEAD,
    boat: NO_YAW_INSTEAD,
    blimp: 'DO_REPOSITION is the one motion message a Blimp implements — use Go to',
    'antenna-tracker': 'a tracker does not travel — point it with Attitude or Manual',
  };

  /**
   * The bound vehicle's Move surface: what it can act on, and why not.
   *
   * Family gating is ArduPilot-only on purpose. This matrix is ArduPilot's
   * per-vehicle dispatch; PX4 has one receiver with no vehicle branch in it,
   * and nothing here was measured against PX4 — so a PX4 profile gates on
   * firmware alone, as it did before.
   *
   * @param {object} [source]  saved config, for `validate`; omit inside a dialog
   * @returns {{family: string, gated: boolean, allows: function(string): boolean,
   *   reason: function(string): (string|null)}} `gated` is whether this matrix
   *   applies at all — a caller reshaping rows must ask it rather than infer it
   *   from some action happening to be allowed.
   */
  function moveFamilyGate(source) {
    const target = RED.mavlink.resolveCatalogTarget(source ? { source } : undefined);
    const family = target.vehicleFamily || '';
    const allowed = target.firmware === 'ardupilot' ? ARDUPILOT_FAMILY_ACTIONS[family] : null;
    function allows(action) {
      return !allowed || allowed.indexOf(action) !== -1;
    }
    return {
      family,
      gated: Boolean(allowed),
      allows,
      reason(action) {
        if (allows(action)) return null;
        return `${ACTION_LABEL[action]} has no handler on ArduPilot ${FAMILY_LABEL[family]} — the vehicle never implements ${ACTION_WIRE[action]}, so the message `
          + `goes out and nothing happens. Instead: ${FAMILY_INSTEAD[family]}`;
      },
    };
  }

  /**
   * A Steer group is all-or-nothing.
   *
   * Filling any axis makes this a position / velocity / acceleration setpoint —
   * the runtime derives the type_mask from which groups carry values — and an
   * axis left blank would encode 0. Under that mask a 0 is a *commanded*
   * zero, not a blank: on an absolute local frame a blank position lands on the
   * EKF origin, a real place and rarely where the vehicle is, and a blank
   * velocity axis commands "hold zero" on an axis nobody mentioned. Group-level
   * optionality is what makes Steer work ("filling fields IS the mode"); within
   * a group it is a half-typed form, reachable by tabbing past two boxes.
   *
   * The runtime refuses these as well (owner ruling, 2026-08-14), so this is
   * the editor half of one rule rather than the only layer that holds it — the
   * dialog is where an operator finds out, before deploying a node that fails
   * every input.
   *
   * Position on **offset** is the one exemption, and it rests on measurement
   * rather than convenience: on LOCAL_OFFSET_NED a 0 is a zero *offset*, which
   * is no movement at all (§14 2026-08-05, the frame-7 probe). Filling one axis
   * is the whole point of that reference — QGC's guided altitude change fills
   * only z, and ArduPlane reads only z. lib/move/index.js draws the same line.
   * Velocity and acceleration get no such exemption on any frame: a zero rate
   * is a rate, whatever the origin is measured from.
   *
   * Siblings are read through `ownDialogField`, NOT `liveOr`.
   * `liveOr` treats a blank live value as "no answer" and falls back to the
   * saved one — right for a field that inherits, wrong here, where an empty
   * box is the operator's answer. With `liveOr` a saved full triplet could
   * never be cleared: each cleared axis still read its siblings as filled, so
   * all three stayed red and there was no way to switch a position Steer to a
   * velocity one. Reproduced by execution before the fix, pinned below.
   *
   * @param {string[]} axes  the group's three field names
   * @param {string} name    which axis this validator guards
   * @param {string} label   how the refusal names the group
   * @returns {function(*, object): (boolean|string)} arity 2, so a returned
   *   reason counts as invalid rather than coercing truthy (§14)
   */
  const POSITION_AXES = ['north', 'east', 'up'];
  const VELOCITY_AXES = ['vNorth', 'vEast', 'vUp'];
  const ACCEL_AXES = ['aNorth', 'aEast', 'aUp'];

  function steerAxisValidator(axes, name, label) {
    return function (v, opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'steer') return true;
      if (!RED.mavlink.isBlank(v)) return RED.validators.number(true).call(this, v, opt);
      if (label === 'position'
        && RED.mavlink.liveOr(this, '#node-input-reference', this.reference, 'world') === 'offset') {
        return true;
      }
      for (let i = 0; i < axes.length; i++) {
        if (axes[i] === name) continue;
        const sibling = fieldValue(this, axes[i]);
        if (!RED.mavlink.isBlank(sibling)) {
          return `is required once another ${label} axis is filled — a blank axis is `
            + `commanded 0 under the type_mask, not left alone`;
        }
      }
      return true;
    };
  }

  /**
   * An Attitude angle is all-or-nothing with the other two.
   *
   * ATTITUDE_IGNORE is a single bit over the whole quaternion, so unlike the
   * body rates — which each have their own bit — there is no encoding for
   * "roll 10, yaw unsaid". A blank yaw would reach the wire as 0, a commanded
   * heading of north the vehicle would swing to on a setpoint that carries no
   * ack to argue with. So filling any angle requires all three, and the runtime
   * refuses the same shape (lib/move/attitude.js).
   *
   * `yaw` is shared with Steer and Go to, so this only applies when the action
   * is Attitude — the same live-or-saved read every other action gate uses.
   *
   * @param {string} name  which angle this validator guards
   * @returns {function(*, object): (boolean|string)} arity 2 so a reason renders (§14)
   */
  function attitudeAngleValidator(name) {
    const ANGLES = ['roll', 'pitch', 'yaw'];
    return function (v, opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'attitude') {
        return RED.validators.number(true).call(this, v, opt);
      }
      if (!RED.mavlink.isBlank(v)) return RED.validators.number(true).call(this, v, opt);
      for (let i = 0; i < ANGLES.length; i++) {
        if (ANGLES[i] === name) continue;
        const sibling = fieldValue(this, ANGLES[i]);
        if (!RED.mavlink.isBlank(sibling)) {
          return 'is required once another angle is filled — the three share one ignore '
            + 'bit, so a blank angle is commanded 0 rather than left alone';
        }
      }
      return true;
    };
  }

  /**
   * MANUAL_CONTROL's buttons. The wire field is a bare uint16 — the shipped
   * dialect carries `enum: null`, so unlike POSITION_TARGET_TYPEMASK there are
   * no compiled names to enumerate, only the field's own positional rule: "the
   * lowest bit corresponds to Button 1". The editor offers the sixteen bits as
   * one multi-select — Node-RED's typedInput with `multiple`, whose value is
   * the comma-separated bit indices — and the two helpers translate between
   * that and the mask the property holds. Button 3 is bit 2 is the value 4:
   * the off-by-one an operator hand-composing the number falls into.
   */
  const BUTTON_OPTIONS = [];
  for (let bit = 0; bit < 16; bit++) BUTTON_OPTIONS.push({ value: String(bit), label: `Button ${bit + 1}` });

  function isValidButtonsMask(n) {
    return Number.isInteger(n) && n >= 0 && n <= 65535;
  }

  /** Saved mask → the multi-select's bit indices; blank or an invalid mask selects nothing. */
  function buttonsToBits(value) {
    const n = RED.mavlink.isBlank(value) ? 0 : Number(value);
    if (!isValidButtonsMask(n)) return '';
    return BUTTON_OPTIONS.map((o) => o.value)
      .filter((v) => (n & (1 << Number(v))) !== 0).join(',');
  }

  /** Bit indices → the mask the property holds; none composes 0, the empty mask. */
  function bitsToButtons(csv) {
    let n = 0;
    String(csv).split(',').forEach((v) => { if (v !== '') n |= (1 << Number(v)); });
    return String(n);
  }

  /**
   * A manual-control stick: required, -1..1.
   *
   * Required because the runtime refuses a blank axis (owner ruling,
   * 2026-08-14): a node saved with an empty stick would deploy clean and fail
   * every input. The range is
   * enforced here because the wire is ±1000 and the operator surface is ±1 — a
   * 500 typed into a stick box is someone thinking in wire units, which would
   * scale to 500000 and clip. The runtime scales whatever it is handed (§2), so
   * this is the only layer that notices.
   *
   * @param {string} [axis]  passed only as 'z', by the one caller whose value is
   *   read — naming the other three would be arguments that never reach a branch
   * @returns {function(*, object): (boolean|string)} arity 2 so a reason renders (§14)
   */
  function stickValidator(axis) {
    return function (v, _opt) {
      if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'manual') return true;
      if (RED.mavlink.isBlank(v)) {
        return 'is required for Manual — MANUAL_CONTROL carries all four axes in every '
          + 'frame, and a blank one is refused rather than centred (0 is full reverse '
          + 'thrust on an ArduSub z axis). Use the value that means "not moving" on '
          + 'this axis: 0 for pitch, roll and yaw, 0.5 for thrust on a Sub';
      }
      const n = Number(v);
      if (!Number.isFinite(n) || n < -1 || n > 1) {
        return 'must be -1..1 (stick deflection, not wire units)';
      }
      // ArduSub reads the thrust axis as 0..1000 with neutral **500**, not
      // −1000..1000 with neutral 0 like the other three (§14, source-read). The
      // ±1000 scaling is the dialect's own declaration for all four axes, so
      // the runtime keeps applying it uniformly — a per-family map is exactly
      // the unmeasured guess doctrine keeps off the wire; a rig run would
      // settle it.
      //
      // What that leaves is an operator surface that *lies* on a Sub: −1..1
      // reads as "0 is neutral", while 0 scales to 0 and lands on full reverse
      // vertical thrust. With the blank sentinel gone there is no
      // escape hatch at all — every axis is sent — so this check is the only
      // thing between an operator's "neutral" and a dive. The editor is the
      // layer that knows the family, so it says so here. Negative values
      // have no representation at all on that axis; the rest of the range maps
      // straight through, with 0.5 as the neutral an operator means by 0.
      // `n <= 0`, not `n < 0`: 0 is the trap, because it is exactly
      // what an operator types for "neutral" on a −1..1 surface and exactly
      // what lands on full reverse. 0.5 is the neutral a Sub reads, so the
      // usable range there is (0, 1] and everything at or below 0 is refused.
      if (axis !== 'z' || n > 0) return true;
      if (!isArduSubProfile(this)) return true;
      return 'ArduSub reads the thrust axis as 0..1000 with neutral 0.5, not −1..1 with '
        + 'neutral 0 — a negative value has no wire representation there, and 0 is '
        + 'full reverse thrust rather than a stop. Use 0.5 for the neutral you mean by 0';
    };
  }

  /**
   * Whether the bound profile is an ArduPilot Sub — the one family whose
   * `MANUAL_CONTROL` z axis does not match the dialect's declared range.
   *
   * @param {object} owner  the node being validated
   * @returns {boolean}
   */
  function isArduSubProfile(owner) {
    const gate = moveFamilyGate(owner);
    return gate.gated && gate.family === 'sub';
  }

  // Dialect + Vehicle Profile validators are the shared Build-tier rule (§6);
  // Move's mode field is `delivery` and it has no firmware selector.
  const moveDefaults = {
    name: { value: '' },
      identity: { value: '' },
      // The dialog only ever offers the tiers DELIVERY_OPTIONS lists for the
      // chosen action, so a Steer node cannot be *set* to confirm through the
      // UI. A hand-edited flow can hold one, and the runtime does not refuse
      // it (AGENTS.md, input trust) — it falls through to the Send branch and
      // reports `sent`, which is true of the wire and misleading about the
      // tier. The editor knows both fields at deploy, so it says so here.
      delivery: {
        value: 'build',
        validate: RED.mavlink.oneOf(['build', 'send', 'confirm', 'stream'], function (v, _opt) {
          const action = RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer');
          // Same class of finding as steer × confirm below, and caught the same
          // way: the dialog never offers this pair (refreshDeliveryOptions
          // withdraws the tier for Offset), but a hand-edited flow can hold it
          // and the runtime would stream it happily. Every tick of an offset
          // setpoint is resolved against the vehicle's position at that moment,
          // so repeating one does not hold a target — it walks the vehicle
          // away until the TTL. Both fields are known at deploy, so the editor
          // says so rather than letting it fly.
          if (v === 'stream' && action === 'steer'
            && RED.mavlink.liveOr(this, '#node-input-reference', this.reference, 'world') === 'offset') {
            return 'Offset cannot stream — each setpoint is resolved against the vehicle\'s '
              + 'position at that moment, so a repeating offset walks it away instead of holding '
              + 'a target. Use Send, or switch the reference to World';
          }
          // Third of the same family, and found by the same lens: a MAV_CMD has
          // no streaming semantics, so the dialog never offers Stream for Turn
          // or Speed — but a hand-edited flow can hold it, and deliverCommand
          // would fall through to the Send branch and report `sent`. True of
          // the wire, a lie about the tier. Known at deploy, so said here.
          if (v === 'stream' && (action === 'turn' || action === 'speed')) {
            return `a command cannot stream — ${action} rides an acknowledged MAV_CMD, `
              + `which is sent once and answered. Use Send, or Send & confirm to wait for `
              + `the acknowledgement`;
          }
          // Same family as Offset above and found by its absence: the dropdown
          // withholds Stream for Go to on a Blimp (no SET_POSITION_TARGET
          // handler — streamed setpoints are discarded in silence, §14), but a
          // node saved with the pair, or rebound to a blimp profile, deployed
          // clean and reported `streaming` at a vehicle hearing nothing. Every
          // other withheld option in this dialog reds on saved; this one now
          // does too.
          if (v === 'stream' && action === 'goto') {
            const gate = moveFamilyGate(this);
            if (gate.gated && gate.family === 'blimp') {
              return 'a Blimp cannot stream Go to — it implements DO_REPOSITION but has no '
                + 'SET_POSITION_TARGET handler, so streamed setpoints are silently '
                + 'discarded. Use Send or Send & confirm';
            }
          }
          // Fourth instance of the family, so it is stated generally rather than
          // per action: only the acked actions have anything to wait for. Go
          // to rides DO_REPOSITION, Turn CONDITION_YAW, Speed DO_CHANGE_SPEED
          // — every one answers a COMMAND_ACK. Steer, Attitude and Manual are
          // setpoints and sticks, which no vehicle acknowledges, so a confirm
          // tier there would wait forever and the runtime reports `sent`.
          if (v !== 'confirm') return true;
          if (action === 'goto' || action === 'turn' || action === 'speed') return true;
          return 'this action cannot confirm — setpoints and sticks carry no COMMAND_ACK, so '
            + 'there is nothing to wait for. Use Send, or switch to Go to, Turn or Speed';
        }),
      },
      // Action × Delivery derives the wire (§6 redesign, 2026-08-12): the
      // operator states an intent; carrier, message name, frame number, and
      // mask are code. goto = the acked guided goto (DO_REPOSITION as
      // COMMAND_INT on the command tiers, SET_POSITION_TARGET_GLOBAL_INT on
      // Stream); steer = setpoints, fire-and-forget.
      // A Steer node with every field blank has nothing to command: the mask
      // derives from which groups carry values, so all-blank is the all-ignore
      // packet PX4 logs as invalid. No *individual* field can be required —
      // filling fields IS the mode — but "at least one of them" can be, and
      // that is the rule. It reds on Action because Action is what makes the
      // fields mean anything; Go to reads none of them, so it never fires.
      // Two args so the reason renders (§14).
      action: {
        value: 'goto',
        validate: RED.mavlink.oneOf(['goto', 'steer', 'turn', 'speed', 'attitude', 'manual'], function (v, _opt) {
          // The vehicle half of §9 ruling 6's "red on saved": the dropdown
          // stops offering an action the bound vehicle has no handler for, and
          // a node that already held one keeps it and lands here. Every entry
          // is a message the vehicle accepts and does nothing with — no NAK on
          // the setpoint carriers, so without this the operator has no symptom
          // to read at all.
          const familyReason = moveFamilyGate(this).reason(v);
          if (familyReason) return familyReason;
          // CONDITION_YAW is an ArduPilot command and PX4 has no handler for it
          // (§14). The family table above answers the ArduPilot half; this is
          // the firmware half, which is all PX4 gets — its receiver has no
          // vehicle branch, so there is no family knowledge to gate on. The
          // message names the escape that works there: Steer's yaw field.
          if (v === 'turn') {
            const firmware = RED.mavlink.resolveCatalogTarget({ source: this }).firmware;
            if (firmware && firmware !== 'ardupilot') {
              return `Turn is an ArduPilot command (CONDITION_YAW) and this profile is ${firmware} — on PX4, yaw with a Steer setpoint instead`;
            }
            return true;
          }
          const owner = this;
          const filled = function (names) {
            return names.some((n) => !RED.mavlink.isBlank(fieldValue(owner, n)));
          };
          // Attitude has Steer's shape and needed Steer's rule: presence drives
          // ATTITUDE_TARGET_TYPEMASK, so an all-blank Attitude sets *every*
          // ignore bit — 199 — and commands nothing while the node still
          // reports `sent` or `streaming`. A setpoint carries no ack, so that
          // is the failure mode with no symptom, and the editor is the only
          // layer that can see it.
          //
          // Manual needs no equivalent: every one of its four sticks is
          // required outright (stickValidator), so there is no all-blank form
          // left to catch: an all-blank Manual is refused outright.
          if (v === 'attitude') {
            if (filled(['roll', 'pitch', 'yaw', 'rollRate', 'pitchRate', 'yawRate', 'thrust'])) {
              return true;
            }
            return 'Attitude needs at least one field filled — an angle, a body rate, or '
              + 'thrust. All-blank sets every ignore bit, so the vehicle is commanded nothing '
              + 'and no ack comes back to tell you';
          }
          if (v !== 'steer') return true;
          const hasPos = filled(['north', 'east', 'up']);
          const hasVel = filled(['vNorth', 'vEast', 'vUp']);
          const hasAcc = filled(['aNorth', 'aEast', 'aUp']);
          // Position + acceleration with no velocity is the one combination
          // the wire vocabulary does not carry (lib/move/frames.js MODES): no
          // named ArduPilot guided submode, no §14 measurement either way. A
          // setpoint gets no ack, so if the source read is right the operator
          // sees "sent" while the vehicle holds — the failure mode with no
          // symptom. Adding a velocity makes it a measured submode; so does
          // clearing the acceleration.
          if (hasPos && hasAcc && !hasVel) {
            return 'position + acceleration needs a velocity too — that pair alone has no '
              + 'guided submode on ArduPilot and is unmeasured, and a setpoint carries '
              + 'no ack to tell you it was ignored';
          }
          // Every other combination is a mode: the type_mask carries an
          // independent ignore bit per group. So the rule left is that
          // *something* is filled.
          if (hasPos || hasVel || hasAcc) return true;
          if (filled(['yaw', 'yawRate'])) return true;
          return 'Steer needs at least one field filled — a position, a velocity, '
            + 'an acceleration, or a yaw';
        }),
      },
      // Go to's one frame choice: altitude above home, absolute MSL, or above
      // terrain. A stray token is a frame the builder never selects (§5's
      // editor half). Terrain is ArduPilot's in practice — PX4's support is
      // patchy — so the dropdown withholds it on a named non-ArduPilot
      // firmware, and a node that already holds it keeps it and reds here
      // (§9 ruling 6: withhold, never rewrite). No profile gates nothing:
      // hiding requires knowledge.
      altRef: {
        value: 'home',
        validate: RED.mavlink.oneOf(['home', 'msl', 'terrain'], function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-altRef', v, 'home') !== 'terrain') return true;
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'goto') !== 'goto') return true;
          const firmware = RED.mavlink.resolveCatalogTarget({ source: this }).firmware;
          if (firmware && firmware !== 'ardupilot') {
            return `Above terrain is an ArduPilot frame (GLOBAL_TERRAIN_ALT) and this profile is ${firmware} — use Above home or Absolute (MSL)`;
          }
          return true;
        }),
      },
      // Steer's axes: world = LOCAL_NED everywhere; body adapts to the bound
      // firmware (AP BODY_OFFSET_NED vs PX4 BODY_NED, §14) and fails closed
      // without one. On the wire tiers the Connection's Vehicle Profile
      // supplies the firmware; on Build only the Vehicle Profile dialect
      // escape does — so Body on Build with a concrete dialect is a node
      // that deploys clean and refuses every input, and the
      // editor must not offer that shape. Deploy-time validation reads the
      // saved values; the live read is own-dialog scoped.
      reference: {
        value: 'world',
        // Membership first (oneOf), then the firmware/tier gates on the
        // members themselves.
        validate: RED.mavlink.oneOf(['world', 'body', 'offset'], function (v, _opt) {
          const ref = RED.mavlink.liveOr(this, '#node-input-reference', v, 'world');
          // 'steer' fallback like every other action gate in this file: a
          // hand-edited flow with no action key must not skip the Steer checks.
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'steer') return true;
          // Offset on PX4 is measured inert — accepted and no motion at all,
          // burst and stream (§14 2026-08-05). The dropdown stops offering it
          // when the profile says PX4, but a node that already had it saved
          // must not be silently rewritten to World: that would change what
          // the operator configured without telling them. So the option stays
          // visible and reds here instead. Read from the saved config, not the
          // DOM — validate runs for every node at deploy, and only this node's
          // own dialog may be open.
          if (ref === 'offset'
            && RED.mavlink.resolveCatalogTarget({ source: this }).firmware === 'px4') {
            return 'Offset from here does nothing on PX4 — it accepts MAV_FRAME_LOCAL_OFFSET_NED '
              + 'and never acts on it (measured). Use World, or Body (PX4 reads BODY_NED)';
          }
          // The mirror image on a fixed wing, and the same ruling: ArduPlane's
          // handler opens `if (coordinate_frame != MAV_FRAME_LOCAL_OFFSET_NED)
          // { return; }` (§14), so World and Body are the two that do nothing
          // there — silently, with no NAK. Offset is not a preference on a
          // plane, it is the only local frame there is.
          const planeGate = moveFamilyGate(this);
          if (ref !== 'offset' && planeGate.gated && planeGate.family === 'plane') {

              + 'returns immediately on every other frame, with no NAK. Use Offset from here';
          }

          if (RED.mavlink.liveOr(this, '#node-input-dialect', this.dialect, '') === '__vehicle') return true;

      },
      // Go to command-path params. Blank encodes the spec's no-change sentinel
      // at runtime (speed −1 = vehicle default, radius 0 = ignored, yaw NaN =
      // current heading mode — the command-preset blankParams convention).
      speed: { value: '', validate: RED.validators.number(true) },
      radius: { value: '', validate: RED.validators.number(true) },
      // MAV_DO_REPOSITION_FLAGS_CHANGE_MODE: flies the vehicle into guided —
      // a mode change, so an explicit opt-in, default off.
      changeMode: { value: false },
      // ── Turn (CONDITION_YAW) ──────────────────────────────────────────
      // Heading is required and bounded 0-360 because ArduCopter *answers
      // FAILED* outside that range (source-read 2026-08-13) — the vehicle is
      // the one refusing, so the editor is where an operator finds out before
      // flying. Two args so the reason renders (§14).
      heading: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'turn') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for Turn';
          const n = Number(v);
          return (Number.isFinite(n) && n >= 0 && n <= 360)
            || 'must be within [0, 360] degrees — ArduPilot answers FAILED outside it';
        },
      },
      turnRate: { value: '', validate: RED.validators.number(true) },
      // -1 ccw, 0 shortest, 1 cw — common.xml defines 0 as "shortest
      // direction", so the default is the dialect's, not one we invented.
      // Direction rides as a float param, so a stray token would reach the
      // wire as NaN — the dialog's job to catch (14.105).
      direction: { value: '0', validate: RED.mavlink.oneOf(['0', '1', '-1']) },
      // Changes what the heading number means, so a strict boolean opt-in like
      // changeMode. ArduCopter also answers FAILED for a param4 that is not
      // exactly 0 or 1.
      relative: { value: false },

      // ── Attitude (SET_ATTITUDE_TARGET) ────────────────────────────────────
      // Degrees in, quaternion out — the operator never sees q[4]. Presence
      // drives ATTITUDE_TARGET_TYPEMASK exactly like Steer's groups, so no
      // field is required on its own — but the three *angles* are one group
      // with one ignore bit, so they go all-or-nothing
      // (attitudeAngleValidator). `yaw` and `yawRate` are the fields Steer and
      // Go to already use: one spelling per operator concept (§14).
      roll: { value: '', validate: attitudeAngleValidator('roll') },
      pitch: { value: '', validate: attitudeAngleValidator('pitch') },
      rollRate: { value: '', validate: RED.validators.number(true) },
      pitchRate: { value: '', validate: RED.validators.number(true) },
      // Normalised 0..1. Out of range is the vehicle's to judge, but a value
      // outside it is almost certainly a percent typed by mistake, and the
      // editor is where that gets caught rather than flown.
      thrust: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.isBlank(v)) return true;
          const n = Number(v);
          return (Number.isFinite(n) && n >= 0 && n <= 1)
            || 'must be 0..1 (normalised thrust, not a percentage)';
        },
      },

      // ── Manual (MANUAL_CONTROL) ───────────────────────────────────────────
      // Sticks are -1..1, the joystick convention, scaled to the wire's ±1000
      // at encode. All four are required (owner ruling, 2026-08-14): the
      // dialect's INT16_MAX "axis is invalid" sentinel is not sent for a blank
      // any more, because a blank box in a saved flow is a field nobody filled
      // rather than a pilot's hand off the stick. Centring at 0 was never an
      // option either — ArduSub reads z as 0..1000 neutral 500, where a
      // helpfully-centred 0 is full reverse thrust (§14). So the editor asks
      // for all four, and the runtime refuses anything less.
      stickX: { value: '', validate: stickValidator() },
      stickY: { value: '', validate: stickValidator() },
      stickZ: { value: '', validate: stickValidator('z') },
      stickR: { value: '', validate: stickValidator() },
      // 0 — no button pressed — is the saved default: the bitmask has a bit
      // per button, so the empty mask is a real value and the runtime sends
      // it as one. Manual is the only action that reads it, so only Manual
      // reds a blank (the gate every action-scoped field uses).
      buttons: {
        value: 0,
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'manual') return true;
          if (RED.mavlink.isBlank(v)) return false;
          return isValidButtonsMask(Number(v))
            || 'must be a 16-bit button bitmask (0-65535)';
        },
      },

      // ── Speed (DO_CHANGE_SPEED) ───────────────────────────────────────────
      // Blank speed and throttle encode the dialect's -1 "no change" sentinel,
      // the blankParams convention. -2 ("return to default") is a real value an
      // operator types, not a sentinel this node owns.
      throttle: { value: '', validate: RED.validators.number(true) },
      speedType: {
        value: 'groundspeed',
        validate: RED.mavlink.oneOf(['groundspeed', 'airspeed', 'climb', 'descent']),
      },

      // ACK timeout and Max retries exist only where a COMMAND_ACK is waited
      // on: the command-path actions (Go to, Turn, Speed) on Send & confirm.
      // The shared definition gates on that, so a value cleared there never
      // reds a Build, Send or Stream node that cannot show the row.
      ...RED.mavlink.ackDefaults((node) => {
        const action = RED.mavlink.liveOr(node, '#node-input-action', node.action);

          && RED.mavlink.liveOr(node, '#node-input-delivery', node.delivery) === 'confirm';
      }),
      // Broadcast (0) is refused only where an ack is actually awaited: the
      // Send & confirm tier, which the delivery rebuild offers on the acked
      // actions (Go to, Turn, Speed). Send/Stream/Build stay broadcast-legal,
      // so this reds nothing they configure. The driver does not
      // restate it — this is the only layer that catches the pair (§0).
      targetSystem: {
        value: '',
        validate: RED.mavlink.validateTargetSystem(['confirm']),
      },
      targetComponent: { value: '', validate: RED.mavlink.validateUint8(0) },
      // Steer groups are optional and default blank: filling fields IS the
      // mode — the runtime derives the type_mask from the non-blank groups and
      // builds the honest all-ignore packet for an all-blank steer (the editor
      // requires one filled field, so the configured path never sends it).
      // That is a per-*group* rule; a half-filled triplet is a different
      // thing, and steerAxisValidator is where the dialog catches it before
      // the runtime does.
      north: { value: '', validate: steerAxisValidator(POSITION_AXES, 'north', 'position') },
      east: { value: '', validate: steerAxisValidator(POSITION_AXES, 'east', 'position') },
      up: { value: '', validate: steerAxisValidator(POSITION_AXES, 'up', 'position') },
      vNorth: { value: '', validate: steerAxisValidator(VELOCITY_AXES, 'vNorth', 'velocity') },
      vEast: { value: '', validate: steerAxisValidator(VELOCITY_AXES, 'vEast', 'velocity') },
      vUp: { value: '', validate: steerAxisValidator(VELOCITY_AXES, 'vUp', 'velocity') },
      aNorth: { value: '', validate: steerAxisValidator(ACCEL_AXES, 'aNorth', 'acceleration') },
      aEast: { value: '', validate: steerAxisValidator(ACCEL_AXES, 'aEast', 'acceleration') },
      aUp: { value: '', validate: steerAxisValidator(ACCEL_AXES, 'aUp', 'acceleration') },
      // Go to's global position is required — saved or live. This is the only
      // check on the *configured* path: the runtime trusts what it is handed
      // (AGENTS.md, input trust), so §10's "blank coordinates must not become
      // 0,0 at ground level" is enforced here or nowhere. A coordinate
      // arriving on msg.payload.position is not checked at all — blank encodes
      // 0 and out-of-range scales and rides the wire, deliberately (§14). The
      // blank-action fallback is 'steer' for the editor's field logic: a config
      // with no action yet validates as a steer form.
      lat: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'goto') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for Go to (a blank coordinate must not become 0)';
          const n = Number(v);
          return (Number.isFinite(n) && n >= -90 && n <= 90) || 'must be within [-90, 90] degrees';
        },
      },
      lon: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'goto') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for Go to (a blank coordinate must not become 0)';
          const n = Number(v);
          return (Number.isFinite(n) && n >= -180 && n <= 180) || 'must be within [-180, 180] degrees';
        },
      },
      alt: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-action', this.action, 'steer') !== 'goto') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for Go to (a blank altitude must not become ground level)';
          return Number.isFinite(Number(v)) || 'must be a number of metres';
        },
      },
      // Shared by Steer, Go to and Attitude — one spelling per operator concept
      // (§14). Only Attitude holds it to the all-or-nothing angle rule; on the
      // other two a blank yaw is a cleared ignore bit, which is its own answer.
      yaw: { value: '', validate: attitudeAngleValidator('yaw') },
      yawRate: { value: '', validate: RED.validators.number(true) },
      // The runtime divides 1000/rateHz to arm the timer, and setInterval
      // substitutes 1 ms for a delay it cannot represent instead of refusing —
      // so a rate of 0, a negative, or anything that coerces to NaN inverts
      // into a ~1000 Hz flood (measured). This is the only check on that:
      // the runtime takes msg.payload.rateHz as given. The floor is 0.1 Hz
      // rather than "any positive number" because one setpoint per 10 s is
      // already far below every firmware's setpoint watchdog, so nothing real
      // is excluded — a UI choice, not a wire limit; the wire does not care
      // until roughly 4.7e-7 Hz, where 1000/rate finally overflows int32.
      // Both fields exist only on Stream delivery — a cleared value must not
      // red a Build or Send node that never reads it (same liveOr gating as
      // mission's items). Two args so the reasons render (§14).
      rateHz: {
        value: 5,
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-delivery', this.delivery) !== 'stream') return true;

      },
      ttlMs: {
        value: 1000,
        validate(v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-delivery', this.delivery) !== 'stream') return true;

  RED.nodes.registerType('mavlink-move', {
    category: 'mavlink',
    paletteLabel: 'move',
    color: '#d8ecff',
    defaults: moveDefaults,
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-location-arrow',
    label() { return this.name || 'mavlink move'; },
    oneditprepare() {
      const node = this;

      RED.mavlink.refreshIdentitySelect(node);

      // Buttons: Node-RED's typedInput multi-select over the sixteen bits, a
      // view over the one hidden canonical field (see the row markup). The
      // view is set from the saved mask BEFORE the change handler binds: an
      // invalid saved mask (hand-edited flow) selects nothing, and composing
      // that back would blank the value the validator is red-ringing. Composed
      // on every operator change — all-off composes blank, so an untouched
      // dialog round-trips byte-identical.
      $('#node-input-buttons').val(RED.mavlink.isBlank(node.buttons) ? '' : node.buttons);
      const $buttonsPick = $('#move-buttons-pick');
      $buttonsPick.typedInput({ types: [{ value: 'buttons', multiple: true, options: BUTTON_OPTIONS }] });
      $buttonsPick.typedInput('value', buttonsToBits(node.buttons));
      $buttonsPick.on('change', () => {
        $('#node-input-buttons').val(bitsToButtons($buttonsPick.typedInput('value')));
      });

      // ▸ Advanced: the rarely-touched params live behind a plain show/hide
      // so the everyday dialog stays the intent and its coordinates.
      $('#move-advanced-toggle').on('click', function (e) {
        e.preventDefault();
        const $adv = $('#move-advanced');
        $adv.toggle();
        $(this).text(`${$adv.is(':visible') ? '▾' : '▸'} Advanced`);
      });
      // A configured Advanced value must be visible on open: an invalid
      // timeout hiding behind a collapsed section leaves the operator staring
      // at a red node with no visible cause. The acceleration triplet lives
      // under the Steer group disclosure, which opens by the same rule.
      if (!RED.mavlink.isBlank(node.timeoutMs) || !RED.mavlink.isBlank(node.radius)
        || !RED.mavlink.isBlank(node.turnRate) || !RED.mavlink.isBlank(node.throttle)
        || !RED.mavlink.isBlank(node.rollRate) || !RED.mavlink.isBlank(node.pitchRate)
        || (node.action === 'manual' && String(node.buttons) !== '0')
        || node.relative || node.changeMode) {
        $('#move-advanced').show();
        $('#move-advanced-toggle').text('▾ Advanced');
      }

      // Delivery tiers follow the action (§9: tiers are computed, not fixed):
      // the acked MAV_CMD actions (Go to, Turn, Speed) confirm via
      // COMMAND_ACK; setpoints carry no ack and cannot. The options are
      // rebuilt per action so the select never offers a tier the action makes
      // illegal; the in-progress (then saved) value survives when still
      // legal, and an illegal one falls back to Send — still a wire tier.
      const DELIVERY_OPTIONS = {
        goto: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['confirm', 'Send & confirm'],
          ['stream', 'Stream']
        ],
        steer: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['stream', 'Stream']
        ],
        // Turn and Speed are acked MAV_CMDs. A command has no streaming
        // semantics, so the tier is not offered; it does have an ack, so
        // confirm is.
        turn: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['confirm', 'Send & confirm']
        ],
        speed: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['confirm', 'Send & confirm']
        ],
        // Setpoint-shaped: no ack to confirm, and streaming is the normal use.
        attitude: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['stream', 'Stream']
        ],
        manual: [
          ['build', 'Build'],
          ['send', 'Send'],
          ['stream', 'Stream']
        ]
      };
      // The Action list, rebuilt per bound vehicle.
      const ACTION_OPTIONS = [
        ['goto', 'Go to (guided goto, acknowledged)'],
        ['steer', 'Steer (setpoints, fire-and-forget)'],
        ['turn', 'Turn (heading, acknowledged)'],
        ['speed', 'Speed (change speed, acknowledged)'],
        ['attitude', 'Attitude (setpoints, fire-and-forget)'],
        ['manual', 'Manual (joystick sticks)']
      ];

      // from wherever the vehicle is, and the only local frame ArduPlane
      // accepts at all.
      const REFERENCE_OPTIONS = [
        ['world', 'World (Local NED)'],
        ['body', 'Body (adapts to firmware)'],
        ['offset', 'Offset from here (relative)']
      ];

      // reference list is. Terrain (GLOBAL_TERRAIN_ALT) is ArduPilot's in

      // non-ArduPilot firmware; a saved value survives and the altRef
      // validator supplies the reason (§9 ruling 6).
      const ALTREF_OPTIONS = [
        ['home', 'Above home'],
        ['msl', 'Absolute (MSL)'],
        ['terrain', 'Above terrain (ArduPilot)']
      ];

      // Rows applyCompanionTargetVisibility owns; `show` reports them, the
      // toggle loop leaves them alone.
      const HELPER_ROWS = ['targetSystem', 'targetComponent'];

      // own checkbox and hidden — and cleared — when that box is cleared.
      const STEER_GROUPS = [
        ['position', ['north', 'east', 'up']],
        ['velocity', ['vNorth', 'vEast', 'vUp']],
        ['accel', ['aNorth', 'aEast', 'aUp']],
        ['yaw', ['yaw', 'yawRate']]
      ];

      /**
       * Rebuild the Action list for the bound vehicle: an action the vehicle
       * has no handler for is withheld, and a saved one survives and reds
       * (§9 ruling 6, via the shared `refreshOptionSelect`).
       *
       * @param {object} gate  from `moveFamilyGate()`
       * @returns {string} the action now selected
       */
      function refreshActionOptions(gate) {
        return RED.mavlink.refreshOptionSelect({
          select: '#node-input-action',
          options: ACTION_OPTIONS,
          saved: node.action,
          withhold(value) { return !gate.allows(value); }
        });
      }

       * Rebuild Steer's Reference list. Two withholdings, both measured, and
       * they point opposite ways: PX4 accepts frame 7 and never acts on it
       * (§14 2026-08-05), while ArduPlane accepts *nothing else* — its handler
       * opens with an early return on any other frame (§14 2026-08-13).
       *
       * Neither rewrites a saved value: the option stays selectable for a node
       * that already holds it and the `reference` validator supplies the
       * reason, because a silent downgrade would change what the operator
       * configured without telling them.
       *
       * @param {object} gate
       * @returns {string} the reference now selected
       */
      function refreshReferenceOptions(gate) {
        const firmware = RED.mavlink.resolveCatalogTarget().firmware;
        return RED.mavlink.refreshOptionSelect({
          select: '#node-input-reference',
          options: REFERENCE_OPTIONS,
          saved: node.reference,
          withhold(value) {
            if (value === 'offset') return firmware === 'px4';
            return firmware === 'ardupilot' && gate.family === 'plane';
          }
        });

       * Rebuild Go to's altitude-reference list: terrain is withheld on a
       * named non-ArduPilot firmware. No profile withholds nothing — hiding
       * requires knowledge — and a saved terrain survives and reds instead.
       *
       * @returns {string} the reference now selected
       */
      function refreshAltRefOptions() {
        const firmware = RED.mavlink.resolveCatalogTarget().firmware;
        return RED.mavlink.refreshOptionSelect({
          select: '#node-input-altRef',
          options: ALTREF_OPTIONS,
          saved: node.altRef,
          withhold(value) {
            return value === 'terrain' && Boolean(firmware) && firmware !== 'ardupilot';
          }
        });
      }

       * Rebuild the Delivery list. Which tiers *exist* is a property of the
       * carrier (a one-shot MAV_CMD has no streaming semantics), so an absent
       * tier falls back; which tiers *do anything on this vehicle* is
       * knowledge, so those are withheld and kept on saved.

       * @param {string} action
       * @param {string} reference
       * @param {object} gate
       */

        RED.mavlink.refreshOptionSelect({
          select: '#node-input-delivery',
          options: DELIVERY_OPTIONS[action] || DELIVERY_OPTIONS.goto,
          saved: node.delivery,
          withhold(value) {
            if (value !== 'stream') return false;
            // Streaming an offset walks the vehicle away. Every tick is
            // resolved against the vehicle's *current* position —
            // ArduCopter/Rover/Sub add `get_relative_position_NED_origin()`
            // per message, and ArduPlane's handler is
            // `next_WP_loc.alt += -z*100`, which accumulates outright — so a
            // 10 m nudge at 5 Hz retargets 10 m from wherever it now is, five
            // times a second, until the TTL (source-read 2026-08-13; not yet
            // SITL-measured).
            if (action === 'steer' && reference === 'offset') return true;
            // Go to is the one action whose two delivery paths ride different
            // wires, and a Blimp implements only one of them: DO_REPOSITION on
            // the command tiers, but no SET_POSITION_TARGET_GLOBAL_INT handler
            // for the streamed form (§14). Streaming would be silence.
            return action === 'goto' && gate.gated && gate.family === 'blimp';
          },
          fallback: 'send'
        });
      }

      /**
       * Which Steer groups the operator currently has open. Seeded from the
       * saved fields on first paint, then owned by the checkboxes.
       */
      let disclosed = null;

      /**
       * Seed the disclosure from the fields themselves: a group is open iff one
       * of its fields carries a value. Nothing to migrate, and a hand-edited
       * flow discloses correctly without knowing this feature exists. A Steer
       * node with nothing filled opens on Position, which is the common case.
       *
       * @returns {Object<string, boolean>}
       */
      function seedDisclosure() {
        const seeded = {};
        let any = false;
        STEER_GROUPS.forEach((entry) => {
          seeded[entry[0]] = entry[1].some((name) => !RED.mavlink.isBlank(node[name]));
          if (seeded[entry[0]]) any = true;
        });
        if (!any) seeded.position = true;
        return seeded;
      }

       * Steer's group disclosure — ☑ Position ☐ Velocity ☐ Acceleration ☐ Yaw

       * saved to config**: they carry no `node-input-` prefix, so Node-RED
       * never persists them, and the type_mask still derives at runtime from
       * which fields carry values. This is the curated-easy path `-ai`'s preset
       * dropdown served, without re-growing a preset vocabulary.
       *
       * Clearing a box clears its fields, and that is the contract rather than
       * a side effect. A blank group is mask-ignored and a filled one is
       * commanded — so a group hidden with values still in it would keep
       * commanding a velocity with nothing on screen to explain it. What is on
       * the form is what the mask carries.
       *

       * @param {boolean} planeSteer  fixed wing: one field, and no boxes at all
       * @returns {Object<string, boolean>} which groups' rows to show
       */
      function applyGroupDisclosure(isSteer, planeSteer) {
        if (!disclosed) disclosed = seedDisclosure();
        // On a plane the form is fixed at the one field frame 7 reads, so there
        // is no choice to offer and Position is simply on. It is written into
        // `disclosed` rather than applied per-paint because the state has to
        // survive the collapse ending: an operator who types an altitude here
        // and then rebinds the node to a copter would otherwise get the row
        // hidden underneath them, value and all, by a seed that ran before the
        // value existed.
        if (planeSteer) disclosed.position = true;
        const shown = {};
        STEER_GROUPS.forEach((entry) => {
          const name = entry[0];
          shown[name] = isSteer && (planeSteer ? name === 'position' : Boolean(disclosed[name]));
          const $box = $(`#move-group-${name}`);
          if ($box.length) $box.prop('checked', Boolean(disclosed[name]));
        });

      }

      /**
       * Which rows the current selection shows. Lifted out of
       * `refreshVisibility` so the branching lives in one place a reader can
       * hold, and so the toggles below stay a loop rather than forty lines.
       *
       * @param {object} state  the derived booleans refreshVisibility computed
       * @returns {Object<string, boolean>} keyed by row suffix — `north` is
       *   `#row-move-north`. `targetSystem`/`targetComponent` are reported for
       *   completeness but owned by applyCompanionTargetVisibility (HELPER_ROWS).
       */
      function moveRowVisibility(state) {
        return {
          // The Identity row appears only when the Connection carries more
          // than one identity: a single-identity Connection has nothing to
          // decide, and a select with one option is noise.
          identity: state.isWire && state.identityIsChoice,
          targetSystem: state.tgt.targetSystem,
          targetComponent: state.tgt.targetComponent,
          altRef: state.isGoto,
          lat: state.isGoto,
          lon: state.isGoto,
          alt: state.isGoto,
          reference: state.isSteer,
          // Steer's groups are disclosed, not always-on: a box reveals its
          // rows, and clearing it clears them. `groups` already folds in the
          // plane collapse, so a fixed wing reaches only `up`.
          north: state.groups.position && !state.planeSteer,
          east: state.groups.position && !state.planeSteer,
          up: state.groups.position,
          vNorth: state.groups.velocity,
          vEast: state.groups.velocity,
          vUp: state.groups.velocity,
          aNorth: state.groups.accel,
          aEast: state.groups.accel,
          aUp: state.groups.accel,
          groups: state.isSteer && !state.planeSteer,
          // Yaw rides Go to's command path by itself, Attitude's whole surface,
          // and Steer's yaw group by disclosure; Turn has its own heading
          // field, and Speed has no heading.
          yaw: state.isGoto || state.groups.yaw || state.isAttitude,
          yawRate: state.groups.yaw || state.isAttitude,
          roll: state.isAttitude,
          pitch: state.isAttitude,
          rollRate: state.isAttitude,
          pitchRate: state.isAttitude,
          thrust: state.isAttitude,
          stickX: state.isManual,
          stickY: state.isManual,
          stickZ: state.isManual,
          stickR: state.isManual,
          buttons: state.isManual,
          // Ground speed is shared: DO_REPOSITION's speed param on Go to, and
          // DO_CHANGE_SPEED's own speed on the Speed action. One spelling for
          // one operator concept (§14).
          speed: state.isCommandPath || state.isSpeed,
          radius: state.isCommandPath,
          changeMode: state.isCommandPath,
          heading: state.isTurn,
          turnRate: state.isTurn,
          direction: state.isTurn,
          relative: state.isTurn,
          throttle: state.isSpeed,
          speedType: state.isSpeed,
          timeoutMs: (state.isGoto || state.isTurn || state.isSpeed) && state.delivery === 'confirm',
          maxRetries: (state.isGoto || state.isTurn || state.isSpeed) && state.delivery === 'confirm',
          rate: state.isStream,
          ttl: state.isStream
        };
      }

      /**
       * §6: only the fields for the selected action, delivery, and identity
       * role exist. Everything else is hidden — not greyed, not left over
       * from another action.
       * Go to → altitude reference + global position; the command-path params
       * (Ground speed, Loiter radius, Change mode, ACK timeout) hide on
       * Stream, where the runtime refuses them.
       * Steer → reference + the optional position/velocity/accel/yaw groups.
       * Build → dialect shown; vehicle only for the Vehicle Profile escape.
       * Wire → connection/identity shown; vehicle hidden.
       * Companion (wire) → target sysid AND compid hidden (derived from airframe).
       */
      function refreshVisibility() {
        // The three selects are rebuilt in dependency order before anything
        // reads them back: the Action list depends on the bound vehicle, the
        // reference list on firmware and family, and the delivery list on both
        // the action and the reference (Offset has no streaming meaning).
        const gate = moveFamilyGate();
        const action = refreshActionOptions(gate) || 'goto';
        const isGoto = action === 'goto';
        const isTurn = action === 'turn';
        const isSpeed = action === 'speed';
        const isAttitude = action === 'attitude';
        const isManual = action === 'manual';
        // Steer and Go to own the position surface; Turn and Speed own none of
        // it. Everything positional keys off this rather than !isGoto, so a
        // command action shows neither family's fields.
        const isSteer = action === 'steer';
        const reference = refreshReferenceOptions(gate) || 'world';
        refreshDeliveryOptions(action, reference, gate);
        // ArduPlane's local handler reads `z` and returns — no lateral axis, no
        // velocity, no acceleration, no yaw (§14). So Steer on a plane is a
        // one-field form: an altitude change, which is exactly what QGC offers
        // a fixed wing beside goto. The groups it cannot fly are not offered,
        // rather than offered and ignored.
        //
        // This hides fields without clearing them, unlike the disclosure
        // checkbox, and the difference is the ruling rather than an oversight.
        // A cleared checkbox is the *operator* saying "not this group", so
        // clearing the values is obeying them. The plane collapse is
        // *knowledge about the vehicle*, and §9 ruling 6 is explicit that
        // knowledge may withhold but must never rewrite what was saved —
        // re-binding the node to a copter has to give the operator their
        // triplet back, not a form silently emptied on their behalf.
        //
        // It keys on the reference actually in force, not on the family alone.
        // The dropdown withholds World and Body on a plane but keeps either if
        // the node already holds it (ruling 6 again), so "plane" and "frame 7"
        // are not the same condition — and a form that collapsed to one field
        // while the Reference still read World would be describing a message it
        // is not sending.
        const planeSteer = isSteer && gate.gated && gate.family === 'plane'
          && reference === 'offset';
        const groups = applyGroupDisclosure(isSteer, planeSteer);

        const delivery = $('#node-input-delivery').val() || 'build';
        const dialect = $('#node-input-dialect').val() || node.dialect || '';
        const isBuild = delivery === 'build';
        const isWire = !isBuild;
        const isStream = delivery === 'stream';
        // Go to's command path: DO_REPOSITION on Build/Send/Send & confirm.
        // Its params have no meaning on a streamed setpoint (runtime refuses
        // them there), so Stream withdraws the rows.
        const isCommandPath = isGoto && !isStream;
        const isBody = !isGoto && reference === 'body';
        const isOffset = !isGoto && reference === 'offset';
        const altRef = refreshAltRefOptions() || 'home';
        const tgt = RED.mavlink.applyCompanionTargetVisibility({
          isBuild,
          identityId: isWire ? $('#node-input-identity').val() : '',
          targetSystemRow: '#row-move-targetSystem',
          targetComponentRow: '#row-move-targetComponent',
        });

        RED.mavlink.applyBuildTierRowVisibility({
          isBuild,
          dialect,
          dialectRow: '#row-move-dialect',
          vehicleRow: '#row-move-vehicle',
          connectionRow: '#row-move-connection'
        });

        const show = moveRowVisibility({
          isWire,
          identityIsChoice: RED.mavlink.hasIdentityChoice($('#node-input-connection').val() || ''),
          tgt, isGoto, isSteer, isTurn,
          isSpeed, isAttitude, isManual,
          isCommandPath, isStream, delivery,
          planeSteer, groups
        });

        // MANUAL_CONTROL's addressing field is `target` — a system id, with no
        // target_component on the wire at all. So the compid row is withdrawn
        // for this action regardless of what the identity role would allow: an
        // operator must not be shown a control the message has no room for.
        //
        // Hidden directly, not through `show`: the target rows are the two this
        // function does NOT toggle from that object — applyCompanionTargetVisibility
        // owns them, and it ran above. Setting show.targetComponent here was a
        // no-op that left the row on screen.
        if (isManual) $('#row-move-targetComponent').hide();

        // Every key of `show` is a row suffix, so the toggles are a loop: a
        // key that reaches no toggle (`show.targetComponent` assigned and never
        // read) is a bug a loop makes unrepresentable rather than caught by
        // review. The two
        // target rows are skipped because applyCompanionTargetVisibility
        // already toggled them above — listing them here would fight it.
        Object.keys(show).forEach((key) => {
          if (HELPER_ROWS.indexOf(key) !== -1) return;
          $(`#row-move-${key}`).toggle(Boolean(show[key]));
        });

        // Labels follow the reference so the operator never translates
        // MAVLink axis conventions in their head: the body reference is
        // heading relative (forward/right). Vertical inputs stay up-positive
        // everywhere (§ "NED is down-positive": the sign flips once, at
        // encode) — and the altitude label names the reference in force.
        // Offset qualifies the *position* triplet only: on frame 7 the rates
        // are plain NED, byte-identical in meaning to frame 1 (ArduCopter
        // source-read 2026-08-13), so velocity and acceleration keep their
        // world labels. isBody and isOffset are mutually exclusive — both read
        // the one reference select — so the qualifier composes safely.
        const fromHere = isOffset ? ' (from here)' : '';
        $('#label-move-north').text((isBody ? 'Metres forward' : 'Metres north') + fromHere);
        $('#label-move-east').text((isBody ? 'Metres right' : 'Metres east') + fromHere);
        $('#label-move-up').text(`Metres up${fromHere}`);
        // Go to's speed is "fly there at"; the Speed action's is "fly at from
        // now on". Same field, same units, different sentence.
        $('#label-move-speed').text(isSpeed ? 'Speed' : 'Ground speed');
        $('#label-move-vNorth').text(isBody ? 'Forward m/s' : 'North m/s');
        $('#label-move-vEast').text(isBody ? 'Right m/s' : 'East m/s');
        $('#label-move-aNorth').text(isBody ? 'Accel forward' : 'Accel north');
        $('#label-move-aEast').text(isBody ? 'Accel right' : 'Accel east');
        $('#label-move-alt').text(altRef === 'msl' ? 'Metres alt (MSL)'
          : altRef === 'terrain' ? 'Metres alt (above terrain)' : 'Metres alt (above home)');
      }

      // Clearing a group clears its fields before the repaint, so the form and
      // the type_mask never disagree (see applyGroupDisclosure).
      STEER_GROUPS.forEach((entry) => {
        $(`#move-group-${entry[0]}`).on('change', function () {
          const open = $(this).is(':checked');
          if (!disclosed) disclosed = seedDisclosure();
          disclosed[entry[0]] = open;
          if (!open) {
            entry[1].forEach((name) => { $(`#node-input-${name}`).val(''); });
          }
          refreshVisibility();
        });
      });

      $('#node-input-action').on('change', refreshVisibility);
      $('#node-input-altRef').on('change', refreshVisibility);
      $('#node-input-reference').on('change', refreshVisibility);
      $('#node-input-delivery').on('change', () => {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-identity').on('change', refreshVisibility);
      $('#node-input-dialect').on('change', () => {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-vehicle').on('change', () => {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-connection').on('change', () => {
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      // populateDialectSelect pins the saved dialect, then always fires the
      // dialect change handler — that one firing is the open's CompID load
      // (trigger-only, as in Build). A second explicit load fetched it twice.
      RED.mavlink.populateDialectSelect($('#node-input-dialect'), { saved: node.dialect || '' });
      refreshVisibility();
    }
  });
  })();
</script>
