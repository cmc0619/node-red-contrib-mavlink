<script type="text/javascript">
  // Dialect + Vehicle Profile validators are the shared Build-tier rule (§6);
  // Move's mode field is `delivery` and it has no firmware selector.
  var moveDefaults = Object.assign(
    {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection' },
      identity: { value: '' },
      delivery: { value: 'build' },
      mode: { value: 'position' },
      frame: { value: 'LOCAL_NED' },
      targetSystem: { value: '', validate: RED.mavlink.validateUint8(0) },
      targetComponent: { value: '', validate: RED.validators.number(true) },
      north: { value: 0, validate: RED.validators.number(true) },
      east: { value: 0, validate: RED.validators.number(true) },
      up: { value: 0, validate: RED.validators.number(true) },
      vNorth: { value: 0, validate: RED.validators.number(true) },
      vEast: { value: 0, validate: RED.validators.number(true) },
      vUp: { value: 0, validate: RED.validators.number(true) },
      aNorth: { value: 0, validate: RED.validators.number(true) },
      aEast: { value: 0, validate: RED.validators.number(true) },
      aUp: { value: 0, validate: RED.validators.number(true) },
      lat: { value: '', validate: RED.validators.number(true) },
      lon: { value: '', validate: RED.validators.number(true) },
      alt: { value: '', validate: RED.validators.number(true) },
      yaw: { value: '', validate: RED.validators.number(true) },
      yawRate: { value: '', validate: RED.validators.number(true) },
      intervalMs: { value: 100, validate: RED.validators.number() },
      ttlMs: { value: 1000, validate: RED.validators.number() }
    },
    RED.mavlink.buildTierDialectDefaults()
  );

  RED.nodes.registerType('mavlink-move', {
    category: 'mavlink',
    paletteLabel: 'move',
    color: '#d8ecff',
    defaults: moveDefaults,
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-location-arrow',
    label: function () { return this.name || 'mavlink move'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
      }

      RED.mavlink.refreshIdentitySelect(node);


      /**
       * §6: only the fields for the selected mode, delivery, and identity role
       * exist. Everything else is hidden — not greyed, not left over from another mode.
       * Build → dialect shown; vehicle only for the Vehicle Profile escape.
       * Wire → connection/identity shown; vehicle hidden.
       * Companion (wire) → target sysid AND compid hidden (derived from airframe).
       */
      function refreshVisibility() {
        var mode = $('#node-input-mode').val() || 'position';
        var frame = $('#node-input-frame').val() || 'LOCAL_NED';
        var delivery = $('#node-input-delivery').val() || 'build';
        var dialect = $('#node-input-dialect').val() || node.dialect || '';
        var isBuild = delivery === 'build';
        var isWire = !isBuild;
        var isGlobalFrame = frame.indexOf('GLOBAL') === 0;
        var isBodyFrame = frame === 'BODY_NED' || frame === 'BODY_OFFSET_NED';
        var usesPosition = mode === 'position' || mode === 'position-velocity';
        var usesVelocity = mode === 'velocity' || mode === 'position-velocity';
        var usesAccel = mode === 'acceleration';
        var tgt = RED.mavlink.applyCompanionTargetVisibility({
          isBuild: isBuild,
          identityId: isWire ? $('#node-input-identity').val() : '',
          targetSystemRow: '#row-move-targetSystem',
          targetComponentRow: '#row-move-targetComponent',
        });

        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuild,
          dialect: dialect,
          dialectRow: '#row-move-dialect',
          vehicleRow: '#row-move-vehicle',
          connectionRow: '#row-move-connection'
        });

        var show = {
          identity: isWire,
          targetSystem: tgt.targetSystem,
          targetComponent: tgt.targetComponent,
          north: usesPosition && !isGlobalFrame,
          east: usesPosition && !isGlobalFrame,
          up: usesPosition && !isGlobalFrame,
          lat: usesPosition && isGlobalFrame,
          lon: usesPosition && isGlobalFrame,
          alt: usesPosition && isGlobalFrame,
          vNorth: usesVelocity,
          vEast: usesVelocity,
          vUp: usesVelocity,
          aNorth: usesAccel,
          aEast: usesAccel,
          aUp: usesAccel,
          yaw: true,
          yawRate: true,
          interval: delivery === 'stream',
          ttl: delivery === 'stream'
        };

        $('#row-move-identity').toggle(!!show.identity);
        $('#row-move-north').toggle(!!show.north);
        $('#row-move-east').toggle(!!show.east);
        $('#row-move-up').toggle(!!show.up);
        $('#row-move-lat').toggle(!!show.lat);
        $('#row-move-lon').toggle(!!show.lon);
        $('#row-move-alt').toggle(!!show.alt);
        $('#row-move-vNorth').toggle(!!show.vNorth);
        $('#row-move-vEast').toggle(!!show.vEast);
        $('#row-move-vUp').toggle(!!show.vUp);
        $('#row-move-aNorth').toggle(!!show.aNorth);
        $('#row-move-aEast').toggle(!!show.aEast);
        $('#row-move-aUp').toggle(!!show.aUp);
        $('#row-move-yaw').toggle(!!show.yaw);
        $('#row-move-yawRate').toggle(!!show.yawRate);
        $('#row-move-interval').toggle(!!show.interval);
        $('#row-move-ttl').toggle(!!show.ttl);

        // Labels follow the frame so the operator never translates MAVLink axis
        // conventions in their head: body frames are heading relative
        // (forward/right). Vertical inputs stay up-positive in every frame
        // (§ "NED is down-positive": the sign flips once, at encode).
        $('#label-move-north').text(isBodyFrame ? 'Metres forward' : 'Metres north');
        $('#label-move-east').text(isBodyFrame ? 'Metres right' : 'Metres east');
        $('#label-move-vNorth').text(isBodyFrame ? 'Forward m/s' : 'North m/s');
        $('#label-move-vEast').text(isBodyFrame ? 'Right m/s' : 'East m/s');
        $('#label-move-aNorth').text(isBodyFrame ? 'Accel forward' : 'Accel north');
        $('#label-move-aEast').text(isBodyFrame ? 'Accel right' : 'Accel east');
        $('#label-move-alt').text(
          frame === 'GLOBAL_INT' ? 'Metres alt (MSL)'
            : frame === 'GLOBAL_TERRAIN_ALT_INT' ? 'Metres alt (terrain)'
              : 'Metres alt (above home)'
        );
      }

      $('#node-input-mode').on('change', refreshVisibility);
      $('#node-input-frame').on('change', refreshVisibility);
      $('#node-input-delivery').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-identity').on('change', refreshVisibility);
      $('#node-input-dialect').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-vehicle').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-connection').on('change', function () {
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      if (RED.mavlink && RED.mavlink.populateDialectSelect) {
        RED.mavlink.populateDialectSelect($('#node-input-dialect'), {
          saved: node.dialect || '',
          includeVehicleEscape: true
        });
      }
      RED.mavlink.reloadTargetCompId(node);
      refreshVisibility();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-move">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-move-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-move-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-move-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-move-identity"><label for="node-input-identity">Send as</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="stream">Stream</option></select></div>
  <div class="form-row"><label for="node-input-mode">Mode</label><select id="node-input-mode">
    <option value="position">Position</option>
    <option value="velocity">Velocity</option>
    <option value="position-velocity">Position + Velocity</option>
    <option value="acceleration">Acceleration</option>
    <option value="yaw-only">Yaw only</option>
  </select></div>
  <div class="form-row" id="row-move-frame"><label for="node-input-frame">Frame</label><select id="node-input-frame" style="width:70%">
    <optgroup label="Local">
      <option value="LOCAL_NED">Local NED (world origin)</option>
      <option value="LOCAL_OFFSET_NED">Offset from current position</option>
      <option value="BODY_OFFSET_NED">Body offset — ArduPilot GUIDED</option>
      <option value="BODY_NED">Body NED (ArduPilot: body offset; PX4 differs)</option>
    </optgroup>
    <optgroup label="Global">
      <option value="GLOBAL_RELATIVE_ALT_INT">Global, altitude above home</option>
      <option value="GLOBAL_INT">Global, absolute altitude (MSL)</option>
      <option value="GLOBAL_TERRAIN_ALT_INT">Global, terrain altitude</option>
    </optgroup>
  </select></div>
  <div class="form-row" id="row-move-targetSystem"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row" id="row-move-targetComponent"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <div class="form-row" id="row-move-north"><label for="node-input-north" id="label-move-north">Metres north</label><input type="text" id="node-input-north" step="any" style="width:120px"> m</div>
  <div class="form-row" id="row-move-east"><label for="node-input-east" id="label-move-east">Metres east</label><input type="text" id="node-input-east" step="any" style="width:120px"> m</div>
  <div class="form-row" id="row-move-up"><label for="node-input-up">Metres up</label><input type="text" id="node-input-up" step="any" style="width:120px"> m</div>
  <div class="form-row" id="row-move-lat"><label for="node-input-lat">Degrees lat</label><input type="text" id="node-input-lat" step="any" style="width:120px"> deg</div>
  <div class="form-row" id="row-move-lon"><label for="node-input-lon">Degrees lon</label><input type="text" id="node-input-lon" step="any" style="width:120px"> deg</div>
  <div class="form-row" id="row-move-alt"><label for="node-input-alt" id="label-move-alt">Metres alt</label><input type="text" id="node-input-alt" step="any" style="width:120px"> m</div>
  <div class="form-row" id="row-move-vNorth"><label for="node-input-vNorth" id="label-move-vNorth">North m/s</label><input type="text" id="node-input-vNorth" step="any" style="width:120px"> m/s</div>
  <div class="form-row" id="row-move-vEast"><label for="node-input-vEast" id="label-move-vEast">East m/s</label><input type="text" id="node-input-vEast" step="any" style="width:120px"> m/s</div>
  <div class="form-row" id="row-move-vUp"><label for="node-input-vUp">Up m/s</label><input type="text" id="node-input-vUp" step="any" style="width:120px"> m/s</div>
  <div class="form-row" id="row-move-aNorth"><label for="node-input-aNorth" id="label-move-aNorth">Accel north</label><input type="text" id="node-input-aNorth" step="any" style="width:120px"> m/s²</div>
  <div class="form-row" id="row-move-aEast"><label for="node-input-aEast" id="label-move-aEast">Accel east</label><input type="text" id="node-input-aEast" step="any" style="width:120px"> m/s²</div>
  <div class="form-row" id="row-move-aUp"><label for="node-input-aUp" id="label-move-aUp">Accel up</label><input type="text" id="node-input-aUp" step="any" style="width:120px"> m/s²</div>
  <div class="form-row" id="row-move-yaw"><label for="node-input-yaw">Yaw</label><input type="text" id="node-input-yaw" step="any" style="width:120px"> rad</div>
  <div class="form-row" id="row-move-yawRate"><label for="node-input-yawRate">Yaw rate</label><input type="text" id="node-input-yawRate" step="any" style="width:120px"> rad/s</div>
  <div class="form-row" id="row-move-interval"><label for="node-input-intervalMs">Stream interval</label><input type="number" id="node-input-intervalMs" style="width:80px"> ms</div>
  <div class="form-row" id="row-move-ttl"><label for="node-input-ttlMs">TTL</label><input type="number" id="node-input-ttlMs" style="width:80px"> ms</div>
</script>

<script type="text/html" data-help-name="mavlink-move">
  <p>Builds or sends SET_POSITION_TARGET_* messages. Vertical inputs — altitude, climb, vertical acceleration — are entered up-positive everywhere; the node flips them once to MAVLink NED down-positive values. The type_mask is computed from the mode; you never enter a bitmask.</p>
  <p><b>Mode</b> picks what drives the vehicle: <i>Position</i>, <i>Velocity</i>, <i>Position + Velocity</i> (feed-forward), <i>Acceleration</i>, or <i>Yaw only</i>. Yaw and yaw rate are optional on every mode — blank means ignored, a value (including 0) means commanded; Yaw only requires at least one of them.</p>
  <p><b>Frame</b> picks the reference and the carrier message: local frames (world NED, offset-from-current, body offset, body NED) send <code>SET_POSITION_TARGET_LOCAL_NED</code>; global frames (altitude above home, absolute MSL, terrain) send <code>SET_POSITION_TARGET_GLOBAL_INT</code> with lat/lon entered in degrees. Field labels follow the frame — body frames read forward/right.</p>
  <p><b>Frame semantics differ per firmware</b> (measured in SITL, §14). ArduPilot reads <i>offset from current</i>, <i>body offset</i> and <i>body NED</i> all as offsets from where the vehicle is now; PX4 ignores both OFFSET frames outright and does <i>not</i> treat body NED as an offset. On PX4, prefer <b>Local NED</b> for position setpoints. Because a zero is "no change" only in a true offset frame, a blank coordinate is accepted (as a zero offset) in <i>offset from current</i> and <i>body offset</i>, and refused everywhere else rather than silently commanding the local origin.</p>
  <p>Combinations measured as unsupported — OFFSET or body-NED frames on PX4 — are still sent but raise a node warning, since setpoints carry no acknowledgement.</p>
  <p>Mode, frame, and delivery reshape the form (§6): only the parameters for the selection are shown. Stream interval and TTL appear only for Stream delivery.</p>
  <p>On <b>Build</b> delivery the Dialect dropdown selects the bundled dialect used for catalogs; choose <i>from Vehicle Profile…</i> to inherit dialect and target defaults from a Vehicle Profile. On <b>Send</b> or <b>Stream</b> delivery a Connection is required and the Send-as identity determines addressing: a companion identity derives the target sysid from its airframe and pins compid to 1 (the autopilot).</p>
  <p>Output 0 continues only on success, once per input. Output 1 carries the status record for every outcome.</p>
  <p>On <b>Stream</b> delivery, when the TTL elapses the node sends the zero-velocity stop packet and reports it on output 1 with <code>detail: "expired"</code> — switch on that to run whatever follows a timed move. It is deliberately not on output 0: that port is a trigger, and the stream's start already fired it, so a second message there would run the rest of the chain twice. Stopping for any other reason reports nothing at all, because the flow already caused it — a new input replaces the stream, and a redeploy closes it.</p>
</script>
