<script type="text/javascript">
  // Dialect + Vehicle + Firmware validators are the shared Build-tier rule
  // (§6 Firmware XOR); Param's mode field is `delivery`.
  var paramDefaults = Object.assign(
    {
      name: { value: '' },
      identity: { value: '' },
      delivery: { value: 'build', validate: RED.mavlink.oneOf(['build', 'send', 'confirm', 'collect']) },
      action: { value: 'read' },
      // Every Param action is a two-way conversation: a set waits for its
      // PARAM_VALUE echo, a read for the value, a list for the stream. None
      // of them can be answered by "sysid 0", so broadcast reds on the tiers
      // that wait — and on Build too, since a built broadcast PARAM_SET
      // forwarded to mavlink-out is the same fleet-wide write.
      targetSystem: {
        value: '',
        validate: RED.mavlink.validateTargetSystem(['build', 'send', 'confirm', 'collect'], 'delivery', 'build'),
      },
      targetComponent: { value: '', validate: RED.validators.number(true) },
      // Which way the parameter is named. The protocol has one field for this
      // -- param_index -1 means "use param_id" -- so the two are alternatives,
      // not a pair, and the dialog shows one at a time.
      lookup: { value: 'name' },
      /**
       * Required wherever the parameter is addressed by name — which is every
       * Set, and a Read that is not in Index mode. `PARAM_REQUEST_LIST` names
       * no parameter at all, so the row is hidden and the rule is off.
       *
       * The driver sends what it is handed: a blank id rides as 16 empty bytes
       * and the vehicle answers nothing, so the only place this can be caught
       * before the wire is here (§0 walled garden).
       */
      paramId: {
        value: '',
        validate: function (v, _opt) {
          var action = RED.mavlink.liveOr(this, '#node-input-action', this && this.action, 'read');
          if (action === 'request-list' || indexAddressed(this)) return true;
          if (RED.mavlink.isBlank(v)) {
            return 'is required — a set or a read by name identifies the parameter by its '
              + 'PARAM_ID, and a blank one reaches the vehicle as an empty name';
          }
          // char[16] on the wire. The input carries maxlength, so this catches
          // a hand-edited flow rather than typing.
          if (String(v).trim().length > 16) return 'exceeds the wire\'s PARAM_ID length of 16';
          return true;
        },
      },
      /**
       * Only a real index is edited, so only a real index is checked.
       *
       * By index the floor is 0, not -1: -1 is the protocol's "use the name"
       * sentinel (PARAM_REQUEST_READ: "Send -1 to use the param ID field as
       * identifier"), so it contradicts the mode that field is in. The ceiling
       * is int16_t's, because the true ceiling is the vehicle's param_count and
       * the editor cannot know it without a full list read.
       *
       * Anywhere else the field is hidden and carries -1, written by the dialog
       * rather than typed. Checking a value the operator cannot see would red
       * the node over something they have no way to fix.
       */
      paramIndex: {
        value: -1,
        validate: function (v, opt) {
          if (!indexAddressed(this)) return true;
          // The shared range check passes blank as "inherit / optional", which
          // every target-id field wants and this one does not: in index mode
          // the index *is* the identifier, and an empty box reaches the wire
          // as Number('') — index 0, a different parameter, silently.
          if (RED.mavlink.isBlank(v)) {
            return 'an index is required when identifying by index';
          }
          return RED.mavlink.validateIntRange(0, 32767)(v, opt);
        },
      },
      value: {
        value: '',
        /**
         * Blank is valid and load-bearing: it defers to `msg.payload` at
         * runtime rather than being an unfilled form. Beyond that the value
         * must be a number, and — when the definition documents bounds — must
         * be inside them. Catching 50 for an 800–2200 PWM parameter here beats
         * discovering it after the vehicle has taken it.
         *
         * Definitions are advisory, not authority: with none loaded this is
         * exactly the old numeric check, and a parameter absent from the seed
         * is never rejected for being unknown.
         */
        validate: function (v) {
          // Only PARAM_SET carries param_value, and only a set shows the row.
          // Configure a set with an out-of-range value, switch to Read one,
          // and without this the node stays red over a field that is no longer
          // on screen — the same trap the index validator avoids, and the one
          // hiding a row creates if the check is not hidden with it.
          if (RED.mavlink.liveOr(this, '#node-input-action', this && this.action, 'read') !== 'set') {
            return true;
          }
          if (RED.mavlink.isBlank(v)) return true;
          var n = Number(v);
          if (!Number.isFinite(n)) return false;
          var defs = _paramDefsByKey[paramDefsKey(this)];
          var def = defs && defs[editedParamId(this)];
          if (!def) return true;
          if (def.bits) {
            // A documented bitmask's legal values are its flags, not a scalar
            // range. PX4 publishes max 32 for GPS_UBX_CFG_INTF while
            // documenting bits 0-5 (full mask 63), so the published bound
            // would red a value the picker itself just built, with no message
            // and nothing to fix. The bound that does apply is the wire's:
            // these ride as int32, in either spelling, and outside it the Set
            // cannot encode — so the picker refuses to touch the box and this
            // red field is where the operator sees why.
            return n >= -2147483648 && n <= 2147483647;
          }
          if (def.min !== undefined && n < def.min) return false;
          if (def.max !== undefined && n > def.max) return false;
          return true;
        },
      },
      paramType: { value: 'MAV_PARAM_TYPE_REAL32' },
      timeout: { value: '', validate: RED.validators.number(true) }
    },
    RED.mavlink.buildTierDialectDefaults({ withFirmware: true })
  );

  /**
   * Loaded definitions, keyed by *which* definitions they are, because Node-RED
   * evaluates `validate` outside `oneditprepare` — the dialog's own cache is
   * unreachable from there.
   *
   * Keyed, not a single mirror: a lone table would be whatever the last opened
   * dialog loaded, and validation of a *different* node would range-check
   * against the wrong firmware. RC1_MIN is 800-1500 on PX4 and 800-2200 on
   * ArduPilot, so opening a PX4 node and then deploying an ArduPilot one with
   * 2000 would fail validation on a value that firmware accepts.
   */
  var _paramDefsByKey = {};

  /**
   * Which definition set a node uses. The shared resolver already answers this
   * for every catalog-backed dialog, from live fields or — via `source` — from
   * a saved config; definitions are one more catalog keyed the same way.
   *
   * They agree for the open node, and a closed node whose set was never loaded
   * simply misses, which skips the range check rather than applying someone
   * else's bounds.
   *
   * @param {object} source  saved node config
   * @returns {string}
   */
  function paramDefsKey(source) {
    return RED.mavlink.resolveCatalogTarget({ source: source }).key;
  }

  /**
   * Whether this node addresses its parameter by index.
   *
   * Two things have to be true, and the second is the protocol's, not the
   * operator's: only `PARAM_REQUEST_READ` carries a `param_index` at all.
   * `PARAM_SET`'s fields are target_system, target_component, param_id,
   * param_value, param_type — there is nowhere to put an index, so a set is
   * addressed by name whatever the mode says. `PARAM_REQUEST_LIST` names no
   * parameter either way.
   *
   * @param {object} node
   * @returns {boolean}
   */
  function indexAddressed(node) {
    return RED.mavlink.liveOr(node, '#node-input-action', node && node.action, 'read') === 'read'
      && RED.mavlink.liveOr(node, '#node-input-lookup', node && node.lookup, 'name') === 'index';
  }

  /**
   * The parameter id currently being edited: the live field while the dialog is
   * open, falling back to the saved value.
   *
   * @param {object} node
   * @returns {string}
   */
  function editedParamId(node) {
    return RED.mavlink.liveOr(node, '#node-input-paramId', node && node.paramId)
      .toUpperCase().trim();
  }

  RED.nodes.registerType('mavlink-param', {
    category: 'mavlink',
    paletteLabel: 'param',
    color: '#e9e4ff',
    defaults: paramDefaults,
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-sliders',
    label: function () { return this.name || 'mavlink param'; },
    oneditprepare: function () {
      var node = this;

      /* ── Connection and vehicle pickers ───────────────────────── */
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');

      /**
       * Show exactly the fields the chosen action puts on the wire.
       *
       * Each action is a different message and they carry different things:
       *
       *   read          PARAM_REQUEST_READ   param_id *or* param_index
       *   set           PARAM_SET            param_id, param_value, param_type
       *   request-list  PARAM_REQUEST_LIST   nothing but the target
       *
       * So only a read is asked which way to address the parameter, only a set
       * is asked for a value and a type, and a list request is asked for
       * neither — offering a Value and a Type beside "Request list" invites
       * filling in fields that are then silently dropped.
       *
       * Only the index is *stamped* when hidden. `param_index` -1 means "use
       * param_id", so a leftover index would win over the name on the wire;
       * a leftover value or type is simply never read, and clearing it would
       * throw away the operator's typing for no gain.
       *
       * A message may still drive a different action at runtime, and it
       * carries its own value and type when it does (`requestFrom` in
       * nodes/mavlink-param.js) — this governs what the node's *own*
       * configuration needs.
       */
      function applyActionRows() {
        var action = $('#node-input-action').val() || 'read';
        var namesOne = action !== 'request-list';
        var byIndex = indexAddressed(node);
        var toggle = RED.mavlink.toggleRow;

        var showName = namesOne && !byIndex;
        toggle('#row-param-lookup', action === 'read');
        toggle('#row-paramId', showName);
        toggle('#row-paramIndex', namesOne && byIndex);
        toggle('#row-value', action === 'set');
        toggle('#row-paramType', action === 'set');

        if (!byIndex) $('#node-input-paramIndex').val(-1);
        // The results panel floats under the name field, so it is tied to that
        // row by construction rather than by a second condition that can drift.
        if (!showName) hideParamResults();
      }

      /* ── Visibility: role × tier matrix (DESIGN.md §6) ───────── */
      function refreshVisibility() {
        var delivery = $('#node-input-delivery').val() || 'build';
        var isBuild = (delivery === 'build');
        var dialect = $('#node-input-dialect').val() || node.dialect || '';

        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuild,
          dialect: dialect,
          dialectRow: '#row-dialect',
          vehicleRow: '#row-vehicle',
          firmwareRow: '#row-firmware',
          connectionRow: '#row-connection'
        });
        /* Param-owned wire rows stay local */
        $('#row-identity').toggle(!isBuild);
        $('#row-timeout').toggle(!isBuild);

        /* role-driven rows: companion hides both target rows */
        RED.mavlink.applyCompanionTargetVisibility({
          isBuild: isBuild,
          identityId: $('#node-input-identity').val() || '',
          targetSystemRow: '#row-targetSystem',
          targetComponentRow: '#row-targetComponent',
        });
      }

      /* ── Param definition catalog ─────────────────────────────── */
      var _paramDefs = {};
      var _defsLoaded = false;
      var _defsNotice = '';
      /**
       * The documented flag entries ({value} per bit) and their OR-ed mask for
       * the parameter the Value field is shaped for. Bit math rides the shared
       * BigInt pair (RED.mavlink.selectedBitmaskValues / bitmaskFromSelection,
       * same as Command's Advanced params): BigInt bitwise has no int32
       * truncation, and a negative value behaves as infinite two's complement
       * — so LOG_BITMASK's signed int32 spelling (-1 is every bit, per
       * readInt32LE) selects, masks, and round-trips with no sign juggling
       * (Gitar, #296). lib/codec/mask.js is the runtime home of the same rule.
       */
      var _valueBitEntries = [];
      var _valueDocMask = 0n;

      /**
       * A saved box value as a BigInt, or null when it carries no bits to
       * preserve (blank defers to msg.payload; a non-integer has no bits).
       */
      function bitmaskBoxValue(raw) {
        var text = String(raw === undefined || raw === null ? '' : raw).trim();
        if (text === '') return null;
        try {
          return BigInt(text);
        } catch (_e) {
          var n = Number(text);
          return Number.isInteger(n) ? BigInt(n) : null;
        }
      }
      /**
       * Which definition set answered, in words -- composed by the route,
       * because only the route knows what it resolved. A Connection whose
       * profile names a different firmware than its own name suggests loads
       * definitions that look wrong for every parameter at once, and the
       * visible symptom is a Type field that will not narrow.
       */
      var _defsCatalog = '';

      /**
       * Tier-aware defs load: build tier reads vehicle from the vehicle field;
       * wire tiers read it through the selected connection's profile. Request
       * sequencing prevents a stale response from overwriting a newer one.
       */
      var _defsSeq = 0;

      /**
       * Give up on loading definitions, saying why. Every path out of
       * loadParamDefs has to come through here: a bare `return` leaves
       * _defsLoaded false, which is the one condition under which the notice
       * row cannot render — so the field silently offers nothing and explains
       * nothing, which is exactly what a typed-in param id looked like before.
       */
      /**
       * This dialog's definition-set key, from the *live* fields — the same
       * resolver `validate` runs against saved config, so the two agree for
       * the open node.
       */
      function currentDefsKey() {
        return RED.mavlink.resolveCatalogTarget().key;
      }

      function noParamDefs(notice) {
        _paramDefs = {};
        _paramDefsByKey[currentDefsKey()] = _paramDefs;
        // Nothing was served, so there is no catalog to name — the notice row
        // is what speaks here, and a stale label beside it would contradict it.
        _defsCatalog = '';
        _defsNotice = notice;
        _defsLoaded = true;
        rebuildParamIndex();
        refreshParamInfo();
      }

      /**
       * Which field the operator still has to fill, or '' when none.
       *
       * The resolver answers *whether* a target resolves; naming the missing
       * field belongs here, because this dialog is the only one that shows the
       * notice and the only one for which firmware is required.
       *
       * @param {{vehicleId: string, firmware: string}} target
       * @returns {string}
       */
      function paramDefsTargetError(target) {
        var delivery = $('#node-input-delivery').val() || 'build';
        if (delivery === 'build') {
          var dialect = $('#node-input-dialect').val() || '';
          if (!dialect) return 'Pick a dialect to load parameter definitions.';
          if (dialect === '__vehicle') {
            return target.vehicleId
              ? ''
              : 'Pick a Vehicle Profile to load parameter definitions.';
          }
          return target.firmware ? '' : 'Pick a firmware to load parameter definitions.';
        }
        var connectionId = $('#node-input-connection').val() || '';
        if (!connectionId) return 'Pick a Connection to load parameter definitions.';
        var connectionNode = RED.nodes.node(connectionId);
        if (!connectionNode) return 'The selected Connection could not be resolved.';
        if (!target.vehicleId) {
          return 'This Connection has no Vehicle Profile, which is where parameter definitions live.';
        }
        return '';
      }

      function loadParamDefs() {
        var target = RED.mavlink.resolveCatalogTarget();
        var missing = paramDefsTargetError(target);
        if (missing) return noParamDefs(missing);

        var seq = ++_defsSeq;
        // Cache under the key this request was built from, not whatever the
        // fields say when it lands.
        var key = target.key;
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/param/defs'), target.query, function (data) {
          if (seq !== _defsSeq) return;
          _paramDefs = data.defs || {};
          _paramDefsByKey[key] = _paramDefs;
          _defsCatalog = data.catalog || '';
          _defsNotice = data.notice || '';
          _defsLoaded = true;
          rebuildParamIndex();
          refreshParamInfo();
        }).fail(function (xhr) {
          if (seq !== _defsSeq) return;
          _paramDefs = {};
          _paramDefsByKey[key] = _paramDefs;
          _defsCatalog = '';
          _defsNotice = (xhr && xhr.responseJSON && xhr.responseJSON.error) ||
            'Parameter definitions unavailable.';
          _defsLoaded = true;
          rebuildParamIndex();
          refreshParamInfo();
        });
      }

      /** Ids in display order, rebuilt whenever definitions change. */
      var _paramIds = [];
      /**
       * Uppercased description per id. `searchParams` runs on every keystroke
       * over as many as 6827 definitions, and a short prefix sends nearly all
       * of them to the description branch — uppercasing there allocated a
       * string per parameter per keypress.
       */
      var _paramText = {};
      /** Ids currently on screen, so keyboard selection has something to index. */
      var _hits = [];
      var _hitIndex = -1;
      /**
       * The query those hits came from. Arrow keys re-render, and re-reading
       * the input would silently re-search — the same string in the live
       * editor, but it makes the panel depend on the input rather than on what
       * it last drew.
       */
      var _hitQuery = '';

      var MAX_HITS = 50;

      function rebuildParamIndex() {
        _paramIds = Object.keys(_paramDefs).sort();
        _paramText = {};
        for (var n = 0; n < _paramIds.length; n++) {
          var entry = _paramDefs[_paramIds[n]];
          _paramText[_paramIds[n]] = entry && entry.description
            ? entry.description.toUpperCase() : '';
        }
        var hasDefs = _paramIds.length > 0;
        $('#row-param-defs-tip').toggle(!hasDefs && _defsLoaded && !!_defsNotice);
        if (!hasDefs && _defsLoaded && _defsNotice) {
          $('#mav-param-defs-tip-text').text(_defsNotice);
        }
        hideParamResults();
      }

      /**
       * Rank matches for `query`. A datalist could only match the start of the
       * name, so finding a parameter meant already knowing what it was called;
       * description text is searched here precisely so "minimum" finds RC1_MIN.
       * Exact and prefix name matches still sort above body text.
       */
      function searchParams(query) {
        var q = String(query || '').trim().toUpperCase();
        var exact = [];
        var prefix = [];
        var contains = [];
        var described = [];
        for (var i = 0; i < _paramIds.length; i++) {
          var id = _paramIds[i];
          if (!q) { prefix.push(id); if (prefix.length >= MAX_HITS) break; continue; }
          if (id === q) { exact.push(id); continue; }
          var at = id.indexOf(q);
          if (at === 0) { prefix.push(id); continue; }
          if (at > 0) { contains.push(id); continue; }
          if (_paramText[id].indexOf(q) !== -1) described.push(id);
        }
        return exact.concat(prefix, contains, described).slice(0, MAX_HITS);
      }

      function hideParamResults() {
        _hits = [];
        _hitIndex = -1;
        _hitQuery = '';
        $('#mav-param-results').empty().toggle(false);
      }

      function chooseParam(id) {
        $('#node-input-paramId').val(id);
        hideParamResults();
        refreshParamInfo();
      }

      function renderParamResults(query, keepIndex) {
        if (!_paramIds.length) return hideParamResults();
        _hitQuery = String(query || '');
        _hits = searchParams(_hitQuery);
        _hitIndex = _hits.length
          ? Math.max(0, Math.min(keepIndex === undefined ? 0 : keepIndex, _hits.length - 1))
          : -1;

        var $panel = $('#mav-param-results');
        $panel.empty();
        for (var i = 0; i < _hits.length; i++) {
          var id = _hits[i];
          var def = _paramDefs[id] || {};
          var detail = def.description || '';
          if (def.unit) detail = detail ? detail + '  \u00b7  ' + def.unit : def.unit;

          var $row = $('<div></div>')
            .attr('class', 'mav-param-hit' + (i === _hitIndex ? ' mav-param-hit-active' : ''))
            .attr('data-param-id', id);
          $row.append($('<div></div>').attr('class', 'mav-param-hit-id').text(id));
          if (detail) {
            $row.append($('<div></div>').attr('class', 'mav-param-hit-detail').text(detail));
          }
          // `id` is captured per row; a shared loop variable would make every
          // row select the last one.
          $row.on('mousedown', (function (chosen) {
            return function (event) {
              // mousedown, not click: the input's blur would tear the panel
              // down before a click could land.
              if (event && event.preventDefault) event.preventDefault();
              chooseParam(chosen);
            };
          }(id)));
          $panel.append($row);
        }
        $panel.toggle(_hits.length > 0);
      }

      function moveParamSelection(delta) {
        if (!_hits.length) return;
        // Re-render rather than track nodes: the panel is capped at MAX_HITS,
        // so the active row stays a function of state instead of history.
        var next = (_hitIndex + delta + _hits.length) % _hits.length;
        renderParamResults(_hitQuery, next);
      }

      function refreshParamInfo() {
        var id = ($('#node-input-paramId').val() || '').toUpperCase().trim();
        var def = _paramDefs[id];

        // Hover text, not a row. Description, unit and range are reference —
        // read once when picking the parameter, then in the way for every
        // edit after. `title` is the same mechanism every other catalog-backed
        // field in the palette uses (§6), so this adds no second one.
        //
        // The Value box gets its own hover from applyFieldMeta; setting one
        // here too would be two mechanisms for one attribute.
        var parts = [];
        if (def) {
          if (def.description) parts.push(def.description);
          if (def.unit) parts.push('Unit: ' + def.unit);
          if (def.min !== undefined || def.max !== undefined) {
            parts.push('Range: ' + (def.min !== undefined ? def.min : '?') +
              ' – ' + (def.max !== undefined ? def.max : '?'));
          }
        }
        // The catalog line leads, and stands alone before a parameter is
        // picked -- that is exactly when "which definitions are these?" is
        // worth answering and there is nothing else to say.
        var hover = parts.length ? parts.join(' | ') : '';
        if (_defsCatalog) hover = hover ? _defsCatalog + '\n' + hover : _defsCatalog;
        if (hover) $('#node-input-paramId').attr('title', hover);
        else $('#node-input-paramId').removeAttr('title');

        // A published type is shown and locked; an unpublished one is asked for.
        //
        // Keyed on whether a type was published, not on the firmware's name —
        // PX4 is simply the only publisher today, and ArduPilot starting would
        // need no change here. §14 measured what the operator picking it costs:
        // a REAL32-typed set of an integer parameter is applied by the vehicle,
        // echoed back with the vehicle's own type, decodes to
        // 1.401298464324817e-45, and times out the confirm for a set that
        // succeeded. Where the firmware states the answer, offering the operator
        // a way to contradict it is offering them that failure.
        // Immutable by having nothing else to offer, not by `disabled`. A
        // disabled control is the obvious way to say "you cannot change this",
        // but nothing else in this palette disables a field that `defaults`
        // saves, so whether Node-RED round-trips one is unverified here — and a
        // Type that silently saves empty is the §14 failure with extra steps.
        // Narrowing the option list needs no new save path: the field is read
        // exactly as every other field is.
        var $type = $('#node-input-paramType');
        var published = def && def.type;
        // Option values are the MAV_PARAM_TYPE *name*, which is what the node
        // saves and the runtime reads. `saved` is passed explicitly so the
        // narrowed list does not get the previous pick appended back as a
        // missing option.
        RED.mavlink.fillEnumSelect(
          $type,
          published
            ? RED.mavlink.PARAM_TYPE_OPTIONS.filter(function (o) { return o.name === def.type; })
            : RED.mavlink.PARAM_TYPE_OPTIONS,
          { valueKey: 'name', saved: published ? def.type : $type.val(), triggerChange: false }
        );
        $type.attr('title', published
          ? 'Published by the firmware for this parameter.'
          : 'This firmware publishes no type for its parameters — pick the one the parameter actually stores.');

        refreshValueField(def);
      }

      /** Sentinel option that hands the operator back the free-text box. */
      var VALUE_CUSTOM = '__custom';

      /**
       * Shape the Value field to the parameter being set.
       *
       * A documented enumeration becomes a real select — `FLTMODE1` takes a
       * flight mode, not "a number", and picking "AltHold" beats remembering
       * that it is 2. Bounds and increment become input attributes, and the
       * unit is printed beside the box rather than buried in hover text (§6:
       * inline hints are units and range; prose belongs in the tooltip).
       *
       * The persisted field is always `#node-input-value` — the select writes
       * through to it — so nothing here changes what Node-RED saves.
       *
       * @param {?object} def
       */
      function refreshValueField(def) {
        var action = $('#node-input-action').val() || 'read';
        var $value = $('#node-input-value');
        var $select = $('#mav-param-value-select');
        var hasBits = !!(action === 'set' && def && def.bits && def.bits.length);
        var hasValues = !hasBits && !!(action === 'set' && def && def.values && def.values.length);

        // Shared helper (§6): sets the hover text on the input *and* its label,
        // and maintains the units hint. A private span here would be a second
        // units mechanism for the same job.
        RED.mavlink.applyFieldMeta('node-input-value', {
          description: def && def.description ? def.description : '',
          // The helper's key is `units`; a parameter definition carries `unit`.
          units: def && def.unit ? def.unit : '',
        });

        // Bounds and step are hints on the box; the validator is what actually
        // refuses, since a saved flow can carry anything.
        if (def && def.min !== undefined) $value.attr('min', def.min);
        else $value.removeAttr('min');
        if (def && def.max !== undefined) $value.attr('max', def.max);
        else $value.removeAttr('max');
        if (def && def.increment !== undefined) $value.attr('step', def.increment);
        else $value.removeAttr('step');

        $select.empty();
        _valueBitEntries = [];
        _valueDocMask = 0n;
        if (hasBits) {
          // A bitmask parameter is a set of switches, not "a number" —
          // ARMING_CHECK takes checks, not a sum the operator computes by
          // hand. One option per documented bit; the picker writes the mask
          // through to the box. The box stays visible beside it: a blank
          // value still defers to msg.payload, and undocumented remainder
          // bits stay reachable and survive picker changes.
          $select.attr('multiple', 'multiple').attr('size', Math.min(8, def.bits.length));
          for (var b = 0; b < def.bits.length; b++) {
            var bit = def.bits[b];
            var flag = String(Math.pow(2, bit.bit));
            $select.append(
              $('<option></option>').val(flag).text(bit.label + ' (bit ' + bit.bit + ')')
            );
            _valueBitEntries.push({ value: flag });
            _valueDocMask = _valueDocMask | BigInt(flag);
          }
          var saved = bitmaskBoxValue($value.val());
          $select.val(saved === null
            ? []
            : RED.mavlink.selectedBitmaskValues(saved.toString(), _valueBitEntries));
          $select.toggle(true);
          $value.toggle(true);
          return;
        }
        $select.removeAttr('multiple').removeAttr('size');
        if (!hasValues) {
          $select.toggle(false);
          $value.toggle(true);
          return;
        }

        // Numeric, not string: a saved `1.0` is the documented `1`, and the
        // select's option values are numeric strings.
        var current = String($value.val() === undefined ? '' : $value.val()).trim();
        var known = current !== '' && def.values.some(function (entry) {
          return Number(current) === Number(entry.value);
        });

        // Shared filler (§6): option values stay numeric strings, `title`
        // carries the dialect description, and the tip sync comes with it.
        // A definition's `label` is the entry's name — the helper composes
        // "NAME (value)" from it rather than showing a bare name.
        RED.mavlink.fillEnumSelect(
          $select,
          def.values.map(function (entry) {
            return {
              name: entry.label,
              value: entry.value,
              description: entry.description,
            };
          }),
          // `triggerChange` off: the helper fires change after selecting its
          // fallback entry, and this select's handler writes the picked value
          // into the box — which would overwrite a custom value with the first
          // documented one before the custom option below even exists. The
          // selection is set explicitly here instead.
          { saved: known ? String(Number(current)) : '', triggerChange: false }
        );

        // Always offered: firmware accepts values no metadata file lists, and a
        // blank value defers to msg.payload — neither may become unreachable
        // just because this parameter happens to document an enumeration.
        $select.append(
          $('<option></option>').val(VALUE_CUSTOM).text('Custom value…')
        );

        $select.val(known ? String(Number(current)) : VALUE_CUSTOM);
        // The custom option is appended after the fill, so re-sync the tip:
        // selecting it must clear the previous option's description.
        RED.mavlink.bindSelectTitleSync($select);
        $select.toggle(true);
        // A value the list does not cover keeps the box visible beside the
        // select, so it can be seen and edited rather than silently dropped.
        $value.toggle(!known);
      }

      /* Reload defs when tier-influencing fields change. */
      function clearParamDefs() {
        _paramDefs = {};
        _defsLoaded = false;
        // The key now carries every field that changes the answer — profile
        // dialect, firmware and family included — so a changed target already
        // lands on a different key. This drops the entry for the key being
        // left, so an explicit clear cannot be served its own stale catalog in
        // the window before the reload arrives.
        delete _paramDefsByKey[currentDefsKey()];
      }

      $('#node-input-delivery').on('change', function () {
        clearParamDefs();
        refreshVisibility();
        loadParamDefs();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-connection').on('change', function () {
        clearParamDefs();
        RED.mavlink.refreshIdentitySelect(node);
        loadParamDefs();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-dialect').on('change', function () {
        clearParamDefs();
        refreshVisibility();
        loadParamDefs();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-vehicle').on('change', function () {
        clearParamDefs();
        loadParamDefs();
        RED.mavlink.reloadTargetCompId(node);
      });
      // The radios are the control, `#node-input-lookup` is the saved value.
      $('input[name=mav-param-lookup]').on('change', function () {
        $('#node-input-lookup').val(
          $('input[name=mav-param-lookup]:checked').val() || 'name'
        );
        applyActionRows();
      });

      $('#node-input-firmware').on('change', function () {
        clearParamDefs();
        loadParamDefs();
      });
      $('#node-input-identity').on('change', function () {
        refreshVisibility();
      });

      // Pin/populate dialect BEFORE the first enum catalog fetch so Build-tier
      // currentCatalogQuery sees the saved dialect (not an empty select).
      RED.mavlink.populateDialectSelect($('#node-input-dialect'), { saved: node.dialect || '' });
      RED.mavlink.reloadTargetCompId(node);

      $('#node-input-paramId').on('input change', refreshParamInfo);
      $('#node-input-paramId').on('input focus', function () {
        renderParamResults($('#node-input-paramId').val());
      });
      $('#node-input-paramId').on('blur', hideParamResults);
      $('#node-input-paramId').on('keydown', function (event) {
        var key = event && event.key;
        if (key === 'ArrowDown') { moveParamSelection(1); }
        else if (key === 'ArrowUp') { moveParamSelection(-1); }
        else if (key === 'Enter' && _hitIndex >= 0) { chooseParam(_hits[_hitIndex]); }
        else if (key === 'Escape') { hideParamResults(); }
        else { return; }
        // Enter would otherwise submit the edit dialog, and the arrows would
        // move the caret instead of the selection.
        if (event.preventDefault) event.preventDefault();
      });
      // The action decides which message is built, so it decides which rows
      // exist at all — not just how the Value field is shaped.
      $('#node-input-action').on('change', function () {
        applyActionRows();
        refreshParamInfo();
      });
      $('#mav-param-value-select').on('change', function () {
        var $box = $('#node-input-value');
        if ($('#mav-param-value-select').attr('multiple') !== undefined) {
          // Bitmask mode: the picker owns the documented bits, the box keeps
          // any undocumented remainder the operator set by hand. The result
          // folds to canonical signed-int32 spelling (BigInt.asIntN): these
          // params ride the wire as at most int32, so a freshly picked bit 31
          // must leave as the negative writeInt32LE accepts — a positive
          // 2147483648 would throw at Set (Gitar, #296 round 2).
          var pickedMask = RED.mavlink.bitmaskFromSelection($('#mav-param-value-select').val());
          var current = bitmaskBoxValue($box.val());
          // A box value outside signed int32 cannot ride the wire, and the
          // fold below would silently rewrite it to one that can (CodeRabbit,
          // #296). Leave it alone: validate() has the field red, which is
          // where the operator sees and fixes it — not a truncated substitute.
          if (current !== null && BigInt.asIntN(32, current) !== current) return;
          // Nothing picked and nothing in the box: leave it alone rather than
          // writing "0". Blank deferred to msg.payload, and a look-and-untick
          // that turns it into an explicit mask of zero is a different node —
          // ARMING_CHECK 0 is every check disabled, which is the opposite of
          // "whatever the flow sends". This is why bitmaskFromSelection
          // reports no-selection as null instead of 0.
          if (pickedMask === null && current === null) return;
          var remainder = current === null ? 0n : (current & ~_valueDocMask);
          var result = remainder | BigInt(pickedMask === null ? 0 : pickedMask);
          $box.val(BigInt.asIntN(32, result).toString());
          return;
        }
        var picked = $('#mav-param-value-select').val();
        if (picked === VALUE_CUSTOM) {
          // Reveal the box rather than clearing it: whatever was there is more
          // likely the value they wanted than an empty field.
          $box.toggle(true);
          return;
        }
        $box.val(picked).toggle(false);
      });
      $('#node-input-value').on('input', function () {
        // Bitmask mode: a hand-edited box is the new truth. Switches still
        // showing the old mask would fold a deselected documented bit straight
        // back in on the next pick (Codex, #296) — re-derive the selection
        // exactly the way reopening the dialog does.
        var $select = $('#mav-param-value-select');
        if ($select.attr('multiple') === undefined) return;
        var saved = bitmaskBoxValue($('#node-input-value').val());
        $select.val(saved === null
          ? []
          : RED.mavlink.selectedBitmaskValues(saved.toString(), _valueBitEntries));
      });

      /* Initial state. */
      RED.mavlink.refreshIdentitySelect(node);
      // Once, not per redraw: refreshVisibility runs on every field change, and
      // refilling there would reset a Type the definition had narrowed to its
      // one published option.
      RED.mavlink.fillEnumSelect($('#node-input-paramType'), RED.mavlink.PARAM_TYPE_OPTIONS,
        { valueKey: 'name', saved: node.paramType, triggerChange: false });
      // Node-RED has already filled the hidden field from the saved property;
      // the radios are ours to check off it.
      $('input[name=mav-param-lookup][value="' +
        ($('#node-input-lookup').val() || 'name') + '"]').prop('checked', true);
      applyActionRows();
      refreshVisibility();
      loadParamDefs();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-param">
  <style>
    /* Colours come from Node-RED's theme variables so the panel follows the
       editor's light and dark themes instead of pinning its own palette. */
    .mav-param-results {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--red-ui-form-input-border-color, #ccc);
      border-radius: 3px;
      background: var(--red-ui-form-input-background, #fff);
      margin: 2px 0 0 107px;
      width: 70%;
    }
    .mav-param-hit {
      padding: 4px 8px;
      cursor: pointer;
      border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee);
    }
    .mav-param-hit:last-child { border-bottom: none; }
    .mav-param-hit:hover,
    .mav-param-hit-active {
      background: var(--red-ui-list-item-background-hover, #efefef);
    }
    .mav-param-hit-id {
      font-family: monospace;
      font-size: 0.9em;
    }
    .mav-field-units {
      margin-left: 6px;
      color: var(--red-ui-secondary-text-color, #888);
      font-size: 0.85em;
    }
    .mav-param-hit-detail {
      font-size: 0.8em;
      color: var(--red-ui-secondary-text-color, #888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and echo-confirm</option><option value="collect">Request list and collect</option></select></div>
  <div class="form-row" id="row-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-firmware"><label for="node-input-firmware">Firmware</label><select id="node-input-firmware"><option value=""></option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row" id="row-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-identity"><label for="node-input-identity">Identity</label><select id="node-input-identity"></select></div>
  <div class="form-row"><label for="node-input-action">Action</label><select id="node-input-action"><option value="read">Read one</option><option value="set">Set one</option><option value="request-list">Request list</option></select></div>
  <div class="form-row" id="row-targetSystem"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row" id="row-targetComponent"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <!--
    The radios are the control; the hidden input is what persists. Node-RED
    loads and saves a property from `#node-input-<prop>` (§2), and a radio
    *group* has no single element carrying that id — named `node-input-lookup`
    they looked like they did, and the mode was thrown away on every close.
    So they write through to the hidden field, exactly as the Value select
    below writes through to `#node-input-value`: one persisted field per
    property, no oneditsave needed to marshal it.
  -->
  <div class="form-row" id="row-param-lookup">
    <label for="node-input-lookup">Identify by</label>
    <input type="hidden" id="node-input-lookup">
    <span>
      <label style="width:auto;margin-right:12px;">
        <input type="radio" name="mav-param-lookup" value="name" style="width:auto;vertical-align:top;"> Name
      </label>
      <label style="width:auto;">
        <input type="radio" name="mav-param-lookup" value="index" style="width:auto;vertical-align:top;"> Index
      </label>
    </span>
  </div>
  <div class="form-row" id="row-paramId">
    <label for="node-input-paramId">Param id</label>
    <input type="text" id="node-input-paramId" maxlength="16" autocomplete="off"
           placeholder="search name or description, e.g. minimum">
    <!--
      A results panel, not a datalist: a datalist can only match the start of
      the name, so you had to know the parameter was called RC1_MIN before you
      could find it. This searches descriptions too, and shows units. Typing a
      name that is in no list still works — Lua scripts and custom builds
      declare parameters no metadata file has ever heard of.
    -->
    <div id="mav-param-results" class="mav-param-results" style="display:none"></div>
  </div>
  <div class="form-row" id="row-param-defs-tip" style="display:none">
    <label>&nbsp;</label>
    <span id="mav-param-defs-tip-text" class="form-tips" style="font-size:0.85em;"></span>
  </div>
  <div class="form-row" id="row-paramIndex"><label for="node-input-paramIndex">Index</label><input type="number" id="node-input-paramIndex" min="0" max="32767" step="1" title="Position in the vehicle's parameter table, from 0. The vehicle reports how many it has in PARAM_VALUE param_count."></div>
  <div class="form-row" id="row-value">
    <label for="node-input-value">Value</label>
    <!--
      The select writes through to #node-input-value, which stays the persisted
      field. "Custom value…" reveals the box again — firmware accepts values no
      metadata file lists, and a blank value defers to msg.payload.
    -->
    <select id="mav-param-value-select" style="width:60%;display:none"></select>
    <!-- number, not text: min/max/step are inert on a text input, and the
         help text promises the documented increment becomes the step. -->
    <input type="number" id="node-input-value">
  </div>
  <div class="form-row" id="row-paramType"><label for="node-input-paramType">Type</label><select id="node-input-paramType"></select></div>
  <div class="form-row" id="row-timeout"><label for="node-input-timeout">Timeout (ms)</label><input type="number" id="node-input-timeout" placeholder="10000"></div>
</script>

<script type="text/html" data-help-name="mavlink-param">
  <p>Reads one parameter, sets one parameter, or requests a full list. Set confirmation is by matching the PARAM_VALUE echo, not COMMAND_ACK.</p>
  <p><b>Delivery.</b> <i>Build</i> emits the message on output 0 without sending — pick a bundled <b>Dialect</b> plus <b>Firmware</b>, or choose <i>from Vehicle Profile…</i> to inherit dialect, firmware, and target defaults from a Vehicle Profile. Wire tiers (Send, confirm, collect) send over the selected <b>Connection</b>; the <b>Identity</b> stamps the source address.</p>
  <p><b>Confirm and collect.</b> On a set, <i>Send and echo-confirm</i> waits for
  the vehicle's <code>PARAM_VALUE</code> echo and re-sends the
  <code>PARAM_SET</code> on silence — three attempts in all, each waiting the
  configured timeout; the attempts made are reported in the terminal status
  record. On a read it waits for the <code>PARAM_VALUE</code> reply and emits
  it. <i>Request list and collect</i> keeps the timeout as the overall bound
  and, when the stream goes quiet inside it, re-requests the missing indexes by
  <code>PARAM_REQUEST_READ</code> a bounded number of times; a vehicle
  advertising zero parameters completes as an empty list.</p>
  <p><b>Addressing.</b> For a companion identity the target is derived automatically (airframe sysid, compid 1). For GCS/custom identities, fill target sysid/compid or leave blank to inherit the profile default.</p>
  <p>PX4 integer parameter types use the MAVLink int/float union so integer bits are reinterpreted in the float slot rather than numerically cast.</p>
  <p><b>Param id</b> searches shipped parameter definitions — type any part of a
  <i>name or description</i> and pick from the results. "minimum" finds
  <code>RC1_MIN</code>; you do not have to know the name first. Each result shows
  its description and units, arrow keys and Enter select, and the definition's
  text becomes hover help on both the id and the value. A name that is in no
  list still works: Lua scripts and custom builds declare parameters no metadata
  file has heard of.</p>
  <p><b>The action decides which fields exist.</b> Each is a different message
  and they carry different things: <i>Read one</i> sends
  <code>PARAM_REQUEST_READ</code>, which names the parameter and nothing else;
  <i>Set one</i> sends <code>PARAM_SET</code>, which adds a value and a type;
  <i>Request list</i> sends <code>PARAM_REQUEST_LIST</code>, which carries only
  the target. So Value and Type appear only for a set, and a list request asks
  for no parameter at all.</p>
  <p><b>Identify by</b> picks name or index, and appears only on <i>Read one</i>.
  <code>PARAM_REQUEST_READ</code> carries both fields and uses the index unless
  it is <code>-1</code>, so they are alternatives rather than a pair; by index
  the name is not sent at all. <code>PARAM_SET</code> has no index field and
  <i>Request list</i> names no parameter, so both are always by name. The index
  starts at 0 and runs to the count the vehicle reports in
  <code>PARAM_VALUE.param_count</code> — it is a position in <i>that</i>
  vehicle's table, not a stable identifier across firmware versions.</p>
  <p><b>Value</b> follows the definition. A parameter with documented choices
  becomes a dropdown — <code>FLTMODE1</code> offers "AltHold (2)" — with a
  <b>Custom value…</b> escape for anything the list does not cover. Documented
  bounds are checked before you can deploy, units print beside the box, and the
  documented increment becomes the step. Leaving it blank is still how you defer
  the value to <code>msg.payload</code>.</p>
  <p>Hovering <b>Param id</b> names the definition set that answered — for
  example <i>PX4 &middot; 1836 definitions (shipped seed)</i>. Definitions follow
  the <b>Vehicle Profile</b>'s Firmware and Vehicle, not the Connection's name,
  so a Connection called "PX4" bound to a profile set to ArduPilot loads
  ArduPilot definitions; every parameter then looks unknown and the Type field
  will not narrow.</p>
  <p>Definitions ship with this package for ArduPilot (all six vehicle types)
  and PX4, chosen by the Vehicle Profile's <b>Firmware</b> and <b>Vehicle</b> —
  the same id differs between stacks, so <code>RC1_MIN</code> is microseconds on
  PX4 and PWM on ArduPilot. Set <b>Vehicle</b> if you know it: an
  <b>Unknown / custom</b> vehicle is offered every parameter name that firmware
  documents, but no bounds and no choice lists, because the vehicle documents
  disagree about those and there is nothing to pick by. Naming the vehicle is
  what turns the range check and the dropdown on. A Vehicle Profile that has downloaded its own
  definitions overrides the shipped ones, since that download came from the
  firmware you are actually flying. When nothing can be offered, the field says
  why, under the input.</p>
  <p>Three source formats are read, sniffed from the document itself rather than from its <code>Content-Type</code>: ArduPilot's <code>apm.pdef.json</code> (objects keyed by param id), PX4's <code>parameters.json</code> (a <code>parameters</code> array carrying <code>name</code> inside each entry), and PX4's <code>parameters.xml</code> (<code>&lt;parameter&gt;</code> elements inside <code>&lt;group&gt;</code>). For PX4 use <code>https://artifacts.px4.io/Firmware/_general/parameters.xml</code> — the <code>.json</code> is published only as an <code>.xz</code> archive, which is refused by name rather than parsed.</p>
</script>
