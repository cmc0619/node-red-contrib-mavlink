<script type="text/javascript">
  RED.nodes.registerType('mavlink-fanout', {
    category: 'mavlink',
    paletteLabel: 'fan-out',
    color: '#ffe6cc',
    defaults: {
      name: { value: '' },
      connection: RED.mavlink.connectionDefault(),
      identity: { value: '' },
      selectionMode: {
        // 'list' — the delivery default is Build, and Build requires the list,
        // so a fresh node must not be born invalid behind a greyed dropdown.
        value: 'list',
        // Membership first (§5's editor half: the runtime dispatches this
        // token with affirmative cases only, so a hand-edited stray must red
        // here). Then the Build rule: Build emits to a downstream mavlink-out,
        // so the Connection's only remaining job is the member directory — and
        // an explicit list is the one selection that does not need it.
        // Requiring the list on Build is what lets `connection` above share
        // the standard blank-on-Build rule (#191). All/filter selection stays
        // on the wire tiers, where a Connection is present anyway.
        validate: RED.mavlink.oneOf(['all', 'list', 'filter'], function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-delivery', this.delivery) !== 'build') return true;
          return v === 'list' || 'must be an explicit sysid list on Build';
        }),
      },
      members: {
        // One row per member: {sysid, north?, east?, up?, patch?}. Offsets are
        // metres (blank = none), applied at build time against the message's
        // own position; patch is a raw wire-unit field object (blank = none).
        value: [],
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-selectionMode', this.selectionMode) !== 'list') return true;
          if (!Array.isArray(v) || v.length === 0) return 'needs at least one member row for list selection';
          // The fields a metre offset would write on any supported carrier —
          // a row carrying both an offset and a raw patch of one of these
          // would make the runtime pick a winner, so it reds here instead.
          var POSITION_FIELDS = ['lat', 'lon', 'alt', 'x', 'y', 'z', 'lat_int', 'lon_int', 'param5', 'param6', 'param7'];
          // Keys the runtime refuses per run (command — the run is classified
          // and safety-gated once) or silently strips (target ids) — red the
          // row at save time instead. Row sysid is the addressing.
          var RESERVED_KEYS = ['command', 'sysid', 'target_system', 'target_component'];
          var seen = {};
          for (var i = 0; i < v.length; i++) {
            var row = v[i];
            var where = 'row ' + (i + 1);
            var sysid = Number(row.sysid);
            if (!Number.isInteger(sysid) || sysid < 1 || sysid > 255) {
              return where + ': sysid must be an integer 1-255';
            }
            if (seen[sysid]) {
              return where + ': duplicate sysid ' + sysid + ' — one row per member, or the later row silently wins';
            }
            seen[sysid] = true;
            var hasOffset = false;
            var axes = ['north', 'east', 'up'];
            for (var a = 0; a < axes.length; a++) {
              if (row[axes[a]] === undefined) continue;
              hasOffset = true;
              if (typeof row[axes[a]] !== 'number' || !Number.isFinite(row[axes[a]])) {
                return where + ': ' + axes[a] + ' offset must be a finite number of metres';
              }
            }
            if (row.patch !== undefined) {
              if (typeof row.patch !== 'object' || row.patch === null || Array.isArray(row.patch)) {
                return where + ': patch must be a JSON object of wire-unit fields';
              }
              for (var r = 0; r < RESERVED_KEYS.length; r++) {
                if (Object.prototype.hasOwnProperty.call(row.patch, RESERVED_KEYS[r])) {
                  return where + ': patch may not set ' + RESERVED_KEYS[r]
                    + ' — the row sysid addresses the member, and command is gated once from the base message';
                }
              }
              for (var p = 0; p < POSITION_FIELDS.length; p++) {
                if (hasOffset && Object.prototype.hasOwnProperty.call(row.patch, POSITION_FIELDS[p])) {
                  return where + ': metre offsets and a raw patch of position field '
                    + POSITION_FIELDS[p] + ' conflict — use one or the other';
                }
              }
            }
          }
          return true;
        },
      },
      vehicleType: { value: '' },
      firmwareFilter: { value: '' },
      armedFilter: { value: '' },
      executionMode: {
        value: 'sequential',
        // Membership first (§5's editor half, as on selectionMode). Then the
        // Build rule: Broadcast only pairs with the "All" selection, which
        // Build cannot choose — the reshape below also resets a retained
        // Broadcast, but a hand-set value must still red rather than deploy a
        // node the runtime refuses on every message.
        validate: RED.mavlink.oneOf(['sequential', 'broadcast'], function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-delivery', this.delivery) !== 'build') return true;
          return v !== 'broadcast' || 'Broadcast needs the "All" selection, which Build cannot use';
        }),
      },
      intervalMs: {
        value: 100,
        // Blank stays absent — numberOption hands it through so lib/fanout's
        // own default fires (blank ≠ 0 ≠ absent, Gitar #287). A present value
        // must be milliseconds >= 0: the input's min="0" is not enforced on
        // save, and a saved negative paces nothing.
        validate: RED.mavlink.validateAtLeast(0),
      },
      concurrency: {
        value: 1,
        validate: function (v) {
          var n = Number(v);
          return Number.isInteger(n) && n >= 1;
        },
      },
      stopOnError: { value: false },
      confirm: { value: false },
      delivery: { value: 'build', validate: RED.mavlink.oneOf(['build', 'send', 'confirm']) },
      timeoutMs: {
        value: 10000,
        // RED.validators.number() accepts 0 and negatives, and the input's
        // min="1" is not enforced on save: a saved 0 arms confirmMember and
        // confirmBroadcast at 0 ms, so every member reports unconfirmed before
        // an ack could arrive.
        validate: function (v) {
          var n = Number(v);
          return Number.isInteger(n) && n >= 1;
        },
      },
      maxRetries: {
        value: 0,
        // Blank stays absent (lib default 0), like intervalMs above. A present
        // value must be a whole retry count >= 0: min="0" is not enforced on
        // save, and a negative or fractional count reaches AckWaiter as-is.
        validate: RED.mavlink.validateAtLeast(0, { integer: true }),
      }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-sitemap',
    label: function () { return this.name || 'mavlink fanout'; },
    oneditprepare: function () {
      var node = this;
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');

      // Members table (#163): one editableList row per member — sysid, N/E/Up
      // offsets in metres, and an optional raw wire-unit patch. Same stock
      // widget the Connection node uses for its extra identities.
      var $members = $('#mav-fanout-members');
      $members.editableList({
        addButton: 'add member',
        removable: true,
        sortable: true,
        height: 'auto',
        addItem: function (container, _index, member) {
          container.css({ display: 'flex', 'align-items': 'center', gap: '4px' });
          function cell(cls, placeholder, title, grow) {
            return $('<input>', { type: 'text', class: cls, placeholder: placeholder, title: title })
              .css(grow ? { 'flex-grow': 1, width: '30px' } : { width: '52px', 'flex-shrink': 0 })
              .appendTo(container);
          }
          var $sysid = cell('mav-fanout-member-sysid', 'sysid', 'System id (1-255)');
          var $north = cell('mav-fanout-member-north', 'N m', 'North offset in metres, applied to the message’s own position (blank = none)');
          var $east = cell('mav-fanout-member-east', 'E m', 'East offset in metres (blank = none)');
          var $up = cell('mav-fanout-member-up', 'Up m', 'Up offset in metres (blank = none)');
          var $patch = cell('mav-fanout-member-patch', 'patch JSON', 'Optional JSON object of message fields to overwrite for this member, in wire units (blank = none)', true);
          if (member) {
            if (member.sysid !== undefined) $sysid.val(member.sysid);
            if (member.north !== undefined) $north.val(member.north);
            if (member.east !== undefined) $east.val(member.east);
            if (member.up !== undefined) $up.val(member.up);
            if (member.patch !== undefined) {
              $patch.val(typeof member.patch === 'string' ? member.patch : JSON.stringify(member.patch));
            }
          }
        },
      });
      (node.members || []).forEach(function (member) {
        $members.editableList('addItem', member);
      });

      var _msgCatalog = { seq: 0 };
      function refreshVehicleTypeOptions() {
        // MAV_TYPE options come from the connection's profile catalog; without
        // a connection the filter cannot resolve at runtime anyway, so an
        // unfilled dropdown is honest, not broken.
        RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, function (catalog) {
          if (!catalog) return;
          var sel = $('#node-input-vehicleType');
          RED.mavlink.fillEnumSelect(sel, (catalog.enums && catalog.enums.MAV_TYPE) || [], {
            saved: node.vehicleType,
            preferLive: true,
            allowEmpty: true,
            emptyLabel: 'Any type',
            titleNamespace: 'mavTypeTip',
            triggerChange: false
          });
        }, { isBuild: false, listKey: 'messages' });
      }

      /**
       * §6 reshape: only the rows for the current selection, execution, and
       * delivery exist. Sysids only for list selection; filter rows only for
       * filter selection; interval/concurrency only for sequential; confirm
       * timing only for the confirm tier; identity only on wire tiers.
       */
      function refreshVisibility() {
        var d = $('#node-input-delivery').val() || 'build';
        var sel = $('#node-input-selectionMode').val() || 'all';
        var exec = $('#node-input-executionMode').val() || 'sequential';
        // Build requires the explicit list (see defaults.selectionMode) — grey
        // the selections that need a live peer table rather than red-ringing
        // after the fact. Broadcast goes with them: it only pairs with the
        // "All" selection, which Build cannot choose.
        $('#node-input-selectionMode option[value="all"], #node-input-selectionMode option[value="filter"]')
          .prop('disabled', d === 'build');
        $('#node-input-executionMode option[value="broadcast"]').prop('disabled', d === 'build');
        // Disabling greys the option but keeps a retained value — a node
        // switched from a Broadcast wire tier would save Build+Broadcast and
        // refuse every message. Move it to the only mode Build supports.
        if (d === 'build' && exec === 'broadcast') {
          exec = 'sequential';
          $('#node-input-executionMode').val(exec);
        }
        // Build never uses a Connection now (the list is the directory), so
        // the picker hides like every other sender's does on Build (§6).
        $('#row-fanout-connection').toggle(d !== 'build');
        $('#row-fanout-identity').toggle(d !== 'build');
        $('#row-fanout-members, #tip-fanout-members').toggle(sel === 'list');
        $('#row-fanout-typeFilter').toggle(sel === 'filter');
        $('#row-fanout-firmwareFilter').toggle(sel === 'filter');
        $('#row-fanout-armedFilter').toggle(sel === 'filter');
        $('#row-fanout-interval').toggle(exec === 'sequential');
        $('#row-fanout-stopOnError').toggle(exec === 'sequential');
        $('#row-fanout-concurrency').toggle(exec === 'sequential' && d === 'confirm');
        $('#row-fanout-timeout').toggle(d === 'confirm');
        $('#row-fanout-retries').toggle(d === 'confirm');
      }

      $('#node-input-delivery').on('change', refreshVisibility);
      $('#node-input-selectionMode').on('change', refreshVisibility);
      $('#node-input-executionMode').on('change', refreshVisibility);
      $('#node-input-connection').on('change', function () {
        refreshVehicleTypeOptions();
        RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
        refreshVisibility();
      });
      refreshVehicleTypeOptions();
      RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
      refreshVisibility();
    },
    oneditsave: function () {
      // Collect the member rows. Blank offset cells stay absent (no offset);
      // a patch that parses to a JSON object is stored as the object so the
      // runtime reads it directly; unparseable text is kept verbatim so the
      // members validator reds the row instead of silently dropping it.
      var members = [];
      $('#mav-fanout-members').editableList('items').each(function () {
        var row = $(this);
        var member = { sysid: Number(row.find('.mav-fanout-member-sysid').val()) };
        ['north', 'east', 'up'].forEach(function (axis) {
          var raw = row.find('.mav-fanout-member-' + axis).val();
          if (!RED.mavlink.isBlank(raw)) member[axis] = Number(raw);
        });
        var patchText = String(row.find('.mav-fanout-member-patch').val() || '').trim();
        if (patchText !== '') {
          try {
            member.patch = JSON.parse(patchText);
          } catch (_err) {
            member.patch = patchText;
          }
        }
        members.push(member);
      });
      this.members = members;
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-fanout">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-fanout-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-fanout-identity"><label for="node-input-identity">Identity</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-selectionMode">Selection</label><select id="node-input-selectionMode"><option value="all">All active vehicles</option><option value="list">Explicit sysid list</option><option value="filter">Filter</option></select></div>
  <div class="form-row" id="row-fanout-members">
    <label style="vertical-align:top;">Members</label>
    <div style="display:inline-block;width:70%;">
      <ol id="mav-fanout-members"></ol>
    </div>
  </div>
  <div class="form-tips" id="tip-fanout-members" style="margin-bottom:8px;">
    Offsets are metres against the message&rsquo;s own position; <b>patch</b> is a JSON
    object of raw wire-unit fields.
  </div>
  <div class="form-row" id="row-fanout-typeFilter"><label for="node-input-vehicleType">Type filter</label><select id="node-input-vehicleType"></select></div>
  <div class="form-row" id="row-fanout-firmwareFilter"><label for="node-input-firmwareFilter">Firmware</label><select id="node-input-firmwareFilter"><option value="">Any</option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row" id="row-fanout-armedFilter"><label for="node-input-armedFilter">Armed</label><select id="node-input-armedFilter"><option value="">Any</option><option value="true">Armed</option><option value="false">Disarmed</option></select></div>
  <div class="form-row"><label for="node-input-executionMode">Execution</label><select id="node-input-executionMode"><option value="sequential">Sequential</option><option value="broadcast">Broadcast</option></select></div>
  <div class="form-row" id="row-fanout-interval"><label for="node-input-intervalMs">Interval ms</label><input type="number" id="node-input-intervalMs" min="0"></div>
  <div class="form-row" id="row-fanout-concurrency"><label for="node-input-concurrency">Concurrency</label><input type="number" id="node-input-concurrency" min="1" style="width:80px"> <span class="form-tips">confirm waits in flight at once; 1 = strictly sequential</span></div>
  <div class="form-row" id="row-fanout-stopOnError"><label for="node-input-stopOnError">Stop on error</label><input type="checkbox" id="node-input-stopOnError" style="display:inline-block;width:auto;"> <span class="form-tips">halt remaining members after the first failure; they report skipped</span></div>
  <div class="form-row"><label for="node-input-confirm">Confirm</label><input type="checkbox" id="node-input-confirm" style="display:inline-block;width:auto;"> <span>Allow safety commands (Flight Termination) and broadcast position setpoints</span></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row" id="row-fanout-timeout"><label for="node-input-timeoutMs">Timeout ms</label><input type="number" id="node-input-timeoutMs" min="1"></div>
  <div class="form-row" id="row-fanout-retries"><label for="node-input-maxRetries">Retries</label><input type="number" id="node-input-maxRetries" min="0"></div>
</script>

<script type="text/html" data-help-name="mavlink-fanout">
  <p>Replicates one <b>built</b> MAVLink message across the active vehicles selected from a Connection peer table. Fan-out is a replicator, not an action node: wire any action node in <b>Build</b> delivery (Command, Move, Payload, Param — or mavlink-build) into it, and it retargets that message per member.</p>
  <p><code>msg.payload</code> is either the built message <code>{name, fields}</code> straight off a Build output, or the wrapper <code>{message, targets, ...options}</code>. <code>targets</code> is an array of sysids or <code>{sysid, ...fieldPatches}</code> objects — the patches overwrite message fields per member in <b>wire units</b> (Fan-out is a raw surface; a COMMAND_INT location patch is degE7), and the list itself becomes the selection. Runtime option overrides (<code>executionMode</code>, <code>delivery</code>, <code>intervalMs</code>, <code>concurrency</code>, …) ride the wrapper too.</p>
  <p>With the <i>Explicit sysid list</i> selection the <b>Members</b> table holds one row per member: its <b>sysid</b>, optional <b>N / E / Up</b> offsets in <b>metres</b>, and an optional <b>raw patch</b> (a JSON object of message fields, wire units — exactly the <code>targets</code> patch shape). Metre offsets are applied at build time against the message's <i>own</i> position: COMMAND_INT <code>x/y/z</code>, COMMAND_LONG <code>param5/6/7</code> (use offsets only on location commands — LONG carries no frame, so Fan-out <i>cannot</i> tell a non-location command's params from coordinates and will offset them anyway; that one is yours to get right, #196), SET_POSITION_TARGET_GLOBAL_INT <code>lat_int/lon_int/alt</code> (up adds to the up-positive altitude), and SET_POSITION_TARGET_LOCAL_NED <code>x/y/z</code> in plain metres (NED: up subtracts from z). Framed carriers must be in a global frame (or strictly LOCAL_NED for the NED setpoint) — local COMMAND_INT frames scale ×1e4 and body frames re-aim "north", so offsets there refuse; use a raw patch. A member with offsets on any other message is refused per message. A row may not combine offsets with a raw patch of position fields — the editor rejects the ambiguity. A <code>msg.payload.targets</code> array still overrides the configured members entirely, and a <code>msg.payload.selection</code> override picks its own group — under either one the configured offsets and raw patches do not apply.</p>
  <p>What the message means is inferred from its name: <code>COMMAND_LONG</code>/<code>COMMAND_INT</code> confirm by COMMAND_ACK; <code>PARAM_SET</code> confirms by its PARAM_VALUE echo (sequential only); offboard setpoints (<code>SET_POSITION_TARGET_LOCAL_NED</code>/<code>_GLOBAL_INT</code>, <code>SET_ATTITUDE_TARGET</code>, <code>SET_ACTUATOR_CONTROL_TARGET</code>) carry no ack and ride the streaming band; everything else addressed is fire-and-forget. Mission <i>transfer steps</i> (<code>MISSION_COUNT</code>, <code>MISSION_ITEM(_INT)</code>, <code>MISSION_REQUEST*</code>, <code>MISSION_ACK</code>, the partial-list pair) and <code>PARAM_REQUEST_LIST</code> are refused — multi-message transactions cannot be replicated. Single-shot mission commands like <code>MISSION_SET_CURRENT</code> and <code>MISSION_CLEAR_ALL</code> replicate normally.</p>
  <p>Fan-out addresses each member's <b>autopilot</b>: the built message's <code>target_component</code> is replaced per member. A message hand-addressed to another component is re-addressed, not honoured — use the single-vehicle nodes for that.</p>
  <p>Sequential mode sends one retargeted message per member at the configured interval; <b>Concurrency</b> lets up to N confirm waits overlap so one slow vehicle doesn't delay the rest. <b>Stop on error</b> halts remaining members after the first failure — they report <code>skipped</code> in the aggregate rather than being commanded. Broadcast mode sends one packet with target_system 0 and target_component 1, and requires the <i>All active vehicles</i> selection — a broadcast reaches every vehicle on the link, so it cannot honour a subset, per-target patches, or a PARAM_SET.</p>
  <p>On <b>Build</b> delivery output 0 emits the product — one retargeted message per member for a downstream <b>mavlink-out</b>. Build requires an <i>Explicit sysid list</i> and needs no Connection: the downstream sender owns the wire, and the list already answers "which vehicles". All/filter selection (and Broadcast) live on the wire tiers, where the Connection's peer table is present to answer it. On wire tiers output 0 fires only when every member succeeds. Output 1 always carries the aggregate status with per-vehicle detail.</p>
  <p><b>Identity</b> — selects the GCS or custom identity that stamps source SysID/CompID on outbound frames. Only identities with a <code>gcs</code> or <code>custom</code> role are offered. Hidden on Build delivery (source ids are stamped at the wire by the sending node).</p>
  <p>Safety commands (Flight Termination) are refused unless the <b>Confirm</b> box is ticked or <code>msg.confirmed = true</code> is set. The same gate covers a <b>broadcast position setpoint</b> — one packet converging every vehicle on one coordinate; velocity/acceleration-only setpoints broadcast ungated.</p>
  <p>Setpoints honour the single-owner stream lock: a member another node (e.g. Move) is actively streaming setpoints to is refused on the wire tiers rather than fed contradictory setpoints — sequential runs refuse that member and continue, broadcast refuses entirely. Stop the stream first.</p>
</script>
