<script type="text/javascript">
  RED.nodes.registerType('mavlink-fanout', {
    category: 'mavlink',
    paletteLabel: 'fan-out',
    color: '#ffe6cc',
    defaults: {
      name: { value: '' },
      connection: RED.mavlink.connectionDefault(),
      identity: { value: '' },
      selectionMode: {
        value: 'all',
        // Build emits to a downstream mavlink-out, so the Connection's only
        // remaining job is the member directory — and an explicit list is the
        // one selection that does not need it. Requiring the list on Build is
        // what lets `connection` above share the standard blank-on-Build rule
        // (#191). All/filter selection stays on the wire tiers, where a
        // Connection is present anyway.
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr('#node-input-delivery', this.delivery) !== 'build') return true;
          return v === 'list' || 'must be an explicit sysid list on Build';
        },
      },
      sysids: {
        value: '',
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr('#node-input-selectionMode', this.selectionMode) !== 'list') return true;
          if (RED.mavlink.isBlank(v)) return 'is required for list selection';
          return String(v).split(',').every(function (part) {
            part = part.trim();
            if (!part) return true;
            var n = Number(part);
            return Number.isInteger(n) && n >= 1 && n <= 255;
          }) || 'must be comma-separated sysids (1-255)';
        },
      },
      vehicleType: { value: '' },
      firmwareFilter: { value: '' },
      armedFilter: { value: '' },
      executionMode: {
        value: 'sequential',
        // Broadcast only pairs with the "All" selection, which Build cannot
        // choose — the reshape below also resets a retained Broadcast, but a
        // hand-set value must still red rather than deploy a node the runtime
        // refuses on every message.
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr('#node-input-delivery', this.delivery) !== 'build') return true;
          return v !== 'broadcast' || 'Broadcast needs the "All" selection, which Build cannot use';
        },
      },
      intervalMs: { value: 100, validate: RED.validators.number() },
      concurrency: {
        value: 1,
        validate: function (v) {
          var n = Number(v);
          return Number.isInteger(n) && n >= 1;
        },
      },
      dryRun: { value: false },
      stopOnError: { value: false },
      confirm: { value: false },
      delivery: { value: 'build' },
      timeoutMs: {
        value: 10000,
        // RED.validators.number() accepts 0 and negatives, and the input's
        // min="1" is not enforced on save: a saved 0 arms confirmMember and
        // confirmBroadcast at 0 ms, so every member reports unconfirmed before
        // an ack could arrive.
        validate: function (v) {
          var n = Number(v);
          return Number.isInteger(n) && n >= 1;
        },
      },
      maxRetries: { value: 0, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-sitemap',
    label: function () { return this.name || 'mavlink fanout'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      }

      var _msgCatalog = { seq: 0 };
      function refreshVehicleTypeOptions() {
        // MAV_TYPE options come from the connection's profile catalog; without
        // a connection the filter cannot resolve at runtime anyway, so an
        // unfilled dropdown is honest, not broken.
        RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, function (catalog) {
          if (!catalog) return;
          var sel = $('#node-input-vehicleType');
          RED.mavlink.fillEnumSelect(sel, (catalog.enums && catalog.enums.MAV_TYPE) || [], {
            saved: node.vehicleType,
            preferLive: true,
            allowEmpty: true,
            emptyLabel: 'Any type',
            titleNamespace: 'mavTypeTip',
            triggerChange: false
          });
        }, { isBuild: false, listKey: 'messages' });
      }

      /**
       * §6 reshape: only the rows for the current selection, execution, and
       * delivery exist. Sysids only for list selection; filter rows only for
       * filter selection; interval/concurrency only for sequential; confirm
       * timing only for the confirm tier; identity only on wire tiers.
       */
      function refreshVisibility() {
        var d = $('#node-input-delivery').val() || 'build';
        var sel = $('#node-input-selectionMode').val() || 'all';
        var exec = $('#node-input-executionMode').val() || 'sequential';
        // Build requires the explicit list (see defaults.selectionMode) — grey
        // the selections that need a live peer table rather than red-ringing
        // after the fact. Broadcast goes with them: it only pairs with the
        // "All" selection, which Build cannot choose.
        $('#node-input-selectionMode option[value="all"], #node-input-selectionMode option[value="filter"]')
          .prop('disabled', d === 'build');
        $('#node-input-executionMode option[value="broadcast"]').prop('disabled', d === 'build');
        // Disabling greys the option but keeps a retained value — a node
        // switched from a Broadcast wire tier would save Build+Broadcast and
        // refuse every message. Move it to the only mode Build supports.
        if (d === 'build' && exec === 'broadcast') {
          exec = 'sequential';
          $('#node-input-executionMode').val(exec);
        }
        // Build never uses a Connection now (the list is the directory), so
        // the picker hides like every other sender's does on Build (§6).
        $('#row-fanout-connection').toggle(d !== 'build');
        $('#row-fanout-identity').toggle(d !== 'build');
        $('#row-fanout-sysids').toggle(sel === 'list');
        $('#row-fanout-typeFilter').toggle(sel === 'filter');
        $('#row-fanout-firmwareFilter').toggle(sel === 'filter');
        $('#row-fanout-armedFilter').toggle(sel === 'filter');
        $('#row-fanout-interval').toggle(exec === 'sequential');
        $('#row-fanout-stopOnError').toggle(exec === 'sequential');
        $('#row-fanout-concurrency').toggle(exec === 'sequential' && d === 'confirm');
        $('#row-fanout-timeout').toggle(d === 'confirm');
        $('#row-fanout-retries').toggle(d === 'confirm');
      }

      $('#node-input-delivery').on('change', refreshVisibility);
      $('#node-input-selectionMode').on('change', refreshVisibility);
      $('#node-input-executionMode').on('change', refreshVisibility);
      $('#node-input-connection').on('change', function () {
        refreshVehicleTypeOptions();
        RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
        refreshVisibility();
      });
      refreshVehicleTypeOptions();
      RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
      refreshVisibility();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-fanout">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-fanout-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-fanout-identity"><label for="node-input-identity">Send as</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-selectionMode">Selection</label><select id="node-input-selectionMode"><option value="all">All active vehicles</option><option value="list">Explicit sysid list</option><option value="filter">Filter</option></select></div>
  <div class="form-row" id="row-fanout-sysids"><label for="node-input-sysids">Sysids</label><input type="text" id="node-input-sysids" placeholder="1,2,3"></div>
  <div class="form-row" id="row-fanout-typeFilter"><label for="node-input-vehicleType">Type filter</label><select id="node-input-vehicleType"></select></div>
  <div class="form-row" id="row-fanout-firmwareFilter"><label for="node-input-firmwareFilter">Firmware</label><select id="node-input-firmwareFilter"><option value="">Any</option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row" id="row-fanout-armedFilter"><label for="node-input-armedFilter">Armed</label><select id="node-input-armedFilter"><option value="">Any</option><option value="true">Armed</option><option value="false">Disarmed</option></select></div>
  <div class="form-row"><label for="node-input-executionMode">Execution</label><select id="node-input-executionMode"><option value="sequential">Sequential</option><option value="broadcast">Broadcast</option></select></div>
  <div class="form-row" id="row-fanout-interval"><label for="node-input-intervalMs">Interval ms</label><input type="number" id="node-input-intervalMs" min="0"></div>
  <div class="form-row" id="row-fanout-concurrency"><label for="node-input-concurrency">Concurrency</label><input type="number" id="node-input-concurrency" min="1" style="width:80px"> <span class="form-tips">confirm waits in flight at once; 1 = strictly sequential</span></div>
  <div class="form-row"><label for="node-input-dryRun">Dry run</label><input type="checkbox" id="node-input-dryRun" style="display:inline-block;width:auto;"></div>
  <div class="form-row" id="row-fanout-stopOnError"><label for="node-input-stopOnError">Stop on error</label><input type="checkbox" id="node-input-stopOnError" style="display:inline-block;width:auto;"> <span class="form-tips">halt remaining members after the first failure; they report skipped</span></div>
  <div class="form-row"><label for="node-input-confirm">Confirm</label><input type="checkbox" id="node-input-confirm" style="display:inline-block;width:auto;"> <span>Allow safety commands (Flight Termination)</span></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row" id="row-fanout-timeout"><label for="node-input-timeoutMs">Timeout ms</label><input type="number" id="node-input-timeoutMs" min="1"></div>
  <div class="form-row" id="row-fanout-retries"><label for="node-input-maxRetries">Retries</label><input type="number" id="node-input-maxRetries" min="0"></div>
</script>

<script type="text/html" data-help-name="mavlink-fanout">
  <p>Replicates one <b>built</b> MAVLink message across the active vehicles selected from a Connection peer table. Fan-out is a replicator, not an action node: wire any action node in <b>Build</b> delivery (Command, Move, Payload, Param — or mavlink-build) into it, and it retargets that message per member.</p>
  <p><code>msg.payload</code> is either the built message <code>{name, fields}</code> straight off a Build output, or the wrapper <code>{message, targets, ...options}</code>. <code>targets</code> is an array of sysids or <code>{sysid, ...fieldPatches}</code> objects — the patches overwrite message fields per member in <b>wire units</b> (Fan-out is a raw surface; a COMMAND_INT location patch is degE7), and the list itself becomes the selection. Runtime option overrides (<code>executionMode</code>, <code>delivery</code>, <code>intervalMs</code>, <code>concurrency</code>, …) ride the wrapper too.</p>
  <p>What the message means is inferred from its name: <code>COMMAND_LONG</code>/<code>COMMAND_INT</code> confirm by COMMAND_ACK; <code>PARAM_SET</code> confirms by its PARAM_VALUE echo (sequential only); offboard setpoints (<code>SET_POSITION_TARGET_LOCAL_NED</code>/<code>_GLOBAL_INT</code>, <code>SET_ATTITUDE_TARGET</code>, <code>SET_ACTUATOR_CONTROL_TARGET</code>) carry no ack and ride the streaming band; everything else addressed is fire-and-forget. Mission <i>transfer steps</i> (<code>MISSION_COUNT</code>, <code>MISSION_ITEM(_INT)</code>, <code>MISSION_REQUEST*</code>, <code>MISSION_ACK</code>, the partial-list pair) and <code>PARAM_REQUEST_LIST</code> are refused — multi-message transactions cannot be replicated. Single-shot mission commands like <code>MISSION_SET_CURRENT</code> and <code>MISSION_CLEAR_ALL</code> replicate normally.</p>
  <p>Fan-out addresses each member's <b>autopilot</b>: the built message's <code>target_component</code> is replaced per member. A message hand-addressed to another component is re-addressed, not honoured — use the single-vehicle nodes for that.</p>
  <p>Sequential mode sends one retargeted message per member at the configured interval; <b>Concurrency</b> lets up to N confirm waits overlap so one slow vehicle doesn't delay the rest. <b>Stop on error</b> halts remaining members after the first failure — they report <code>skipped</code> in the aggregate rather than being commanded. Broadcast mode sends one packet with target_system 0 and target_component 1, and requires the <i>All active vehicles</i> selection — a broadcast reaches every vehicle on the link, so it cannot honour a subset, per-target patches, or a PARAM_SET.</p>
  <p>On <b>Build</b> delivery output 0 emits the product — one retargeted message per member for a downstream <b>mavlink-out</b>. Build requires an <i>Explicit sysid list</i> and needs no Connection: the downstream sender owns the wire, and the list already answers "which vehicles". All/filter selection (and Broadcast) live on the wire tiers, where the Connection's peer table is present to answer it. On wire tiers output 0 fires only when every member succeeds. Output 1 always carries the aggregate status with per-vehicle detail.</p>
  <p><b>Send as</b> — selects the GCS or custom identity that stamps source SysID/CompID on outbound frames. Only identities with a <code>gcs</code> or <code>custom</code> role are offered. Hidden on Build delivery (source ids are stamped at the wire by the sending node).</p>
  <p>Safety commands (Flight Termination) are refused unless the <b>Confirm</b> box is ticked or <code>msg.confirmed = true</code> is set.</p>
</script>
