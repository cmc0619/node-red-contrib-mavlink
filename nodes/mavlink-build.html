<script type="text/javascript">
  (function () {
    var BAND_OPTIONS = [
      { value: '0', label: 'Emergency (0)' },
      { value: '1', label: 'Liveness (1)' },
      { value: '2', label: 'Control (2)' },
      { value: '3', label: 'Streaming (3)' },
      { value: '4', label: 'Bulk (4)' },
    ];

    var TIER_OPTIONS = [
      { value: 'build', label: 'Build' },
      { value: 'send',  label: 'Send' },
    ];

    var COMMAND_MESSAGES = { COMMAND_LONG: true, COMMAND_INT: true };

    /** @type {Object<string, {messages:Array, enums:Object, dialect:string, error?:string}>} */
    var _msgCatalogByKey = {};
    var _msgCatalogKey = '';
    var _msgRequestSeq = 0;
    /** @type {Object<string, {commands:Array, enums:Object}>} */
    var _cmdCatalogByKey = {};
    var _cmdRequestSeq = 0;

    function resolveVehicleTarget() {
      var tierVal = $('#node-input-tier').val() || 'send';
      if (tierVal !== 'build') {
        // Wire tier: derive the catalog from the selected connection's vehicle
        // profile. Pass the profile id, not just the dialect name — the admin
        // route serves custom XML bundles only when given ?vehicle=<id>.
        // No silent default: until a connection with a profile is selected the
        // catalog is pending and the dialog says so (§6 — the connection's
        // profile is the only legitimate dialect source on wire tiers).
        var connectionId = $('#node-input-connection').val() || '';
        var connVehicleId = '';
        var dialect = '';
        if (connectionId && RED.nodes && RED.nodes.node) {
          var connNode = RED.nodes.node(connectionId);
          if (connNode && connNode.vehicle && RED.nodes.node(connNode.vehicle)) {
            connVehicleId = connNode.vehicle;
            var connVehicle = RED.nodes.node(connNode.vehicle);
            if (connVehicle && connVehicle.dialect) dialect = connVehicle.dialect;
          }
        }
        if (connVehicleId) {
          return {
            key: 'vehicle:' + connVehicleId,
            query: { vehicle: connVehicleId, dialect: dialect },
            dialect: dialect,
          };
        }
        return {
          key: 'pending:connection',
          query: null,
          dialect: '',
          pending: 'Select a Connection first — its Vehicle Profile supplies the dialect for Send delivery.',
        };
      }
      // Build tier: use the dialect picker.
      var dialectVal = $('#node-input-dialect').val() || 'ardupilotmega';
      if (dialectVal !== '__vehicle') {
        return {
          key: 'dialect:' + dialectVal,
          query: { dialect: dialectVal },
          dialect: dialectVal,
        };
      }
      // '__vehicle' escape: derive from the selected Vehicle Profile.
      var vehicleId = $('#node-input-vehicle').val() || '';
      var vehicleDialect = 'ardupilotmega';
      if (vehicleId && RED.nodes && RED.nodes.node) {
        var vehicle = RED.nodes.node(vehicleId);
        if (vehicle && vehicle.dialect) vehicleDialect = vehicle.dialect;
      }
      if (vehicleId) {
        return {
          key: 'vehicle:' + vehicleId,
          query: { vehicle: vehicleId, dialect: vehicleDialect },
          dialect: vehicleDialect,
        };
      }
      return {
        key: 'dialect:' + vehicleDialect,
        query: { dialect: vehicleDialect },
        dialect: vehicleDialect,
      };
    }

    function loadMessagesCatalog(cb) {
      var target = resolveVehicleTarget();
      if (target.pending) {
        var pendingCatalog = { messages: [], enums: {}, dialect: '', error: 'pending', errorHint: target.pending };
        _msgCatalogByKey[target.key] = pendingCatalog;
        _msgCatalogKey = target.key;
        cb(pendingCatalog);
        return;
      }
      if (_msgCatalogByKey[target.key]) {
        _msgCatalogKey = target.key;
        cb(_msgCatalogByKey[target.key]);
        return;
      }
      var seq = ++_msgRequestSeq;
      $.getJSON(RED.mavlink.adminApiUrl('/mavlink/build/messages'), target.query, function (data) {
        if (seq !== _msgRequestSeq) return;
        var catalog = {
          messages: data.messages || [],
          enums: data.enums || {},
          dialect: data.dialect || target.dialect,
        };
        _msgCatalogByKey[target.key] = catalog;
        _msgCatalogKey = target.key;
        cb(catalog);
    }).fail(function (_xhr, _status, err) {
      if (seq !== _msgRequestSeq) return;
      var catalog = {
        messages: [],
        enums: {},
        dialect: target.dialect,
        error: String(err || 'load failed'),
      };
      _msgCatalogByKey[target.key] = catalog;
      _msgCatalogKey = target.key;
      cb(catalog);
    });
  }

    function loadCommandsCatalog(cb) {
      var target = resolveVehicleTarget();
      if (target.pending) {
        cb({ commands: [], enums: {}, dialect: '', error: 'pending', errorHint: target.pending });
        return;
      }
      if (_cmdCatalogByKey[target.key]) {
        cb(_cmdCatalogByKey[target.key]);
        return;
      }
      var seq = ++_cmdRequestSeq;
      $.getJSON(RED.mavlink.adminApiUrl('/mavlink/command/commands'), target.query, function (data) {
        if (seq !== _cmdRequestSeq) return;
        var catalog = {
          commands: data.commands || [],
          enums: data.enums || {},
          dialect: data.dialect || target.dialect,
        };
        _cmdCatalogByKey[target.key] = catalog;
        cb(catalog);
      }).fail(function (_xhr, _status, err) {
        if (seq !== _cmdRequestSeq) return;
        cb({ commands: [], enums: {}, dialect: target.dialect, error: String(err || 'load failed') });
      });
    }

    function bitmaskTitle(description) {
      var base = description || 'Bitmask flags';
      return base + ' (Ctrl/Cmd-click to select multiple flags.)';
    }

    function selectedBitmaskValues(saved, entries) {
      if (saved === undefined || saved === null || saved === '') return [];
      var mask;
      try {
        mask = BigInt(String(saved));
      } catch (_e) {
        return [];
      }
      return entries.filter(function (entry) {
        var value;
        try {
          value = BigInt(String(entry.value));
        } catch (_e) {
          return false;
        }
        return (value === 0n && mask === 0n) || (value !== 0n && (mask & value) === value);
      }).map(function (entry) {
        return String(entry.value);
      });
    }

    function selectedNumericMask(raw) {
      var values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      if (!values.length) return null;
      var mask = 0n;
      values.forEach(function (value) {
        mask = mask | BigInt(String(value));
      });
      return Number(mask);
    }

    /** Collect typed values from live `.mav-field-input` controls (oneditsave + live sync). */
    function collectFieldInputsFromDom($root) {
      var fields = {};
      $root.find('.mav-field-input').each(function () {
        var name = $(this).attr('data-field');
        if (!name) return;
        var kind = $(this).attr('data-kind') || 'number';
        var raw = $(this).val();
        if (kind === 'bitmask') {
          fields[name] = Array.isArray(raw) ? raw : (raw ? [raw] : []);
          return;
        }
        if (kind === 'bitmask-mask') {
          var mask = selectedNumericMask(raw);
          if (mask !== null) fields[name] = mask;
          return;
        }
        if (raw === '' || raw === null || raw === undefined) return;
        if (kind === 'array') {
          fields[name] = String(raw).split(/[,\s]+/).filter(function (p) { return p !== ''; }).map(function (p) {
            var n = Number(p);
            return Number.isNaN(n) ? p : n;
          });
          return;
        }
        if (kind === 'int64' || kind === 'char') {
          fields[name] = String(raw);
          return;
        }
        if (kind === 'enum') {
          var asNum = Number(raw);
          fields[name] = !Number.isNaN(asNum) && String(asNum) === String(raw) ? asNum : raw;
          return;
        }
        var n = Number(raw);
        fields[name] = !Number.isNaN(n) ? n : raw;
      });
      return fields;
    }

    RED.nodes.registerType('mavlink-build', {
      category: 'MAVLink',
      color: '#6ea6d7',
      defaults: {
        name:        { value: '' },
        dialect:     {
          value: 'ardupilotmega',
          validate: function (v) {
            var $t = $('#node-input-tier');
            var tier = ($t && $t.length) ? $t.val() : (this.tier || 'send');
            if (tier === 'build') return !!v;
            return true;
          },
        },
        vehicle:     {
          value: '',
          type: 'mavlink-vehicle',
          required: false,
          validate: function (v) {
            var $t = $('#node-input-tier');
            var tier = ($t && $t.length) ? $t.val() : (this.tier || 'send');
            var $d = $('#node-input-dialect');
            var dialect = ($d && $d.length && $d.val()) ? $d.val() : (this.dialect || 'ardupilotmega');
            if (tier === 'build' && dialect === '__vehicle') return !!v;
            return true;
          },
        },
        connection:  {
          value: '',
          type: 'mavlink-connection',
          validate: function (v) {
            var $t = $('#node-input-tier');
            var tier = ($t && $t.length) ? $t.val() : (this.tier || 'send');
            if (tier !== 'build') return !!v;
            return true;
          },
        },
        messageName: { value: 'HEARTBEAT' },
        fields:      { value: '{}' },
        tier:        { value: 'send' },
        band:        { value: '2' },
        repeatMs:    { value: 0 },
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-wrench',
      paletteLabel: 'mavlink build',
      label: function () {
        return this.name || this.messageName || 'mavlink build';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        var node = this;
        var container = $('#node-input-fields-container');
        var savedFields = {};
        try { savedFields = JSON.parse(node.fields || '{}'); } catch (_e) { savedFields = {}; }
        /** Tracks MAV_CMD identity across param rebuilds; `undefined` = not initialized. */
        var lastBuildCommandId = undefined;
        var COMMAND_PARAM_KEYS = [
          'param1', 'param2', 'param3', 'param4', 'param5', 'param6', 'param7', 'x', 'y', 'z',
        ];

        function clearCommandParamWireFields() {
          COMMAND_PARAM_KEYS.forEach(function (key) { delete savedFields[key]; });
        }

        if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
          RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
          RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        }

        var $tier = $('#node-input-tier');
        $tier.empty();
        TIER_OPTIONS.forEach(function (opt) {
          $('<option>').val(opt.value).text(opt.label).appendTo($tier);
        });
        $tier.val(node.tier || 'send');

        var $band = $('#node-input-band');
        $band.empty();
        BAND_OPTIONS.forEach(function (opt) {
          $('<option>').val(opt.value).text(opt.label).appendTo($band);
        });
        $band.val(node.band !== undefined ? String(node.band) : '2');

        function updateVisibility() {
          var tierVal = $tier.val();
          var dialectVal = $('#node-input-dialect').val() || node.dialect || 'ardupilotmega';
          if (tierVal === 'build') {
            $('#mav-connection-row').hide();
            $('#mav-dialect-row').show();
            if (dialectVal === '__vehicle') {
              $('#mav-vehicle-row').show();
            } else {
              $('#mav-vehicle-row').hide();
            }
          } else {
            $('#mav-connection-row').show();
            $('#mav-dialect-row').hide();
            $('#mav-vehicle-row').hide();
          }
        }
        $tier.on('change', function () {
          _msgCatalogByKey = {};
          _cmdCatalogByKey = {};
          updateVisibility();
          reloadCatalogs();
        });
        updateVisibility();

        function formRow(label, control) {
          var row = $('<div class="form-row"></div>');
          row.append($('<label></label>').text(label).css('width', '140px'));
          row.append(control);
          return row;
        }

        function fieldLabel(spec) {
          var label = spec.name || 'field';
          if (spec.units) label += ' (' + spec.units + ')';
          return label;
        }

        function isCharArray(spec) {
          return spec.type === 'char' || (String(spec.type || '').indexOf('char') === 0);
        }

        function isInt64(spec) {
          return spec.type === 'int64_t' || spec.type === 'uint64_t';
        }

        function isCommandParamSlot(name) {
          return /^param[1-7]$/.test(name);
        }

        /** COMMAND_INT carries location in x/y/z, not param5–7. */
        function wireFieldForCommandParam(msgName, index) {
          if (msgName === 'COMMAND_INT' && index >= 5 && index <= 7) {
            return ['x', 'y', 'z'][index - 5];
          }
          return 'param' + index;
        }

        function fieldInput(spec, enums) {
          var saved = savedFields[spec.name];
          if (spec.enum && enums[spec.enum] && enums[spec.enum].length) {
            var multi = spec.display === 'bitmask';
            var sel = $('<select class="mav-field-input"></select>')
              .attr('data-field', spec.name)
              .attr('data-kind', multi ? 'bitmask' : 'enum')
              .attr('title', multi ? bitmaskTitle(spec.description) : (spec.description || ''));
            if (multi) sel.attr('multiple', 'multiple').attr('size', Math.min(6, enums[spec.enum].length));
            else sel.append($('<option></option>').val('').text('\u2014'));
            enums[spec.enum].forEach(function (entry) {
              sel.append($('<option></option>').val(entry.name).text(entry.label));
            });
            if (multi) {
              var selected = Array.isArray(saved) ? saved.map(String) : (saved !== undefined && saved !== null && saved !== '' ? [String(saved)] : []);
              sel.val(selected);
            } else if (saved !== undefined && saved !== null && saved !== '') {
              // Accept saved numeric value or entry name.
              var match = enums[spec.enum].find(function (e) {
                return String(e.value) === String(saved) || e.name === saved;
              });
              sel.val(match ? match.name : String(saved));
            }
            return sel;
          }
          if (isCharArray(spec)) {
            return $('<input type="text" class="mav-field-input">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'char')
              .attr('title', spec.description || '')
              .attr('maxlength', spec.arrayLength || undefined)
              .val(saved !== undefined && saved !== null ? saved : '');
          }
          if (spec.arrayLength) {
            var arrVal = Array.isArray(saved) ? saved.join(', ') : (saved !== undefined && saved !== null ? saved : '');
            return $('<input type="text" class="mav-field-input" style="width:70%">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'array')
              .attr('title', (spec.description || '') + ' (comma-separated, length ' + spec.arrayLength + ')')
              .attr('placeholder', 'e.g. 0, 0, 0')
              .val(arrVal);
          }
          if (isInt64(spec)) {
            return $('<input type="text" class="mav-field-input">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'int64')
              .attr('title', spec.description || '64-bit decimal string')
              .val(saved !== undefined && saved !== null ? String(saved) : '');
          }
          var input = $('<input type="number" class="mav-field-input">')
            .attr('data-field', spec.name)
            .attr('data-kind', 'number')
            .attr('title', spec.description || '')
            .val(saved !== undefined && saved !== null ? saved : '');
          if (spec.minValue !== null && spec.minValue !== undefined) input.attr('min', spec.minValue);
          if (spec.maxValue !== null && spec.maxValue !== undefined) input.attr('max', spec.maxValue);
          if (spec.increment !== null && spec.increment !== undefined) input.attr('step', spec.increment);
          return input;
        }

        /**
         * Merge live edits into savedFields before rebuilding controls so a MAV_CMD
         * (or message) change does not discard in-session parameter values.
         */
        function syncSavedFieldsFromDom() {
          var $root = $('#node-input-fields-container');
          if (!$root.find('.mav-field-input').length) return;
          var live = collectFieldInputsFromDom($root);
          // Empty controls are omitted from `live` (save semantics). Delete those
          // keys from the working snapshot so a rebuild does not restore them.
          $root.find('.mav-field-input').each(function () {
            var name = $(this).attr('data-field');
            if (!name) return;
            if (Object.prototype.hasOwnProperty.call(live, name)) {
              savedFields[name] = live[name];
            } else {
              delete savedFields[name];
            }
          });
        }

        function commandParamInput(msgName, spec, enums) {
          var key = wireFieldForCommandParam(msgName, spec.index);
          var saved = savedFields[key];
          // COMMAND_INT may also have legacy param5–7 saved from earlier builds.
          if ((saved === undefined || saved === null || saved === '') && msgName === 'COMMAND_INT' && spec.index >= 5) {
            saved = savedFields['param' + spec.index];
          }
          if (spec.enum && enums[spec.enum] && enums[spec.enum].length) {
            var isBitmask = !!spec.bitmask;
            var sel = $('<select class="mav-field-input"></select>')
              .attr('data-field', key)
              .attr('data-kind', isBitmask ? 'bitmask-mask' : 'enum')
              .attr('title', isBitmask ? bitmaskTitle(spec.description) : (spec.description || ''));
            if (isBitmask) {
              sel.attr('multiple', 'multiple').attr('size', Math.min(6, enums[spec.enum].length));
            } else {
              sel.append($('<option></option>').val('').text('\u2014'));
            }
            enums[spec.enum].forEach(function (entry) {
              sel.append($('<option></option>').val(String(entry.value)).text(entry.label));
            });
            if (isBitmask) {
              sel.val(selectedBitmaskValues(saved, enums[spec.enum]));
            } else if (saved !== undefined && saved !== null && saved !== '') {
              sel.val(String(saved));
            }
            return sel;
          }
          var input = $('<input type="number" class="mav-field-input">')
            .attr('data-field', key)
            .attr('data-kind', 'number')
            .attr('title', spec.description || '')
            .val(saved !== undefined && saved !== null ? saved : '');
          if (spec.minValue !== null && spec.minValue !== undefined) input.attr('min', spec.minValue);
          if (spec.maxValue !== null && spec.maxValue !== undefined) input.attr('max', spec.maxValue);
          if (spec.increment !== null && spec.increment !== undefined) input.attr('step', spec.increment);
          return input;
        }

        function refreshCommandParams(msgName, cmdCatalog) {
          syncSavedFieldsFromDom();
          var $slot = $('#mav-command-params');
          $slot.empty();
          if (!cmdCatalog) {
            $slot.append($('<div class="form-row"><em>Loading command parameters\u2026</em></div>'));
            return;
          }
          var cmdId = $('#mav-build-command-select').val() || '';
          // Same command rebuild keeps live edits; a different MAV_CMD must not
          // inherit paramN/x/y/z values that mean something else on the new command.
          if (lastBuildCommandId !== undefined && String(lastBuildCommandId) !== String(cmdId)) {
            clearCommandParamWireFields();
          }
          lastBuildCommandId = cmdId;
          if (!cmdId) {
            $slot.append($('<div class="form-row"><em>Select a MAV_CMD to configure parameters.</em></div>'));
            return;
          }
          var cmd = (cmdCatalog.commands || []).find(function (c) {
            return String(c.value) === String(cmdId);
          });
          if (!cmd) {
            $slot.append($('<div class="form-row"><em>Command not in this dialect.</em></div>'));
            return;
          }
          var visible = (cmd.params || []).filter(function (p) { return !p.hidden; });
          if (!visible.length) {
            $slot.append($('<div class="form-row"><em>No exposed parameters for this command.</em></div>'));
            return;
          }
          visible.forEach(function (spec) {
            var label = spec.label || spec.description || ('param ' + spec.index);
            if (spec.units) label += ' (' + spec.units + ')';
            $slot.append(formRow(label, commandParamInput(msgName, spec, cmdCatalog.enums || {})));
          });
        }

        function refreshFieldForm() {
          syncSavedFieldsFromDom();
          container.empty();
          var catalog = _msgCatalogByKey[_msgCatalogKey];
          var msgName = $('#node-input-messageName').val();
          if (!catalog) {
            container.append($('<div class="form-row"><em>Loading message fields\u2026</em></div>'));
            return;
          }
          if (catalog.error && !(catalog.messages && catalog.messages.length)) {
            var hint = catalog.errorHint ||
              'Could not load messages for this Vehicle dialect. Deploy the Vehicle Profile (required for custom dialects).';
            container.append($('<div class="form-row"></div>').append($('<em></em>').text(hint)));
            return;
          }
          var msg = (catalog.messages || []).find(function (m) { return m.name === msgName; });
          if (!msg) {
            container.append($('<div class="form-row"><em>Message not in this dialect.</em></div>'));
            return;
          }

          if (COMMAND_MESSAGES[msg.name]) {
            // COMMAND_LONG / COMMAND_INT: named command params, never Param 1–7 (§6).
            // COMMAND_INT location lives in x/y/z — hide those raw slots too.
            lastBuildCommandId = undefined;
            (msg.fields || []).forEach(function (spec) {
              if (isCommandParamSlot(spec.name) || spec.name === 'command') return;
              if (msg.name === 'COMMAND_INT' && (spec.name === 'x' || spec.name === 'y' || spec.name === 'z')) return;
              container.append(formRow(fieldLabel(spec), fieldInput(spec, catalog.enums || {})));
            });
            var cmdSel = $('<select id="mav-build-command-select" class="mav-field-input"></select>')
              .attr('data-field', 'command')
              .attr('data-kind', 'number');
            cmdSel.append($('<option></option>').val('').text('\u2014 select MAV_CMD \u2014'));
            container.append(formRow('command (MAV_CMD)', cmdSel));
            container.append($('<div id="mav-command-params"></div>'));
            loadCommandsCatalog(function (cmdCatalog) {
              (cmdCatalog.commands || []).forEach(function (c) {
                cmdSel.append($('<option></option>').val(String(c.value)).text(c.label));
              });
              var savedCmd = savedFields.command;
              if (savedCmd !== undefined && savedCmd !== null && savedCmd !== '') {
                cmdSel.val(String(savedCmd));
              } else if (cmdCatalog.commands && cmdCatalog.commands.length) {
                // Prefer ARM if present, else first command — never leave blank.
                var arm = cmdCatalog.commands.find(function (c) { return c.value === 400; });
                cmdSel.val(String((arm || cmdCatalog.commands[0]).value));
              }
              cmdSel.off('change.mavcmd').on('change.mavcmd', function () {
                refreshCommandParams(msg.name, cmdCatalog);
              });
              refreshCommandParams(msg.name, cmdCatalog);
            });
            return;
          }

          var fields = msg.fields || [];
          if (!fields.length) {
            container.append($('<div class="form-row"><em>No fields for this message.</em></div>'));
            return;
          }
          fields.forEach(function (spec) {
            container.append(formRow(fieldLabel(spec), fieldInput(spec, catalog.enums || {})));
          });
        }

        function buildMessageDropdown(catalog) {
          var sel = $('#node-input-messageName');
          var current = sel.is('select') ? sel.val() : null;
          var prefer = current || node.messageName || 'HEARTBEAT';
          if (!sel.is('select')) {
            var $select = $('<select id="node-input-messageName" style="width:70%"></select>');
            sel.replaceWith($select);
            sel = $select;
          }
          sel.empty();
          if (catalog.errorHint) {
            // Pending state: conditions not satisfied yet (e.g. no connection
            // selected on Send delivery). Placeholder instead of a fake list —
            // but it carries the saved name so a Done here never overwrites a
            // valid saved selection with empty (§6).
            sel.append($('<option></option>').val(prefer).text('(select a Connection)'));
            sel.val(prefer);
            sel.off('change.mavmsg').on('change.mavmsg', refreshFieldForm);
            refreshFieldForm();
            return;
          }
          (catalog.messages || []).forEach(function (m) {
            sel.append($('<option></option>').val(m.name).text(m.label));
          });
          if (prefer && !sel.find('option[value="' + prefer + '"]').length) {
            sel.append($('<option></option>').val(prefer).text(prefer + ' (missing)'));
          }
          if (prefer) sel.val(prefer);
          else if (catalog.messages && catalog.messages.length) sel.val(catalog.messages[0].name);
          sel.off('change.mavmsg').on('change.mavmsg', refreshFieldForm);
          refreshFieldForm();
        }

        function reloadCatalogs() {
          container.empty().append($('<div class="form-row"><em>Loading messages\u2026</em></div>'));
          loadMessagesCatalog(function (catalog) {
            buildMessageDropdown(catalog);
          });
        }

        $('#node-input-vehicle').on('change', function () {
          if ($tier.val() === 'build' && $('#node-input-dialect').val() === '__vehicle') {
            _msgCatalogByKey = {};
            _cmdCatalogByKey = {};
            reloadCatalogs();
          }
        });

        $('#node-input-connection').on('change', function () {
          if ($tier.val() !== 'build') {
            _msgCatalogByKey = {};
            _cmdCatalogByKey = {};
            reloadCatalogs();
          }
        });

        // Populate dialect picker from the server's bundled list; reload catalogs
        // once ready so the message dropdown uses the correct dialect from the start.
        var $dialect = $('#node-input-dialect');
        $dialect.on('change', function () {
          _msgCatalogByKey = {};
          _cmdCatalogByKey = {};
          updateVisibility();
          reloadCatalogs();
        });
        (function initDialectPicker() {
          var savedDialect = node.dialect || 'ardupilotmega';
          $.getJSON(RED.mavlink.adminApiUrl('/mavlink/dialects'), function (data) {
            $dialect.empty();
            (data.dialects || []).forEach(function (d) {
              $dialect.append($('<option>').val(d).text(d));
            });
            $dialect.append($('<option>').val('__vehicle').text('from Vehicle Profile\u2026'));
            $dialect.val(savedDialect);
            updateVisibility();
            reloadCatalogs();
          }).fail(function () {
            $dialect.empty();
            if (savedDialect !== '__vehicle') {
              $dialect.append($('<option>').val(savedDialect).text(savedDialect));
            }
            $dialect.append($('<option>').val('__vehicle').text('from Vehicle Profile\u2026'));
            $dialect.val(savedDialect);
            updateVisibility();
            reloadCatalogs();
          });
        }());
      },
      oneditsave: function () {
        var $root = $('#node-input-fields-container');
        // If catalogs never populated controls, keep the previously saved JSON.
        if (!$root.find('.mav-field-input').length) return;
        $('#node-input-fields').val(JSON.stringify(collectFieldInputsFromDom($root)));
      },
    });
  }());
</script>

<script type="text/html" data-help-name="mavlink-build">
  <p>Build a MAVLink message from any message in the loaded dialect.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">payload <span class="property-type">object</span></dt>
    <dd>Field value overrides merged on top of the node's configured defaults.
        Set to <code>false</code> to suppress the node silently.</dd>
    <dt class="optional">band <span class="property-type">number</span></dt>
    <dd>Queue band override (0–4).</dd>
    <dt class="optional">target <span class="property-type">object</span></dt>
    <dd><code>{ sysid, compid }</code> destination.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li><b>Continue</b>: on <b>Build</b> tier, carries
      <code>{ message: { name, fields }, messageName, tier }</code> — forward to
      <b>mavlink-out</b> or inspect/modify before sending.<br/>
      On <b>Send</b> tier, carries the original input message as a pass-through trigger.</li>
    <li><b>Status</b>: a status record on every terminal outcome.</li>
  </ol>
  <h3>Details</h3>
  <p><b>Message</b> is a dialect dropdown. Selecting a message reshapes the field
  form: enum-typed fields become dropdowns; scalars are number inputs; strings
  are text. <code>COMMAND_LONG</code> / <code>COMMAND_INT</code> use a MAV_CMD
  dropdown and that command's named params — never a Param 1–7 grid. Bitmask
  fields use native multi-selects; Ctrl/Cmd-click multiple flags.</p>
  <p><b>Dialect</b> (Build delivery): pick a bundled dialect from the dropdown.
  Choose <i>from Vehicle Profile…</i> to use a custom XML dialect; the Vehicle
  Profile field then appears. On wire deliveries the connection's profile
  governs, so the Dialect and Vehicle rows are hidden.</p>
  <p><b>Delivery</b>: <i>Build</i> encodes and emits without sending; no
  connection needed. <i>Send</i> enqueues directly on the Connection.</p>
  <p><b>Repeat</b>: when set, the node fires independently of inbound triggers at
  the configured interval. The status badge shows the achieved rate alongside the
  configured rate.</p>
</script>
