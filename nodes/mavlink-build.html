<script type="text/javascript">
  (function () {
    const TIER_OPTIONS = [
      { value: 'build', label: 'Build' },
      { value: 'send',  label: 'Send' },
    ];

    const COMMAND_MESSAGES = { COMMAND_LONG: true, COMMAND_INT: true };

    /** Messages / commands catalog request sequences (DESIGN.md §6 shared loadCatalog). */
    const _msgCatalog = { seq: 0 };
    const _cmdCatalog = { seq: 0 };
    /** Catalog the loader last handed this dialog — paint from this. */
    let _currentMsgCatalog = null;

    // Catalog source follows the shared role × tier matrix (DESIGN.md §6). The
    // Build node's tier field is `tier`; the dialect picker governs on Build,
    // the connection's bound Vehicle Profile on wire tiers. No silent default.
    function buildTierIsBuild() {
      return ($('#node-input-tier').val() || 'send') === 'build';
    }

    function loadMessagesCatalog(cb) {
      RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, cb, {
        isBuild: buildTierIsBuild(),
        listKey: 'messages'
      });
    }

    function loadCommandsCatalog(cb) {
      RED.mavlink.loadCatalog('/mavlink/command/commands', _cmdCatalog, cb, {
        isBuild: buildTierIsBuild(),
        listKey: 'commands'
      });
    }

    /** Collect typed values from live `.mav-field-input` controls (oneditsave + live sync). */
    function collectFieldInputsFromDom($root) {
      const fields = {};
      $root.find('.mav-field-input').each(function () {
        const name = $(this).attr('data-field');
        if (!name) return;
        const kind = $(this).attr('data-kind') || 'number';
        if (kind === 'boolean') {
          fields[name] = RED.mavlink.booleanEnumValue($(this));
          return;
        }
        const raw = $(this).val();
        if (kind === 'bitmask-mask') {
          // Nothing selected omits the field — the same shape as the blank
          // option on a scalar enum select.
          const mask = RED.mavlink.bitmaskFromSelection(raw);
          if (mask !== null) fields[name] = mask;
          return;
        }
        if (raw === '' || raw === null || raw === undefined) return;
        if (kind === 'array') {
          fields[name] = String(raw).split(/[,\s]+/).filter((p) => p !== '').map((p) => {
            const n = Number(p);
            return Number.isNaN(n) ? p : n;
          });
          return;
        }
        if (kind === 'int64' || kind === 'char') {
          fields[name] = String(raw);
          return;
        }
        if (kind === 'enum') {
          fields[name] = Number(raw);
          return;
        }
        const n = Number(raw);
        fields[name] = !Number.isNaN(n) ? n : raw;
      });
      return fields;
    }

    // Dialect + Vehicle validators are the shared Build-tier rule (§6); the
    // Build node's mode field is `tier`. Connection stays local because it is
    // required on wire tiers only — the inverse of the dialect rule.
    const buildDefaults = {
      name:        { value: '' },
        // A name this dialect cannot resolve — blank, or a name the catalog
        // does not carry — resolves no message metadata, so every input fails
        // with "dialect or message unresolved". Config validity is the
        // editor's verdict (§6), so this validator is the only thing between
        // that and a deployed node. Two args so the reason renders.
        //
        // The second case is normal use, not hand-edited JSON: switch an
        // existing node's dialect or Connection and fillEnumSelect keeps the
        // old name selectable as `#NAME (not in dialect)` so it survives
        // open-and-save (#198). Surviving is right; deploying is not.
        messageName: {
          value: 'HEARTBEAT',
          validate(v, _opt) {
            if (RED.mavlink.isBlank(v)) return 'is required — pick a message from the dialect';
            if (RED.mavlink.isMissingFromDialect(this, '#node-input-messageName', v)) {
              return 'is not in this dialect — pick a message the Connection speaks';
            }
            return true;
          },
        },
        fields:      {
          value: '{}',
          // Two args so a returned reason counts as invalid rather than being
          // coerced truthy (§14).
          validate(v, _opt) {
            if (RED.mavlink.isBlank(v)) return true;
            try {
              const parsed = JSON.parse(v);
              if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
                return 'must be a JSON object';
              }
            } catch {
              return 'is not valid JSON';
            }
            return true;
          },
        },
        // The vocabulary is TIER_OPTIONS, which also paints the select — one
        // list, so the red ring cannot drift from what the dialog offers.
        tier: {
          value: 'send',
          validate: RED.mavlink.oneOf(TIER_OPTIONS.map((o) => o.value)),
        },
        // The vocabulary is the shared BAND_OPTIONS list that paints the
        // select, so the ring cannot drift from what the dialog offers.
        band: {
          value: '2',
          validate: RED.mavlink.oneOf(RED.mavlink.BAND_OPTIONS.map((o) => o.value)),
        },
        // A typo here fails silently rather than loudly: Number('10OO') is NaN,
        // NaN > 0 is false, and the repeat timer simply never arms — the node
        // looks configured and does nothing. Blank is 0, which is the real
        // "off" value, so blank stays legal.
        repeatMs:    { value: 0, validate: RED.mavlink.validateAtLeast(0) },
      ...RED.mavlink.buildTierDialectDefaults({ modeField: 'tier' })
    };

    RED.nodes.registerType('mavlink-build', {
      category: 'mavlink',
      color: '#6ea6d7',
      defaults: buildDefaults,
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-wrench',
      paletteLabel: 'build',
      label() {
        return this.name || this.messageName || 'mavlink build';
      },
      labelStyle() {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare() {
        const node = this;
        const container = $('#node-input-fields-container');
        let savedFields = {};
        try { savedFields = JSON.parse(node.fields || '{}'); } catch (_e) { savedFields = {}; }
        /** Tracks MAV_CMD identity across param rebuilds; `undefined` = not initialized. */
        let lastBuildCommandId = undefined;
        const COMMAND_PARAM_KEYS = [
          'param1', 'param2', 'param3', 'param4', 'param5', 'param6', 'param7', 'x', 'y', 'z',
        ];

        function clearCommandParamWireFields() {
          COMMAND_PARAM_KEYS.forEach((key) => { delete savedFields[key]; });
        }

        RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');

        const $tier = $('#node-input-tier');
        $tier.empty();
        TIER_OPTIONS.forEach((opt) => {
          $('<option>').val(opt.value).text(opt.label).appendTo($tier);
        });
        $tier.val(node.tier || 'send');

        RED.mavlink.fillBandSelect(
          $('#node-input-band'),
          node.band !== undefined ? String(node.band) : '2'
        );

        function updateVisibility() {
          const dialectVal = $('#node-input-dialect').val() || node.dialect || '';
          RED.mavlink.applyBuildTierRowVisibility({
            isBuild: $tier.val() === 'build',
            dialect: dialectVal,
            dialectRow: '#mav-dialect-row',
            vehicleRow: '#mav-vehicle-row',
            connectionRow: '#mav-connection-row'
          });
        }
        $tier.on('change', () => {
          clearCatalogs();
          updateVisibility();
          reloadCatalogs();
        });
        updateVisibility();

        function formRow(label, control) {
          return RED.mavlink.formRow(label, control, { labelWidth: '140px' });
        }

        function fieldLabel(spec) {
          let label = spec.name || 'field';
          if (spec.units) label += ` (${spec.units})`;
          return label;
        }

        function isCharArray(spec) {
          return spec.type === 'char' || (String(spec.type || '').indexOf('char') === 0);
        }

        function isInt64(spec) {
          return spec.type === 'int64_t' || spec.type === 'uint64_t';
        }

        function isCommandParamSlot(name) {
          return /^param[1-7]$/.test(name);
        }

        /** COMMAND_INT carries location in x/y/z, not param5–7. */
        function wireFieldForCommandParam(msgName, index) {
          if (msgName === 'COMMAND_INT' && index >= 5 && index <= 7) {
            return ['x', 'y', 'z'][index - 5];
          }
          return `param${index}`;
        }

        function fieldInput(spec, enums) {
          const saved = savedFields[spec.name];
          // §6: CompID dropdown. XML leaves target_component without enum= —
          // use the shared reloadCompIdSelect (same helper as Command/Payload/…).
          if (spec.name === 'target_component') {
            const $comp = $('<select class="mav-field-input"></select>')
              .attr('data-field', spec.name)
              .attr('data-kind', 'enum')
              .attr('title', spec.description || '');
            RED.mavlink.reloadCompIdSelect($comp, {
              initialSaved: saved,
              emptyLabel: '\u2014',
            });
            return $comp;
          }
          if (spec.enum && enums[spec.enum] && enums[spec.enum].length) {
            const entries = enums[spec.enum];
            const falseTrue = RED.mavlink.isFalseTrueEnum(entries);
            if (falseTrue) {
              return RED.mavlink.booleanEnumInput(entries, {
                saved,
                title: spec.description || '',
                className: 'mav-field-input',
              }).attr('data-field', spec.name);
            }
            // Options carry the wire value, so Done saves the number
            // mavlink-in emits and pymavlink accepts.
            const multi = spec.display === 'bitmask';
            const sel = $('<select class="mav-field-input"></select>')
              .attr('data-field', spec.name)
              .attr('data-kind', multi ? 'bitmask-mask' : 'enum')
              .attr('title', multi ? RED.mavlink.bitmaskTitle(spec.description) : (spec.description || ''));
            if (multi) sel.attr('multiple', 'multiple').attr('size', Math.min(6, entries.length));
            else sel.append($('<option></option>').val('').text('\u2014'));
            entries.forEach((entry) => {
              const $opt = $('<option></option>').val(String(entry.value)).text(entry.label);
              if (entry.description) $opt.attr('title', entry.description);
              sel.append($opt);
            });
            if (multi) {
              sel.val(RED.mavlink.selectedBitmaskValues(saved, entries));
            } else if (saved !== undefined && saved !== null && saved !== '') {
              const match = entries.find((e) => String(e.value) === String(saved));
              if (match) {
                sel.val(String(match.value));
              } else {
                // A saved value the table lacks — a dialect switch, a newer
                // firmware's entry — must survive open-and-save, not silently
                // deselect and drop the field on Done (Codex #198).
                RED.mavlink.ensureSavedEnumOption(sel, String(saved));
                sel.val(String(saved));
              }
            }
            return sel;
          }
          if (isCharArray(spec)) {
            return $('<input type="text" class="mav-field-input">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'char')
              .attr('title', spec.description || '')
              .attr('maxlength', spec.arrayLength || undefined)
              .val(saved !== undefined && saved !== null ? saved : '');
          }
          if (spec.arrayLength) {
            const arrVal = Array.isArray(saved) ? saved.join(', ') : (saved !== undefined && saved !== null ? saved : '');
            return $('<input type="text" class="mav-field-input" style="width:70%">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'array')
              .attr('title', `${spec.description || ''} (comma-separated, length ${spec.arrayLength})`)
              .attr('placeholder', 'e.g. 0, 0, 0')
              .val(arrVal);
          }
          if (isInt64(spec)) {
            return $('<input type="text" class="mav-field-input">')
              .attr('data-field', spec.name)
              .attr('data-kind', 'int64')
              .attr('title', spec.description || '64-bit decimal string')
              .val(saved !== undefined && saved !== null ? String(saved) : '');
          }
          const input = $('<input type="number" class="mav-field-input">')
            .attr('data-field', spec.name)
            .attr('data-kind', 'number')
            .attr('title', spec.description || '')
            .val(saved !== undefined && saved !== null ? saved : '');
          if (spec.minValue !== null && spec.minValue !== undefined) input.attr('min', spec.minValue);
          if (spec.maxValue !== null && spec.maxValue !== undefined) input.attr('max', spec.maxValue);
          if (spec.increment !== null && spec.increment !== undefined) input.attr('step', spec.increment);
          return input;
        }

        /**
         * Merge live edits into savedFields before rebuilding controls so a MAV_CMD
         * (or message) change does not discard in-session parameter values.
         */
        function syncSavedFieldsFromDom() {
          const $root = $('#node-input-fields-container');
          if (!$root.find('.mav-field-input').length) return;
          const live = collectFieldInputsFromDom($root);
          // Empty controls are omitted from `live` (save semantics). Delete those
          // keys from the working snapshot so a rebuild does not restore them.
          $root.find('.mav-field-input').each(function () {
            const name = $(this).attr('data-field');
            if (!name) return;
            if (Object.prototype.hasOwnProperty.call(live, name)) {
              savedFields[name] = live[name];
            } else {
              delete savedFields[name];
            }
          });
        }

        function commandParamInput(msgName, spec, enums) {
          const key = wireFieldForCommandParam(msgName, spec.index);
          let saved = savedFields[key];
          // Switching the carrier message COMMAND_LONG → COMMAND_INT for the same
          // MAV_CMD resets lastBuildCommandId, so the param wipe is skipped and the
          // just-synced param5–7 are still the live values for x/y/z. Both forms hold
          // degrees here (the INT build scales), so the number carries across as-is.
          if ((saved === undefined || saved === null || saved === '') && msgName === 'COMMAND_INT' && spec.index >= 5) {
            saved = savedFields[`param${spec.index}`];
          }
          // The control ladder (checkbox / pulldown / bitmask / magic boolean /
          // number, with the #198 saved-value sentinel) is the shared builder;
          // Build contributes its collector attributes and the mask fold.
          return RED.mavlink.paramControl(spec, enums, {
            saved,
            className: 'mav-field-input',
            attrName: 'data-field',
            attrValue: key,
            bitmaskKind: 'bitmask-mask',
            commandId: $('#mav-build-command-select').val(),
          });
        }

        function refreshCommandParams(msgName, cmdCatalog) {
          syncSavedFieldsFromDom();
          const $slot = $('#mav-command-params');
          $slot.empty();
          if (!cmdCatalog) {
            $slot.append($('<div class="form-row"><em>Loading command parameters\u2026</em></div>'));
            return;
          }
          const cmdId = $('#mav-build-command-select').val() || '';
          // Same command rebuild keeps live edits; a different MAV_CMD must not
          // inherit paramN/x/y/z values that mean something else on the new command.
          if (lastBuildCommandId !== undefined && String(lastBuildCommandId) !== String(cmdId)) {
            clearCommandParamWireFields();
          }
          lastBuildCommandId = cmdId;
          if (!cmdId) {
            $slot.append($('<div class="form-row"><em>Select a MAV_CMD to configure parameters.</em></div>'));
            return;
          }
          const cmd = (cmdCatalog.commands || []).find((c) => String(c.value) === String(cmdId));
          if (!cmd) {
            $slot.append($('<div class="form-row"><em>Command not in this dialect.</em></div>'));
            return;
          }
          const visible = (cmd.params || []).filter((p) => !p.hidden);
          if (!visible.length) {
            $slot.append($('<div class="form-row"><em>No exposed parameters for this command.</em></div>'));
            return;
          }
          visible.forEach((spec) => {
            let label = spec.label || spec.description || (`param ${spec.index}`);
            if (spec.units) label += ` (${spec.units})`;
            $slot.append(formRow(label, commandParamInput(msgName, spec, cmdCatalog.enums || {})));
          });
        }

        function refreshFieldForm() {
          syncSavedFieldsFromDom();
          container.empty();
          const catalog = _currentMsgCatalog;
          const msgName = $('#node-input-messageName').val();
          if (!catalog) {
            container.append($('<div class="form-row"><em>Loading message fields\u2026</em></div>'));
            return;
          }
          // Catalog empty/failed: leave Fields blank. Missing Connection /
          // Vehicle Profile already reds the node via defaults.validate —
          // a second prose error adds nothing (§2 / AGENTS.md).
          const msg = (catalog.messages || []).find((m) => m.name === msgName);
          if (!msg) return;

          if (COMMAND_MESSAGES[msg.name]) {
            // COMMAND_LONG / COMMAND_INT: named command params, never Param 1–7 (§6).
            // COMMAND_INT location lives in x/y/z — hide those raw slots too.
            lastBuildCommandId = undefined;
            (msg.fields || []).forEach((spec) => {
              if (isCommandParamSlot(spec.name) || spec.name === 'command') return;
              if (msg.name === 'COMMAND_INT' && (spec.name === 'x' || spec.name === 'y' || spec.name === 'z')) return;
              container.append(formRow(fieldLabel(spec), fieldInput(spec, catalog.enums || {})));
            });
            const cmdSel = $('<select id="mav-build-command-select" class="mav-field-input"></select>')
              .attr('data-field', 'command')
              .attr('data-kind', 'number');
            // The search box is not a field: no .mav-field-input, so the
            // collector never scrapes it; the select stays the saved value.
            const cmdSearch = $('<input type="text" id="mav-build-command-search" placeholder="type a name or number">');
            container.append(formRow('command (MAV_CMD)', $('<div></div>').append(cmdSearch, cmdSel)));
            container.append($('<div id="mav-command-params"></div>'));
            loadCommandsCatalog((cmdCatalog) => {
              const commands = cmdCatalog.commands || [];
              const savedCmd = savedFields.command;
              let prefer = '';
              if (savedCmd !== undefined && savedCmd !== null && savedCmd !== '') {
                prefer = String(savedCmd);
              } else if (commands.length) {
                // Prefer ARM if present, else first command — never leave blank.
                const arm = commands.find((c) => c.value === 400);
                prefer = String((arm || commands[0]).value);
              }
              // Drop the placeholder empty option — fillEnumSelect rebuilds the list.
              RED.mavlink.fillEnumSelect(cmdSel, commands, {
                saved: prefer,
                titleNamespace: 'mavcmd',
                triggerChange: false
              });
              cmdSel.off('change.mavcmdParams').on('change.mavcmdParams', () => {
                refreshCommandParams(msg.name, cmdCatalog);
              });
              RED.mavlink.mountEnumSearch(cmdSearch, cmdSel, { prefix: 'MAV_CMD_' }).setEntries(commands);
              refreshCommandParams(msg.name, cmdCatalog);
            });
            return;
          }

          const fields = msg.fields || [];
          if (!fields.length) {
            container.append($('<div class="form-row"><em>No fields for this message.</em></div>'));
            return;
          }
          fields.forEach((spec) => {
            container.append(formRow(fieldLabel(spec), fieldInput(spec, catalog.enums || {})));
          });
        }

        // Type a message by name or id; the select stays the saved property
        // (RED.mavlink.mountEnumSearch explains the shape).
        const messageSearch = RED.mavlink.mountEnumSearch(
          $('#mav-build-msg-search'), $('#node-input-messageName'), { valueKey: 'name', numberKey: 'id' }
        );

        function buildMessageDropdown(catalog) {
          _currentMsgCatalog = catalog;
          const sel = $('#node-input-messageName');
          const prefer = sel.val() || node.messageName || 'HEARTBEAT';
          // Tip sync and the field-form rebuild must use different change
          // namespaces — fillEnumSelect's bindSelectTitleSync does
          // off('change.' + ns), which would erase the renderer if both used
          // mavmsg.
          RED.mavlink.fillEnumSelect(sel, catalog.messages || [], {
            saved: prefer,
            valueKey: 'name',
            titleNamespace: 'mavmsgTip',
            triggerChange: false
          });
          sel.off('change.mavmsgForm').on('change.mavmsgForm', refreshFieldForm);
          messageSearch.setEntries(catalog.messages || []);
          refreshFieldForm();
        }

        function reloadCatalogs() {
          _currentMsgCatalog = null;
          container.empty().append($('<div class="form-row"><em>Loading messages\u2026</em></div>'));
          loadMessagesCatalog((catalog) => {
            buildMessageDropdown(catalog);
          });
        }

        function clearCatalogs() {
          _currentMsgCatalog = null;
        }

        $('#node-input-vehicle').on('change', () => {
          if ($tier.val() === 'build' && $('#node-input-dialect').val() === '__vehicle') {
            clearCatalogs();
            reloadCatalogs();
          }
        });

        $('#node-input-connection').on('change', () => {
          if ($tier.val() !== 'build') {
            clearCatalogs();
            reloadCatalogs();
          }
        });

        // Shared helper keeps an empty unsaved dialect selected until the Build
        // validator accepts a concrete dialect or the Vehicle Profile escape.
        const $dialect = $('#node-input-dialect');
        $dialect.on('change', () => {
          clearCatalogs();
          updateVisibility();
          reloadCatalogs();
        });
        RED.mavlink.populateDialectSelect($dialect, { saved: node.dialect || '' });
      },
      oneditsave() {
        const $root = $('#node-input-fields-container');
        // If catalogs never populated controls, keep the previously saved JSON.
        if (!$root.find('.mav-field-input').length) return;
        $('#node-input-fields').val(JSON.stringify(collectFieldInputsFromDom($root)));
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-build">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row" id="mav-dialect-row">
    <label for="node-input-dialect"><i class="fa fa-list"></i> Dialect</label>
    <select id="node-input-dialect" style="width:70%"></select>
  </div>
  <div class="form-row" id="mav-vehicle-row">
    <label for="node-input-vehicle"><i class="fa fa-plane"></i> Vehicle</label>
    <input type="text" id="node-input-vehicle">
  </div>
  <div class="form-row" id="mav-connection-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <hr/>
  <div class="form-row">
    <label for="mav-build-msg-search"><i class="fa fa-envelope"></i> Message</label>
    <input type="text" id="mav-build-msg-search" placeholder="type a name or number" style="width:70%">
    <!-- The select is the saved property; the search box above only drives it,
         so nothing outside the dialect's list can reach messageName. -->
    <div style="margin-left:104px; margin-top:4px">
      <select id="node-input-messageName" style="width:70%"></select>
    </div>
  </div>
  <div class="form-row">
    <label style="width:140px;font-weight:bold">Fields</label>
  </div>
  <div id="node-input-fields-container"></div>
  <input type="hidden" id="node-input-fields">
  <hr/>
  <div class="form-row">
    <label for="node-input-tier"><i class="fa fa-send"></i> Delivery</label>
    <select id="node-input-tier" style="width:150px"></select>
  </div>
  <div class="form-row">
    <label for="node-input-band"><i class="fa fa-sort-amount-asc"></i> Band</label>
    <select id="node-input-band" style="width:200px"></select>
  </div>
  <div class="form-row">
    <label for="node-input-repeatMs"><i class="fa fa-refresh"></i> Repeat</label>
    <input type="number" id="node-input-repeatMs" placeholder="0" min="0" step="100" style="width:80px">
    <span> ms (0 = off)</span>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-build">
  <p>Build a MAVLink message from any message in the loaded dialect.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">payload <span class="property-type">object</span></dt>
    <dd>Field value overrides merged on top of the node's configured defaults,
        keyed by wire field name. Values are raw wire values — the numbers
        <b>mavlink-in</b> emits and pymavlink accepts: an enum field takes the
        entry's number, a bitmask field one mask number, a 64-bit field a
        decimal string. Set to <code>false</code> to suppress the node silently.</dd>
    <dt class="optional">band <span class="property-type">number</span></dt>
    <dd>Queue band override (0–4).</dd>
    <dt class="optional">target <span class="property-type">object</span></dt>
    <dd><code>{ sysid, compid }</code> destination.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li><b>Continue</b>: on <b>Build</b> tier, carries
      <code>{ message: { name, fields }, messageName, tier }</code> — forward to
      <b>mavlink-out</b> or inspect/modify before sending.<br/>
      On <b>Send</b> tier, carries the original input message as a pass-through trigger.</li>
    <li><b>Status</b>: a status record on every terminal outcome.</li>
  </ol>
  <h3>Details</h3>
  <p><b>Message</b> is a dialect dropdown. Selecting a message reshapes the field
  form: enum-typed fields become dropdowns; scalars are number inputs; strings
  are text. <code>COMMAND_LONG</code> / <code>COMMAND_INT</code> use a MAV_CMD
  dropdown and that command's named params — never a Param 1–7 grid. Bitmask
  fields use native multi-selects; Ctrl/Cmd-click multiple flags. Every field
  saves as its wire number; the blank option leaves a field out.</p>
  <p><b>Dialect</b> (Build delivery): pick a bundled dialect from the dropdown.
  Choose <i>from Vehicle Profile…</i> to use a custom XML dialect; the Vehicle
  Profile field then appears. On wire deliveries the connection's profile
  governs, so the Dialect and Vehicle rows are hidden.</p>
  <p><b>Delivery</b>: <i>Build</i> emits the merged message without sending; no
  connection needed. <i>Send</i> enqueues directly on the Connection.</p>
  <p><b>Repeat</b>: when set, the node fires independently of inbound triggers at
  the configured interval. The status badge shows the achieved rate alongside the
  configured rate.</p>
</script>
