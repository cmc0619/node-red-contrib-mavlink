<!-- mavlink-command editor dialog (DESIGN.md §3, §6, §9) -->
<script type="text/javascript">
(function () {
  'use strict';

  /**
   * Helper: create a labelled form row.
   * @param {string} label
   * @param {HTMLElement} input
   * @returns {HTMLElement}
   */
  function formRow(label, input) {
    const row = $('<div class="form-row"></div>');
    const tip = (input && input.attr) ? (input.attr('title') || '') : '';
    const lbl = $('<label></label>').css({ width: '120px', display: 'inline-block' }).text(label);
    if (tip) lbl.attr('title', tip);
    row.append(lbl).append(input);
    return row;
  }

  /**
   * Delivery options filtered by what the selected command supports.
   * @param {boolean} hasConnection  whether a connection is configured
   * @param {boolean} hasCompletion  whether the command has a completion condition
   * @returns {Array<{value: string, label: string}>}
   */
  function deliveryOptions(hasConnection, hasCompletion) {
    const opts = [{ value: 'build', label: 'Build' }];
    if (hasConnection) {
      opts.push({ value: 'send', label: 'Send' });
      opts.push({ value: 'confirm', label: 'Send & confirm' });
      if (hasCompletion) {
        opts.push({ value: 'complete', label: 'Send & await completion' });
      }
    }
    return opts;
  }

  // ── Preset / command caches loaded from server ─────────────────────────────
  let _presetGroups = null;
  /** @type {Object<string, {commands:Array, enums:Object, dialect:string}>} */
  const _catalogByKey = {};
  /** In-flight waiters per catalog key (coalesce concurrent loads). */
  const _catalogInflight = {};
  /** Monotonic token bumped on every load (callers / tests observe churn). */
  let _catalogRequestSeq = 0;
  /** Cache key for the catalog currently shown in the Advanced dropdown. */
  let _activeCatalogKey = '';
  /** @type {Object<string, {messages:Array, enums:Object, dialect:string, error?:string}>} */
  const _messageCatalogByKey = {};
  let _messageRequestSeq = 0;

  function emptyCatalogTarget() {
    return { key: 'empty', query: null, dialect: '', vehicleId: '' };
  }

  function loadPresets(cb) {
    if (_presetGroups) { cb(_presetGroups); return; }
    $.getJSON(RED.mavlink.adminApiUrl('/mavlink/command/presets'), function (data) {
      _presetGroups = data.groups || [];
      cb(_presetGroups);
    }).fail(function () {
      _presetGroups = [];
      cb(_presetGroups);
    });
  }

  /**
   * Resolve which Vehicle / dialect the Advanced list and enum catalogs should
   * load, respecting the role × tier matrix (DESIGN.md §6):
   *   - Build tier: the Dialect picker governs; Vehicle Profile is used only
   *     when the picker is set to the explicit `from Vehicle Profile…` escape.
   *   - Wire tiers: the bound Connection's profile governs.
   *
   * @returns {{key: string, query: object, dialect: string, vehicleId: string}}
   */
  function resolveCatalogTarget() {
    const tier = $('#node-input-delivery').val() || 'confirm';
    const isBuild = tier === 'build';

    if (isBuild) {
      // Build tier: use the dialect picker unless the Vehicle Profile escape is selected.
      const dialectVal = $('#node-input-dialect').val() || '';
      if (!dialectVal) return emptyCatalogTarget();
      if (dialectVal !== '__vehicle') {
        return {
          key: 'dialect:' + dialectVal,
          query: { dialect: dialectVal },
          dialect: dialectVal,
          vehicleId: '',
        };
      }
      const vehicleId = $('#node-input-vehicle').val() || '';
      let vehicleDialect = '';
      if (vehicleId && RED.nodes && RED.nodes.node) {
        const vehicle = RED.nodes.node(vehicleId);
        if (vehicle && vehicle.dialect) vehicleDialect = vehicle.dialect;
      }
      if (vehicleId) {
        return {
          key: 'vehicle:' + vehicleId,
          query: { vehicle: vehicleId, dialect: vehicleDialect },
          dialect: vehicleDialect,
          vehicleId: vehicleId,
        };
      }
      return emptyCatalogTarget();
    }

    // Wire tiers: catalog source is the connection's bound vehicle profile.
    const connId = $('#node-input-connection').val();
    if (connId && RED.nodes && RED.nodes.node) {
      const conn = RED.nodes.node(connId);
      const vehicleRef = RED.mavlink.vehicleIdFrom(conn && conn.vehicle);
      if (vehicleRef) {
        const vehicle = RED.nodes.node(vehicleRef);
        const dialect = vehicle && vehicle.dialect ? vehicle.dialect : '';
        return {
          key: 'vehicle:' + vehicleRef,
          query: { vehicle: vehicleRef, dialect: dialect },
          dialect: dialect,
          vehicleId: vehicleRef,
        };
      }
    }
    return emptyCatalogTarget();
  }

  /**
   * Load the Advanced catalog (commands + enums). Concurrent callers for the
   * same target share one in-flight request (Greptile #36 — preset change must
   * not cancel a pending Connection/Vehicle tip repaint). Responses for a key
   * the editor no longer targets are dropped.
   *
   * @param {function({commands:Array, enums:Object, dialect:string}|null, Error=):void} cb
   */
  function loadCommandsCatalog(cb) {
    const target = resolveCatalogTarget();
    const requestedKey = target.key;
    ++_catalogRequestSeq;
    if (_catalogByKey[requestedKey]) {
      _activeCatalogKey = requestedKey;
      cb(_catalogByKey[requestedKey]);
      return;
    }
    if (!target.query) {
      const emptyCatalog = { commands: [], enums: {}, dialect: '' };
      _catalogByKey[requestedKey] = emptyCatalog;
      _activeCatalogKey = requestedKey;
      cb(emptyCatalog);
      return;
    }
    if (!_catalogInflight[requestedKey]) {
      _catalogInflight[requestedKey] = [];
      $.getJSON(RED.mavlink.adminApiUrl('/mavlink/command/commands'), target.query, function (data) {
        const waiters = _catalogInflight[requestedKey] || [];
        delete _catalogInflight[requestedKey];
        const catalog = {
          commands: data.commands || [],
          enums: data.enums || {},
          dialect: data.dialect || target.dialect,
        };
        _catalogByKey[requestedKey] = catalog;
        if (resolveCatalogTarget().key !== requestedKey) return;
        _activeCatalogKey = requestedKey;
        for (let i = 0; i < waiters.length; i++) waiters[i](catalog);
      }).fail(function (_xhr, _status, err) {
        const waiters = _catalogInflight[requestedKey] || [];
        delete _catalogInflight[requestedKey];
        if (resolveCatalogTarget().key !== requestedKey) return;
        _activeCatalogKey = requestedKey;
        const empty = {
          commands: [],
          enums: {},
          dialect: target.dialect,
          error: String(err || 'load failed'),
        };
        for (let i = 0; i < waiters.length; i++) waiters[i](empty);
      });
    }
    _catalogInflight[requestedKey].push(cb);
  }

  function loadMessagesCatalog(cb) {
    const target = resolveCatalogTarget();
    if (_messageCatalogByKey[target.key]) {
      cb(_messageCatalogByKey[target.key]);
      return;
    }
    if (!target.query) {
      const emptyCatalog = { messages: [], enums: {}, dialect: '' };
      _messageCatalogByKey[target.key] = emptyCatalog;
      cb(emptyCatalog);
      return;
    }
    const seq = ++_messageRequestSeq;
    $.getJSON(RED.mavlink.adminApiUrl('/mavlink/build/messages'), target.query, function (data) {
      if (seq !== _messageRequestSeq) return;
      const catalog = {
        messages: data.messages || [],
        enums: data.enums || {},
        dialect: data.dialect || target.dialect,
      };
      _messageCatalogByKey[target.key] = catalog;
      cb(catalog);
    }).fail(function (_xhr, _status, err) {
      if (seq !== _messageRequestSeq) return;
      cb({ messages: [], enums: {}, dialect: target.dialect, error: String(err || 'load failed') });
    });
  }

  // Hard-coded preset param shapes for offline rendering.
  // Keyed by preset id; each entry is an array of { index, label, units, enumName }.
  // This table covers the presets defined in lib/command/presets.js.
  const REBOOT_SHUTDOWN_ACTION_OPTIONS = [
    { name: 'REBOOT_SHUTDOWN_ACTION_NONE', value: 0, label: 'REBOOT_SHUTDOWN_ACTION_NONE (0)' },
    { name: 'REBOOT_SHUTDOWN_ACTION_REBOOT', value: 1, label: 'REBOOT_SHUTDOWN_ACTION_REBOOT (1)' },
    { name: 'REBOOT_SHUTDOWN_ACTION_SHUTDOWN', value: 2, label: 'REBOOT_SHUTDOWN_ACTION_SHUTDOWN (2)' },
    { name: 'REBOOT_SHUTDOWN_ACTION_REBOOT_TO_BOOTLOADER', value: 3, label: 'REBOOT_SHUTDOWN_ACTION_REBOOT_TO_BOOTLOADER (3)' },
    { name: 'REBOOT_SHUTDOWN_ACTION_POWER_ON', value: 4, label: 'REBOOT_SHUTDOWN_ACTION_POWER_ON (4)' },
  ];

  const PRESET_PARAMS = {
    arm:           [{ index: 2, label: 'Force (0 or 21196)', units: '' }],
    disarm:        [{ index: 2, label: 'Force (0 or 21196)', units: '' }],
    set_mode:      [{ index: 1, label: 'Mode (base_mode)', units: '', enumName: 'MAV_MODE' },
                    { index: 2, label: 'Custom mode', units: '' }],
    takeoff:       [{ index: 1, label: 'Min pitch', units: 'deg' },
                    { index: 7, label: 'Altitude', units: 'm' }],
    land:          [{ index: 1, label: 'Abort altitude', units: 'm' },
                    { index: 5, label: 'Latitude', units: 'degE7' },
                    { index: 6, label: 'Longitude', units: 'degE7' },
                    { index: 7, label: 'Altitude', units: 'm' }],
    rtl:           [],
    set_home:      [{ index: 1, label: 'Use current (1 = yes)', units: '' },
                    { index: 5, label: 'Latitude', units: 'degE7' },
                    { index: 6, label: 'Longitude', units: 'degE7' },
                    { index: 7, label: 'Altitude', units: 'm' }],
    reposition:    [{ index: 1, label: 'Speed', units: 'm/s' },
                    { index: 2, label: 'Bitmask / flags', units: '', enumName: 'MAV_DO_REPOSITION_FLAGS', bitmask: true },
                    { index: 3, label: 'Loiter radius', units: 'm' },
                    { index: 4, label: 'Yaw', units: 'deg' },
                    { index: 5, label: 'Latitude', units: 'degE7' },
                    { index: 6, label: 'Longitude', units: 'degE7' },
                    { index: 7, label: 'Altitude', units: 'm' }],
    change_speed:  [{ index: 1, label: 'Speed type', units: '', enumName: 'SPEED_TYPE' },
                    { index: 2, label: 'Speed', units: 'm/s' },
                    { index: 3, label: 'Throttle', units: '%' }],
    yaw:           [{ index: 1, label: 'Angle', units: 'deg' },
                    { index: 2, label: 'Angular speed', units: 'deg/s' },
                    { index: 3, label: 'Direction (-1=CCW 0=CW)', units: '' }],
    rotate:        [{ index: 1, label: 'Angle', units: 'deg' },
                    { index: 2, label: 'Angular speed', units: 'deg/s' },
                    { index: 3, label: 'Direction (-1=CCW 0=CW)', units: '' }],
    orbit:         [{ index: 1, label: 'Radius', units: 'm' },
                    { index: 2, label: 'Velocity', units: 'm/s' },
                    { index: 3, label: 'Yaw behavior', units: '', enumName: 'ORBIT_YAW_BEHAVIOUR' },
                    { index: 5, label: 'Latitude', units: 'degE7' },
                    { index: 6, label: 'Longitude', units: 'degE7' },
                    { index: 7, label: 'Altitude', units: 'm' }],
    mission_start: [{ index: 1, label: 'First item', units: '' },
                    { index: 2, label: 'Last item', units: '' }],
    pause:         [],
    resume:        [],
    request_message:    [{ index: 1, label: 'Message ID', units: '', messages: true },
                         { index: 2, label: 'Response target', units: '' }],
    set_message_interval: [{ index: 1, label: 'Message ID', units: '', messages: true },
                            { index: 2, label: 'Interval', units: 'µs' },
                            { index: 3, label: 'Response target', units: '' }],
    stop_message_interval: [{ index: 1, label: 'Message ID', units: '', messages: true }],
    reboot_autopilot: [{ index: 1, label: 'Autopilot action', units: '', enumName: 'REBOOT_SHUTDOWN_ACTION', fallbackOptions: REBOOT_SHUTDOWN_ACTION_OPTIONS },
                       { index: 2, label: 'Companion action', units: '', enumName: 'REBOOT_SHUTDOWN_ACTION', fallbackOptions: REBOOT_SHUTDOWN_ACTION_OPTIONS }],
    flight_termination: [{ index: 1, label: 'Terminate (1=yes)', units: '' }],
  };

  const PRESET_ENUM_NAMES = Array.from(new Set(
    Object.values(PRESET_PARAMS)
      .flat()
      .map((spec) => spec.enumName)
      .filter(Boolean)
  ));

  // Presets with completion conditions — determines if "await completion" is shown.
  const HAS_COMPLETION = new Set(['arm', 'disarm', 'takeoff', 'land', 'rtl', 'set_mode']);
  // Safety presets that require msg.confirmed.
  const REQUIRES_CONFIRM = new Set(['flight_termination']);

  RED.nodes.registerType('mavlink-command', {
    category: 'mavlink',
    color: '#4a90d9',
    defaults: {
      name:              { value: '' },
      mode:              { value: 'preset' },
      preset:            { value: 'arm' },
      advancedCommand:   { value: '' },
      delivery:          { value: 'confirm' },
      dialect:           {
        value: '',
        validate: function (v) {
          const $d = $('#node-input-delivery');
          const tier = ($d && $d.length) ? $d.val() : (this.delivery || 'confirm');
          if (tier === 'build') return !!v;
          return true;
        },
      },
      vehicle:           {
        value: '',
        type: 'mavlink-vehicle',
        required: false,
        validate: function (v) {
          const $d = $('#node-input-delivery');
          const tier = ($d && $d.length) ? $d.val() : (this.delivery || 'confirm');
          const $dialect = $('#node-input-dialect');
          const dialect = ($dialect && $dialect.length && $dialect.val()) ? $dialect.val() : (this.dialect || '');
          if (tier === 'build' && dialect === '__vehicle') return !!v;
          return true;
        },
      },
      connection:        { value: '', type: 'mavlink-connection', required: false },
      identity:          { value: '' },
      targetSysid:       { value: '', validate: RED.mavlink.validateUint8(0) },
      targetCompid:      { value: '' },
      timeout:           { value: '10000' },
      maxRetries:        { value: '3' },
      unconfirmedContinue: { value: false },
      completionTimeout: { value: '60000' },
      params:            { value: '{}' },
    },
    inputs:  1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-rocket',
    paletteLabel: 'command',
    label: function () {
      if (this.name) return this.name;
      if (this.mode === 'advanced') {
        const id = this.advancedCommand;
        return id !== undefined && id !== null && id !== '' ? `cmd ${id}` : 'command';
      }
      return this.preset || 'command';
    },

    oneditprepare: function () {
      const node = this;
      const container = $('#node-input-params-container');

      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      }

      // ── Identity (send-as) select ──────────────────────────────────────────
      function refreshIdentitySelect() {
        if (!(RED.mavlink && RED.mavlink.fillIdentitySelect)) return;
        const connId = $('#node-input-connection').val();
        RED.mavlink.fillIdentitySelect($('#node-input-identity'), connId, { saved: node.identity });
      }

      // ── Role × tier visibility matrix (DESIGN.md §6) ──────────────────────
      function refreshVisibility() {
        const tier = $('#node-input-delivery').val() || 'confirm';
        const isBuild = tier === 'build';
        const dialectVal = $('#node-input-dialect').val() || node.dialect || '';

        // Build tier: show dialect row; Vehicle Profile appears only for __vehicle.
        $('#row-cmd-dialect')[isBuild ? 'show' : 'hide']();
        $('#row-cmd-vehicle')[isBuild && dialectVal === '__vehicle' ? 'show' : 'hide']();
        $('#row-cmd-connection')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-identity')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-timeout')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-maxRetries')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-unconfirmedContinue')[isBuild ? 'hide' : 'show']();

        if (!isBuild) {
          // Wire tiers: companion identity → target sysid/compid are derived, hide them.
          const identityId = $('#node-input-identity').val();
          const role = RED.mavlink && RED.mavlink.identityRole
            ? RED.mavlink.identityRole(identityId)
            : 'gcs';
          const isCompanion = role === 'companion';
          $('#row-cmd-target')[isCompanion ? 'hide' : 'show']();
        } else {
          // Build tier always shows the target rows (must stamp targets).
          $('#row-cmd-target').show();
        }
      }

      $('#node-input-identity').on('change', refreshVisibility);

      function reloadTargetCompId() {
        if (!(RED.mavlink && RED.mavlink.loadEnumsCatalog)) return;
        const seq = ++compIdRequestSeq;
        const saved = $('#node-input-targetCompid').val() || node.targetCompid;
        RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
          if (seq !== compIdRequestSeq) return;
          RED.mavlink.fillCompIdSelect(
            $('#node-input-targetCompid'),
            ((catalog || {}).enums || {}).MAV_COMPONENT || [],
            { allowEmpty: true, emptyLabel: '(profile default)', saved: saved }
          );
        });
      }
      let compIdRequestSeq = 0;
      reloadTargetCompId();

      // ── Mode toggle ────────────────────────────────────────────────────────
      function applyMode(mode) {
        if (mode === 'advanced') {
          $('#row-preset').hide();
          $('#row-advanced').show();
          refreshAdvancedCommands();
        } else {
          $('#row-preset').show();
          $('#row-advanced').hide();
        }
        refreshParamFields();
        refreshDelivery();
      }

      $('#node-input-mode').on('change', function () {
        applyMode($(this).val());
      });

      // ── Preset dropdown ────────────────────────────────────────────────────
      function buildPresetDropdown(groups) {
        const sel = $('#node-input-preset').empty();
        for (const g of groups) {
          const og = $('<optgroup></optgroup>').attr('label', g.group.charAt(0).toUpperCase() + g.group.slice(1));
          for (const p of g.presets) {
            const opt = $('<option></option>').val(p.id).text(`${p.name} (${p.commandId})`);
            og.append(opt);
          }
          sel.append(og);
        }
        // Re-apply the saved selection now that the options exist, then fire a
        // change so the param fields, delivery tiers, and safety notice render
        // for the saved preset. loadPresets is async on first open, so this
        // callback runs after the initial applyMode() left the dialog empty —
        // without this the exposed params stay stale until the user re-picks.
        sel.val(node.preset || 'arm');
        applyPresetOptionTips(sel);
        sel.trigger('change');
      }

      /**
       * Dialect-sourced titles on preset <option>s and the select.
       *
       * @param {JQuery} [$sel]
       * @param {{commands?: Array}|null} [catalog]  when provided, paint only
       *   (no second loadCommandsCatalog — avoids racing refreshParamFields).
       */
      function applyPresetOptionTips($sel, catalog) {
        const sel = $sel && $sel.length ? $sel : $('#node-input-preset');
        if (!sel.length) return;
        function paint(cat) {
          if (!cat) return;
          const byId = {};
          (cat.commands || []).forEach(function (c) {
            byId[String(c.value)] = c.description || '';
          });
          sel.find('option').each(function () {
            const pid = $(this).val();
            const cid = presetCommandId(pid);
            const tip = cid != null ? byId[String(cid)] : '';
            if (tip) $(this).attr('title', tip);
            else $(this).removeAttr('title');
          });
          function syncPresetTitle() {
            const tip = sel.find('option:selected').attr('title') || '';
            if (tip) sel.attr('title', tip);
            else sel.removeAttr('title');
          }
          syncPresetTitle();
          sel.off('change.mavPresetTip').on('change.mavPresetTip', syncPresetTitle);
        }
        if (catalog) {
          paint(catalog);
          return;
        }
        // Tip titles from cache when possible; otherwise one catalog load that
        // does not gate control rendering (Codex #36).
        const target = resolveCatalogTarget();
        if (_catalogByKey[target.key]) {
          paint(_catalogByKey[target.key]);
          return;
        }
        loadCommandsCatalog(paint);
      }

      /**
       * One catalog fetch for both preset-option titles and param field tips
       * when Connection / Vehicle / delivery changes (Greptile #36). Painting
       * then refreshParamFields (cache hit) avoids last-request-wins cancel.
       */
      function refreshPresetTipsAndParams() {
        loadCommandsCatalog(function (catalog) {
          if ($('#node-input-mode').val() !== 'preset') return;
          applyPresetOptionTips(null, catalog);
          refreshParamFields();
        });
      }

      loadPresets(buildPresetDropdown);

      $('#node-input-preset').on('change', function () {
        refreshParamFields();
        refreshDelivery();
      });

      // ── Advanced MAV_CMD dropdown (§6 / §9 — every command in the dialect) ─
      function buildAdvancedDropdown(catalog) {
        if (!catalog) return;
        const commands = catalog.commands || [];
        const sel = $('#node-input-advancedCommand');
        // Prefer the in-progress selection over the pre-edit saved value so a
        // Connection change mid-dialog does not snap the MAV_CMD back.
        const current = sel.val();
        const saved = node.advancedCommand !== undefined && node.advancedCommand !== null
          ? String(node.advancedCommand)
          : '';
        const prefer = current || saved;

        sel.empty();
        sel.append($('<option></option>').val('').text('\u2014 select MAV_CMD \u2014'));
        for (const c of commands) {
          const $opt = $('<option></option>').val(String(c.value)).text(c.label);
          if (c.description) $opt.attr('title', c.description);
          sel.append($opt);
        }
        if (prefer && !sel.find('option[value="' + prefer + '"]').length) {
          sel.append($('<option></option>').val(prefer).text('#' + prefer + ' (not in dialect)'));
        }
        if (prefer) sel.val(prefer);
        function syncAdvancedTitle() {
          const tip = sel.find('option:selected').attr('title') || '';
          if (tip) sel.attr('title', tip);
          else sel.removeAttr('title');
        }
        syncAdvancedTitle();
        sel.off('change.mavCmdTip').on('change.mavCmdTip', syncAdvancedTitle);
        sel.trigger('change');
      }

      function refreshAdvancedCommands() {
        loadCommandsCatalog(buildAdvancedDropdown);
      }

      $('#node-input-advancedCommand').on('change', function () {
        refreshParamFields();
        refreshDelivery();
      });

      // ── Delivery dropdown ──────────────────────────────────────────────────
      function refreshDelivery() {
        const hasConn = !!$('#node-input-connection').val();
        const mode = $('#node-input-mode').val();
        let hasCompletion = false;
        if (mode === 'preset') {
          hasCompletion = HAS_COMPLETION.has($('#node-input-preset').val());
        }

        const curDelivery = $('#node-input-delivery').val();
        const opts = deliveryOptions(hasConn, hasCompletion);
        const sel = $('#node-input-delivery').empty();
        for (const o of opts) {
          sel.append($('<option></option>').val(o.value).text(o.label));
        }
        // Preserve selection if still valid; else fall back to last available.
        if (opts.find((o) => o.value === curDelivery)) {
          sel.val(curDelivery);
        } else {
          sel.val(opts[opts.length - 1].value);
        }
        refreshCompletionRow();
      }

      $('#node-input-connection').on('change', function () {
        presetEnumsCatalog = { enums: {} };
        presetEnumsLoaded = false;
        presetEnumRequestSeq += 1;
        presetMessagesCatalog = null;
        presetMessagesKey = '';
        refreshDelivery();
        // Connection binds a Vehicle Profile → dialect; CompID + Advanced follow it.
        reloadTargetCompId();
        // Re-fill the identity dropdown for the newly selected connection.
        refreshIdentitySelect();
        refreshVisibility();
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });

      $('#node-input-vehicle').on('change', function () {
        // Vehicle Profile change invalidates build-tier catalogs.
        if ($('#node-input-delivery').val() === 'build') {
          presetEnumsCatalog = { enums: {} };
          presetEnumsLoaded = false;
          presetEnumRequestSeq += 1;
          presetMessagesCatalog = null;
          presetMessagesKey = '';
          if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
          if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
        }
      });

      $('#node-input-delivery').on('change', function () {
        refreshCompletionRow();
        refreshVisibility();
        // Tier switch may change catalog source (build→vehicle, wire→connection).
        // Invalidate all cached dialect data and reload.
        presetEnumsCatalog = { enums: {} };
        presetEnumsLoaded = false;
        presetEnumRequestSeq += 1;
        presetMessagesCatalog = null;
        presetMessagesKey = '';
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });

      function refreshCompletionRow() {
        const isComplete = $('#node-input-delivery').val() === 'complete';
        $('#row-completion-timeout')[isComplete ? 'show' : 'hide']();
      }

      // ── Param fields ───────────────────────────────────────────────────────
      let savedParams = {};
      try { savedParams = JSON.parse(node.params || '{}'); } catch (_e) {}
      let presetEnumsCatalog = { enums: {} };
      let presetEnumsLoaded = false;
      let presetEnumRequestSeq = 0;
      let presetMessagesCatalog = null;
      let presetMessagesKey = '';

      const $dialect = $('#node-input-dialect');
      $dialect.on('change', function () {
        presetEnumsCatalog = { enums: {} };
        presetEnumsLoaded = false;
        presetEnumRequestSeq += 1;
        presetMessagesCatalog = null;
        presetMessagesKey = '';
        refreshVisibility();
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });
      RED.mavlink.populateDialectSelect($dialect, {
        saved: node.dialect || '',
        includeVehicleEscape: true,
      });

      function loadPresetEnums(cb) {
        if (presetEnumsLoaded) {
          cb();
          return;
        }
        if (!(RED.mavlink && typeof RED.mavlink.loadEnumsCatalog === 'function')) {
          presetEnumsLoaded = true;
          presetEnumsCatalog = { enums: {} };
          cb();
          return;
        }
        const seq = ++presetEnumRequestSeq;
        RED.mavlink.loadEnumsCatalog(PRESET_ENUM_NAMES, function (catalog) {
          if (seq !== presetEnumRequestSeq) return;
          presetEnumsCatalog = catalog || { enums: {} };
          presetEnumsLoaded = true;
          cb();
        });
      }

      function loadPresetMessages(cb) {
        const target = resolveCatalogTarget();
        loadMessagesCatalog(function (catalog) {
          const currentTarget = resolveCatalogTarget();
          if (currentTarget.key !== target.key) return;
          presetMessagesCatalog = catalog || { messages: [] };
          presetMessagesKey = target.key;
          cb();
        });
      }

      function needsPresetEnums(specs) {
        return specs.some(function (spec) { return !!spec.enumName; });
      }

      function needsPresetMessages(specs) {
        return specs.some(function (spec) { return !!spec.messages; });
      }

      function presetMessagesReady() {
        return presetMessagesCatalog && presetMessagesKey === resolveCatalogTarget().key;
      }

      function fillSelect($select, entries, opts) {
        if (RED.mavlink && typeof RED.mavlink.fillEnumSelect === 'function') {
          RED.mavlink.fillEnumSelect($select, entries, opts || {});
          return;
        }
        const options = opts || {};
        const saved = options.saved !== undefined && options.saved !== null
          ? String(options.saved)
          : String($select.val() || '');
        $select.empty();
        if (options.allowEmpty) {
          $select.append($('<option></option>').val('').text(options.emptyLabel || '\u2014'));
        }
        for (const entry of entries || []) {
          const value = String(entry.value);
          const label = entry.label || (entry.name + ' (' + entry.value + ')');
          const $opt = $('<option></option>').val(value).text(label);
          if (entry.description) $opt.attr('title', entry.description);
          $select.append($opt);
        }
        if (saved && !$select.find('option[value="' + saved + '"]').length) {
          $select.append($('<option></option>').val(saved).text('#' + saved + ' (not in dialect)'));
        }
        if (saved || options.allowEmpty) $select.val(saved);
      }

      function messageEntries(catalog) {
        return ((catalog && catalog.messages) || []).map(function (msg) {
          return {
            name: msg.name,
            value: msg.id,
            label: msg.label || (msg.name + ' (' + msg.id + ')'),
            description: msg.description || null,
          };
        });
      }

      function numericParamInput(spec) {
        return $('<input type="number" class="param-input">')
          .attr('data-idx', spec.index)
          .val(savedParams[spec.index] !== undefined ? savedParams[spec.index] : '');
      }

      /** Look up a preset's numeric MAV_CMD id from the loaded presets API. */
      function presetCommandId(presetId) {
        const groups = _presetGroups || [];
        for (let g = 0; g < groups.length; g++) {
          const presets = groups[g].presets || [];
          for (let i = 0; i < presets.length; i++) {
            if (presets[i].id === presetId) return presets[i].commandId;
          }
        }
        return null;
      }

      function catalogParamByIndex(catalog, commandId, index) {
        if (!catalog || commandId == null) return null;
        const cmd = (catalog.commands || []).find(function (c) {
          return String(c.value) === String(commandId);
        });
        if (!cmd) return null;
        return (cmd.params || []).find(function (p) {
          return Number(p.index) === Number(index);
        }) || null;
      }

      /**
       * Field label for one Advanced param under the §6 four-case rule
       * (caller has already filtered `hidden` / reserved / Empty).
       * @param {object} spec
       * @returns {string}
       */
      function advancedParamLabel(spec) {
        let label = spec.label || spec.description || ('param ' + spec.index);
        if (spec.units) label += ' (' + spec.units + ')';
        return label;
      }

      function bitmaskTitle(description) {
        const base = description || 'Bitmask flags';
        return base + ' (Ctrl/Cmd-click to select multiple flags.)';
      }

      function booleanEntryLabel(entry) {
        const name = entry && entry.name ? entry.name : '';
        if (name === 'FALSE' || name.slice(-6) === '_FALSE') return 'false';
        if (name === 'TRUE' || name.slice(-5) === '_TRUE') return 'true';
        return entry.label || name;
      }

      function selectedBitmaskValues(saved, entries) {
        if (saved === undefined || saved === null || saved === '') return [];
        let mask;
        try {
          mask = BigInt(String(saved));
        } catch (_e) {
          return [];
        }
        const selected = [];
        for (const entry of entries) {
          let value;
          try {
            value = BigInt(String(entry.value));
          } catch (_e) {
            continue;
          }
          if ((value === 0n && mask === 0n) || (value !== 0n && (mask & value) === value)) {
            selected.push(String(entry.value));
          }
        }
        return selected;
      }

      /**
       * Build the input control for one Advanced param: enum= → <select>,
       * otherwise a number field with units/range as constraints (§6).
       * @param {object} spec
       * @param {Object<string, Array>} enums
       * @returns {HTMLElement|jQuery}
       */
      function advancedParamInput(spec, enums) {
        const saved = savedParams[spec.index];
        if (spec.enum && enums[spec.enum] && enums[spec.enum].length) {
          const entries = enums[spec.enum];
          const falseTrue = RED.mavlink.isFalseTrueEnum(entries);
          const isBitmask = !!spec.bitmask && !falseTrue;
          const sel = $('<select class="param-input"></select>')
            .attr('data-idx', spec.index)
            .attr('data-kind', falseTrue ? 'enum' : (isBitmask ? 'bitmask' : 'enum'))
            .attr('title', isBitmask ? bitmaskTitle(spec.description) : (spec.description || ''));
          if (isBitmask) {
            sel.attr('multiple', 'multiple').attr('size', Math.min(6, entries.length));
          } else {
            sel.append($('<option></option>').val('').text('\u2014'));
          }
          for (const entry of entries) {
            const $opt = $('<option></option>').val(String(entry.value)).text(falseTrue ? booleanEntryLabel(entry) : entry.label);
            if (entry.description) $opt.attr('title', entry.description);
            sel.append($opt);
          }
          if (isBitmask) {
            sel.val(selectedBitmaskValues(saved, entries));
          } else if (saved !== undefined && saved !== null && saved !== '') {
            sel.val(String(saved));
          }
          return sel;
        }
        const input = $('<input type="number" class="param-input">')
          .attr('data-idx', spec.index)
          .attr('title', spec.description || '')
          .val(saved !== undefined && saved !== null ? saved : '');
        if (spec.minValue !== null && spec.minValue !== undefined) input.attr('min', spec.minValue);
        if (spec.maxValue !== null && spec.maxValue !== undefined) input.attr('max', spec.maxValue);
        if (spec.increment !== null && spec.increment !== undefined) input.attr('step', spec.increment);
        return input;
      }

      function presetParamInput(spec) {
        const saved = savedParams[spec.index];
        if (spec.messages) {
          const entries = messageEntries(presetMessagesCatalog);
          if (entries.length) {
            const sel = $('<select class="param-input"></select>')
              .attr('data-idx', spec.index)
              .attr('data-kind', 'enum');
            fillSelect(sel, entries, { allowEmpty: true, emptyLabel: '\u2014 message \u2014', saved: saved });
            return sel;
          }
        }

        if (spec.enumName) {
          const enums = (presetEnumsCatalog && presetEnumsCatalog.enums) || {};
          let entries = enums[spec.enumName] || [];
          if (!entries.length && spec.fallbackOptions) entries = spec.fallbackOptions;
          if (entries.length) {
            const falseTrue = RED.mavlink.isFalseTrueEnum(entries);
            const isBitmask = !!spec.bitmask && !falseTrue;
            const sel = $('<select class="param-input"></select>')
              .attr('data-idx', spec.index)
              .attr('data-kind', falseTrue ? 'enum' : (isBitmask ? 'bitmask' : 'enum'));
            if (isBitmask) {
              sel.attr('multiple', 'multiple').attr('size', Math.min(6, entries.length));
            }
            if (falseTrue) {
              sel.append($('<option></option>').val('').text('\u2014'));
              for (const entry of entries) {
                const $opt = $('<option></option>').val(String(entry.value)).text(booleanEntryLabel(entry));
                if (entry.description) $opt.attr('title', entry.description);
                sel.append($opt);
              }
              if (saved !== undefined && saved !== null && saved !== '') sel.val(String(saved));
            } else {
              fillSelect(sel, entries, { allowEmpty: !isBitmask, saved: saved });
            }
            if (isBitmask) sel.val(selectedBitmaskValues(saved, entries));
            return sel;
          }
        }

        return numericParamInput(spec);
      }

      function refreshParamFields() {
        container.empty();

        const mode = $('#node-input-mode').val();
        if (mode === 'advanced') {
          // Fields are created by selection (§6 / §9 Advanced): named params
          // from the dialect metadata — never a raw Param 1–7 grid.
          const catalog = _catalogByKey[_activeCatalogKey];
          const cmdId = $('#node-input-advancedCommand').val();
          if (!catalog) {
            container.append($('<div class="form-row"><em>Loading command parameters\u2026</em></div>'));
            return;
          }
          if (catalog.error && !(catalog.commands && catalog.commands.length)) {
            container.append($('<div class="form-row"><em>Could not load command parameters for this Vehicle dialect. Deploy the Vehicle Profile (required for custom dialects).</em></div>'));
            return;
          }
          if (!cmdId) {
            container.append($('<div class="form-row"><em>Select a MAV_CMD to configure parameters.</em></div>'));
            return;
          }
          const cmd = (catalog.commands || []).find(function (c) {
            return String(c.value) === String(cmdId);
          });
          if (!cmd) {
            container.append($('<div class="form-row"><em>Command not in this dialect.</em></div>'));
            return;
          }
          const visible = (cmd.params || []).filter(function (p) { return !p.hidden; });
          if (visible.length === 0) {
            container.append($('<div class="form-row"><em>No exposed parameters for this command.</em></div>'));
            return;
          }
          for (const spec of visible) {
            container.append(formRow(advancedParamLabel(spec), advancedParamInput(spec, catalog.enums || {})));
          }
        } else {
          const presetId = $('#node-input-preset').val();
          const paramSpec = PRESET_PARAMS[presetId] || [];
          if (needsPresetEnums(paramSpec) && !presetEnumsLoaded) {
            container.append($('<div class="form-row"><em>Loading parameter options\u2026</em></div>'));
            loadPresetEnums(refreshParamFields);
            return;
          }
          if (needsPresetMessages(paramSpec) && !presetMessagesReady()) {
            container.append($('<div class="form-row"><em>Loading message list\u2026</em></div>'));
            loadPresetMessages(refreshParamFields);
            return;
          }
          // Render controls immediately so a slow tip-catalog fetch cannot
          // leave the form empty at Done (Codex #36). Titles attach when ready.
          if (paramSpec.length === 0) {
            container.append($('<div class="form-row"><em>No exposed parameters for this preset.</em></div>'));
            return;
          }
          const commandId = presetCommandId(presetId);
          const rows = [];
          for (const spec of paramSpec) {
            const label = spec.units
              ? `${spec.label} (${spec.units})`
              : spec.label;
            const input = presetParamInput(spec);
            rows.push({ spec, input, row: formRow(label, input) });
            container.append(rows[rows.length - 1].row);
          }
          loadCommandsCatalog(function (cmdCatalog) {
            if ($('#node-input-mode').val() !== 'preset') return;
            if ($('#node-input-preset').val() !== presetId) return;
            for (const row of rows) {
              if (!row.input.closest('body').length) return; // row was replaced
              const catParam = catalogParamByIndex(cmdCatalog, commandId, row.spec.index);
              if (catParam && catParam.description) {
                const tip = row.spec.bitmask
                  ? bitmaskTitle(catParam.description)
                  : catParam.description;
                row.input.attr('title', tip);
                const lbl = row.input.closest('.form-row').find('label').first();
                if (lbl.length) lbl.attr('title', tip);
              }
            }
          });
        }
      }

      // ── Safety preset notice ───────────────────────────────────────────────
      function refreshSafetyNotice() {
        const presetId = $('#node-input-preset').val();
        const isSafety = REQUIRES_CONFIRM.has(presetId) && $('#node-input-mode').val() !== 'advanced';
        $('#row-safety-notice')[isSafety ? 'show' : 'hide']();
      }

      $('#node-input-preset').on('change', refreshSafetyNotice);
      $('#node-input-mode').on('change', refreshSafetyNotice);

      // ── Initial state ──────────────────────────────────────────────────────
      refreshIdentitySelect();
      applyMode(node.mode || 'preset');
      refreshSafetyNotice();
      refreshCompletionRow();
      refreshVisibility();
    },

    oneditsave: function () {
      // Collect param values from the dynamic fields.
      const params = {};
      $('.param-input').each(function () {
        const $input = $(this);
        const idx = Number($input.attr('data-idx'));
        const raw = $input.val();
        if ($input.attr('data-kind') === 'bitmask') {
          const values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
          if (!values.length) return;
          let mask = 0n;
          for (const value of values) {
            mask = mask | BigInt(String(value));
          }
          mask = Number(mask);
          params[idx] = mask;
          return;
        }
        const val = String(raw || '').trim();
        if (val !== '') params[idx] = Number(val);
      });
      this.params = JSON.stringify(params);
    },

    oneditcancel: function () {},
  });
}());
</script>

<script type="text/html" data-template-name="mavlink-command">
  <div class="form-row">
    <label for="node-input-name" style="width:120px"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="(optional)">
  </div>

  <div class="form-row">
    <label for="node-input-mode" style="width:120px">Mode</label>
    <select id="node-input-mode" style="width:200px">
      <option value="preset">Preset</option>
      <option value="advanced">Advanced (full MAV_CMD list)</option>
    </select>
  </div>

  <div class="form-row" id="row-preset">
    <label for="node-input-preset" style="width:120px">Preset</label>
    <select id="node-input-preset" style="width:240px"></select>
  </div>

  <div class="form-row" id="row-advanced" style="display:none">
    <label for="node-input-advancedCommand" style="width:120px">MAV_CMD</label>
    <select id="node-input-advancedCommand" style="width:280px"></select>
  </div>

  <!-- Safety notice for presets that require confirmation -->
  <div class="form-row" id="row-safety-notice"
       style="display:none;background:#fff3cd;border:1px solid #ffc107;padding:6px 10px;border-radius:3px">
    <i class="fa fa-warning" style="color:#e67e22"></i>
    <strong>Safety command</strong> — set <code>msg.confirmed = true</code> to allow sending.
  </div>

  <hr style="margin:8px 0">

  <div class="form-row">
    <label style="width:120px;font-weight:bold">Parameters</label>
  </div>
  <div id="node-input-params-container"></div>
  <!-- params JSON stored in hidden field; populated by oneditsave -->
  <input type="hidden" id="node-input-params">

  <hr style="margin:8px 0">

  <div class="form-row" id="row-cmd-dialect">
    <label for="node-input-dialect" style="width:120px">Dialect</label>
    <select id="node-input-dialect" style="width:240px"></select>
  </div>

  <div class="form-row" id="row-cmd-vehicle">
    <label for="node-input-vehicle" style="width:120px">Vehicle Profile</label>
    <input type="text" id="node-input-vehicle" style="width:240px">
  </div>

  <div class="form-row" id="row-cmd-connection">
    <label for="node-input-connection" style="width:120px">Connection</label>
    <input type="text" id="node-input-connection" style="width:240px">
  </div>

  <div class="form-row" id="row-cmd-identity">
    <label for="node-input-identity" style="width:120px">Send as</label>
    <select id="node-input-identity" style="width:240px"></select>
  </div>

  <div class="form-row">
    <label for="node-input-delivery" style="width:120px">Delivery</label>
    <select id="node-input-delivery" style="width:200px">
      <option value="build">Build</option>
      <option value="send">Send</option>
      <option value="confirm">Send &amp; confirm</option>
      <option value="complete">Send &amp; await completion</option>
    </select>
  </div>

  <div class="form-row" id="row-completion-timeout" style="display:none">
    <label for="node-input-completionTimeout" style="width:120px">Completion timeout</label>
    <input type="number" id="node-input-completionTimeout" style="width:80px"> ms
  </div>

  <hr style="margin:8px 0">

  <div class="form-row" id="row-cmd-target">
    <label for="node-input-targetSysid" style="width:120px">Target sysid</label>
    <input type="number" id="node-input-targetSysid" min="0" max="255" placeholder="(profile default)" style="width:80px">
    <label for="node-input-targetCompid" style="margin-left:10px;width:80px">Compid</label>
    <select id="node-input-targetCompid" style="width:80px"></select>
  </div>

  <div class="form-row" id="row-cmd-timeout">
    <label for="node-input-timeout" style="width:120px">ACK timeout</label>
    <input type="number" id="node-input-timeout" style="width:80px"> ms
  </div>

  <div class="form-row" id="row-cmd-maxRetries">
    <label for="node-input-maxRetries" style="width:120px">Max retries</label>
    <input type="number" id="node-input-maxRetries" style="width:60px">
    <span style="margin-left:6px;color:#888;font-size:11px">TEMPORARILY_REJECTED backoff</span>
  </div>

  <div class="form-row" id="row-cmd-unconfirmedContinue">
    <label style="width:120px">On timeout</label>
    <input type="checkbox" id="node-input-unconfirmedContinue" style="width:auto;margin-right:6px">
    <label for="node-input-unconfirmedContinue" style="width:auto">Continue chain if unconfirmed</label>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-command">
  <p>Sends a MAVLink <code>MAV_CMD</code> command with configurable delivery and confirmation.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | false</span></dt>
    <dd>
      When an object with numeric keys 1–7, those values override the configured
      command parameters for the matching param index.
      <code>false</code> suppresses the command (nothing is sent or emitted).
    </dd>
    <dt class="optional">payload.target <span class="property-type">object</span></dt>
    <dd>
      <code>{ sysid, compid }</code> — runtime override for the target address; takes
      precedence over every other resolution step including companion derivation.
    </dd>
    <dt class="optional">payload.identityId <span class="property-type">string</span></dt>
    <dd>Runtime override for the send-as Local Identity node id.</dd>
    <dt class="optional">confirmed <span class="property-type">boolean</span></dt>
    <dd>Must be <code>true</code> for Safety presets (e.g. Flight Termination).</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue
      <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The status record on success; the built <code>COMMAND_LONG</code> message in Build mode.</dd>
      </dl>
    </li>
    <li>Status — plain status object at the message root on every terminal outcome:
      <dl class="message-properties">
        <dt>result <span class="property-type">string</span></dt>
        <dd>Outcome name (<code>accepted</code>, <code>failed</code>, <code>unconfirmed</code>, …).</dd>
        <dt>resultCode <span class="property-type">number | null</span></dt>
        <dd>MAV_RESULT code when the outcome came from COMMAND_ACK.</dd>
        <dt>confirmedBy <span class="property-type">string</span></dt>
        <dd><code>ack</code>, <code>state</code>, or <code>none</code>.</dd>
        <dt>target <span class="property-type">object</span></dt>
        <dd>Resolved <code>{ sysid, compid }</code>.</dd>
        <dt>elapsed <span class="property-type">number</span></dt>
        <dd>Milliseconds from start to terminal outcome.</dd>
        <dt>retries <span class="property-type">number</span></dt>
        <dd>COMMAND_ACK retries performed.</dd>
        <dt>command <span class="property-type">string</span></dt>
        <dd>Friendly command name when known.</dd>
        <dt>commandId <span class="property-type">number</span></dt>
        <dd>MAV_CMD value.</dd>
        <dt>detail <span class="property-type">string | null</span></dt>
        <dd>Extra human-readable context.</dd>
      </dl>
    </li>
  </ol>

  <h3>Delivery tiers</h3>
  <ul>
    <li><b>Build</b> — construct the COMMAND_LONG and emit on output 0; no send. Pick a bundled
        <em>Dialect</em>, or choose <em>from Vehicle Profile…</em> to use a custom XML dialect
        and that profile's default target. Identity and connection are not used.</li>
    <li><b>Send</b> — fire-and-forget; no acknowledgement waiting.</li>
    <li><b>Send &amp; confirm</b> (default) — wait for COMMAND_ACK; retry on TEMPORARILY_REJECTED.</li>
    <li><b>Send &amp; await completion</b> — after ACCEPTED, poll the peer table until the
        vehicle state satisfies the command's completion condition (Arm, Takeoff, Land, Set Mode).</li>
  </ul>

  <h3>Role × tier matrix</h3>
  <p>
    The dialog reshapes at edit time based on the selected delivery tier and identity role.
    At runtime only <code>msg.payload</code> can override values; hidden fields are not honored.
  </p>
  <ul>
    <li><b>Build tier</b>: Dialect row shown; Vehicle Profile row shown only when Dialect is
        <em>from Vehicle Profile…</em>. Connection, identity, timeout, and retry rows hidden.
        Target sysid/compid inherit from the Vehicle Profile only in that mode.</li>
    <li><b>Wire tiers</b> (Send / confirm / complete): Connection shown (required); identity
        (send-as) shown. Target rows follow the identity role:</li>
    <li><b>gcs / custom identity</b>: target sysid and compid shown; blank inherits the
        connection's vehicle profile default.</li>
    <li><b>companion identity</b>: target sysid and compid hidden — target is derived from
        the companion's airframe sysid and fixed compid 1.</li>
  </ul>

  <h3>Mode</h3>
  <p>
    <b>Preset</b> — hand-curated commands with pinned params and friendly names.
    <b>Advanced</b> — every <code>MAV_CMD</code> in the dialect as a dropdown; all
    params exposed. Build tier uses the Dialect picker; wire tiers use the
    bound connection's profile. Bitmask params render as multi-selects;
    Ctrl/Cmd-click multiple flags and the editor stores their numeric mask.
  </p>

  <h3>Details</h3>
  <p>
    Output 0 (continue) fires only on success — that is what stops a chain on failure.
    Wiring output 1 (status) into another action is not refused; suppress with
    <code>msg.payload === false</code> when you need an explicit hold.
  </p>
  <p>
    On ACK timeout the node checks the peer table. If the completion condition is
    satisfied, the command is confirmed by observed state. Otherwise the result is
    <em>unconfirmed</em>; output 0 does not fire unless <em>Continue chain if unconfirmed</em> is enabled.
  </p>
  <p>
    COMMAND_ACK matching keys on the same resolved target as the send: a companion
    identity's derived address <code>{airframe sysid, 1}</code> is used for both sending
    and settling the acknowledgement transaction.
  </p>
</script>
