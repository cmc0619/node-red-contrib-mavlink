<!-- mavlink-command editor dialog (DESIGN.md §3, §6, §9) -->
<script type="text/javascript">
(function () {
  'use strict';

  /**
   * Helper: create a labelled form row.
   * @param {string} label
   * @param {HTMLElement} input
   * @returns {HTMLElement}
   */
  function formRow(label, input) {
    const row = $('<div class="form-row"></div>');
    const tip = (input && input.attr) ? (input.attr('title') || '') : '';
    const lbl = $('<label></label>').css({ width: '120px', display: 'inline-block' }).text(label);
    if (tip) lbl.attr('title', tip);
    row.append(lbl).append(input);
    return row;
  }

  /**
   * Delivery options filtered by what the selected command supports.
   * @param {boolean} hasConnection  whether a connection is configured
   * @param {boolean} hasCompletion  whether the command has a completion condition
   * @returns {Array<{value: string, label: string}>}
   */
  function deliveryOptions(hasConnection, hasCompletion) {
    const opts = [{ value: 'build', label: 'Build' }];
    if (hasConnection) {
      opts.push({ value: 'send', label: 'Send' });
      opts.push({ value: 'confirm', label: 'Send & confirm' });
      if (hasCompletion) {
        opts.push({ value: 'complete', label: 'Send & await completion' });
      }
    }
    return opts;
  }

  // ── Presets / command catalog loaded from server ───────────────────────────
  let _currentPresetGroups = [];
  /** Commands catalog request sequence. */
  const _cmdCatalog = { seq: 0 };
  /** Commands catalog the loader last handed this dialog — paint from this. */
  let _currentCmdCatalog = null;
  /** Messages catalog request sequence (request_message picker). */
  const _msgCatalog = { seq: 0 };

  function loadPresets(cb) {
    $.getJSON(RED.mavlink.adminApiUrl('/mavlink/command/presets'), function (data) {
      _currentPresetGroups = data.groups || [];
      cb(_currentPresetGroups);
    }).fail(function () {
      _currentPresetGroups = [];
      cb(_currentPresetGroups);
    });
  }

  /**
   * Load the Advanced catalog (commands + enums).
   *
   * @param {function({commands:Array, enums:Object, dialect:string}):void} cb
   */
  function loadCommandsCatalog(cb) {
    RED.mavlink.loadCatalog('/mavlink/command/commands', _cmdCatalog, function (catalog) {
      _currentCmdCatalog = catalog;
      cb(catalog);
    }, {
      listKey: 'commands'
    });
  }

  function loadMessagesCatalog(cb) {
    RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, cb, {
      listKey: 'messages'
    });
  }

  // Preset curation only (§6): which param indices each preset exposes, plus
  // the few overrides the dialect XML cannot know — operator-guidance labels
  // ('Direction (-1=CCW 0=CW)'), the `messages: true` message-picker flag, and
  // lat/lon 'deg' (the XML leaves those unitless because the wire unit is
  // carrier-dependent; canonical operator input is degrees, §9). Everything
  // else — labels, units, enums, bitmask-ness, descriptions, ranges — renders
  // from the commands catalog, exactly like Advanced mode.
  // Keys here OVERRIDE the catalog param spec; omit a key to inherit it.
  const PRESET_PARAMS = {
    arm:           [{ index: 2, label: 'Force Arm' }],
    disarm:        [{ index: 2, label: 'Force Disarm' }],
    set_mode:      [{ index: 1, label: 'Mode (base_mode)' },
                    { index: 2 }],
    takeoff:       [{ index: 1 }, { index: 7 }],
    land:          [{ index: 1 },
                    { index: 5, units: 'deg' },
                    { index: 6, units: 'deg' },
                    { index: 7 }],
    rtl:           [],
    set_home:      [{ index: 1 },
                    { index: 5, units: 'deg' },
                    { index: 6, units: 'deg' },
                    { index: 7 }],
    change_speed:  [{ index: 1 },
                    { index: 2, label: 'Speed (blank = no change)' },
                    { index: 3, label: 'Throttle (blank = no change)' }],
    orbit:         [{ index: 1 },
                    { index: 2, label: 'Velocity (blank = default)' },
                    { index: 3 },
                    { index: 5, units: 'deg' },
                    { index: 6, units: 'deg' },
                    { index: 7, label: 'Alt (blank = current)' }],
    mission_start: [{ index: 1 }, { index: 2 }],
    pause:         [],
    resume:        [],
    request_message:    [{ index: 1, messages: true }, { index: 2 }],
    set_message_interval: [{ index: 1, messages: true }, { index: 2 }, { index: 3 }],
    stop_message_interval: [{ index: 1, messages: true }],
    reboot_autopilot: [{ index: 1 }, { index: 2 }],
    flight_termination: [{ index: 1, label: 'Terminate (1=yes)' }],
  };

  // Presets whose *blank* param5/6 encodes the spec's NaN "use current
  // position" sentinel (`blankParams` in lib/command/presets.js). int32 has no
  // NaN, so those presets can only say "here" over COMMAND_LONG —
  // `longToIntFields` refuses the pair at build. The carrier is an editor
  // field, so the impossibility is a deploy-time verdict rather than a
  // first-message surprise. Drift-tested against the library, like the map
  // below.
  const NAN_CENTRE_PRESETS = new Set(['orbit']);

  // Which presets cannot be sent with a blank coordinate — a mirror of
  // `requireLocation` in lib/command/presets.js. It lives here because a
  // Node-RED validator is synchronous and the preset catalog is fetched
  // asynchronously: a node whose dialog was never opened still has to be
  // checked at deploy, so the rule cannot wait on a fetch.
  //
  // Two copies of one rule is a real cost. It is paid down by an executed test
  // (test/nodes/command-html.test.js) that reads the library's PRESETS and
  // asserts this map matches the *offered* ones exactly, so the pair cannot
  // drift in silence. Offered is the right side of the comparison: a row the
  // dropdown does not carry is not this node's surface to police, and
  // `reposition` is exactly that — Move owns the goto, and the row survives
  // only as the DO_REPOSITION metadata mavlink-formation builds from.
  //
  // Orbit is deliberately absent: DO_ORBIT documents NaN on param5/6 as "use
  // current vehicle position", so a blank centre is the spec's own "orbit
  // where I am" and demanding coordinates refused a legal command.
  const PRESET_LOCATION = {
    set_home: { require: { unless: { param: 1, equals: 1 } } },
  };

  /** A param value that is actually a value: not blank, and finite. */
  function presentParam(value) {
    return !RED.mavlink.isBlank(value) && Number.isFinite(Number(value));
  }

  /**
   * Whether this invocation needs lat/lon, reading the same shape the library
   * declares on the preset row.
   * Set Home's "use current position" flag makes the vehicle ignore the
   * coordinates; a blank flag is 0, which is still "no".
   */
  function locationRequired(rule, values) {
    if (rule === true) return true;
    if (!rule || !rule.unless) return false;
    return Number(values[rule.unless.param] || 0) !== rule.unless.equals;
  }

  /**
   * Scrape the rendered param controls into the `{index: number}` shape the
   * saved blob carries. Every control is read by its `data-kind`, because
   * `.val()` alone lies on two of the three: a checkbox with no value attribute
   * returns the literal string `"on"` whether it is ticked or not, and a
   * multi-select returns an array of the chosen values. `Number()` reads both
   * as NaN.
   *
   * The single scrape is shared by `oneditsave` and the validator on purpose —
   * a validator that judged different values than Done writes would red a
   * config the operator cannot fix, or pass one it cannot send.
   *
   * @returns {Object<number, number>}
   */
  function scrapeParamInputs() {
    const params = {};
    $('.param-input').each(function () {
      const $input = $(this);
      const idx = Number($input.attr('data-idx'));
      const kind = $input.attr('data-kind');
      if (kind === 'boolean') {
        params[idx] = RED.mavlink.booleanEnumValue($input);
        return;
      }
      if (kind === 'px4mode') {
        // One control, two wire params: PX4 reads DO_SET_MODE param2 as the
        // decomposed main mode and param3 as the sub mode (DESIGN.md §14 "PX4
        // DO_SET_MODE on this SIH wants main_mode in param2") — the packed
        // option value is split here, never saved whole.
        const packed = Number($input.val());
        params[idx] = RED.mavlink.px4MainMode(packed);
        params[idx + 1] = RED.mavlink.px4SubMode(packed);
        return;
      }
      const raw = $input.val();
      if (kind === 'bitmask') {
        // Nothing selected omits the param, which resolves to 0 on the wire
        // anyway — the same shape as the blank number field below.
        const mask = RED.mavlink.bitmaskFromSelection(raw);
        if (mask !== null) params[idx] = mask;
        return;
      }
      const val = String(raw === undefined || raw === null ? '' : raw).trim();
      if (val !== '') params[idx] = Number(val);
    });
    return params;
  }

  /**
   * Param values to validate: the live rendered fields while this node's own
   * dialog is on top *and* a real form is on screen, otherwise the saved blob.
   * `oneditsave` writes `#node-input-params` only on Done, so mid-edit the
   * hidden field still holds the pre-edit JSON and validating it would judge
   * the wrong values.
   *
   * `_mavParamsRendered` is the same authority `oneditsave` scrapes behind, and
   * for the same reason: a dialog can be open over a form that rendered nothing
   * — the catalog is still loading, or the saved preset is one the palette no
   * longer offers. Scraping zero fields there reads as "every param is blank"
   * and reds a node whose saved params are intact.
   *
   * Returns null when the saved blob is unreadable — the caller reds rather
   * than falling open.
   */
  function paramValues(owner, savedJson) {
    const values = {};
    if (owner && owner._mavParamsRendered && RED.mavlink.ownDialogField(owner, '#node-input-params')) {
      return scrapeParamInputs();
    }
    let parsed;
    try {
      parsed = JSON.parse(savedJson || '{}');
    } catch {
      return null;
    }
    if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) return null;
    for (const key of Object.keys(parsed)) {
      if (!RED.mavlink.isBlank(parsed[key])) values[Number(key)] = Number(parsed[key]);
    }
    return values;
  }

  /**
   * True when param5/6 carry metres rather than degrees, so the ±90/±180 gate
   * must not fire. Only COMMAND_INT carries a frame at all; the LONG carrier
   * and every unknown frame stay on the degree path, which is the safe
   * direction — a missing frame must not buy a bypass (§9, #263).
   */
  /** Whether the COMMAND_INT carrier is selected — the int32 param5/6 path. */
  function intCarrierSelected(owner) {
    return RED.mavlink.liveOr(owner, '#node-input-sendAs', owner.sendAs, 'int') === 'int';
  }

  function localFrameSelected(owner) {
    if (!intCarrierSelected(owner)) return false;
    const frame = Number(RED.mavlink.liveOr(owner, '#node-input-frame', owner.frame, ''));
    return frame === 1 || frame === 7 || frame === 8 || frame === 9 ||
      frame === 20 || frame === 21;
  }

  // Presets with completion conditions — determines if "await completion" is shown.
  const HAS_COMPLETION = new Set(['arm', 'disarm', 'takeoff', 'land', 'rtl', 'set_mode']);
  // Safety presets: the notice is the editor's warning. Selecting the
  // preset is the operator's choice — the driver packs and sends it.
  const REQUIRES_CONFIRM = new Set(['flight_termination']);

  // Dialect + Vehicle Profile validators are the shared Build-tier rule (§6);
  // Command's mode field is `delivery` and it has no Firmware field.
  const commandDefaults = Object.assign(
    {
      name:              { value: '' },
      mode:              { value: 'preset', validate: RED.mavlink.oneOf(['preset', 'advanced']) },
      // The dropdown cannot produce an unknown preset; a hand-edited flow can.
      // The runtime does not repair it (AGENTS.md, input trust) — `getPreset`
      // returns undefined, `resolveCommandId` yields null, and the node builds
      // and sends MAV_CMD(null), then reports success. A false success is a
      // different animal from garbage-out, and this is the layer that can tell
      // the difference: PRESET_PARAMS enumerates exactly the offered presets
      // (drift-tested against the library), so the check is synchronous and
      // needs no catalog fetch. Advanced mode has its own field and rule.
      preset: {
        value: 'arm',
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-mode', this.mode, 'preset') !== 'preset') return true;
          return Object.prototype.hasOwnProperty.call(PRESET_PARAMS, v)
            || 'is not a preset this palette offers — pick one from the list';
        },
      },
      // Advanced mode's command *is* the message — blank builds MAV_CMD(null)
      // and sends it. Config validity is the editor's verdict (§6), so this is
      // the only thing standing between a half-filled dialog and the wire.
      // Preset mode never reads the field, hence the conditional. Two args so
      // the reason renders.
      advancedCommand:   {
        value: '',
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-mode', this.mode, 'preset') !== 'advanced') return true;
          return !RED.mavlink.isBlank(v) || 'is required in Advanced mode — pick a command';
        },
      },
      delivery:          { value: 'confirm', validate: RED.mavlink.oneOf(['build', 'send', 'confirm', 'complete']) },
      sendAs:            { value: 'int', validate: RED.mavlink.oneOf(['int', 'long']) },
      // Closed vocabulary: the frame select's own options. Relative alt (3) is
      // the editor default — saved explicitly; the driver does not invent it.
      // Other frames ride msg.mavFrame at runtime; a hand-edited config value
      // the dialog cannot save reds here.
      frame:             { value: '3', validate: RED.mavlink.oneOf(['0', '3', '10', '1']) },
      identity:          { value: '' },
      // A statically configured broadcast (0) on an ack-confirmed tier is a
      // cross-field static requirement, so it reds at deploy rather than on
      // the first message (#260). The driver no longer restates it — this is
      // the only layer that catches the pair (§0).
      targetSystem: {
        value: '',
        validate: RED.mavlink.validateTargetSystem(['confirm', 'complete'], 'delivery', 'confirm'),
      },
      // Compid is a wire uint8; the select's catalog values all fit, so this
      // reds only a hand-edited flow. Blank inherits the profile default.
      targetComponent:      { value: '', validate: RED.mavlink.validateUint8(0) },
      // Blank allowed: the runtime reads '' as "use the default"
      // (mavlink-command.js — `config.timeout === '' ? DEFAULT_TIMEOUT_MS`),
      // so the validator must accept it. Same shape as Mission, Move, Payload.
      timeout:           { value: '10000', validate: RED.mavlink.validateAtLeast(0) },
      maxRetries:        { value: '3', validate: RED.mavlink.validateAtLeast(0, { integer: true }) },
      unconfirmedContinue: { value: false },
      completionTimeout: { value: '60000', validate: RED.mavlink.validateAtLeast(0) },
      // The preset params blob. Nothing checked it before, and the runtime
      // refused blank/out-of-range coordinates on its behalf; that refusal is
      // gone (AGENTS.md, input trust), so this is now the only thing between a
      // half-filled Set Home and a vehicle told its home is 0,0 — null island,
      // Gulf of Guinea, at sea level. Range is checked wherever a degree
      // coordinate is *present*, independently of whether the preset requires
      // one: takeoff and land expose lat/lon without requiring them, and 200°
      // there is still garbage that scales into a real place (§9, #263).
      // Two args so the reasons render (§14).
      params: {
        value: '{}',
        validate: function (v, _opt) {
          // The blob must parse in both modes — Advanced included, where the
          // runtime reads it through the same JSON.parse and a corrupt blob
          // is drift the editor can already see at deploy. The preset rules
          // below are preset-only. Blank reds too: mergeParams parses this
          // string as saved and '' is not JSON — '{}' is the empty spelling —
          // while paramValues' own '' fallback would vouch for it (Codex).
          if (RED.mavlink.isBlank(v)) return 'is not valid JSON — {} is the empty set';
          const values = paramValues(this, v);
          if (values === null) return 'is not valid JSON';
          if (RED.mavlink.liveOr(this, '#node-input-mode', this.mode, 'preset') !== 'preset') return true;
          if (!localFrameSelected(this)) {
            if (presentParam(values[5]) && Math.abs(Number(values[5])) > 90) {
              return 'latitude must be within ±90°';
            }
            if (presentParam(values[6]) && Math.abs(Number(values[6])) > 180) {
              return 'longitude must be within ±180°';
            }
          }
          const preset = RED.mavlink.liveOr(this, '#node-input-preset', this.preset, 'arm');
          // A blank centre on these presets is the NaN sentinel, and int32 has
          // no NaN: the build refuses the pair, so the operator would meet it
          // on the first message instead of at deploy.
          if (NAN_CENTRE_PRESETS.has(preset) && intCarrierSelected(this) &&
              (!presentParam(values[5]) || !presentParam(values[6]))) {
            return 'with a blank centre this means "here" (NaN), which COMMAND_INT cannot carry — ' +
              'set Send as to COMMAND_LONG, or fill in the centre';
          }
          const rule = PRESET_LOCATION[preset];
          if (!rule || !locationRequired(rule.require, values)) return true;
          if (!presentParam(values[5]) || !presentParam(values[6])) {
            return 'needs a latitude and longitude — a blank coordinate is sent as 0,0';
          }
          return true;
        },
      },
    },
    RED.mavlink.buildTierDialectDefaults()
  );

  RED.nodes.registerType('mavlink-command', {
    category: 'mavlink',
    color: '#4a90d9',
    defaults: commandDefaults,
    inputs:  1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-rocket',
    paletteLabel: 'command',
    label: function () {
      if (this.name) return this.name;
      if (this.mode === 'advanced') {
        const id = this.advancedCommand;
        return id !== undefined && id !== null && id !== '' ? `cmd ${id}` : 'command';
      }
      return this.preset || 'command';
    },

    oneditprepare: function () {
      const node = this;
      const container = $('#node-input-params-container');

      RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');

      // ── Role × tier visibility matrix (DESIGN.md §6) ──────────────────────
      function refreshVisibility() {
        const tier = $('#node-input-delivery').val() || 'confirm';
        const isBuild = tier === 'build';
        const dialectVal = $('#node-input-dialect').val() || node.dialect || '';

        // Shared Build-tier rows (dialect / vehicle / connection).
        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuild,
          dialect: dialectVal,
          dialectRow: '#row-cmd-dialect',
          vehicleRow: '#row-cmd-vehicle',
          connectionRow: '#row-cmd-connection'
        });
        // Command-owned wire rows stay local.
        $('#row-cmd-identity')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-timeout')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-maxRetries')[isBuild ? 'hide' : 'show']();
        $('#row-cmd-unconfirmedContinue')[isBuild ? 'hide' : 'show']();

        // Wire + companion → target derived; Build always shows (must stamp).
        RED.mavlink.applyCompanionTargetVisibility({
          isBuild: isBuild,
          identityId: $('#node-input-identity').val(),
          combinedTargetRow: '#row-cmd-target',
        });
      }

      $('#node-input-identity').on('change', refreshVisibility);

      // First CompID fill runs after populateDialectSelect pins the saved dialect.

      // ── Mode toggle ────────────────────────────────────────────────────────
      function applyMode(mode) {
        if (mode === 'advanced') {
          $('#row-preset').hide();
          $('#row-advanced').show();
          refreshAdvancedCommands();
        } else {
          $('#row-preset').show();
          $('#row-advanced').hide();
          refreshParamFields();
        }
        refreshDelivery();
      }

      $('#node-input-mode').on('change', function () {
        applyMode($(this).val());
      });

      // ── Preset dropdown ────────────────────────────────────────────────────
      function buildPresetDropdown(groups) {
        const sel = $('#node-input-preset').empty();
        for (const g of groups) {
          const og = $('<optgroup></optgroup>').attr('label', g.group.charAt(0).toUpperCase() + g.group.slice(1));
          for (const p of g.presets) {
            const opt = $('<option></option>').val(p.id).text(`${p.name} (${p.commandId})`);
            og.append(opt);
          }
          sel.append(og);
        }
        // Re-apply the saved selection now that the options exist, then fire a
        // change so the param fields, delivery tiers, and safety notice render
        // for the saved preset. loadPresets is async on first open, so this
        // callback runs after the initial applyMode() left the dialog empty —
        // without this the exposed params stay stale until the user re-picks.
        sel.val(node.preset || 'arm');
        loadCommandsCatalog(function (catalog) {
          applyPresetOptionTips(sel, catalog);
          sel.trigger('change');
        });
      }

      /**
       * Dialect-sourced titles on preset <option>s and the select.
       *
       * @param {JQuery} [$sel]
       * @param {{commands?: Array}|null} [catalog]  when provided, paint only
       *   (no second loadCommandsCatalog — avoids racing refreshParamFields).
       */
      function applyPresetOptionTips($sel, catalog) {
        const sel = $sel && $sel.length ? $sel : $('#node-input-preset');
        if (!sel.length) return;
        function paint(cat) {
          if (!cat) return;
          const byId = {};
          (cat.commands || []).forEach(function (c) {
            byId[String(c.value)] = c.description || '';
          });
          sel.find('option').each(function () {
            const pid = $(this).val();
            const cid = presetCommandId(pid);
            const tip = cid != null ? byId[String(cid)] : '';
            if (tip) $(this).attr('title', tip);
            else $(this).removeAttr('title');
          });
          RED.mavlink.bindSelectTitleSync(sel, { namespace: 'mavPresetTip' });
        }
        if (catalog) {
          paint(catalog);
          return;
        }
        // One catalog load that does not gate control rendering.
        loadCommandsCatalog(paint);
      }

      /**
       * Refresh preset-option titles and parameter fields when Connection,
       * Vehicle, or delivery changes.
       */
      function refreshPresetTipsAndParams() {
        loadCommandsCatalog(function (catalog) {
          if ($('#node-input-mode').val() !== 'preset') return;
          applyPresetOptionTips(null, catalog);
          refreshParamFields();
        });
      }

      loadPresets(buildPresetDropdown);

      $('#node-input-preset').on('change', function () {
        refreshParamFields();
        refreshDelivery();
      });

      // ── Advanced MAV_CMD dropdown (§6 / §9 — every command in the dialect) ─
      function buildAdvancedDropdown(catalog) {
        if (!catalog) return;
        const sel = $('#node-input-advancedCommand');
        // preferLive: a Connection change mid-dialog must not snap the MAV_CMD
        // back to the pre-edit value.
        RED.mavlink.fillEnumSelect(sel, catalog.commands || [], {
          saved: node.advancedCommand,
          preferLive: true,
          allowEmpty: true,
          emptyLabel: '\u2014 select MAV_CMD \u2014',
          titleNamespace: 'mavCmdTip'
        });
      }

      function refreshAdvancedCommands() {
        loadCommandsCatalog(function (catalog) {
          if ($('#node-input-mode').val() !== 'advanced') return;
          buildAdvancedDropdown(catalog);
          refreshParamFields();
        });
      }

      $('#node-input-advancedCommand').on('change', function () {
        refreshParamFields();
        refreshDelivery();
      });

      // ── Delivery dropdown ──────────────────────────────────────────────────
      function refreshDelivery() {
        const hasConn = !!$('#node-input-connection').val();
        const mode = $('#node-input-mode').val();
        let hasCompletion = false;
        if (mode === 'preset') {
          hasCompletion = HAS_COMPLETION.has($('#node-input-preset').val());
        }

        const curDelivery = $('#node-input-delivery').val();
        const opts = deliveryOptions(hasConn, hasCompletion);
        const sel = $('#node-input-delivery').empty();
        for (const o of opts) {
          sel.append($('<option></option>').val(o.value).text(o.label));
        }
        // Preserve selection if still valid; else fall back to last available.
        if (opts.find((o) => o.value === curDelivery)) {
          sel.val(curDelivery);
        } else {
          sel.val(opts[opts.length - 1].value);
        }
        refreshCompletionRow();
      }

      $('#node-input-connection').on('change', function () {
        presetMessagesCatalog = null;
        _currentCmdCatalog = null;
        refreshDelivery();
        // Connection binds a Vehicle Profile → dialect; CompID + Advanced follow it.
        RED.mavlink.reloadTargetCompId(node, { field: 'targetComponent' });
        // Re-fill the identity dropdown for the newly selected connection.
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });

      $('#node-input-vehicle').on('change', function () {
        // Vehicle Profile change invalidates build-tier catalogs.
        if ($('#node-input-delivery').val() === 'build') {
          presetMessagesCatalog = null;
          _currentCmdCatalog = null;
          RED.mavlink.reloadTargetCompId(node, { field: 'targetComponent' });
          if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
          if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
        }
      });

      $('#node-input-delivery').on('change', function () {
        refreshCompletionRow();
        refreshVisibility();
        // Tier switch may change catalog source (build→vehicle, wire→connection).
        // Reload dialect data for the selected catalog source.
        presetMessagesCatalog = null;
        _currentCmdCatalog = null;
        RED.mavlink.reloadTargetCompId(node, { field: 'targetComponent' });
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });

      function refreshCompletionRow() {
        const isComplete = $('#node-input-delivery').val() === 'complete';
        $('#row-completion-timeout')[isComplete ? 'show' : 'hide']();
      }

      // ── Carrier (§9) ───────────────────────────────────────────────────────
      // Frame only exists on the COMMAND_INT wire message, so its row follows
      // the carrier choice.
      function refreshFrameRow() {
        const isInt = $('#node-input-sendAs').val() === 'int';
        $('#row-cmd-frame')[isInt ? 'show' : 'hide']();
      }
      $('#node-input-sendAs').on('change', refreshFrameRow);
      refreshFrameRow();

      // ── Param fields ───────────────────────────────────────────────────────
      let savedParams = {};
      try { savedParams = JSON.parse(node.params || '{}'); } catch (_e) {}
      let presetMessagesCatalog = null;

      const $dialect = $('#node-input-dialect');
      $dialect.on('change', function () {
        presetMessagesCatalog = null;
        _currentCmdCatalog = null;
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node, { field: 'targetComponent' });
        if ($('#node-input-mode').val() === 'advanced') refreshAdvancedCommands();
        if ($('#node-input-mode').val() === 'preset') refreshPresetTipsAndParams();
      });
      RED.mavlink.populateDialectSelect($dialect, { saved: node.dialect || '' });
      // Compid catalog must run after the dialect select is pinned (see
      // populateDialectSelect); the earlier CompID reload at prepare
      // start raced an empty select on Build.
      RED.mavlink.reloadTargetCompId(node, { field: 'targetComponent' });

      function loadPresetMessages(cb) {
        const target = RED.mavlink.resolveCatalogTarget();
        loadMessagesCatalog(function (catalog) {
          const currentTarget = RED.mavlink.resolveCatalogTarget();
          if (currentTarget.key !== target.key) return;
          presetMessagesCatalog = catalog || { messages: [] };
          cb();
        });
      }

      function needsPresetMessages(specs) {
        return specs.some(function (spec) { return !!spec.messages; });
      }

      function presetMessagesReady() {
        return !!presetMessagesCatalog;
      }

      function messageEntries(catalog) {
        return ((catalog && catalog.messages) || []).map(function (msg) {
          return {
            name: msg.name,
            value: msg.id,
            // label optional — fillEnumSelect falls back to enumOptionLabel
            label: msg.label,
            description: msg.description || null,
          };
        });
      }

      /** Look up a preset's numeric MAV_CMD id from the loaded presets API. */
      function presetCommandId(presetId) {
        const groups = _currentPresetGroups;
        for (let g = 0; g < groups.length; g++) {
          const presets = groups[g].presets || [];
          for (let i = 0; i < presets.length; i++) {
            if (presets[i].id === presetId) return presets[i].commandId;
          }
        }
        return null;
      }

      function catalogParamByIndex(catalog, commandId, index) {
        if (!catalog || commandId == null) return null;
        const cmd = (catalog.commands || []).find(function (c) {
          return String(c.value) === String(commandId);
        });
        if (!cmd) return null;
        return (cmd.params || []).find(function (p) {
          return Number(p.index) === Number(index);
        }) || null;
      }

      /**
       * Field label for one Advanced param under the §6 four-case rule
       * (caller has already filtered `hidden` / reserved / Empty).
       * @param {object} spec
       * @returns {string}
       */
      function advancedParamLabel(spec) {
        let label = spec.label || spec.description || ('param ' + spec.index);
        if (spec.units) label += ' (' + spec.units + ')';
        return label;
      }

      /**
       * Build the input control for one Advanced param: enum= → <select>,
       * otherwise a number field with units/range as constraints (§6).
       * @param {object} spec
       * @param {Object<string, Array>} enums
       * @param {string|number} commandId  the MAV_CMD being configured
       * @returns {HTMLElement|jQuery}
       */
      function advancedParamInput(spec, enums, commandId) {
        const saved = savedParams[spec.index];
        // DO_SET_MODE's custom_mode carries no `enum=` — its table is chosen
        // by airframe, not by command — so the profile names one here. Same
        // curated-by-(command, index) shape as magicBooleanValue below, and
        // it sits on the shared render path so Advanced mode reads the same
        // pulldown the Set Mode preset does.
        const enumName = spec.enum || RED.mavlink.customModeEnum(commandId, spec.index);
        if (enumName && enums[enumName] && enums[enumName].length) {
          const entries = enums[enumName];
          const falseTrue = RED.mavlink.isFalseTrueEnum(entries);
          if (falseTrue) {
            return RED.mavlink.booleanEnumInput(entries, {
              saved,
              title: spec.description || '',
              className: 'param-input',
            }).attr('data-idx', spec.index);
          }
          const isBitmask = !!spec.bitmask && !falseTrue;
          const sel = $('<select class="param-input"></select>')
            .attr('data-idx', spec.index)
            .attr('data-kind', falseTrue ? 'enum' : (isBitmask ? 'bitmask' : 'enum'))
            .attr('title', isBitmask ? RED.mavlink.bitmaskTitle(spec.description) : (spec.description || ''));
          // No blank option. An unset command param resolves to 0, and where
          // 0 is a real choice the dialect already enumerates it — MAV_ROI_NONE,
          // PARACHUTE_DISABLE, FAILURE_TYPE_OK. So blank was either a second
          // spelling of an entry that exists, or (ACCELCAL_VEHICLE_POS, which
          // starts at 1) a way to send a value the enum does not define.
          // Upstream marks genuinely unused params `Empty`/`reserved`, and
          // isHiddenParam drops those before they reach a control.
          if (isBitmask) {
            sel.attr('multiple', 'multiple').attr('size', Math.min(6, entries.length));
          }
          for (const entry of entries) {
            const $opt = $('<option></option>').val(String(entry.value)).text(falseTrue ? RED.mavlink.booleanEntryLabel(entry) : entry.label);
            if (entry.description) $opt.attr('title', entry.description);
            sel.append($opt);
          }
          if (isBitmask) {
            sel.val(RED.mavlink.selectedBitmaskValues(saved, entries));
          } else if (saved !== undefined && saved !== null && saved !== '') {
            // A saved value the table lacks — a newer firmware's mode, Blimp's
            // reserved 30, a dialect switch — must survive open-and-save, not
            // deselect to null and resolve to 0 on the wire (Codex #198). The
            // shared sentinel keeps it selectable until the operator changes it.
            RED.mavlink.ensureSavedEnumOption(sel, String(saved));
            sel.val(String(saved));
          }
          return sel;
        }
        // No enum, but upstream models this param as a magic number that is
        // really on/off (DESIGN.md §14). Value from the audited table; label
        // and hover text still come from the dialect.
        const magic = RED.mavlink.magicBooleanValue(commandId, spec.index);
        if (magic !== null) {
          return RED.mavlink.booleanEnumInput([], {
            saved,
            trueValue: magic,
            title: spec.description || '',
            className: 'param-input',
          }).attr('data-idx', spec.index);
        }
        const input = $('<input type="number" class="param-input">')
          .attr('data-idx', spec.index)
          .attr('title', spec.description || '')
          .val(saved !== undefined && saved !== null ? saved : '');
        if (spec.minValue !== null && spec.minValue !== undefined) input.attr('min', spec.minValue);
        if (spec.maxValue !== null && spec.maxValue !== undefined) input.attr('max', spec.maxValue);
        if (spec.increment !== null && spec.increment !== undefined) input.attr('step', spec.increment);
        return input;
      }

      /**
       * Preset param input: the message picker is the one preset-only control;
       * everything else renders through the same catalog-driven builder as
       * Advanced mode (§6 — one render path, the XML is the source).
       */
      function presetParamInput(spec, enums, commandId) {
        const saved = savedParams[spec.index];
        if (spec.messages) {
          const entries = messageEntries(presetMessagesCatalog);
          if (entries.length) {
            const sel = $('<select class="param-input"></select>')
              .attr('data-idx', spec.index)
              .attr('data-kind', 'enum');
            RED.mavlink.fillEnumSelect(sel, entries, {
              allowEmpty: true,
              emptyLabel: '\u2014 message \u2014',
              saved: saved,
            });
            return sel;
          }
        }
        // PX4's DO_SET_MODE dropdown lives on the preset surface only: in
        // Advanced mode param3 (custom submode) has its own dialect-rendered
        // number field, and a packed dropdown writing param3 behind it would
        // fight that control. The preset renders params 1\u20132, so the pair is
        // this control's to own (scrapeParamInputs splits it into 2 + 3).
        const px4Entries = RED.mavlink.px4ModeEntries(commandId, spec.index);
        if (px4Entries) {
          const $px4 = px4ModeInput(px4Entries);
          if ($px4) return $px4;
        }
        return advancedParamInput(spec, enums || {}, commandId);
      }

      /** Blank, or an integer the packed byte can hold \u2014 the pair the PX4
       * mode select can represent without rewriting it on save. */
      function px4ByteOrBlank(v) {
        if (v === undefined || v === null || v === '') return true;
        const n = Number(v);
        return Number.isInteger(n) && n >= 0 && n <= 255;
      }

      /**
       * The PX4 flight-mode select: options are the baked table, valued by
       * the packed custom_mode (unique per mode); the saved config carries
       * the decomposed pair the wire wants, recomposed here so open-and-save
       * round-trips. A saved pair the table lacks survives via the shared
       * sentinel \u2014 the same rule advancedParamInput applies to the AP mode
       * dropdown (Codex #198).
       *
       * A saved pair the packing cannot even represent (a hand-edited packed
       * word in param2, say) returns null instead — the raw number fields
       * keep it verbatim rather than silently rewriting it on Done.
       *
       * @param {Array<{name: string, value: number, label: string}>} entries
       * @returns {?jQuery}
       */
      function px4ModeInput(entries) {
        if (!px4ByteOrBlank(savedParams[2]) || !px4ByteOrBlank(savedParams[3])) return null;
        const sel = $('<select class="param-input"></select>')
          .attr('data-idx', 2)
          .attr('data-kind', 'px4mode')
          .attr('title', 'PX4 flight mode \u2014 saved as main mode (param 2) and sub mode (param 3)');
        for (const entry of entries) {
          sel.append($('<option></option>').val(String(entry.value)).text(entry.label));
        }
        const savedMain = savedParams[2];
        if (savedMain !== undefined && savedMain !== null && savedMain !== '') {
          const packed = RED.mavlink.px4PackCustomMode(
            Number(savedMain),
            Number(savedParams[3] !== undefined && savedParams[3] !== null && savedParams[3] !== '' ? savedParams[3] : 0)
          );
          RED.mavlink.ensureSavedEnumOption(sel, String(packed));
          sel.val(String(packed));
        }
        return sel;
      }

      function refreshParamFields() {
        container.empty();
        // True only when a real form (or a legitimate zero-param form) is on
        // screen; oneditsave refuses to scrape placeholders (Codex #36).
        node._mavParamsRendered = false;

        const mode = $('#node-input-mode').val();
        if (mode === 'advanced') {
          // Fields are created by selection (§6 / §9 Advanced): named params
          // from the dialect metadata — never a raw Param 1–7 grid.
          const catalog = _currentCmdCatalog;
          const cmdId = $('#node-input-advancedCommand').val();
          if (!catalog) {
            container.append($('<div class="form-row"><em>Loading command parameters\u2026</em></div>'));
            loadCommandsCatalog(function () {
              if ($('#node-input-mode').val() !== 'advanced') return;
              refreshParamFields();
            });
            return;
          }
          if (catalog.error && !(catalog.commands && catalog.commands.length)) {
            container.append($('<div class="form-row"><em>Could not load command parameters for this Vehicle dialect. Deploy the Vehicle Profile (required for custom dialects).</em></div>'));
            return;
          }
          if (!cmdId) {
            container.append($('<div class="form-row"><em>Select a MAV_CMD to configure parameters.</em></div>'));
            return;
          }
          const cmd = (catalog.commands || []).find(function (c) {
            return String(c.value) === String(cmdId);
          });
          if (!cmd) {
            container.append($('<div class="form-row"><em>Command not in this dialect.</em></div>'));
            return;
          }
          const visible = (cmd.params || []).filter(function (p) { return !p.hidden; });
          if (visible.length === 0) {
            container.append($('<div class="form-row"><em>No exposed parameters for this command.</em></div>'));
            node._mavParamsRendered = true;
            return;
          }
          for (const spec of visible) {
            container.append(formRow(advancedParamLabel(spec), advancedParamInput(spec, catalog.enums || {}, cmdId)));
          }
          node._mavParamsRendered = true;
        } else {
          const presetId = $('#node-input-preset').val();
          // A select with no option matching the saved preset leaves nothing
          // selected, so val() is null. The reachable cause is a failed preset
          // fetch: `loadPresets`'s .fail() hands back an empty group list, and
          // buildPresetDropdown then paints a select with no options at all.
          //
          // Null is NOT "this preset has no parameters". Treating it as such
          // rendered an empty form, marked it rendered, and let oneditsave
          // scrape zero `.param-input` fields over the saved blob — open the
          // node while the admin API is down, click Done, params gone.
          //
          // Same class as the rendered-guard itself (Codex #36) with a
          // different trigger — there the form had not rendered yet, here it
          // rendered nothing — so the answer is the same: leave the flag off
          // and oneditsave keeps its hands off the saved params.
          if (presetId === null || presetId === undefined) {
            container.append($('<div class="form-row"><em>The preset list could not be '
              + 'loaded, so this node\'s parameters cannot be shown. They are preserved; '
              + 'restore the preset list and reopen this dialog to edit them.</em></div>'));
            return;
          }
          const paramSpec = PRESET_PARAMS[presetId] || [];
          if (paramSpec.length === 0) {
            container.append($('<div class="form-row"><em>No exposed parameters for this preset.</em></div>'));
            node._mavParamsRendered = true;
            return;
          }
          if (needsPresetMessages(paramSpec) && !presetMessagesReady()) {
            container.append($('<div class="form-row"><em>Loading message list\u2026</em></div>'));
            loadPresetMessages(refreshParamFields);
            return;
          }
          // Params render from the commands catalog — the dialect XML is the
          // source for labels, units, enums, bitmask-ness, descriptions, and
          // ranges; PRESET_PARAMS only curates exposure and guidance (§6).
          // Paint from the catalog the loader hands back (Style C). oneditsave's
          // rendered-guard keeps a premature Done from scraping the empty form
          // (Codex #36).
          const commandId = presetCommandId(presetId);
          function renderPresetRows(catalog) {
            for (const spec of paramSpec) {
              // Curation keys override the catalog spec; omitted keys inherit.
              const merged = Object.assign({}, catalogParamByIndex(catalog, commandId, spec.index) || {}, spec);
              container.append(formRow(advancedParamLabel(merged), presetParamInput(merged, catalog.enums || {}, commandId)));
            }
            node._mavParamsRendered = true;
          }
          if (!_currentCmdCatalog) {
            container.append($('<div class="form-row"><em>Loading command parameters\u2026</em></div>'));
          }
          loadCommandsCatalog(function (cmdCatalog) {
            if ($('#node-input-mode').val() !== 'preset') return;
            if ($('#node-input-preset').val() !== presetId) return;
            container.empty();
            // An errored catalog renders the curated skeleton (labels and
            // numeric inputs) rather than an empty form.
            renderPresetRows(cmdCatalog || { commands: [], enums: {} });
          });
        }
      }

      // ── Safety preset notice ───────────────────────────────────────────────
      function refreshSafetyNotice() {
        const presetId = $('#node-input-preset').val();
        const isSafety = REQUIRES_CONFIRM.has(presetId) && $('#node-input-mode').val() !== 'advanced';
        $('#row-safety-notice')[isSafety ? 'show' : 'hide']();
      }

      $('#node-input-preset').on('change', refreshSafetyNotice);
      $('#node-input-mode').on('change', refreshSafetyNotice);

      // ── Initial state ──────────────────────────────────────────────────────
      RED.mavlink.refreshIdentitySelect(node);
      applyMode(node.mode || 'preset');
      refreshSafetyNotice();
      refreshCompletionRow();
      refreshVisibility();
    },

    oneditsave: function () {
      // Scrape only a rendered form. If Done lands while the catalog is still
      // loading (or an error placeholder is showing), the container holds no
      // inputs — scraping it would silently wipe the saved params (Codex #36).
      if (!this._mavParamsRendered) return;
      // Collect param values from the dynamic fields — the same scrape the
      // validator judges, so Done cannot write values the validator never saw.
      const params = scrapeParamInputs();
      // Write the hidden input, not `this.params`. Node-RED runs oneditsave
      // first, then its own edit pane walks `defaults` and copies
      // `#node-input-<key>` over the node property (editor red.js
      // handleEditSave → pane.apply). A `this.params` written here is
      // overwritten a moment later by the hidden field's *dialog-open* value,
      // so every param edit was silently discarded. Same shape as Build's
      // fields blob (mavlink-build.html:566).
      $('#node-input-params').val(JSON.stringify(params));
    },

    oneditcancel: function () {},
  });
}());
</script>

<script type="text/html" data-template-name="mavlink-command">
  <div class="form-row">
    <label for="node-input-name" style="width:120px"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="(optional)">
  </div>

  <div class="form-row">
    <label for="node-input-mode" style="width:120px">Mode</label>
    <select id="node-input-mode" style="width:200px">
      <option value="preset">Preset</option>
      <option value="advanced">Advanced (full MAV_CMD list)</option>
    </select>
  </div>

  <div class="form-row" id="row-preset">
    <label for="node-input-preset" style="width:120px">Preset</label>
    <select id="node-input-preset" style="width:240px"></select>
  </div>

  <div class="form-row" id="row-advanced" style="display:none">
    <label for="node-input-advancedCommand" style="width:120px">MAV_CMD</label>
    <select id="node-input-advancedCommand" style="width:280px"></select>
  </div>

  <!-- Safety notice for presets that require confirmation -->
  <div class="form-row" id="row-safety-notice"
       style="display:none;background:#fff3cd;border:1px solid #ffc107;padding:6px 10px;border-radius:3px">
    <i class="fa fa-warning" style="color:#e67e22"></i>
    <strong>Safety command</strong> — this preset sends Flight Termination.
  </div>

  <hr style="margin:8px 0">

  <div class="form-row">
    <label style="width:120px;font-weight:bold">Parameters</label>
  </div>
  <div id="node-input-params-container"></div>
  <!-- params JSON stored in hidden field; populated by oneditsave -->
  <input type="hidden" id="node-input-params">

  <hr style="margin:8px 0">

  <div class="form-row" id="row-cmd-dialect">
    <label for="node-input-dialect" style="width:120px">Dialect</label>
    <select id="node-input-dialect" style="width:240px"></select>
  </div>

  <div class="form-row" id="row-cmd-vehicle">
    <label for="node-input-vehicle" style="width:120px">Vehicle Profile</label>
    <input type="text" id="node-input-vehicle" style="width:240px">
  </div>

  <div class="form-row" id="row-cmd-connection">
    <label for="node-input-connection" style="width:120px">Connection</label>
    <input type="text" id="node-input-connection" style="width:240px">
  </div>

  <div class="form-row" id="row-cmd-identity">
    <label for="node-input-identity" style="width:120px">Identity</label>
    <select id="node-input-identity" style="width:240px"></select>
  </div>

  <div class="form-row">
    <label for="node-input-delivery" style="width:120px">Delivery</label>
    <select id="node-input-delivery" style="width:200px">
      <option value="build">Build</option>
      <option value="send">Send</option>
      <option value="confirm">Send &amp; confirm</option>
      <option value="complete">Send &amp; await completion</option>
    </select>
  </div>

  <div class="form-row" id="row-cmd-sendAs">
    <!-- Label says what the options are: the literal wire messages. "Carrier"
         was a metaphor the ecosystem doesn't share (-ai says "Send as"), and
         the word collided with Move's former protocol selector. -->
    <label for="node-input-sendAs" style="width:120px">Send as</label>
    <select id="node-input-sendAs" style="width:280px">
      <option value="int">COMMAND_INT (positional; degE7 on the wire)</option>
      <option value="long">COMMAND_LONG (float params)</option>
    </select>
  </div>

  <div class="form-row" id="row-cmd-frame" style="display:none">
    <label for="node-input-frame" style="width:120px">Frame</label>
    <select id="node-input-frame" style="width:280px">
      <option value="3">Global, relative alt (default)</option>
      <option value="0">Global, absolute alt (AMSL)</option>
      <option value="10">Global, terrain alt</option>
      <option value="1">Local NED (metres)</option>
    </select>
  </div>

  <div class="form-row" id="row-completion-timeout" style="display:none">
    <label for="node-input-completionTimeout" style="width:120px">Completion timeout</label>
    <input type="number" id="node-input-completionTimeout" style="width:80px"> ms
  </div>

  <hr style="margin:8px 0">

  <div class="form-row" id="row-cmd-target">
    <label for="node-input-targetSystem" style="width:120px">Target sysid</label>
    <input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)" style="width:80px">
    <label for="node-input-targetComponent" style="margin-left:10px;width:80px">Compid</label>
    <select id="node-input-targetComponent" style="width:80px"></select>
  </div>

  <div class="form-row" id="row-cmd-timeout">
    <label for="node-input-timeout" style="width:120px">ACK timeout</label>
    <input type="number" id="node-input-timeout" style="width:80px"> ms
  </div>

  <div class="form-row" id="row-cmd-maxRetries">
    <label for="node-input-maxRetries" style="width:120px">Max retries</label>
    <input type="number" id="node-input-maxRetries" style="width:60px">
    <span style="margin-left:6px;color:#888;font-size:11px">TEMPORARILY_REJECTED backoff</span>
  </div>

  <div class="form-row" id="row-cmd-unconfirmedContinue">
    <label style="width:120px">On timeout</label>
    <input type="checkbox" id="node-input-unconfirmedContinue" style="width:auto;margin-right:6px">
    <label for="node-input-unconfirmedContinue" style="width:auto">Continue chain if unconfirmed</label>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-command">
  <p>Sends a MAVLink <code>MAV_CMD</code> command with configurable delivery and confirmation.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | false</span></dt>
    <dd>
      When an object with numeric keys 1–7, those values override the configured
      command parameters for the matching param index.
      <code>false</code> suppresses the command (nothing is sent or emitted).
    </dd>
    <dt class="optional">payload.target <span class="property-type">object</span></dt>
    <dd>
      <code>{ sysid, compid }</code> — runtime override for the target address; takes
      precedence over every other resolution step including companion derivation.
    </dd>
    <dt class="optional">payload.identityId <span class="property-type">string</span></dt>
    <dd>Runtime override for the Identity row's Local Identity node id.</dd>
    <dt class="optional">payload.mode <span class="property-type">string</span></dt>
    <dd>
      Set Mode (<code>MAV_CMD_DO_SET_MODE</code>) only: a flight-mode name
      (<code>'GUIDED'</code>, <code>'Position'</code>) resolved into the
      custom-mode params — the vehicle's published <code>AVAILABLE_MODES</code>
      table first, then the profile's shipped table. Sets param1's
      custom-mode-enabled bit; an explicit numeric payload param still wins.
      A name nothing resolves rides as NaN and fails loudly at the wire.
    </dd>
    <dt class="optional">mavFrame <span class="property-type">number</span></dt>
    <dd>Per-message MAV_FRAME override for the COMMAND_INT carrier; takes
        precedence over the configured Frame.</dd>
  </dl>

  <h3>Send as</h3>
  <p>
    <b>Send as</b> defaults to COMMAND_INT; choose COMMAND_LONG only when needed.
    Positional parameters (latitude / longitude) are always entered in
    <b>decimal degrees</b>; the choice only changes how they travel:
  </p>
  <ul>
    <li><b>COMMAND_INT</b> — spec-preferred for positional commands: lat/lon are
        scaled to <code>degE7</code> integers (no float precision loss) and the
        coordinate <b>Frame</b> is explicit. Use this unless the vehicle only
        speaks COMMAND_LONG.</li>
    <li><b>COMMAND_LONG</b> — legacy float params; frame interpretation is
        implementation-dependent, and lat/lon lose precision (~1&nbsp;m) as
        float32.</li>
  </ul>
  <p>
    A vehicle that rejects the chosen carrier with
    <code>COMMAND_INT_ONLY</code> / <code>COMMAND_LONG_ONLY</code> triggers one
    automatic resend in the other form; the resend is rebuilt from the same
    degree-valued parameters.
  </p>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue
      <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The status record on success; the built carrier message
            (<code>COMMAND_INT</code> or <code>COMMAND_LONG</code>) in Build mode.</dd>
      </dl>
    </li>
    <li>Status — plain status object at the message root on every terminal outcome:
      <dl class="message-properties">
        <dt>result <span class="property-type">string</span></dt>
        <dd>Outcome name (<code>accepted</code>, <code>failed</code>, <code>unconfirmed</code>, …).</dd>
        <dt>resultCode <span class="property-type">number | null</span></dt>
        <dd>MAV_RESULT code when the outcome came from COMMAND_ACK.</dd>
        <dt>resultParam2 <span class="property-type">number | null</span></dt>
        <dd>The ack's <code>result_param2</code> — command-specific detail, often the
            reason for a denial; 0 when the vehicle reported nothing.
            <code>null</code> when no <i>terminal</i> ack arrived — a run that saw only
            <code>IN_PROGRESS</code> acks and then timed out reports <code>null</code> too,
            since the vehicle never stated a result.</dd>
        <dt>confirmedBy <span class="property-type">string</span></dt>
        <dd><code>ack</code>, <code>state</code>, or <code>none</code>.</dd>
        <dt>target <span class="property-type">object</span></dt>
        <dd>Resolved <code>{ sysid, compid }</code>.</dd>
        <dt>elapsed <span class="property-type">number</span></dt>
        <dd>Milliseconds from start to terminal outcome.</dd>
        <dt>retries <span class="property-type">number</span></dt>
        <dd>Re-transmissions beyond the first send — TEMPORARILY_REJECTED
            back-offs plus timeout re-sends.</dd>
        <dt>command <span class="property-type">string</span></dt>
        <dd>Friendly command name when known.</dd>
        <dt>commandId <span class="property-type">number</span></dt>
        <dd>MAV_CMD value.</dd>
        <dt>detail <span class="property-type">string | null</span></dt>
        <dd>Extra human-readable context.</dd>
      </dl>
    </li>
  </ol>

  <h3>Delivery tiers</h3>
  <ul>
    <li><b>Build</b> — construct the selected carrier message and emit on output 0; no send. Pick a bundled
        <em>Dialect</em>, or choose <em>from Vehicle Profile…</em> to use a custom XML dialect
        and that profile's default target. Identity and connection are not used.</li>
    <li><b>Send</b> — fire-and-forget; no acknowledgement waiting.</li>
    <li><b>Send &amp; confirm</b> (default) — wait for COMMAND_ACK; retry on TEMPORARILY_REJECTED,
        and for presets that tolerate re-issue re-send up to 3 times when a window closes with
        no ack at all. While the vehicle answers IN_PROGRESS the status badge shows the
        progress it reports.</li>
    <li><b>Send &amp; await completion</b> — after ACCEPTED, poll the peer table until the
        vehicle state satisfies the command's completion condition (Arm, Takeoff, Land, Set Mode).</li>
  </ul>
  <p>A broadcast target (sysid 0) is refused on <b>Send &amp; confirm</b> and
  <b>Send &amp; await completion</b>: one COMMAND_ACK cannot answer for a fleet, and the first
  vehicle to respond would settle the wait. Broadcast rides <b>Send</b> (fire-and-forget), or
  <b>mavlink-fanout</b> broadcast mode for per-vehicle acknowledgements.</p>

  <h3>Role × tier matrix</h3>
  <p>
    The dialog reshapes at edit time based on the selected delivery tier and identity role.
    At runtime only <code>msg.payload</code> can override values; hidden fields are not honored.
  </p>
  <ul>
    <li><b>Build tier</b>: Dialect row shown; Vehicle Profile row shown only when Dialect is
        <em>from Vehicle Profile…</em>. Connection, identity, timeout, and retry rows hidden.
        Target sysid/compid inherit from the Vehicle Profile only in that mode.</li>
    <li><b>Wire tiers</b> (Send / confirm / complete): Connection shown (required); the
        Identity row shown. Target rows follow the identity role:</li>
    <li><b>gcs / custom identity</b>: target sysid and compid shown; blank inherits the
        connection's vehicle profile default.</li>
    <li><b>companion identity</b>: target sysid and compid hidden — target is derived from
        the companion's airframe sysid and fixed compid 1.</li>
  </ul>

  <h3>Mode</h3>
  <p>
    <b>Preset</b> — hand-curated commands with pinned params and friendly names.
    <b>Advanced</b> — every <code>MAV_CMD</code> in the dialect as a dropdown; all
    params exposed. Build tier uses the Dialect picker; wire tiers use the
    bound connection's profile. Bitmask params render as multi-selects;
    Ctrl/Cmd-click multiple flags and the editor stores their numeric mask.
  </p>
  <p>
    <b>Set Mode</b>'s <i>Custom Mode</i> becomes a pulldown of the airframe's
    flight modes when the bound Vehicle Profile is ArduPilot and names a family
    — Copter, Plane, Rover, Boat, Sub, Blimp, or Antenna Tracker. Unknown and
    PX4 keep the number box: no table can be chosen for them. Remember that the
    autopilot only reads Custom Mode when <code>MAV_MODE_FLAG_CUSTOM_MODE_ENABLED</code>
    is set in <i>Mode</i>.
  </p>

  <h3>Details</h3>
  <p>
    Output 0 (continue) fires only on success — that is what stops a chain on failure.
    Wiring output 1 (status) into another action is not refused; suppress with
    <code>msg.payload === false</code> when you need an explicit hold.
  </p>
  <p>
    A silent ACK window is re-sent up to 3 times (idempotent recovery — a command
    lost on the way out and an ack lost on the way back are indistinguishable).
    Only presets whose entry allows auto-retry do this: commands that never
    auto-retry, and every <b>Advanced</b>-mode command (a raw MAV_CMD id says nothing
    about whether re-issuing it is safe), are sent once. Any ACK at all — including
    IN_PROGRESS — also ends re-sending. After the final window the node
    checks the peer table. If the completion condition is satisfied, the command is
    confirmed by observed state. Otherwise the result is <em>unconfirmed</em>;
    output 0 does not fire unless <em>Continue chain if unconfirmed</em> is enabled.
  </p>
  <p>
    COMMAND_ACK matching keys on the same resolved target as the send: a companion
    identity's derived address <code>{airframe sysid, 1}</code> is used for both sending
    and settling the acknowledgement transaction.
  </p>
</script>
