<script type="text/javascript">
  (function () {
    const logDefaults = {
      name: { value: '' },
      connection: RED.mavlink.connectionDefault(),
      identity: {
        value: '',
        type: 'mavlink-local-identity',
        validate: RED.mavlink.identityOverrideValidator(),
      },
      operation: { value: 'list', validate: RED.mavlink.oneOf(['list', 'download']) },
      logId: {
        value: '',
        validate(v, opt) {
          if (RED.mavlink.liveOr(this, '#node-input-operation', this.operation, 'list') !== 'download') return true;
          return RED.mavlink.validateIntRange(0, 65535).call(this, v, opt);
        },
      },
      targetSystem: {
        value: '',
        validate: RED.mavlink.validateTargetSystem(['confirm'], 'delivery', 'confirm'),
      },
      targetComponent: { value: 1, required: true, validate: RED.mavlink.validateUint8(1) },
      ...RED.mavlink.ackDefaults(RED.mavlink.ackRowsOnWire),
    };

    RED.nodes.registerType('mavlink-log', {
      category: 'mavlink',
      paletteLabel: 'log',
      color: '#e6e6ff',
      defaults: logDefaults,
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-arrow-down',
      label() { return this.name || `log ${this.operation || 'list'}`; },
      oneditprepare() {
        const node = this;
        const $operation = $('#node-input-operation');
        const refresh = () => {
          const operation = $operation.val() || 'list';
          $('#row-log-id').toggle(operation === 'download');
          $('#row-identity').toggle(
            RED.mavlink.hasIdentityChoice($('#node-input-connection').val() || '')
          );
        };

        $operation.on('change', refresh);
        $('#node-input-connection').on('change', () => {
          RED.mavlink.refreshIdentitySelect(node);
          refresh();
          RED.mavlink.reloadTargetCompId(node);
        });
        RED.mavlink.refreshIdentitySelect(node);
        RED.mavlink.reloadTargetCompId(node);
        refresh();
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-log">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-identity"><label for="node-input-identity">Identity</label><select id="node-input-identity"></select></div>
  <div class="form-row"><label for="node-input-operation">Operation</label><select id="node-input-operation"><option value="list">List logs</option><option value="download">Download log</option></select></div>
  <div class="form-row" id="row-log-id"><label for="node-input-logId">Log id</label><input type="number" id="node-input-logId" min="0" max="65535" step="1" placeholder="msg.payload.id"></div>
  <div class="form-row"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <div class="form-row" id="row-timeoutMs"><label for="node-input-timeoutMs">Step timeout (ms)</label><input type="number" id="node-input-timeoutMs" min="1" step="1" placeholder="10000"></div>
  <div class="form-row" id="row-maxRetries"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" min="0" step="1" placeholder="3"></div>
</script>

<script type="text/html" data-help-name="mavlink-log">
  <p>Lists onboard logs or downloads one selected log with the MAVLink log transfer protocol. Output 0 (continue) fires after success; output 1 (status) carries retry, data, and terminal records.</p>
  <p><b>List logs</b> sends <code>LOG_REQUEST_LIST</code> and returns the complete <code>LOG_ENTRY</code> collection. The entry <code>size</code> is a vehicle estimate and is informational.</p>
  <p><b>Download log</b> selects the id from the config field or <code>msg.payload.id</code>. Output 0 is a Buffer in <code>msg.payload</code> with <code>msg.logId</code>; connect a Node-RED File node when the bytes should be saved. The transfer follows <code>LOG_DATA</code> offsets, retries only missing ranges, and ends on a short data packet or zero-count EOF. If a peer returns full packets without an end marker, a timeout retry probes the next range for EOF.</p>
  <p><b>Addressing</b> uses the selected Connection and target. Source sysid and component must match the target before a log reply can advance the operation. The node runs the bounded exchange and reports protocol failures on its status output.</p>
  <p>Set <code>msg.payload === false</code> to suppress an operation. Cancellation during node close sends <code>LOG_REQUEST_END</code> so the vehicle can resume normal logging.</p>
</script>
