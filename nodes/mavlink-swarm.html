<script type="text/javascript">
  RED.nodes.registerType('mavlink-swarm', {
    category: 'mavlink',
    color: '#ffe6cc',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection', required: true },
      selectionMode: { value: 'all' },
      sysids: { value: '' },
      vehicleType: { value: '' },
      firmwareFilter: { value: '' },
      armedFilter: { value: '' },
      executionMode: { value: 'sequential' },
      intervalMs: { value: 100, validate: RED.validators.number() },
      dryRun: { value: false },
      confirm: { value: false },
      delivery: { value: 'build' },
      actionType: { value: 'command' },
      commandId: { value: 400, validate: RED.validators.number() },
      preset: { value: '' },
      params: { value: '{}' },
      moveMode: { value: 'local-position' },
      north: { value: 0, validate: RED.validators.number(true) },
      east: { value: 0, validate: RED.validators.number(true) },
      up: { value: 0, validate: RED.validators.number(true) },
      lat: { value: '', validate: RED.validators.number(true) },
      lon: { value: '', validate: RED.validators.number(true) },
      alt: { value: '', validate: RED.validators.number(true) },
      topic: { value: 'camera' },
      verb: { value: 'photo' },
      path: { value: 'legacy' },
      paramAction: { value: 'set' },
      paramId: { value: '' },
      value: { value: '', validate: RED.validators.number(true) },
      paramType: { value: 'MAV_PARAM_TYPE_REAL32' },
      firmware: { value: 'ardupilot' },
      timeoutMs: { value: 10000, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-sitemap',
    label: function () { return this.name || 'mavlink swarm'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      }

      RED.mavlink = RED.mavlink || {};
      if (!RED.mavlink.PAYLOAD_VERBS) {
        RED.mavlink.PAYLOAD_VERBS = {
          camera: [
            { value: 'photo', label: 'Photo' },
            { value: 'start-video', label: 'Start video' },
            { value: 'stop-video', label: 'Stop video' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'trigger-distance', label: 'Trigger by distance' }
          ],
          gimbal: [
            { value: 'aim', label: 'Aim' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'roi-set', label: 'ROI set' },
            { value: 'roi-clear', label: 'ROI clear' }
          ],
          servo: [
            { value: 'set', label: 'Set' },
            { value: 'repeat', label: 'Repeat' }
          ],
          release: [
            { value: 'gripper', label: 'Gripper' },
            { value: 'winch', label: 'Winch' },
            { value: 'parachute', label: 'Parachute' }
          ]
        };
      }

      function refreshVerbOptions(useSaved) {
        var topic = $('#node-input-topic').val() || 'camera';
        var verbs = RED.mavlink.PAYLOAD_VERBS[topic] || [];
        var $verb = $('#node-input-verb');
        var saved = useSaved ? (node.verb || $verb.val()) : $verb.val();
        $verb.empty();
        for (var i = 0; i < verbs.length; i++) {
          var entry = verbs[i];
          $verb.append($('<option></option>').val(entry.value).text(entry.label));
        }
        var valid = verbs.some(function (v) { return v.value === saved; });
        $verb.val(valid ? saved : (verbs[0] ? verbs[0].value : ''));
      }

      $('#node-input-topic').on('change', function () {
        refreshVerbOptions(false);
      });
      refreshVerbOptions(true);

      var _msgCatalogByKey = {};
      var _msgRequestSeq = 0;
      var _cmdCatalogByKey = {};
      var _cmdRequestSeq = 0;

      function resolveCatalogTarget() {
        var connId = $('#node-input-connection').val();
        var vehicleId = '';
        var dialect = 'ardupilotmega';
        if (connId && RED.nodes && RED.nodes.node) {
          var conn = RED.nodes.node(connId);
          if (conn && conn.vehicle) {
            vehicleId = conn.vehicle;
            var vehicle = RED.nodes.node(vehicleId);
            if (vehicle && vehicle.dialect) dialect = vehicle.dialect;
          }
        }
        if (vehicleId) {
          return {
            key: 'vehicle:' + vehicleId,
            query: { vehicle: vehicleId, dialect: dialect },
            dialect: dialect,
          };
        }
        return {
          key: 'dialect:' + dialect,
          query: { dialect: dialect },
          dialect: dialect,
        };
      }

      function loadMessagesCatalog(cb) {
        var target = resolveCatalogTarget();
        // Always advance the seq so an in-flight request for another Connection
        // cannot overwrite this catalog after a cache hit.
        var seq = ++_msgRequestSeq;
        if (_msgCatalogByKey[target.key]) {
          cb(_msgCatalogByKey[target.key]);
          return;
        }
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/build/messages'), target.query, function (data) {
          if (seq !== _msgRequestSeq) return;
          var catalog = {
            messages: data.messages || [],
            enums: data.enums || {},
            dialect: data.dialect || target.dialect,
          };
          _msgCatalogByKey[target.key] = catalog;
          cb(catalog);
        }).fail(function () {
          if (seq !== _msgRequestSeq) return;
          cb({ messages: [], enums: {}, dialect: target.dialect });
        });
      }

      function buildVehicleTypeDropdown(catalog) {
        if (!catalog) return;
        var entries = (catalog.enums && catalog.enums.MAV_TYPE) || [];
        var sel = $('#node-input-vehicleType');
        var current = sel.val();
        var saved = node.vehicleType !== undefined && node.vehicleType !== null
          ? String(node.vehicleType)
          : '';
        var prefer = current || saved;

        sel.empty();
        sel.append($('<option></option>').val('').text('Any type'));
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          sel.append($('<option></option>').val(String(entry.value)).text(entry.label));
        }
        if (prefer && !sel.find('option[value="' + prefer + '"]').length) {
          sel.append($('<option></option>').val(prefer).text('#' + prefer + ' (not in dialect)'));
        }
        if (prefer) sel.val(prefer);
      }

      function loadCommandsCatalog(cb) {
        var target = resolveCatalogTarget();
        var seq = ++_cmdRequestSeq;
        if (_cmdCatalogByKey[target.key]) {
          cb(_cmdCatalogByKey[target.key]);
          return;
        }
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/command/commands'), target.query, function (data) {
          if (seq !== _cmdRequestSeq) return;
          var catalog = {
            commands: data.commands || [],
            enums: data.enums || {},
            dialect: data.dialect || target.dialect,
          };
          _cmdCatalogByKey[target.key] = catalog;
          cb(catalog);
        }).fail(function () {
          if (seq !== _cmdRequestSeq) return;
          cb({ commands: [], enums: {}, dialect: target.dialect });
        });
      }

      function buildCommandDropdown(catalog) {
        var sel = $('#node-input-commandId');
        var current = sel.val();
        var saved = node.commandId !== undefined && node.commandId !== null
          ? String(node.commandId)
          : '';
        var prefer = current || saved;

        sel.empty();
        for (var i = 0; i < (catalog.commands || []).length; i++) {
          var entry = catalog.commands[i];
          sel.append($('<option></option>').val(String(entry.value)).text(entry.label));
        }
        if (prefer && !sel.find('option[value="' + prefer + '"]').length) {
          sel.append($('<option></option>').val(prefer).text('#' + prefer + ' (not in dialect)'));
        }
        if (prefer) sel.val(prefer);
        else if (catalog.commands && catalog.commands.length) sel.val(String(catalog.commands[0].value));
      }

      function refreshVehicleTypeOptions() {
        loadMessagesCatalog(buildVehicleTypeDropdown);
      }

      function refreshCommandOptions() {
        loadCommandsCatalog(buildCommandDropdown);
      }

      $('#node-input-connection').on('change', function () {
        refreshVehicleTypeOptions();
        refreshCommandOptions();
      });
      refreshVehicleTypeOptions();
      refreshCommandOptions();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-swarm">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-selectionMode">Selection</label><select id="node-input-selectionMode"><option value="all">All active vehicles</option><option value="list">Explicit sysid list</option><option value="filter">Filter</option></select></div>
  <div class="form-row"><label for="node-input-sysids">Sysids</label><input type="text" id="node-input-sysids" placeholder="1,2,3"></div>
  <div class="form-row"><label for="node-input-vehicleType">Type filter</label><select id="node-input-vehicleType"></select></div>
  <div class="form-row"><label for="node-input-firmwareFilter">Firmware</label><select id="node-input-firmwareFilter"><option value="">Any</option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row"><label for="node-input-armedFilter">Armed</label><select id="node-input-armedFilter"><option value="">Any</option><option value="true">Armed</option><option value="false">Disarmed</option></select></div>
  <div class="form-row"><label for="node-input-executionMode">Execution</label><select id="node-input-executionMode"><option value="sequential">Sequential</option><option value="broadcast">Broadcast</option></select></div>
  <div class="form-row"><label for="node-input-intervalMs">Interval ms</label><input type="number" id="node-input-intervalMs" min="0"></div>
  <div class="form-row"><label for="node-input-dryRun">Dry run</label><input type="checkbox" id="node-input-dryRun" style="display:inline-block;width:auto;"></div>
  <div class="form-row"><label for="node-input-confirm">Confirm</label><input type="checkbox" id="node-input-confirm" style="display:inline-block;width:auto;"> <span>Allow safety commands (Flight Termination)</span></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row"><label for="node-input-actionType">Action</label><select id="node-input-actionType"><option value="command">Command</option><option value="move">Move</option><option value="payload">Payload</option><option value="param">Param set</option><option value="mission">Mission (refused)</option></select></div>
  <div class="form-row"><label for="node-input-commandId">Command</label><select id="node-input-commandId" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-params">Params JSON</label><input type="text" id="node-input-params" placeholder='{"1":1}'></div>
  <div class="form-row"><label for="node-input-moveMode">Move mode</label><select id="node-input-moveMode"><option value="local-position">Local position</option><option value="local-velocity">Local velocity</option><option value="global-position">Global position</option></select></div>
  <div class="form-row"><label for="node-input-north">North</label><input type="number" id="node-input-north"></div>
  <div class="form-row"><label for="node-input-east">East</label><input type="number" id="node-input-east"></div>
  <div class="form-row"><label for="node-input-up">Up</label><input type="number" id="node-input-up"></div>
  <div class="form-row"><label for="node-input-lat">Latitude</label><input type="number" id="node-input-lat"></div>
  <div class="form-row"><label for="node-input-lon">Longitude</label><input type="number" id="node-input-lon"></div>
  <div class="form-row"><label for="node-input-alt">Altitude</label><input type="number" id="node-input-alt"></div>
  <div class="form-row"><label for="node-input-topic">Payload topic</label><select id="node-input-topic"><option value="camera">Camera</option><option value="gimbal">Gimbal</option><option value="servo">Servo</option><option value="release">Release</option></select></div>
  <div class="form-row"><label for="node-input-verb">Payload verb</label><select id="node-input-verb"></select></div>
  <div class="form-row"><label for="node-input-path">Payload path</label><select id="node-input-path"><option value="legacy">Legacy</option><option value="manager">Gimbal manager</option></select></div>
  <div class="form-row"><label for="node-input-paramId">Param id</label><input type="text" id="node-input-paramId" maxlength="16"></div>
  <div class="form-row"><label for="node-input-value">Param value</label><input type="number" id="node-input-value"></div>
  <div class="form-row"><label for="node-input-paramType">Param type</label><select id="node-input-paramType"><option value="MAV_PARAM_TYPE_REAL32">REAL32 (9)</option><option value="MAV_PARAM_TYPE_UINT8">UINT8 (1)</option><option value="MAV_PARAM_TYPE_INT8">INT8 (2)</option><option value="MAV_PARAM_TYPE_UINT16">UINT16 (3)</option><option value="MAV_PARAM_TYPE_INT16">INT16 (4)</option><option value="MAV_PARAM_TYPE_UINT32">UINT32 (5)</option><option value="MAV_PARAM_TYPE_INT32">INT32 (6)</option></select></div>
  <div class="form-row"><label for="node-input-timeoutMs">Timeout ms</label><input type="number" id="node-input-timeoutMs" min="1"></div>
</script>

<script type="text/html" data-help-name="mavlink-swarm">
  <p>Fans one single-message MAVLink action out across the active vehicles selected from a Connection peer table.</p>
  <p>Sequential mode sends one targeted message per member at the configured interval. Broadcast mode sends one packet with target_system 0 and target_component 1.</p>
  <p>Output 0 fires only when every member succeeds. Output 1 always carries the aggregate status with per-vehicle detail. Mission actions and parameter list requests are refused.</p>
  <p>Broadcast requires the <i>All active vehicles</i> selection: a broadcast packet reaches every vehicle on the link, so it cannot honour a filtered or explicit-list subset. Use sequential fan-out for a subset.</p>
  <p>Safety commands (Flight Termination) are refused unless the <b>Confirm</b> box is ticked or <code>msg.confirmed = true</code> is set.</p>
</script>
