<script type="text/javascript">
  RED.nodes.registerType('mavlink-swarm', {
    category: 'mavlink',
    color: '#ffe6cc',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection', required: false },
      dialect: {
        value: '',
        validate: function (v) {
          var $delivery = $('#node-input-delivery');
          var delivery = ($delivery && $delivery.length) ? $delivery.val() : (this.delivery || 'build');
          var $selectionMode = $('#node-input-selectionMode');
          var selectionMode = ($selectionMode && $selectionMode.length)
            ? $selectionMode.val()
            : (this.selectionMode || 'all');
          if (delivery === 'build' && selectionMode === 'list') return !!v;
          return true;
        },
      },
      vehicle: {
        value: '',
        type: 'mavlink-vehicle',
        required: false,
        validate: function (v) {
          var $delivery = $('#node-input-delivery');
          var delivery = ($delivery && $delivery.length) ? $delivery.val() : (this.delivery || 'build');
          var $selectionMode = $('#node-input-selectionMode');
          var selectionMode = ($selectionMode && $selectionMode.length)
            ? $selectionMode.val()
            : (this.selectionMode || 'all');
          var $dialect = $('#node-input-dialect');
          var dialect = ($dialect && $dialect.length && $dialect.val()) ? $dialect.val() : (this.dialect || '');
          if (delivery === 'build' && selectionMode === 'list' && dialect === '__vehicle') return !!v;
          return true;
        },
      },
      identity: { value: '' },
      selectionMode: { value: 'all' },
      sysids: {
        value: '',
        validate: function (v) {
          // Empty is fine when Selection isn't "list"; when the field is filled
          // (or list mode is active) every token must be a MAVLink sysid.
          if (v === undefined || v === null || String(v).trim() === '') return true;
          return String(v).split(',').every(function (part) {
            part = part.trim();
            if (!part) return true;
            var n = Number(part);
            return Number.isInteger(n) && n >= 1 && n <= 255;
          });
        },
      },
      vehicleType: { value: '' },
      firmwareFilter: { value: '' },
      armedFilter: { value: '' },
      executionMode: { value: 'sequential' },
      intervalMs: { value: 100, validate: RED.validators.number() },
      dryRun: { value: false },
      confirm: { value: false },
      delivery: { value: 'build' },
      actionType: { value: 'command' },
      // Required for command actions and command-backed payload verbs (§9):
      // no default wire form. Move and Param actions carry no MAV_CMD, and
      // message-kind payload verbs (gimbal manager aiming) never consult the
      // carrier, so a blank carrier is fine for those (Codex review on #61).
      carrier: { value: '', validate: function (v) {
        // Live selectors first, saved values as fallback (house pattern, see
        // the dialect validator above): this.* is stale during in-dialog
        // validation.
        var $type = $('#node-input-actionType');
        var t = ($type && $type.length) ? $type.val() : (this.actionType || 'command');
        if (t !== 'command' && t !== 'payload') return true;
        if (t === 'payload') {
          var $topic = $('#node-input-topic');
          var topic = ($topic && $topic.length) ? $topic.val() : (this.topic || 'camera');
          var $verb = $('#node-input-verb');
          var verb = ($verb && $verb.length) ? $verb.val() : (this.verb || '');
          var $path = $('#node-input-path');
          var path = ($path && $path.length) ? $path.val() : (this.path || 'legacy');
          if (RED.mavlink.payloadVerbIgnoresCarrier(topic, verb, path)) return true;
        }
        return v === 'int' || v === 'long';
      } },
      frame: { value: '' },
      commandId: { value: 400, validate: RED.validators.number() },
      preset: { value: '' },
      // Free-text JSON: the editor is the loud-failure point — the runtime
      // mergeParams treats unparseable saved JSON as empty (§2 config trust).
      params: { value: '{}', validate: function (v) {
        if (!v) return true;
        try { JSON.parse(v); return true; } catch (_e) { return false; }
      } },
      moveMode: { value: 'local-position' },
      north: { value: 0, validate: RED.validators.number(true) },
      east: { value: 0, validate: RED.validators.number(true) },
      up: { value: 0, validate: RED.validators.number(true) },
      lat: { value: '', validate: RED.validators.number(true) },
      lon: { value: '', validate: RED.validators.number(true) },
      alt: { value: '', validate: RED.validators.number(true) },
      topic: { value: 'camera' },
      verb: { value: 'photo' },
      path: { value: 'legacy' },
      paramAction: { value: 'set' },
      paramId: { value: '' },
      value: { value: '', validate: RED.validators.number(true) },
      paramType: { value: 'MAV_PARAM_TYPE_REAL32' },
      firmware: { value: 'ardupilot' },
      timeoutMs: { value: 10000, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-sitemap',
    label: function () { return this.name || 'mavlink swarm'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
      }

      $('#node-input-topic').on('change', function () {
        RED.mavlink.refreshVerbOptions();
        refreshCarrierRows();
      });
      $('#node-input-verb').on('change', refreshCarrierRows);
      $('#node-input-path').on('change', refreshCarrierRows);
      RED.mavlink.refreshVerbOptions({ saved: node.verb });

      var _msgCatalog = { byKey: {}, seq: 0 };
      var _cmdCatalog = { byKey: {}, seq: 0 };

      // Swarm's Build path is narrower than the shared rule: the Dialect picker
      // only governs when Delivery is Build AND Selection is an explicit list;
      // every other combination reads the connection's profile (§6). Feed that
      // as the isBuild override into the shared loadCatalog / resolver.
      function swarmIsBuildList() {
        var delivery = $('#node-input-delivery').val() || 'build';
        var selectionMode = $('#node-input-selectionMode').val() || 'all';
        return delivery === 'build' && selectionMode === 'list';
      }

      function loadMessagesCatalog(cb) {
        RED.mavlink.loadCatalog('/mavlink/build/messages', _msgCatalog, cb, {
          isBuild: swarmIsBuildList(),
          listKey: 'messages'
        });
      }

      function buildVehicleTypeDropdown(catalog) {
        if (!catalog) return;
        var sel = $('#node-input-vehicleType');
        var prefer = sel.val() || (
          node.vehicleType !== undefined && node.vehicleType !== null
            ? String(node.vehicleType)
            : ''
        );
        RED.mavlink.fillEnumSelect(sel, (catalog.enums && catalog.enums.MAV_TYPE) || [], {
          saved: prefer,
          allowEmpty: true,
          emptyLabel: 'Any type',
          titleNamespace: 'mavTypeTip',
          triggerChange: false
        });
      }

      function loadCommandsCatalog(cb) {
        RED.mavlink.loadCatalog('/mavlink/command/commands', _cmdCatalog, cb, {
          isBuild: swarmIsBuildList(),
          listKey: 'commands'
        });
      }

      function buildCommandDropdown(catalog) {
        var sel = $('#node-input-commandId');
        var prefer = sel.val() || (
          node.commandId !== undefined && node.commandId !== null
            ? String(node.commandId)
            : ''
        );
        RED.mavlink.fillEnumSelect(sel, catalog.commands || [], {
          saved: prefer,
          titleNamespace: 'mavCmdTip',
          triggerChange: false
        });
      }

      function refreshVehicleTypeOptions() {
        loadMessagesCatalog(buildVehicleTypeDropdown);
      }

      function refreshCommandOptions() {
        loadCommandsCatalog(buildCommandDropdown);
      }

      function refreshVisibility() {
        var d = $('#node-input-delivery').val() || 'build';
        var sel = $('#node-input-selectionMode').val() || 'all';
        // Swarm's Build path for this matrix is the narrow Build+list case
        // (same isBuild override resolveCatalogTarget already takes).
        var isBuildList = d === 'build' && sel === 'list';
        var dialect = $('#node-input-dialect').val() || node.dialect || '';
        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuildList,
          dialect: dialect,
          dialectRow: '#row-swarm-dialect',
          vehicleRow: '#row-swarm-vehicle',
          connectionRow: '#row-swarm-connection'
        });
        $('#row-swarm-identity').toggle(d !== 'build');
      }

      function refreshCatalogsAndVisibility() {
        refreshVehicleTypeOptions();
        refreshCommandOptions();
        refreshVisibility();
      }

      var $dialect = $('#node-input-dialect');
      $dialect.on('change', refreshCatalogsAndVisibility);
      if (RED.mavlink && RED.mavlink.populateDialectSelect) {
        RED.mavlink.populateDialectSelect($dialect, {
          saved: node.dialect || '',
          includeVehicleEscape: true
        });
      }
      $('#node-input-vehicle').on('change', function () {
        refreshVehicleTypeOptions();
        refreshCommandOptions();
      });
      $('#node-input-connection').on('change', function () {
        refreshVehicleTypeOptions();
        refreshCommandOptions();
        RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
        refreshVisibility();
      });
      $('#node-input-delivery').on('change', refreshCatalogsAndVisibility);
      $('#node-input-selectionMode').on('change', refreshCatalogsAndVisibility);

      // ── Carrier (§9) ───────────────────────────────────────────────────────
      // Carrier applies to anything riding a MAV_CMD: command actions and
      // command-backed payload verbs. Message-kind payload verbs (gimbal
      // manager aiming) ignore it. Frame only exists on COMMAND_INT.
      function refreshCarrierRows() {
        var t = $('#node-input-actionType').val() || 'command';
        var usesCarrier = t === 'command' ||
          (t === 'payload' && !RED.mavlink.payloadVerbIgnoresCarrier(
            $('#node-input-topic').val() || 'camera',
            $('#node-input-verb').val() || '',
            $('#node-input-path').val() || 'legacy'
          ));
        $('#row-swarm-carrier').toggle(usesCarrier);
        $('#row-swarm-frame').toggle(usesCarrier && $('#node-input-carrier').val() === 'int');
      }
      $('#node-input-carrier').on('change', refreshCarrierRows);
      $('#node-input-actionType').on('change', refreshCarrierRows);
      refreshCarrierRows();
      refreshVehicleTypeOptions();
      refreshCommandOptions();
      RED.mavlink.refreshIdentitySelect(node, { rolesAllowed: ['gcs', 'custom'] });
      refreshVisibility();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-swarm">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-swarm-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-swarm-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-swarm-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-swarm-identity"><label for="node-input-identity">Send as</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-selectionMode">Selection</label><select id="node-input-selectionMode"><option value="all">All active vehicles</option><option value="list">Explicit sysid list</option><option value="filter">Filter</option></select></div>
  <div class="form-row"><label for="node-input-sysids">Sysids</label><input type="text" id="node-input-sysids" placeholder="1,2,3"></div>
  <div class="form-row"><label for="node-input-vehicleType">Type filter</label><select id="node-input-vehicleType"></select></div>
  <div class="form-row"><label for="node-input-firmwareFilter">Firmware</label><select id="node-input-firmwareFilter"><option value="">Any</option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row"><label for="node-input-armedFilter">Armed</label><select id="node-input-armedFilter"><option value="">Any</option><option value="true">Armed</option><option value="false">Disarmed</option></select></div>
  <div class="form-row"><label for="node-input-executionMode">Execution</label><select id="node-input-executionMode"><option value="sequential">Sequential</option><option value="broadcast">Broadcast</option></select></div>
  <div class="form-row"><label for="node-input-intervalMs">Interval ms</label><input type="number" id="node-input-intervalMs" min="0"></div>
  <div class="form-row"><label for="node-input-dryRun">Dry run</label><input type="checkbox" id="node-input-dryRun" style="display:inline-block;width:auto;"></div>
  <div class="form-row"><label for="node-input-confirm">Confirm</label><input type="checkbox" id="node-input-confirm" style="display:inline-block;width:auto;"> <span>Allow safety commands (Flight Termination)</span></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row"><label for="node-input-actionType">Action</label><select id="node-input-actionType"><option value="command">Command</option><option value="move">Move</option><option value="payload">Payload</option><option value="param">Param set</option><option value="mission">Mission (refused)</option></select></div>
  <div class="form-row"><label for="node-input-commandId">Command</label><select id="node-input-commandId" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-params">Params JSON</label><input type="text" id="node-input-params" placeholder='{"1":1}'></div>
  <div class="form-row" id="row-swarm-carrier"><label for="node-input-carrier">Carrier</label><select id="node-input-carrier" style="width:70%"><option value="">&mdash; select carrier &mdash;</option><option value="int">COMMAND_INT (positional; degE7 on the wire)</option><option value="long">COMMAND_LONG (float params)</option></select></div>
  <div class="form-row" id="row-swarm-frame" style="display:none"><label for="node-input-frame">Frame</label><select id="node-input-frame" style="width:70%"><option value="">Global, absolute alt (default)</option><option value="3">Global, relative alt</option><option value="10">Global, terrain alt</option><option value="1">Local NED (metres)</option></select></div>
  <div class="form-row"><label for="node-input-moveMode">Move mode</label><select id="node-input-moveMode"><option value="local-position">Local position</option><option value="local-velocity">Local velocity</option><option value="global-position">Global position</option></select></div>
  <div class="form-row"><label for="node-input-north">North</label><input type="number" id="node-input-north"></div>
  <div class="form-row"><label for="node-input-east">East</label><input type="number" id="node-input-east"></div>
  <div class="form-row"><label for="node-input-up">Up</label><input type="number" id="node-input-up"></div>
  <div class="form-row"><label for="node-input-lat">Latitude</label><input type="number" id="node-input-lat"></div>
  <div class="form-row"><label for="node-input-lon">Longitude</label><input type="number" id="node-input-lon"></div>
  <div class="form-row"><label for="node-input-alt">Altitude</label><input type="number" id="node-input-alt"></div>
  <div class="form-row"><label for="node-input-topic">Payload topic</label><select id="node-input-topic"><option value="camera">Camera</option><option value="gimbal">Gimbal</option><option value="servo">Servo</option><option value="release">Release</option></select></div>
  <div class="form-row"><label for="node-input-verb">Payload verb</label><select id="node-input-verb"></select></div>
  <div class="form-row"><label for="node-input-path">Payload path</label><select id="node-input-path"><option value="legacy">Legacy</option><option value="manager">Gimbal manager</option></select></div>
  <div class="form-row"><label for="node-input-paramId">Param id</label><input type="text" id="node-input-paramId" maxlength="16"></div>
  <div class="form-row"><label for="node-input-value">Param value</label><input type="number" id="node-input-value"></div>
  <div class="form-row"><label for="node-input-paramType">Param type</label><select id="node-input-paramType"><option value="MAV_PARAM_TYPE_REAL32">REAL32 (9)</option><option value="MAV_PARAM_TYPE_UINT8">UINT8 (1)</option><option value="MAV_PARAM_TYPE_INT8">INT8 (2)</option><option value="MAV_PARAM_TYPE_UINT16">UINT16 (3)</option><option value="MAV_PARAM_TYPE_INT16">INT16 (4)</option><option value="MAV_PARAM_TYPE_UINT32">UINT32 (5)</option><option value="MAV_PARAM_TYPE_INT32">INT32 (6)</option></select></div>
  <div class="form-row"><label for="node-input-timeoutMs">Timeout ms</label><input type="number" id="node-input-timeoutMs" min="1"></div>
</script>

<script type="text/html" data-help-name="mavlink-swarm">
  <p>Fans one single-message MAVLink action out across the active vehicles selected from a Connection peer table.</p>
  <p>Sequential mode sends one targeted message per member at the configured interval. Broadcast mode sends one packet with target_system 0 and target_component 1.</p>
  <p>Output 0 fires only when every member succeeds. Output 1 always carries the aggregate status with per-vehicle detail. Mission actions and parameter list requests are refused.</p>
  <p>The <b>Carrier</b> field is required for Command actions and command-backed
  Payload verbs (§9) — message-kind payload verbs (gimbal manager aiming) ignore it:
  <code>COMMAND_INT</code> scales positional params from decimal degrees to
  <code>degE7</code> integers with an explicit <b>Frame</b>;
  <code>COMMAND_LONG</code> sends float params. Positional values are always
  entered in decimal degrees. <code>msg.payload.carrier</code> and
  <code>msg.payload.mavFrame</code> override per message.</p>
  <p><b>Send as</b> — selects the GCS or custom identity that stamps source SysID/CompID on outbound frames. Only identities with a <code>gcs</code> or <code>custom</code> role are offered. Hidden on Build delivery (source ids are stamped at the wire by the sending node).</p>
  <p>The Connection is not required when Delivery is <b>Build</b> and Selection is <b>Explicit sysid list</b> — the list resolves without a live peer table. All other combinations (all/filter even in Build) still require a Connection because the peer table is the only place those selections resolve.</p>
  <p>Broadcast requires the <i>All active vehicles</i> selection: a broadcast packet reaches every vehicle on the link, so it cannot honour a filtered or explicit-list subset. Use sequential fan-out for a subset.</p>
  <p>Safety commands (Flight Termination) are refused unless the <b>Confirm</b> box is ticked or <code>msg.confirmed = true</code> is set.</p>
</script>
