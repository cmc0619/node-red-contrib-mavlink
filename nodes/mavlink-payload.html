<script type="text/javascript">
  // The form body is generated from /mavlink/payload/field-tips: labels, units,
  // ranges, defaults, enums and bitmask-ness come from the dialect the vehicle
  // actually speaks (§6 — no baked protocol copy in editor HTML). Topic and
  // Verb pick the recipe; everything below them is painted from the answer.
  (function () {
    var payloadDefaults = Object.assign(
      {
        name: { value: '' },
        connection: { value: '', type: 'mavlink-connection' },
        identity: { value: '' },
        delivery: { value: 'build' },
        carrier: { value: 'int' },
        frame: { value: '' },
        timeout: { value: 10000, validate: RED.validators.number(true) },
        maxRetries: { value: 3, validate: RED.validators.number(true) },
        topic: { value: 'camera' },
        verb: { value: 'photo' },
        path: { value: 'legacy' },
        targetSystem: { value: '', validate: RED.mavlink.validateUint8(0) },
        targetComponent: { value: '', validate: RED.validators.number(true) },
        // One object, not a field per slot: rows are generated per verb, so
        // there is no #node-input-<slot> for Node-RED to read at save time.
        values: { value: {} }
      },
      RED.mavlink.buildTierDialectDefaults()
    );

    /** Fold a multi-select bitmask's selected values into one number. */
    function maskOf(raw) {
      var values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      if (!values.length) return '';
      var mask = 0n;
      values.forEach(function (value) { mask = mask | BigInt(String(value)); });
      return Number(mask);
    }

    /**
     * Label for a field the dialect does not name. Command params carry a
     * `label`; message fields (gimbal manager aiming) do not, so the recipe's
     * own key is all there is. Spacing and case only — nothing invented.
     */
    function humanize(key) {
      return key
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/^./, function (c) { return c.toUpperCase(); });
    }

    /** Read the generated rows back into a plain values object. */
    function collectValues() {
      var values = {};
      $('#payload-fields .mav-payload-field').each(function () {
        var $input = $(this);
        var key = $input.attr('data-field');
        if (!key) return;
        var kind = $input.attr('data-kind') || 'number';
        if (kind === 'boolean') {
          values[key] = RED.mavlink.booleanEnumValue($input);
          return;
        }
        if (kind === 'bitmask') {
          values[key] = maskOf($input.val());
          return;
        }
        values[key] = $input.val();
      });
      return values;
    }

    function preparePayload(node) {
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
      RED.mavlink.refreshIdentitySelect(node);

      // The saved values, used to paint the verb this node was saved on.
      // Nothing is carried across a selection change: a value typed into one
      // verb's field has no meaning in the next verb's, and `mode` / `action`
      // are shared keys whose enums differ per device. Pick a new verb and you
      // get that verb's defaults.
      var stash = Object.assign({}, node.values);
      var seq = 0;

      function selection() {
        return {
          topic: $('#node-input-topic').val() || 'camera',
          verb: $('#node-input-verb').val() || '',
          path: $('#node-input-path').val() || 'legacy'
        };
      }

      function isBuild() {
        return ($('#node-input-delivery').val() || 'build') === 'build';
      }

      function forgetValues() {
        Object.keys(stash).forEach(function (k) { delete stash[k]; });
      }

      function notice(text) {
        $('#payload-fields').empty()
          .append($('<div class="form-row"></div>').append($('<em></em>').text(text)));
      }

      /** One control, shaped by the metadata (§6): enum → select, FALSE/TRUE →
       *  checkbox, bitmask → multi-select, everything else → number. */
      function fieldInput(key, meta, entries) {
        var stashed = stash[key];
        var blank = stashed === undefined || stashed === null || stashed === '';
        // A control that must land on something — a pulldown, a checkbox, a
        // bitmask — takes the recipe default when unset. A number box does
        // not: see below.
        var saved = blank
          ? (meta.default === null || meta.default === undefined ? '' : meta.default)
          : stashed;
        var $input;
        if (entries && entries.length) {
          if (RED.mavlink.isFalseTrueEnum(entries)) {
            $input = RED.mavlink.booleanEnumInput(entries, {
              saved: saved,
              title: meta.description || ''
            });
          } else if (meta.bitmask) {
            $input = $('<select style="width:70%"></select>')
              .attr('data-kind', 'bitmask')
              .attr('multiple', 'multiple')
              .attr('size', Math.min(6, entries.length))
              .attr('title', RED.mavlink.bitmaskTitle(meta.description));
            entries.forEach(function (entry) {
              $input.append($('<option></option>')
                .val(String(entry.value))
                .text(entry.label || entry.name));
            });
            $input.val(RED.mavlink.selectedBitmaskValues(saved, entries));
          } else {
            // No blank option: every slot has a recipe default, so blank would
            // only be a second spelling of it.
            $input = $('<select style="width:70%"></select>').attr('data-kind', 'enum');
            RED.mavlink.fillEnumSelect($input, entries, { saved: saved });
          }
        } else {
          // Numbers stay blank when unset. buildPayloadMessage resolves a blank
          // slot to the recipe default, so the wire is identical either way,
          // and an empty box does not assert a number the dialect may disagree
          // with — three recipe defaults sit below their param's stated `min`.
          //
          // No `min` attribute for the same reason: upstream's minimums are
          // advisory and sometimes contradict their own prose
          // (IMAGE_START_CAPTURE sequence is min=1 with a description that says
          // to set 0). `max` stays — the only two are cameraId=255, a real
          // uint8 ceiling.
          $input = $('<input type="number" style="width:110px">')
            .attr('step', meta.increment !== null && meta.increment !== undefined ? meta.increment : 'any')
            .attr('title', meta.description || '')
            .val(blank ? '' : stashed);
          if (meta.maxValue !== null && meta.maxValue !== undefined) $input.attr('max', meta.maxValue);
        }
        return $input.addClass('mav-payload-field').attr('data-field', key);
      }

      function renderFields(data) {
        var $box = $('#payload-fields').empty();
        var fields = (data && data.fields) || {};
        var enums = (data && data.enums) || {};
        // The route emits the recipe's own slot order (param1..param7), which
        // is how the protocol reads: lat, lon, alt — not alphabetically.
        var keys = Object.keys(fields);
        if (!keys.length) {
          notice('No parameters for this verb.');
          return;
        }
        keys.forEach(function (key) {
          var meta = fields[key] || {};
          var $row = $('<div class="form-row"></div>');
          $row.append($('<label></label>').text(meta.label || humanize(key)));
          $row.append(fieldInput(key, meta, meta.enum ? enums[meta.enum] : null));
          if (meta.units) $row.append($('<span></span>').text(' ' + meta.units));
          $box.append($row);
        });
      }

      // §6 hidden is not honored: a control the operator cannot see must not
      // put anything on the wire, so the frame row clears itself on the way
      // out rather than saving whatever was left in it.
      function applyFrameRow(carrierShown) {
        var shown = carrierShown && $('#node-input-carrier').val() === 'int';
        if (!shown) $('#node-input-frame').val('');
        $('#row-payload-frame').toggle(shown);
      }

      // Carrier is observable only when the command carries a location; for
      // everything else COMMAND_INT and COMMAND_LONG are byte-identical in
      // params 1–4. Pin the hidden control to what is actually sent so §6's
      // "hidden is not honored" holds without a runtime branch.
      function applyCarrier(data) {
        var sel = selection();
        var matters = !RED.mavlink.payloadVerbIgnoresCarrier(sel.topic, sel.verb, sel.path)
          && !!(data && data.carrierMatters);
        if (!matters) $('#node-input-carrier').val('int');
        $('#row-payload-carrier').toggle(matters);
        applyFrameRow(matters);
      }

      function refreshFields() {
        var sel = selection();
        if (!sel.verb) {
          notice('Pick a verb.');
          return;
        }
        var query = RED.mavlink.currentCatalogQuery() || {};
        if (isBuild() && !(query.dialect || query.vehicle)) {
          notice('Pick a Dialect or Vehicle Profile to load this verb’s parameters.');
          return;
        }
        query.topic = sel.topic;
        query.verb = sel.verb;
        query.path = sel.path;
        var mine = ++seq;
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/payload/field-tips'), query, function (data) {
          if (mine !== seq) return;
          renderFields(data);
          applyCarrier(data);
        }).fail(function () {
          if (mine !== seq) return;
          notice('Could not load parameters for this verb.');
        });
      }

      /**
       * §6: only the rows for the selected verb, delivery tier and identity
       * role exist. Build → vehicle shown, connection/identity/timeout hidden;
       * wire tiers the reverse. Companion (wire) hides target sysid; compid
       * stays visible because it addresses a payload device, not the autopilot.
       */
      function refreshVisibility() {
        var build = isBuild();
        var isWire = !build;
        RED.mavlink.applyCompanionTargetVisibility({
          isBuild: build,
          identityId: isWire ? $('#node-input-identity').val() : '',
          hideCompidWhenCompanion: false,
          targetSystemRow: '#row-payload-targetSystem',
          targetComponentRow: '#row-payload-targetComponent'
        });
        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: build,
          dialect: $('#node-input-dialect').val() || '',
          dialectRow: '#row-payload-dialect',
          vehicleRow: '#row-payload-vehicle',
          connectionRow: '#row-payload-connection'
        });
        $('#row-payload-identity').toggle(isWire);
        $('#row-payload-timeout').toggle(isWire);
        $('#row-payload-maxRetries').toggle(isWire);

        var sel = selection();
        // Gripper, winch and parachute have one command each, so their verb
        // select would offer a single choice. A control with nothing to decide
        // is noise; the value is still stamped by refreshVerbOptions.
        $('#row-payload-verb').toggle(
          (RED.mavlink.PAYLOAD_VERBS[sel.topic] || []).length > 1
        );
        $('#row-payload-path').toggle(sel.topic === 'gimbal' && sel.verb === 'aim');
      }

      // Target compid addresses the payload device, so the topic names it:
      // MAV_COMP_ID_CAMERA.., GIMBAL.., WINCH, PARACHUTE. Suggested, not
      // filtered — a gripper has no component of its own and servo outputs
      // belong to the autopilot.
      function reloadCompIds() {
        RED.mavlink.reloadTargetCompId(node, { suggest: selection().topic });
      }

      function reselect() {
        forgetValues();
        refreshVisibility();
        refreshFields();
      }

      // Topics come from the shared verb table, not a baked <option> list (§6).
      // A topic is a device: camera, gimbal, servo, gripper, winch, parachute.
      var $topic = $('#node-input-topic');
      Object.keys(RED.mavlink.PAYLOAD_VERBS).forEach(function (topic) {
        $topic.append($('<option></option>').val(topic).text(humanize(topic)));
      });
      $topic.val(node.topic || 'camera');
      if (!$topic.val()) $topic.val('camera');

      $topic.on('change', function () {
        RED.mavlink.refreshVerbOptions();
        reselect();
        reloadCompIds();
      });
      $('#node-input-verb').on('change', reselect);
      $('#node-input-path').on('change', reselect);

      $('#node-input-carrier').on('change', function () {
        applyFrameRow($('#row-payload-carrier').is(':visible'));
      });
      $('#node-input-delivery').on('change', function () {
        refreshVisibility();
        refreshFields();
        reloadCompIds();
      });
      $('#node-input-identity').on('change', refreshVisibility);
      $('#node-input-connection').on('change', function () {
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        refreshFields();
        reloadCompIds();
      });
      $('#node-input-vehicle').on('change', function () {
        refreshFields();
        reloadCompIds();
      });
      var $dialect = $('#node-input-dialect');
      $dialect.on('change', function () {
        refreshVisibility();
        refreshFields();
        reloadCompIds();
      });
      RED.mavlink.populateDialectSelect($dialect, {
        saved: node.dialect || '',
        includeVehicleEscape: true
      });

      node._payloadSave = function () {
        return Object.assign({}, stash, collectValues());
      };

      RED.mavlink.refreshVerbOptions({ saved: node.verb });
      refreshVisibility();
      refreshFields();
      reloadCompIds();
    }

    RED.nodes.registerType('mavlink-payload', {
      category: 'mavlink',
      paletteLabel: 'payload',
      color: '#ffe8d8',
      defaults: payloadDefaults,
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-camera',
      label: function () { return this.name || 'mavlink payload'; },
      oneditprepare: function () { preparePayload(this); },
      oneditsave: function () {
        // Only the prepared closure knows whether the mounted rows belong to
        // the current selection; without it there is nothing safe to scrape.
        if (typeof this._payloadSave === 'function') this.values = this._payloadSave();
      }
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-payload">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-payload-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-payload-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-payload-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-payload-identity"><label for="node-input-identity">Send as</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send &amp; confirm</option></select></div>
  <div class="form-row" id="row-payload-carrier"><label for="node-input-carrier">Carrier</label><select id="node-input-carrier" style="width:70%"><option value="int">COMMAND_INT (positional; degE7 on the wire)</option><option value="long">COMMAND_LONG (float params)</option></select></div>
  <div class="form-row" id="row-payload-frame" style="display:none"><label for="node-input-frame">Frame</label><select id="node-input-frame" style="width:70%"><option value="">Global, absolute alt (default)</option><option value="3">Global, relative alt</option><option value="10">Global, terrain alt</option><option value="1">Local NED (metres)</option></select></div>
  <div class="form-row" id="row-payload-timeout"><label for="node-input-timeout">ACK timeout</label><input type="number" id="node-input-timeout" style="width:80px"> ms</div>
  <div class="form-row" id="row-payload-maxRetries"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" style="width:60px"></div>
  <div class="form-row"><label for="node-input-topic">Topic</label><select id="node-input-topic"></select></div>
  <div class="form-row" id="row-payload-verb"><label for="node-input-verb">Verb</label><select id="node-input-verb"></select></div>
  <div class="form-row" id="row-payload-path"><label for="node-input-path">Gimbal path</label><select id="node-input-path"><option value="legacy">DO_MOUNT_CONTROL</option><option value="manager">GIMBAL_MANAGER_SET_PITCHYAW</option></select></div>
  <div class="form-row" id="row-payload-targetSystem"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row" id="row-payload-targetComponent"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <div id="payload-fields"></div>
</script>

<script type="text/html" data-help-name="mavlink-payload">
  <p>Controls camera, gimbal, servo, gripper, winch and parachute payload verbs. Command-backed verbs report command acknowledgement as their confirmation mode.</p>
  <p>A <b>Topic</b> is a device on the airframe; a <b>Verb</b> is what to do with it. Topic and verb reshape the form (§6): only the parameters for the selected verb are shown, and their labels, units, enum choices and any real ceiling come from the Vehicle's dialect rather than this page. A blank number sends that parameter's recipe default; the dialect's advisory minimums are not enforced, because upstream sometimes contradicts them in its own description text. Gripper, winch and parachute have a single verb each, so their Verb row is hidden.</p>
  <p>The <b>Carrier</b> field appears only when the choice is observable — a command the dialect marks as carrying a location, i.e. gimbal ROI-set. Elsewhere <code>COMMAND_INT</code> and <code>COMMAND_LONG</code> pass params 1–4 identically, so the node sends <code>COMMAND_INT</code>. Positional values — e.g. ROI latitude / longitude — are always entered in decimal degrees regardless of carrier. <code>msg.payload.carrier</code> and <code>msg.payload.mavFrame</code> override per message. Message-kind verbs (gimbal manager aiming) never ride a MAV_CMD.</p>
  <p>On <b>Build</b> delivery the Dialect picker supplies editor catalogs. Choose <i>from Vehicle Profile…</i> to use a profile dialect and target defaults; a concrete dialect has no profile target rung. On <b>Send</b> or <b>Send &amp; confirm</b> delivery a Connection is required. The Send-as identity drives target addressing: a companion identity derives the target sysid from its airframe; the target compid remains visible and config-resolved because it addresses a payload device (camera or gimbal), not the autopilot.</p>
  <p>On the <b>Send &amp; confirm</b> tier a command-backed verb waits for its <code>COMMAND_ACK</code>: output 0 (continue) fires only on <code>ACCEPTED</code>, and a <code>DENIED</code>, <code>TEMPORARILY_REJECTED</code>, or timeout halts the chain and reports on output 1.</p>
  <p>Gimbal manager aiming uses GIMBAL_MANAGER_SET_PITCHYAW and has no MAVLink acknowledgement, so it is always sent unconfirmed.</p>
</script>
