<script type="text/javascript">
  RED.nodes.registerType('mavlink-payload', {
    category: 'mavlink',
    color: '#ffe8d8',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection' },
      dialect: {
        value: '',
        validate: function (v) {
          var $delivery = $('#node-input-delivery');
          var delivery = ($delivery && $delivery.length) ? $delivery.val() : (this.delivery || 'build');
          if (delivery === 'build') return !!v;
          return true;
        }
      },
      vehicle: {
        value: '',
        type: 'mavlink-vehicle',
        required: false,
        validate: function (v) {
          var $delivery = $('#node-input-delivery');
          var delivery = ($delivery && $delivery.length) ? $delivery.val() : (this.delivery || 'build');
          var $dialect = $('#node-input-dialect');
          var dialect = ($dialect && $dialect.length && $dialect.val()) ? $dialect.val() : (this.dialect || '');
          if (delivery === 'build' && dialect === '__vehicle') return !!v;
          return true;
        }
      },
      identity: { value: '' },
      delivery: { value: 'build' },
      timeout: { value: 10000, validate: RED.validators.number(true) },
      maxRetries: { value: 3, validate: RED.validators.number(true) },
      topic: { value: 'camera' },
      verb: { value: 'photo' },
      path: { value: 'legacy' },
      targetSystem: { value: '', validate: RED.mavlink.validateUint8(0) },
      targetComponent: { value: '', validate: RED.validators.number(true) },
      /* camera photo */
      cameraId: { value: 0, validate: RED.validators.number(true) },
      count: { value: 1, validate: RED.validators.number(true) },
      interval: { value: 0, validate: RED.validators.number(true) },
      sequence: { value: 0, validate: RED.validators.number(true) },
      /* camera start/stop video */
      streamId: { value: 0, validate: RED.validators.number(true) },
      statusFrequency: { value: 0, validate: RED.validators.number(true) },
      /* camera trigger-distance */
      distance: { value: 0, validate: RED.validators.number(true) },
      shutter: { value: 0, validate: RED.validators.number(true) },
      trigger: { value: 1, validate: RED.validators.number(true) },
      /* gimbal aim */
      pitch: { value: 0, validate: RED.validators.number(true) },
      roll: { value: 0, validate: RED.validators.number(true) },
      yaw: { value: 0, validate: RED.validators.number(true) },
      pitchRate: { value: 0, validate: RED.validators.number(true) },
      yawRate: { value: 0, validate: RED.validators.number(true) },
      flags: { value: 0, validate: RED.validators.number(true) },
      gimbalDeviceId: { value: 0, validate: RED.validators.number(true) },
      /* gimbal set-mode */
      modeValue: { value: 0, validate: RED.validators.number(true) },
      stabilizeRoll: { value: 0, validate: RED.validators.number(true) },
      stabilizePitch: { value: 0, validate: RED.validators.number(true) },
      stabilizeYaw: { value: 0, validate: RED.validators.number(true) },
      /* gimbal roi-set */
      lat: { value: 0, validate: RED.validators.number(true) },
      lon: { value: 0, validate: RED.validators.number(true) },
      alt: { value: 0, validate: RED.validators.number(true) },
      /* servo */
      servo: { value: 0, validate: RED.validators.number(true) },
      pwm: { value: 0, validate: RED.validators.number(true) },
      period: { value: 0, validate: RED.validators.number(true) },
      /* release */
      instance: { value: 0, validate: RED.validators.number(true) },
      actionValue: { value: 0, validate: RED.validators.number(true) },
      length: { value: 0, validate: RED.validators.number(true) },
      rate: { value: 0, validate: RED.validators.number(true) }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-camera',
    label: function () { return this.name || 'mavlink payload'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
        RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');
      }

      if (RED.mavlink && RED.mavlink.fillIdentitySelect) {
        RED.mavlink.fillIdentitySelect(
          $('#node-input-identity'),
          node.connection,
          { saved: node.identity }
        );
      }

      RED.mavlink = RED.mavlink || {};
      if (!RED.mavlink.PAYLOAD_VERBS) {
        RED.mavlink.PAYLOAD_VERBS = {
          camera: [
            { value: 'photo', label: 'Photo' },
            { value: 'start-video', label: 'Start video' },
            { value: 'stop-video', label: 'Stop video' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'trigger-distance', label: 'Trigger by distance' }
          ],
          gimbal: [
            { value: 'aim', label: 'Aim' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'roi-set', label: 'ROI set' },
            { value: 'roi-clear', label: 'ROI clear' }
          ],
          servo: [
            { value: 'set', label: 'Set' },
            { value: 'repeat', label: 'Repeat' }
          ],
          release: [
            { value: 'gripper', label: 'Gripper' },
            { value: 'winch', label: 'Winch' },
            { value: 'parachute', label: 'Parachute' }
          ]
        };
      }

      var PAYLOAD_ENUM_NAMES = [
        'CAMERA_MODE',
        'MAV_MOUNT_MODE',
        'GRIPPER_ACTIONS',
        'WINCH_ACTIONS',
        'PARACHUTE_ACTION'
      ];
      var RELEASE_ACTION_ENUMS = {
        gripper: 'GRIPPER_ACTIONS',
        winch: 'WINCH_ACTIONS',
        parachute: 'PARACHUTE_ACTION'
      };
      var MODE_ENUMS = {
        camera: 'CAMERA_MODE',
        gimbal: 'MAV_MOUNT_MODE'
      };
      var FALLBACK_ENUMS = {
        GRIPPER_ACTIONS: [
          { name: 'GRIPPER_ACTIONS_RELEASE', value: 0, label: 'GRIPPER_ACTIONS_RELEASE (0)' },
          { name: 'GRIPPER_ACTIONS_GRAB', value: 1, label: 'GRIPPER_ACTIONS_GRAB (1)' },
          { name: 'GRIPPER_ACTIONS_HOLD', value: 2, label: 'GRIPPER_ACTIONS_HOLD (2)' }
        ],
        WINCH_ACTIONS: [
          { name: 'WINCH_ACTIONS_RELAXED', value: 0, label: 'WINCH_ACTIONS_RELAXED (0)' },
          { name: 'WINCH_ACTIONS_RELATIVE_LENGTH_CONTROL', value: 1, label: 'WINCH_ACTIONS_RELATIVE_LENGTH_CONTROL (1)' },
          { name: 'WINCH_ACTIONS_RATE_CONTROL', value: 2, label: 'WINCH_ACTIONS_RATE_CONTROL (2)' },
          { name: 'WINCH_ACTIONS_LOCK', value: 3, label: 'WINCH_ACTIONS_LOCK (3)' },
          { name: 'WINCH_ACTIONS_DELIVER', value: 4, label: 'WINCH_ACTIONS_DELIVER (4)' },
          { name: 'WINCH_ACTIONS_HOLD', value: 5, label: 'WINCH_ACTIONS_HOLD (5)' },
          { name: 'WINCH_ACTIONS_RETRACT', value: 6, label: 'WINCH_ACTIONS_RETRACT (6)' },
          { name: 'WINCH_ACTIONS_LOAD_LINE', value: 7, label: 'WINCH_ACTIONS_LOAD_LINE (7)' },
          { name: 'WINCH_ACTIONS_ABANDON_LINE', value: 8, label: 'WINCH_ACTIONS_ABANDON_LINE (8)' },
          { name: 'WINCH_ACTIONS_LOAD_PAYLOAD', value: 9, label: 'WINCH_ACTIONS_LOAD_PAYLOAD (9)' }
        ],
        PARACHUTE_ACTION: [
          { name: 'PARACHUTE_ACTION_DISABLE', value: 0, label: 'PARACHUTE_ACTION_DISABLE (0)' },
          { name: 'PARACHUTE_ACTION_ENABLE', value: 1, label: 'PARACHUTE_ACTION_ENABLE (1)' },
          { name: 'PARACHUTE_ACTION_RELEASE', value: 2, label: 'PARACHUTE_ACTION_RELEASE (2)' }
        ]
      };
      var enumCatalog = { enums: {} };
      var enumCatalogLoaded = false;
      var enumRequestSeq = 0;
      var tipRequestSeq = 0;
      var paintedModeEnum = null;
      var paintedReleaseEnum = null;
      /**
       * Numeric / text payload fields that take command/message param tips.
       * Enum <select>s (modeValue, actionValue) keep fillEnumSelect titles —
       * do not clear/overwrite them here (CodeRabbit #36).
       */
      var TIP_FIELDS = [
        'cameraId', 'count', 'interval', 'sequence',
        'streamId', 'statusFrequency',
        'distance', 'shutter', 'trigger',
        'pitch', 'roll', 'yaw', 'pitchRate', 'yawRate',
        'flags', 'gimbalDeviceId',
        'stabilizeRoll', 'stabilizePitch', 'stabilizeYaw',
        'lat', 'lon', 'alt',
        'servo', 'pwm', 'period',
        'instance', 'length', 'rate'
      ];

      function isBuildDelivery() {
        return ($('#node-input-delivery').val() || 'build') === 'build';
      }

      function hasCatalogTarget(query) {
        return !!(query && (query.dialect || query.vehicle));
      }

      function catalogQuery() {
        if (RED.mavlink && typeof RED.mavlink.currentCatalogQuery === 'function') {
          return RED.mavlink.currentCatalogQuery();
        }
        return {};
      }

      function clearPayloadFieldTips() {
        if (!(RED.mavlink && typeof RED.mavlink.applyFieldMeta === 'function')) return;
        for (var i = 0; i < TIP_FIELDS.length; i++) {
          RED.mavlink.applyFieldMeta('node-input-' + TIP_FIELDS[i], null);
        }
      }

      /**
       * Join PAYLOAD_RECIPES to dialect description + units via
       * /mavlink/payload/field-tips — never bake protocol copy into HTML (§6).
       */
      function refreshPayloadFieldTips() {
        if (!(RED.mavlink && typeof RED.mavlink.adminApiUrl === 'function')) return;
        if (typeof RED.mavlink.applyFieldMeta !== 'function') return;
        var topic = $('#node-input-topic').val() || 'camera';
        var verb = $('#node-input-verb').val() || '';
        var path = $('#node-input-path').val() || 'legacy';
        if (!verb) {
          clearPayloadFieldTips();
          return;
        }
        var query = catalogQuery();
        if (isBuildDelivery() && !hasCatalogTarget(query)) {
          clearPayloadFieldTips();
          return;
        }
        query.topic = topic;
        query.verb = verb;
        query.path = path;
        var seq = ++tipRequestSeq;
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/payload/field-tips'), query, function (data) {
          if (seq !== tipRequestSeq) return;
          clearPayloadFieldTips();
          var fields = (data && data.fields) || {};
          for (var i = 0; i < TIP_FIELDS.length; i++) {
            var name = TIP_FIELDS[i];
            var meta = fields[name];
            if (meta) RED.mavlink.applyFieldMeta('node-input-' + name, meta);
          }
        }).fail(function () {
          if (seq !== tipRequestSeq) return;
          clearPayloadFieldTips();
        });
      }

      function loadPayloadEnums(cb) {
        if (enumCatalogLoaded) {
          cb();
          return;
        }
        if (isBuildDelivery() && !hasCatalogTarget(catalogQuery())) {
          enumCatalogLoaded = true;
          enumCatalog = { enums: {} };
          cb();
          return;
        }
        if (!(RED.mavlink && typeof RED.mavlink.loadEnumsCatalog === 'function')) {
          enumCatalogLoaded = true;
          enumCatalog = { enums: {} };
          cb();
          return;
        }
        var seq = ++enumRequestSeq;
        RED.mavlink.loadEnumsCatalog(PAYLOAD_ENUM_NAMES, function (catalog) {
          if (seq !== enumRequestSeq) return;
          enumCatalog = catalog || { enums: {} };
          enumCatalogLoaded = true;
          cb();
        });
      }

      function enumEntries(name) {
        var enums = (enumCatalog && enumCatalog.enums) || {};
        return enums[name] || FALLBACK_ENUMS[name] || [];
      }

      function fillSelect($select, entries, saved, emptyLabel) {
        if (RED.mavlink && typeof RED.mavlink.fillEnumSelect === 'function') {
          RED.mavlink.fillEnumSelect($select, entries, {
            allowEmpty: true,
            emptyLabel: emptyLabel || '\u2014',
            saved: saved
          });
          return;
        }
        $select.empty();
        $select.append($('<option></option>').val('').text(emptyLabel || '\u2014'));
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          $select.append($('<option></option>').val(String(entry.value)).text(entry.label || (entry.name + ' (' + entry.value + ')')));
        }
        if (saved !== undefined && saved !== null && saved !== '') $select.val(String(saved));
      }

      /**
       * §6: only the fields for the selected topic/verb, delivery tier, and
       * identity role exist. Everything else is hidden.
       * Build → vehicle shown; connection/identity/timeout/retry hidden.
       * Wire → reverse.
       * Companion (wire) → target sysid hidden; compid stays visible (spec exception).
       */
      function refreshVisibility() {
        var topic = $('#node-input-topic').val() || 'camera';
        var verb = $('#node-input-verb').val() || '';
        var path = $('#node-input-path').val() || 'legacy';
        var delivery = $('#node-input-delivery').val() || 'build';
        var isBuild = delivery === 'build';
        var isWire = !isBuild;
        var dialectVal = $('#node-input-dialect').val() || '';
        var identityId = isWire ? $('#node-input-identity').val() : '';
        var isCompanion = isWire && RED.mavlink.identityRole(identityId) === 'companion';
        var isManager = topic === 'gimbal' && verb === 'aim' && path === 'manager';
        var show = {
          /* tier-driven rows */
          dialect: isBuild,
          vehicle: isBuild && dialectVal === '__vehicle',
          connection: isWire,
          identity: isWire,
          timeout: isWire,
          maxRetries: isWire,
          /* target addressing: companion hides sysid; payload compid stays visible always */
          targetSystem: isBuild || !isCompanion,
          targetComponent: true,
          /* camera */
          cameraId:        (topic === 'camera' && (verb === 'photo' || verb === 'set-mode')),
          count:           (topic === 'camera' && verb === 'photo') || (topic === 'servo' && verb === 'repeat'),
          interval:        topic === 'camera' && verb === 'photo',
          sequence:        topic === 'camera' && verb === 'photo',
          streamId:        topic === 'camera' && (verb === 'start-video' || verb === 'stop-video'),
          statusFrequency: topic === 'camera' && verb === 'start-video',
          distance:        topic === 'camera' && verb === 'trigger-distance',
          shutter:         topic === 'camera' && verb === 'trigger-distance',
          trigger:         topic === 'camera' && verb === 'trigger-distance',
          /* gimbal */
          path:            topic === 'gimbal' && verb === 'aim',
          pitch:           topic === 'gimbal' && verb === 'aim',
          roll:            topic === 'gimbal' && verb === 'aim' && !isManager,
          yaw:             topic === 'gimbal' && verb === 'aim',
          pitchRate:       isManager,
          yawRate:         isManager,
          flags:           isManager,
          gimbalDeviceId:  isManager,
          mode:            verb === 'set-mode' && (topic === 'camera' || topic === 'gimbal'),
          stabilizeRoll:   topic === 'gimbal' && verb === 'set-mode',
          stabilizePitch:  topic === 'gimbal' && verb === 'set-mode',
          stabilizeYaw:    topic === 'gimbal' && verb === 'set-mode',
          lat:             topic === 'gimbal' && verb === 'roi-set',
          lon:             topic === 'gimbal' && verb === 'roi-set',
          alt:             topic === 'gimbal' && verb === 'roi-set',
          /* servo */
          servo:           topic === 'servo',
          pwm:             topic === 'servo',
          period:          topic === 'servo' && verb === 'repeat',
          /* release */
          instance:        topic === 'release' && (verb === 'gripper' || verb === 'winch'),
          action:          topic === 'release',
          length:          topic === 'release' && verb === 'winch',
          rate:            topic === 'release' && verb === 'winch'
        };

        $('#row-payload-dialect').toggle(!!show.dialect);
        $('#row-payload-vehicle').toggle(!!show.vehicle);
        $('#row-payload-connection').toggle(!!show.connection);
        $('#row-payload-identity').toggle(!!show.identity);
        $('#row-payload-timeout').toggle(!!show.timeout);
        $('#row-payload-maxRetries').toggle(!!show.maxRetries);
        $('#row-payload-targetSystem').toggle(!!show.targetSystem);
        $('#row-payload-targetComponent').toggle(!!show.targetComponent);
        $('#row-payload-cameraId').toggle(!!show.cameraId);
        $('#row-payload-count').toggle(!!show.count);
        $('#row-payload-interval').toggle(!!show.interval);
        $('#row-payload-sequence').toggle(!!show.sequence);
        $('#row-payload-streamId').toggle(!!show.streamId);
        $('#row-payload-statusFrequency').toggle(!!show.statusFrequency);
        $('#row-payload-distance').toggle(!!show.distance);
        $('#row-payload-shutter').toggle(!!show.shutter);
        $('#row-payload-trigger').toggle(!!show.trigger);
        $('#row-payload-path').toggle(!!show.path);
        $('#row-payload-pitch').toggle(!!show.pitch);
        $('#row-payload-roll').toggle(!!show.roll);
        $('#row-payload-yaw').toggle(!!show.yaw);
        $('#row-payload-pitchRate').toggle(!!show.pitchRate);
        $('#row-payload-yawRate').toggle(!!show.yawRate);
        $('#row-payload-flags').toggle(!!show.flags);
        $('#row-payload-gimbalDeviceId').toggle(!!show.gimbalDeviceId);
        $('#row-payload-mode').toggle(!!show.mode);
        $('#row-payload-stabilizeRoll').toggle(!!show.stabilizeRoll);
        $('#row-payload-stabilizePitch').toggle(!!show.stabilizePitch);
        $('#row-payload-stabilizeYaw').toggle(!!show.stabilizeYaw);
        $('#row-payload-lat').toggle(!!show.lat);
        $('#row-payload-lon').toggle(!!show.lon);
        $('#row-payload-alt').toggle(!!show.alt);
        $('#row-payload-servo').toggle(!!show.servo);
        $('#row-payload-pwm').toggle(!!show.pwm);
        $('#row-payload-period').toggle(!!show.period);
        $('#row-payload-instance').toggle(!!show.instance);
        $('#row-payload-action').toggle(!!show.action);
        $('#row-payload-length').toggle(!!show.length);
        $('#row-payload-rate').toggle(!!show.rate);
        refreshPayloadFieldTips();
      }

      function savedForEnum(painted, enumName, currentVal, nodeVal) {
        if (!enumName) return '';
        if (painted === null) return nodeVal;
        if (painted === enumName) {
          return currentVal !== undefined && currentVal !== null && currentVal !== ''
            ? currentVal
            : nodeVal;
        }
        // Enum family changed (e.g. gripper → parachute): do not leak the old id.
        return '';
      }

      function refreshEnumControls() {
        loadPayloadEnums(function () {
          var topic = $('#node-input-topic').val() || 'camera';
          var verb = $('#node-input-verb').val() || '';
          var releaseEnum = topic === 'release' ? RELEASE_ACTION_ENUMS[verb] : null;
          var modeEnum = verb === 'set-mode' ? MODE_ENUMS[topic] : null;

          if (modeEnum) {
            fillSelect(
              $('#node-input-modeValue'),
              enumEntries(modeEnum),
              savedForEnum(paintedModeEnum, modeEnum, $('#node-input-modeValue').val(), node.modeValue),
              '\u2014 mode \u2014'
            );
            paintedModeEnum = modeEnum;
          }

          if (releaseEnum) {
            fillSelect(
              $('#node-input-actionValue'),
              enumEntries(releaseEnum),
              savedForEnum(paintedReleaseEnum, releaseEnum, $('#node-input-actionValue').val(), node.actionValue),
              '\u2014 action \u2014'
            );
            paintedReleaseEnum = releaseEnum;
          }

          refreshVisibility();
        });
      }

      function refreshVerbOptions(useSaved) {
        var topic = $('#node-input-topic').val() || 'camera';
        var verbs = RED.mavlink.PAYLOAD_VERBS[topic] || [];
        var $verb = $('#node-input-verb');
        var saved = useSaved ? (node.verb || $verb.val()) : $verb.val();
        $verb.empty();
        for (var i = 0; i < verbs.length; i++) {
          var entry = verbs[i];
          $verb.append($('<option></option>').val(entry.value).text(entry.label));
        }
        var valid = verbs.some(function (v) { return v.value === saved; });
        $verb.val(valid ? saved : (verbs[0] ? verbs[0].value : ''));
      }

      function resetEnumCatalog() {
        enumCatalog = { enums: {} };
        enumCatalogLoaded = false;
        paintedModeEnum = null;
        paintedReleaseEnum = null;
      }

      $('#node-input-topic').on('change', function () {
        refreshVerbOptions(false);
        refreshEnumControls();
      });
      $('#node-input-verb').on('change', refreshEnumControls);
      $('#node-input-path').on('change', refreshVisibility);
      $('#node-input-delivery').on('change', function () {
        resetEnumCatalog();
        refreshEnumControls();
      });
      $('#node-input-identity').on('change', refreshVisibility);
      $('#node-input-connection').on('change', function () {
        resetEnumCatalog();
        if (RED.mavlink && RED.mavlink.fillIdentitySelect) {
          RED.mavlink.fillIdentitySelect(
            $('#node-input-identity'),
            $(this).val(),
            { saved: node.identity }
          );
        }
        refreshEnumControls();
      });
      $('#node-input-vehicle').on('change', function () {
        resetEnumCatalog();
        refreshEnumControls();
      });
      var $dialect = $('#node-input-dialect');
      $dialect.on('change', function () {
        resetEnumCatalog();
        refreshEnumControls();
      });
      RED.mavlink.populateDialectSelect($dialect, {
        saved: node.dialect || '',
        includeVehicleEscape: true
      });
      refreshVerbOptions(true);
      refreshEnumControls();

      if (RED.mavlink.loadEnumsCatalog) {
        RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
          RED.mavlink.fillCompIdSelect(
            $('#node-input-targetComponent'),
            ((catalog || {}).enums || {}).MAV_COMPONENT || [],
            { allowEmpty: true, emptyLabel: '(profile default)', saved: node.targetComponent }
          );
        });
      }
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-payload">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row" id="row-payload-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-payload-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-payload-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-payload-identity"><label for="node-input-identity">Send as</label><select id="node-input-identity" style="width:70%"></select></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send &amp; confirm</option></select></div>
  <div class="form-row" id="row-payload-timeout"><label for="node-input-timeout">ACK timeout</label><input type="number" id="node-input-timeout" style="width:80px"> ms</div>
  <div class="form-row" id="row-payload-maxRetries"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" style="width:60px"></div>
  <div class="form-row"><label for="node-input-topic">Topic</label><select id="node-input-topic"><option value="camera">Camera</option><option value="gimbal">Gimbal</option><option value="servo">Servo</option><option value="release">Release</option></select></div>
  <div class="form-row"><label for="node-input-verb">Verb</label><select id="node-input-verb"></select></div>
  <div class="form-row" id="row-payload-path"><label for="node-input-path">Gimbal path</label><select id="node-input-path"><option value="legacy">DO_MOUNT_CONTROL</option><option value="manager">GIMBAL_MANAGER_SET_PITCHYAW</option></select></div>
  <div class="form-row" id="row-payload-targetSystem"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row" id="row-payload-targetComponent"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>

<script type="text/html" data-help-name="mavlink-payload">
  <p>Controls camera, gimbal, servo, and release payload verbs. Command-backed verbs report command acknowledgement as their confirmation mode.</p>
  <p>Topic and verb reshape the form (§6): only the parameters for the selected verb are shown.</p>
  <p>On <b>Build</b> delivery the Dialect picker supplies editor catalogs. Choose <i>from Vehicle Profile…</i> to use a profile dialect and target defaults; a concrete dialect has no profile target rung. On <b>Send</b> or <b>Send &amp; confirm</b> delivery a Connection is required. The Send-as identity drives target addressing: a companion identity derives the target sysid from its airframe; the target compid remains visible and config-resolved because it addresses a payload device (camera or gimbal), not the autopilot.</p>
  <p>On the <b>Send &amp; confirm</b> tier a command-backed verb waits for its <code>COMMAND_ACK</code>: output 0 (continue) fires only on <code>ACCEPTED</code>, and a <code>DENIED</code>, <code>TEMPORARILY_REJECTED</code>, or timeout halts the chain and reports on output 1.</p>
  <p>Gimbal manager aiming uses GIMBAL_MANAGER_SET_PITCHYAW and has no MAVLink acknowledgement, so it is always sent unconfirmed.</p>
</script>
