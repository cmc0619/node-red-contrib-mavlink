<script type="text/javascript">
  RED.nodes.registerType('mavlink-payload', {
    category: 'mavlink',
    color: '#ffe8d8',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection' },
      delivery: { value: 'build' },
      timeout: { value: 10000, validate: RED.validators.number(true) },
      maxRetries: { value: 3, validate: RED.validators.number(true) },
      topic: { value: 'camera' },
      verb: { value: 'photo' },
      path: { value: 'legacy' },
      targetSystem: { value: 1, validate: RED.validators.number() },
      targetComponent: { value: 1, validate: RED.validators.number() },
      count: { value: 1, validate: RED.validators.number(true) },
      interval: { value: 0, validate: RED.validators.number(true) },
      modeValue: { value: 0, validate: RED.validators.number(true) },
      distance: { value: 0, validate: RED.validators.number(true) },
      pitch: { value: 0, validate: RED.validators.number(true) },
      roll: { value: 0, validate: RED.validators.number(true) },
      yaw: { value: 0, validate: RED.validators.number(true) },
      pitchRate: { value: 0, validate: RED.validators.number(true) },
      yawRate: { value: 0, validate: RED.validators.number(true) },
      servo: { value: 0, validate: RED.validators.number(true) },
      pwm: { value: 0, validate: RED.validators.number(true) },
      period: { value: 0, validate: RED.validators.number(true) },
      instance: { value: 0, validate: RED.validators.number(true) },
      actionValue: { value: 0, validate: RED.validators.number(true) }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-camera',
    label: function () { return this.name || 'mavlink payload'; },
    oneditprepare: function () {
      var node = this;
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      }

      RED.mavlink = RED.mavlink || {};
      if (!RED.mavlink.PAYLOAD_VERBS) {
        RED.mavlink.PAYLOAD_VERBS = {
          camera: [
            { value: 'photo', label: 'Photo' },
            { value: 'start-video', label: 'Start video' },
            { value: 'stop-video', label: 'Stop video' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'trigger-distance', label: 'Trigger by distance' }
          ],
          gimbal: [
            { value: 'aim', label: 'Aim' },
            { value: 'set-mode', label: 'Set mode' },
            { value: 'roi-set', label: 'ROI set' },
            { value: 'roi-clear', label: 'ROI clear' }
          ],
          servo: [
            { value: 'set', label: 'Set' },
            { value: 'repeat', label: 'Repeat' }
          ],
          release: [
            { value: 'gripper', label: 'Gripper' },
            { value: 'winch', label: 'Winch' },
            { value: 'parachute', label: 'Parachute' }
          ]
        };
      }

      var PAYLOAD_ENUM_NAMES = [
        'CAMERA_MODE',
        'MAV_MOUNT_MODE',
        'GRIPPER_ACTIONS',
        'WINCH_ACTIONS',
        'PARACHUTE_ACTION'
      ];
      var RELEASE_ACTION_ENUMS = {
        gripper: 'GRIPPER_ACTIONS',
        winch: 'WINCH_ACTIONS',
        parachute: 'PARACHUTE_ACTION'
      };
      var MODE_ENUMS = {
        camera: 'CAMERA_MODE',
        gimbal: 'MAV_MOUNT_MODE'
      };
      var FALLBACK_ENUMS = {
        GRIPPER_ACTIONS: [
          { name: 'GRIPPER_ACTIONS_RELEASE', value: 0, label: 'GRIPPER_ACTIONS_RELEASE (0)' },
          { name: 'GRIPPER_ACTIONS_GRAB', value: 1, label: 'GRIPPER_ACTIONS_GRAB (1)' },
          { name: 'GRIPPER_ACTIONS_HOLD', value: 2, label: 'GRIPPER_ACTIONS_HOLD (2)' }
        ],
        WINCH_ACTIONS: [
          { name: 'WINCH_ACTIONS_RELAXED', value: 0, label: 'WINCH_ACTIONS_RELAXED (0)' },
          { name: 'WINCH_ACTIONS_RELATIVE_LENGTH_CONTROL', value: 1, label: 'WINCH_ACTIONS_RELATIVE_LENGTH_CONTROL (1)' },
          { name: 'WINCH_ACTIONS_RATE_CONTROL', value: 2, label: 'WINCH_ACTIONS_RATE_CONTROL (2)' },
          { name: 'WINCH_ACTIONS_LOCK', value: 3, label: 'WINCH_ACTIONS_LOCK (3)' },
          { name: 'WINCH_ACTIONS_DELIVER', value: 4, label: 'WINCH_ACTIONS_DELIVER (4)' },
          { name: 'WINCH_ACTIONS_HOLD', value: 5, label: 'WINCH_ACTIONS_HOLD (5)' },
          { name: 'WINCH_ACTIONS_RETRACT', value: 6, label: 'WINCH_ACTIONS_RETRACT (6)' },
          { name: 'WINCH_ACTIONS_LOAD_LINE', value: 7, label: 'WINCH_ACTIONS_LOAD_LINE (7)' },
          { name: 'WINCH_ACTIONS_ABANDON_LINE', value: 8, label: 'WINCH_ACTIONS_ABANDON_LINE (8)' },
          { name: 'WINCH_ACTIONS_LOAD_PAYLOAD', value: 9, label: 'WINCH_ACTIONS_LOAD_PAYLOAD (9)' }
        ],
        PARACHUTE_ACTION: [
          { name: 'PARACHUTE_ACTION_DISABLE', value: 0, label: 'PARACHUTE_ACTION_DISABLE (0)' },
          { name: 'PARACHUTE_ACTION_ENABLE', value: 1, label: 'PARACHUTE_ACTION_ENABLE (1)' },
          { name: 'PARACHUTE_ACTION_RELEASE', value: 2, label: 'PARACHUTE_ACTION_RELEASE (2)' }
        ]
      };
      var enumCatalog = { enums: {} };
      var enumCatalogLoaded = false;
      var enumRequestSeq = 0;

      function loadPayloadEnums(cb) {
        if (enumCatalogLoaded) {
          cb();
          return;
        }
        if (!(RED.mavlink && typeof RED.mavlink.loadEnumsCatalog === 'function')) {
          enumCatalogLoaded = true;
          enumCatalog = { enums: {} };
          cb();
          return;
        }
        var seq = ++enumRequestSeq;
        RED.mavlink.loadEnumsCatalog(PAYLOAD_ENUM_NAMES, function (catalog) {
          if (seq !== enumRequestSeq) return;
          enumCatalog = catalog || { enums: {} };
          enumCatalogLoaded = true;
          cb();
        });
      }

      function enumEntries(name) {
        var enums = (enumCatalog && enumCatalog.enums) || {};
        return enums[name] || FALLBACK_ENUMS[name] || [];
      }

      function fillSelect($select, entries, saved, emptyLabel) {
        if (RED.mavlink && typeof RED.mavlink.fillEnumSelect === 'function') {
          RED.mavlink.fillEnumSelect($select, entries, {
            allowEmpty: true,
            emptyLabel: emptyLabel || '\u2014',
            saved: saved
          });
          return;
        }
        $select.empty();
        $select.append($('<option></option>').val('').text(emptyLabel || '\u2014'));
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          $select.append($('<option></option>').val(String(entry.value)).text(entry.label || (entry.name + ' (' + entry.value + ')')));
        }
        if (saved !== undefined && saved !== null && saved !== '') $select.val(String(saved));
      }

      function refreshEnumControls() {
        loadPayloadEnums(function () {
          var topic = $('#node-input-topic').val() || 'camera';
          var verb = $('#node-input-verb').val() || '';
          var releaseEnum = topic === 'release' ? RELEASE_ACTION_ENUMS[verb] : null;
          var modeEnum = verb === 'set-mode' ? MODE_ENUMS[topic] : null;
          var currentMode = $('#node-input-modeValue').val();
          var currentAction = $('#node-input-actionValue').val();
          var modeSaved = currentMode !== undefined && currentMode !== null && currentMode !== '' ? currentMode : node.modeValue;
          var actionSaved = currentAction !== undefined && currentAction !== null && currentAction !== '' ? currentAction : node.actionValue;

          $('#row-payload-mode')[modeEnum ? 'show' : 'hide']();
          if (modeEnum) {
            fillSelect($('#node-input-modeValue'), enumEntries(modeEnum), modeSaved, '\u2014 mode \u2014');
          }

          if (releaseEnum) {
            fillSelect($('#node-input-actionValue'), enumEntries(releaseEnum), actionSaved, '\u2014 action \u2014');
          } else {
            fillSelect($('#node-input-actionValue'), [], '', '\u2014 action \u2014');
          }
        });
      }

      function refreshVerbOptions(useSaved) {
        var topic = $('#node-input-topic').val() || 'camera';
        var verbs = RED.mavlink.PAYLOAD_VERBS[topic] || [];
        var $verb = $('#node-input-verb');
        var saved = useSaved ? (node.verb || $verb.val()) : $verb.val();
        $verb.empty();
        for (var i = 0; i < verbs.length; i++) {
          var entry = verbs[i];
          $verb.append($('<option></option>').val(entry.value).text(entry.label));
        }
        var valid = verbs.some(function (v) { return v.value === saved; });
        $verb.val(valid ? saved : (verbs[0] ? verbs[0].value : ''));
      }

      $('#node-input-topic').on('change', function () {
        refreshVerbOptions(false);
        refreshEnumControls();
      });
      $('#node-input-verb').on('change', refreshEnumControls);
      $('#node-input-connection').on('change', function () {
        enumCatalog = { enums: {} };
        enumCatalogLoaded = false;
        refreshEnumControls();
      });
      refreshVerbOptions(true);
      refreshEnumControls();

      if (RED.mavlink.loadEnumsCatalog) {
        RED.mavlink.loadEnumsCatalog(['MAV_COMP_ID'], function (catalog) {
          RED.mavlink.fillCompIdSelect(
            $('#node-input-targetComponent'),
            (catalog.enums || {}).MAV_COMP_ID || [],
            { saved: node.targetComponent }
          );
        });
      }
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-payload">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send &amp; confirm</option></select></div>
  <div class="form-row"><label for="node-input-timeout">ACK timeout</label><input type="number" id="node-input-timeout" style="width:80px"> ms</div>
  <div class="form-row"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" style="width:60px"></div>
  <div class="form-row"><label for="node-input-topic">Topic</label><select id="node-input-topic"><option value="camera">Camera</option><option value="gimbal">Gimbal</option><option value="servo">Servo</option><option value="release">Release</option></select></div>
  <div class="form-row"><label for="node-input-verb">Verb</label><select id="node-input-verb"></select></div>
  <div class="form-row"><label for="node-input-path">Gimbal path</label><select id="node-input-path"><option value="legacy">DO_MOUNT_CONTROL</option><option value="manager">GIMBAL_MANAGER_SET_PITCHYAW</option></select></div>
  <div class="form-row"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255"></div>
  <div class="form-row"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <div class="form-row"><label for="node-input-count">Camera</label><input type="text" id="node-input-count" placeholder="count"><input type="text" id="node-input-interval" placeholder="interval" style="width:30%;"></div>
  <div class="form-row"><label for="node-input-pitch">Gimbal</label><input type="text" id="node-input-pitch" placeholder="pitch"><input type="text" id="node-input-yaw" placeholder="yaw" style="width:30%;"></div>
  <div class="form-row" id="row-payload-mode"><label for="node-input-modeValue">Mode</label><select id="node-input-modeValue" style="width:30%;"></select></div>
  <div class="form-row"><label for="node-input-servo">Servo</label><input type="text" id="node-input-servo" placeholder="servo"><input type="text" id="node-input-pwm" placeholder="pwm" style="width:30%;"></div>
  <div class="form-row"><label for="node-input-actionValue">Release</label><input type="text" id="node-input-instance" placeholder="instance"><select id="node-input-actionValue" style="width:30%;"></select></div>
</script>

<script type="text/html" data-help-name="mavlink-payload">
  <p>Controls camera, gimbal, servo, and release payload verbs. Command-backed verbs report command acknowledgement as their confirmation mode.</p>
  <p>On the <b>Send &amp; confirm</b> tier a command-backed verb waits for its <code>COMMAND_ACK</code>: output 0 (continue) fires only on <code>ACCEPTED</code>, and a <code>DENIED</code>, <code>TEMPORARILY_REJECTED</code>, or timeout halts the chain and reports on output 1.</p>
  <p>Gimbal manager aiming uses GIMBAL_MANAGER_SET_PITCHYAW and has no MAVLink acknowledgement, so it is always sent unconfirmed.</p>
</script>
