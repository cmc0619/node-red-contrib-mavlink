<script type="text/javascript">
  (function () {
    function positiveSecondsValidator(v, _opt) {
      // Blank reds: the runtime opens the lease timer at this value as saved
      // (§0), and Number('') is 0 — an already-expired lease, not "no default".
      var n = RED.mavlink.isBlank(v) ? NaN : Number(v);
      if (!Number.isFinite(n) || n <= 0) return 'must be a positive number of seconds';
      return true;
    }

    // One place decides single- vs multi-identity so the three sites that turn
    // on it — row visibility, save-time clear, and the validator — cannot drift
    // apart (Sourcery). A Connection with at most one bound identity has no
    // real choice: its sole identity is the Local Identity the runtime asserts.
    function isSingleIdentity(connId) {
      return RED.mavlink.identityOptionsFor(connId).length <= 1;
    }

    /**
     * A choice of Identity exists only when the Connection carries more than
     * one. A single-identity Connection has exactly one — its Local Identity —
     * so the editor hides the field (see oneditprepare) and oneditsave stores
     * blank — the runtime then asserts the Connection's Local Identity.
     * Whatever leftover is still stored here is ignored by the validator, so
     * it must never ring, even for a stale saved value from before the field
     * was hidden. That is the first branch: with the Connection resolved to a
     * single identity, pass.
     *
     * When the Connection does carry additionals, a bound pick is required. The
     * field is then a connection-scoped select that only offers bound
     * identities and auto-picks one, so the ring is unreachable through the
     * dialog — this validator survives solely as the hand-edited-flow backstop
     * for the promoted silent-false-success case (a lease on an unbound id no
     * scheduler heartbeats). command/fanout, whose unbound pick is not that
     * class, carry no identity validator. The connection is read live through
     * liveOr so the check is scoped to this node's own open dialog (#217).
     */
    function boundIdentityValidator(v, _opt) {
      var connId = RED.mavlink.liveOr(this, '#node-input-connection', this.connection, '');
      // No Connection resolved yet — its own required ring owns that.
      if (RED.mavlink.isBlank(connId) || connId === '_ADD_' || !RED.nodes.node(connId)) return true;
      // Single-identity Connection: field hidden, value ignored — never ring.
      if (isSingleIdentity(connId)) return true;
      // Multi-identity: a bound identity must be chosen.
      if (RED.mavlink.isBlank(v) || v === '_ADD_') return 'is required';
      if (!RED.nodes.node(v)) return 'references a missing Identity';
      if (!RED.mavlink.identityOptionsFor(connId).some(function (o) { return o.id === v; })) {
        return 'is not bound to the selected Connection — bind it there or pick a bound Identity';
      }
      return true;
    }

    RED.nodes.registerType('mavlink-health', {
      category: 'mavlink',
      color: '#6ea6d7',
      defaults: {
        name:       { value: '' },
        connection: { value: '', type: 'mavlink-connection', required: true },
        identity:   { value: '', type: 'mavlink-local-identity', validate: boundIdentityValidator },
        ttlS:       { value: 5, validate: positiveSecondsValidator },
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ['continue', 'status'],
      icon: 'font-awesome/fa-heartbeat',
      paletteLabel: 'health',
      label: function () {
        return this.name || 'mavlink health';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        var node = this;
        RED.mavlink.ensureConfigNodePicker(this, 'connection', 'mavlink-connection', 'node-input');
        // The Identity is a choice only when the Connection carries more than
        // one identity. A single-identity Connection has exactly one — its
        // Local Identity — so the field is hidden and oneditsave stores blank.
        // Showing a field with a single answer, then red-ringing a stale pick,
        // is the anti-pattern §0 forbids. When there is a choice,
        // the field is a connection-scoped select — the same one command and
        // fanout use — that only ever offers bound identities (no role filter:
        // health asserts any bound identity, gcs included). Re-evaluate on
        // every Connection change.
        function refreshIdentityRow() {
          var connId = $('#node-input-connection').val() || '';
          if (isSingleIdentity(connId)) {
            $('#row-health-identity').hide();
          } else {
            $('#row-health-identity').show();
            RED.mavlink.refreshIdentitySelect(node);
          }
        }
        refreshIdentityRow();
        $('#node-input-connection').on('change', refreshIdentityRow);
      },
      oneditsave: function () {
        // A single-identity Connection hides the field; store blank so nothing
        // stale is kept and the runtime resolves the sole Local Identity.
        // Clear the DOM element, not just the property: Node-RED harvests
        // #node-input-* values into the node after oneditsave, so setting only
        // this.identity would be overwritten by the select's value (Codacy).
        var connId = $('#node-input-connection').val() || '';
        if (isSingleIdentity(connId)) {
          $('#node-input-identity').val('');
          this.identity = '';
        }
      },
    });
  }());
</script>

<script type="text/html" data-template-name="mavlink-health">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <div class="form-row" id="row-health-identity">
    <label for="node-input-identity"><i class="fa fa-id-card"></i> Identity</label>
    <select id="node-input-identity"></select>
  </div>
  <div class="form-row">
    <label for="node-input-ttlS"><i class="fa fa-clock-o"></i> Default lease (s)</label>
    <input type="number" id="node-input-ttlS" min="1" placeholder="5">
  </div>
</script>

<script type="text/html" data-help-name="mavlink-health">
  <p>Asserts an Identity's health on its Connection with an expiring lease. A faulted identity's HEARTBEAT stops going out until the fault clears — the companion-failsafe posture other GCS software reads as "this component is gone."</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload.health <span class="property-type">string</span></dt>
    <dd>
      <code>ok</code> — clear any fault and start (or renew) a lease. Send another <code>ok</code> before the lease lapses, or the Identity faults on its own.<br>
      <code>fatal</code> — fault the Identity immediately and cancel any pending lease.<br>
      Anything else is a no-op: nothing is asserted, nothing is sent.
    </dd>
    <dt class="optional">payload.ttl_s <span class="property-type">number</span></dt>
    <dd>Lease length in seconds for an <code>ok</code> assertion. Overrides the node's default lease when present.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Continue — the original input message, fired once an <code>ok</code>/<code>fatal</code> assertion is accepted. Nothing rides here when a lease expires on its own.</li>
    <li>Status — a record on every accepted assertion and on a lease that expires unrenewed. <code>result</code> is <code>healthy</code> (with <code>ttlS</code>), <code>faulted</code>, <code>lease-expired</code>, or <code>failed</code> (a crashed input, with <code>detail</code>).</li>
  </ol>
  <h3>Details</h3>
  <p>Set <code>msg.payload = false</code> to suppress the node silently.</p>
  <p>The lease is owned by the Connection, keyed on the Identity — one promise per identity, last assertion wins. Closing or redeploying this node cancels its subscription to expiry notices and does not cancel the Connection's lease or the Identity's fault state.</p>
</script>
