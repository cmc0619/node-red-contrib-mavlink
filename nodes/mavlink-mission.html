<script type="text/javascript">
  RED.nodes.registerType('mavlink-mission', {
    category: 'mavlink',
    color: '#e9e4ff',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection' },
      delivery: { value: 'confirm' },
      operation: { value: 'download' },
      missionType: { value: 'mission' },
      firmware: { value: 'ardupilot' },
      targetSystem: { value: 1, validate: RED.validators.number() },
      targetComponent: { value: 1, validate: RED.validators.number() },
      items: { value: '' },
      confirmClear: { value: false },
      timeout: { value: '', validate: RED.validators.number(true) },
      maxRetries: { value: '', validate: RED.validators.number(true) }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-map-signs',
    label: function () {
      return this.name || ('mission ' + (this.operation || 'download'));
    },
    oneditprepare: function () {
      // Mission types offered per firmware (§9 firmware gating, §11). ArduPilot
      // carries mission/fence/rally; PX4 (and unknown stacks) carry mission
      // only. Every entry shows its numeric MAV_MISSION_TYPE (§6).
      var TYPES_BY_FIRMWARE = {
        ardupilot: [['mission', 'Mission (0)'], ['fence', 'Fence (1)'], ['rally', 'Rally (2)']],
        px4: [['mission', 'Mission (0)']],
        custom: [['mission', 'Mission (0)']]
      };

      var $type = $('#node-input-missionType');
      var $op = $('#node-input-operation');
      var $fw = $('#node-input-firmware');

      function repopulateTypes() {
        var saved = $type.val();
        var list = TYPES_BY_FIRMWARE[$fw.val()] || TYPES_BY_FIRMWARE.custom;
        $type.empty();
        list.forEach(function (entry) {
          $type.append($('<option>').val(entry[0]).text(entry[1]));
        });
        // Preserve a valid saved selection; never overwrite it with empty (§6).
        if (saved && list.some(function (e) { return e[0] === saved; })) {
          $type.val(saved);
        }
      }

      function refreshRows() {
        var op = $op.val();
        $('.mavlink-mission-items').toggle(op === 'upload');
        $('.mavlink-mission-confirm').toggle(op === 'clear');
      }

      $fw.on('change', repopulateTypes);
      $op.on('change', refreshRows);
      repopulateTypes();
      refreshRows();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-mission">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build (plan only)</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row"><label for="node-input-operation">Operation</label><select id="node-input-operation"><option value="download">Download</option><option value="upload">Upload</option><option value="clear">Clear</option></select></div>
  <div class="form-row"><label for="node-input-firmware">Firmware</label><select id="node-input-firmware"><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row"><label for="node-input-missionType">Type</label><select id="node-input-missionType"></select></div>
  <div class="form-row"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255"></div>
  <div class="form-row"><label for="node-input-targetComponent">Target compid</label><input type="number" id="node-input-targetComponent" min="0" max="255"></div>
  <div class="form-row mavlink-mission-items"><label for="node-input-items">Items (JSON)</label><input type="text" id="node-input-items" placeholder="[] or set msg.payload.items"></div>
  <div class="form-row mavlink-mission-confirm"><label for="node-input-confirmClear">Confirm</label><input type="checkbox" id="node-input-confirmClear" style="display:inline-block; width:auto; vertical-align:top;"> <span>Yes, permanently erase this plan</span></div>
  <div class="form-row"><label for="node-input-timeout">Step timeout (ms)</label><input type="number" id="node-input-timeout" placeholder="1500"></div>
  <div class="form-row"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" placeholder="5"></div>
</script>

<script type="text/html" data-help-name="mavlink-mission">
  <p>Downloads, uploads, or clears a mission, fence, or rally plan over the MAVLink mission protocol — the one exchange the vehicle drives.</p>
  <p>Output 0 (continue) fires only on a successful <code>MISSION_ACK</code>. Output 1 (status) carries progress records (phase and item counts) as they happen and the terminal record either way.</p>
  <p><b>Delivery.</b> <i>Build</i> emits the protocol plan on output 0 without sending. <i>Send and confirm</i> runs the transfer to its acknowledgement.</p>
  <p><b>Upload</b> answers whatever sequence the vehicle requests, in the format it asks for (<code>MISSION_ITEM_INT</code> vs <code>MISSION_ITEM</code>). A failed upload fails — it never degrades into a clear. Provide items in the config JSON or as <code>msg.payload.items</code>.</p>
  <p><b>Clear</b> is destructive and requires confirmation: tick the box or set <code>msg.confirmed = true</code>.</p>
  <p>The mission type list is gated by firmware — PX4 does not carry fence and rally the same way as ArduPilot.</p>
  <p>Set <code>msg.payload === false</code> to suppress. A status record fed back into the input is refused.</p>
</script>
