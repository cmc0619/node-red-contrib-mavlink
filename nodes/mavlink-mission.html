<script type="text/javascript">
  // Family reservation for configured items — a mirror of
  // lib/mission/validate.js (FENCE_COMMANDS / RALLY_COMMAND), carried here
  // because a Node-RED validator is synchronous and cannot reach the library.
  // Drift-tested against it in test/nodes/mission-html.test.js.
  var MISSION_FENCE_COMMANDS = [5000, 5001, 5002, 5003, 5004, 5005];
  var MISSION_RALLY_COMMAND = 5100;

  // Dialect + Vehicle + Firmware validators are the shared Build-tier rule
  // (§6 Firmware XOR); Mission's mode field is `delivery` (default confirm).
  var missionDefaults = Object.assign(
    {
      name: { value: '' },
      identity: { value: '' },
      delivery: { value: 'confirm', validate: RED.mavlink.oneOf(['build', 'confirm']) },
      operation: { value: 'download', validate: RED.mavlink.oneOf(['download', 'upload', 'clear']) },
      missionType: { value: 'mission', validate: RED.mavlink.oneOf(['mission', 'fence', 'rally']) },
      // A statically configured broadcast (0) can never run a transfer:
      // download and upload are refused for sysid 0 on every tier (§9 — no
      // vehicle answers as sysid 0), so the pair reds at deploy rather than
      // on the first message. Clear stays broadcast-legal, and blank passes
      // (it inherits the profile default). Two args so the reason renders.
      targetSystem: {
        value: '',
        validate: function (v, opt) {
          var range = RED.mavlink.validateUint8(0).call(this, v, opt);
          if (range !== true) return range;
          if (RED.mavlink.isBlank(v) || Number(v) !== 0) return true;
          var op = RED.mavlink.liveOr(this, '#node-input-operation', this.operation, 'download');
          if (op === 'clear') return true;
          return 'broadcast (0) cannot ' + op + ' — no vehicle answers as sysid 0; address one vehicle';
        },
      },
      // Compid is a wire uint8; the select's catalog values all fit, so this
      // reds only a hand-edited flow. Blank inherits the profile default.
      targetComponent: { value: '', validate: RED.mavlink.validateUint8(0) },
      items: {
        value: '',
        // Two args so a returned reason counts as invalid rather than being
        // coerced truthy (§14). Blank means "items come from the payload".
        // Operation-aware like the shared tier validators: only Upload reads
        // items, so a leftover value must not red a Download or Clear node.
        validate: function (v, _opt) {
          if (RED.mavlink.liveOr(this, '#node-input-operation', this.operation) !== 'upload') return true;
          if (RED.mavlink.isBlank(v)) return true;
          var arr;
          try {
            arr = JSON.parse(v);
          } catch {
            return 'is not valid JSON';
          }
          if (!Array.isArray(arr)) return 'must be a JSON array';
          // A configured [] would upload MISSION_COUNT 0 — the wire's
          // "erase the plan" — not a no-op (#241). Use Clear for that.
          if (arr.length === 0) return 'must not be empty — use the Clear operation to erase a plan';
          // Per-item red rings, mirroring the runtime validator (§9 "Item
          // validation is per type"): the wire `command` is a uint16 (a
          // fractional id truncates into the reserved fence range on
          // serialization), and an item must belong to the selected plan's
          // family so buffers cannot corrupt each other.
          var type = RED.mavlink.liveOr(this, '#node-input-missionType', this.missionType, 'mission');
          for (var i = 0; i < arr.length; i++) {
            var item = arr[i];
            // The raw value must be present and numeric before Number() runs:
            // '' / null / false all coerce to 0, a legal uint16, and would
            // upload command 0 instead of red-ringing the blank (Codex). An
            // explicit numeric 0 and a numeric string stay legal.
            var raw = item && typeof item === 'object' ? item.command : undefined;
            var cmd = typeof raw === 'number' ? raw
              : (typeof raw === 'string' && raw.trim() !== '' ? Number(raw) : NaN);
            if (!Number.isInteger(cmd) || cmd < 0 || cmd > 0xffff) {
              return 'item ' + i + ' needs an integer command id (0–65535)';
            }
            var fence = MISSION_FENCE_COMMANDS.indexOf(cmd) !== -1;
            var rally = cmd === MISSION_RALLY_COMMAND;
            var wrongFamily = type === 'fence' ? !fence
              : type === 'rally' ? !rally
                : (fence || rally);
            if (wrongFamily) {
              return 'item ' + i + ' command ' + cmd + ' is not a valid ' + type + ' item';
            }
          }
          return true;
        },
      },
      timeout: { value: '', validate: RED.mavlink.validateAtLeast(0) },
      maxRetries: { value: '', validate: RED.mavlink.validateAtLeast(0, { integer: true }) }
    },
    RED.mavlink.buildTierDialectDefaults({ withFirmware: true })
  );

  RED.nodes.registerType('mavlink-mission', {
    category: 'mavlink',
    paletteLabel: 'mission',
    color: '#e9e4ff',
    defaults: missionDefaults,
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-map-signs',
    label: function () {
      return this.name || ('mission ' + (this.operation || 'download'));
    },
    oneditprepare: function () {
      var node = this;

      /* ── Connection and vehicle pickers ───────────────────────── */
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');
      RED.mavlink.ensureConfigNodePicker(node, 'vehicle', 'mavlink-vehicle', 'node-input');

      // Mission types offered per firmware (§9 firmware gating, §11). ArduPilot
      // carries mission/fence/rally; PX4 (and unknown stacks) carry mission only.
      var TYPES_BY_FIRMWARE = {
        ardupilot: [['mission', 'Mission (0)'], ['fence', 'Fence (1)'], ['rally', 'Rally (2)']],
        px4:       [['mission', 'Mission (0)']],
        custom:    [['mission', 'Mission (0)']]
      };

      var $type = $('#node-input-missionType');
      var $op   = $('#node-input-operation');

      /**
       * Read the effective firmware from the selected tier. Build concrete
       * dialects use the Firmware field; Build's Vehicle Profile escape and
       * wire tiers use their bound profile.
       */
      function getEffectiveFirmware() {
        var delivery = $('#node-input-delivery').val() || 'confirm';
        if (delivery === 'build') {
          var dialect = $('#node-input-dialect').val() || '';
          if (dialect && dialect !== '__vehicle') return $('#node-input-firmware').val() || '';
          if (dialect !== '__vehicle') return '';
          var vehicleId = $('#node-input-vehicle').val() || '';
          if (vehicleId) {
            var v = RED.nodes.node(vehicleId);
            if (v && v.firmware) return v.firmware;
          }
          return '';
        }
        var connectionId = $('#node-input-connection').val() || '';
        if (connectionId) {
          var conn = RED.nodes.node(connectionId);
          if (conn && conn.vehicle) {
            var vNode = RED.nodes.node(conn.vehicle);
            if (vNode && vNode.firmware) return vNode.firmware;
          }
        }
        return '';
      }

      function repopulateTypes() {
        var saved = $type.val();
        var fw = getEffectiveFirmware();
        var list = TYPES_BY_FIRMWARE[fw] || TYPES_BY_FIRMWARE.custom;
        $type.empty();
        list.forEach(function (entry) {
          $type.append($('<option>').val(entry[0]).text(entry[1]));
        });
        if (saved && list.some(function (e) { return e[0] === saved; })) {
          $type.val(saved);
        }
      }

      function refreshRows() {
        var op = $op.val();
        $('.mavlink-mission-items').toggle(op === 'upload');
      }

      /* ── Visibility: role × tier matrix (DESIGN.md §6) ───────── */
      function refreshVisibility() {
        var delivery = $('#node-input-delivery').val() || 'confirm';
        var dialect = $('#node-input-dialect').val() || node.dialect || '';
        var isBuild = (delivery === 'build');
        var isWire = !isBuild;

        RED.mavlink.applyBuildTierRowVisibility({
          isBuild: isBuild,
          dialect: dialect,
          dialectRow: '#row-mission-dialect',
          vehicleRow: '#row-vehicle',
          firmwareRow: '#row-mission-firmware',
          connectionRow: '#row-connection'
        });
        /* Mission-owned wire rows stay local */
        $('#row-identity').toggle(isWire);
        $('#row-timeout').toggle(isWire);
        $('#row-maxRetries').toggle(isWire);

        /* role-driven rows: companion hides both target rows */
        RED.mavlink.applyCompanionTargetVisibility({
          isBuild: isBuild,
          identityId: $('#node-input-identity').val() || '',
          targetSystemRow: '#row-targetSystem',
          targetComponentRow: '#row-targetComponent',
        });

        refreshRows();
        repopulateTypes();
      }

      $('#node-input-delivery').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-connection').on('change', function () {
        RED.mavlink.refreshIdentitySelect(node);
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-vehicle').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-identity').on('change', function () {
        refreshVisibility();
      });
      $('#node-input-dialect').on('change', function () {
        refreshVisibility();
        RED.mavlink.reloadTargetCompId(node);
      });
      $('#node-input-firmware').on('change', repopulateTypes);
      $op.on('change', refreshRows);
      RED.mavlink.populateDialectSelect($('#node-input-dialect'), { saved: node.dialect || '' });
      RED.mavlink.reloadTargetCompId(node);

      /* Initial state. */
      RED.mavlink.refreshIdentitySelect(node);
      refreshVisibility();
    }
  });
</script>

<script type="text/html" data-template-name="mavlink-mission">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build (plan only)</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row" id="row-mission-dialect"><label for="node-input-dialect">Dialect</label><select id="node-input-dialect" style="width:70%"></select></div>
  <div class="form-row" id="row-vehicle"><label for="node-input-vehicle">Vehicle</label><input type="text" id="node-input-vehicle"></div>
  <div class="form-row" id="row-mission-firmware"><label for="node-input-firmware">Firmware</label><select id="node-input-firmware"><option value=""></option><option value="ardupilot">ArduPilot</option><option value="px4">PX4</option><option value="custom">Custom</option></select></div>
  <div class="form-row" id="row-connection"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row" id="row-identity"><label for="node-input-identity">Identity</label><select id="node-input-identity"></select></div>
  <div class="form-row"><label for="node-input-operation">Operation</label><select id="node-input-operation"><option value="download">Download</option><option value="upload">Upload</option><option value="clear">Clear</option></select></div>
  <div class="form-row"><label for="node-input-missionType">Type</label><select id="node-input-missionType"></select></div>
  <div class="form-row" id="row-targetSystem"><label for="node-input-targetSystem">Target sysid</label><input type="number" id="node-input-targetSystem" min="0" max="255" placeholder="(profile default)"></div>
  <div class="form-row" id="row-targetComponent"><label for="node-input-targetComponent">Target compid</label><select id="node-input-targetComponent"></select></div>
  <div class="form-row mavlink-mission-items"><label for="node-input-items" style="vertical-align:top;">Items (JSON)</label><textarea id="node-input-items" rows="8" style="width:70%; font-family:monospace; resize:vertical;" placeholder="non-empty JSON array, or set msg.payload.items"></textarea></div>
  <div class="form-row" id="row-timeout"><label for="node-input-timeout">Step timeout (ms)</label><input type="number" id="node-input-timeout" placeholder="1500"></div>
  <div class="form-row" id="row-maxRetries"><label for="node-input-maxRetries">Max retries</label><input type="number" id="node-input-maxRetries" placeholder="5"></div>
</script>

<script type="text/html" data-help-name="mavlink-mission">
  <p>Downloads, uploads, or clears a mission, fence, or rally plan over the MAVLink mission protocol — the one exchange the vehicle drives.</p>
  <p>Output 0 (continue) fires only on a successful <code>MISSION_ACK</code>. Output 1 (status) carries progress records (phase and item counts) as they happen and the terminal record either way.</p>
  <p><b>Delivery.</b> <i>Build</i> emits the protocol plan on output 0 without sending. Choose a bundled <b>Dialect</b> plus <b>Firmware</b>, or choose <i>from Vehicle Profile…</i> to inherit dialect, firmware, and target defaults from a Vehicle Profile. <i>Send and confirm</i> runs the transfer to its acknowledgement over the selected <b>Connection</b>.</p>
  <p><b>Addressing.</b> For a companion identity the target is derived automatically (airframe sysid, compid 1). The mission type list is gated by the effective firmware — the Build Firmware field, the Build Vehicle Profile escape, or the connection's bound profile on wire tiers — because PX4 does not carry fence and rally the same way as ArduPilot.</p>
  <p><b>Upload</b> answers whatever sequence the vehicle requests. A failed upload fails — it never degrades into a clear. Provide items in the config JSON or as <code>msg.payload.items</code>; an upload that resolves zero items is refused, because a zero count erases the plan on the vehicle — use <b>Clear</b> for that.</p>
  <p><b>Clear</b> erases the selected plan on the vehicle. Selecting the Clear operation is the confirmation — any input triggers it.</p>
  <p>Set <code>msg.payload === false</code> to suppress. Status records are plain objects on output 1; they are not refused if wired into another action input — chain control is silence on output 0.</p>
</script>
