<!--
  mavlink-connection — Connection config node editor (DESIGN.md §3, §6, §7).

  Vehicle / Identity use Node-RED's standard config-node select with edit
  (pencil) and add (+) buttons — never a free-form id and never a buttonless
  <select> fallback.
-->

<script type="text/javascript">
  RED.nodes.registerType('mavlink-connection', {
    category: 'config',
    defaults: {
      name: { value: '' },
      mode: { value: 'udp', required: true },
      bindHost: { value: '0.0.0.0' },
      bindPort: { value: 14550, validate: function (v) {
        var mode = $('#node-config-input-mode').val() || this.mode || 'udp';
        if (mode === 'serial') return true;
        return RED.validators.number()(v);
      } },
      remoteHost: { value: '' },
      remotePort: { value: '', validate: RED.validators.number(true) },
      serialPath: { value: '', validate: function (v) {
        var mode = $('#node-config-input-mode').val() || this.mode || 'udp';
        if (mode !== 'serial') return true;
        return String(v == null ? '' : v).trim().length > 0;
      } },
      baudRate: { value: 57600, validate: function (v) {
        var mode = $('#node-config-input-mode').val() || this.mode || 'udp';
        if (mode !== 'serial') return true;
        return RED.validators.number()(v);
      } },
      // Config-node references (§6 — everything enumerable is a dropdown).
      vehicle: { value: '', type: 'mavlink-vehicle', required: true },
      localIdentity: { value: '', type: 'mavlink-local-identity', required: true },
      additionalIdentities: { value: [] },
      signOutbound: { value: false },
      requireSigned: { value: false },
      acceptInvalid: { value: false },
      linkId: { value: 0, validate: RED.validators.number() },
      staleMs: { value: '', validate: RED.validators.number(true) },
      expireMs: { value: '', validate: RED.validators.number(true) },
      disabled: { value: false },
    },
    credentials: {
      signingPassphrase: { type: 'password' },
    },
    label: function () {
      var mode = (this.mode || 'udp').toUpperCase();
      if (this.mode === 'serial') {
        return this.name || ('MAVLink SERIAL ' + (this.serialPath || ''));
      }
      var where = this.bindPort ? ':' + this.bindPort : '';
      return this.name || 'MAVLink ' + mode + where;
    },
    oneditprepare: function () {
      if (RED.mavlink && RED.mavlink.ensureConfigNodePicker) {
        RED.mavlink.ensureConfigNodePicker(this, 'vehicle', 'mavlink-vehicle', 'node-config-input');
        RED.mavlink.ensureConfigNodePicker(
          this,
          'localIdentity',
          'mavlink-local-identity',
          'node-config-input'
        );
      }

      function refreshTransportRows() {
        var mode = $('#node-config-input-mode').val() || 'udp';
        var ip = mode === 'udp' || mode === 'tcp';
        $('#row-conn-bindHost, #row-conn-bindPort, #row-conn-remoteHost, #row-conn-remotePort').toggle(ip);
        $('#row-conn-serialPath, #row-conn-baudRate').toggle(mode === 'serial');
        $('#mav-conn-tcp-tip').toggle(mode === 'tcp');
        $('#mav-conn-serial-tip').toggle(mode === 'serial');
      }
      $('#node-config-input-mode').on('change', refreshTransportRows);
      refreshTransportRows();
    },
  });
</script>

<script type="text/html" data-template-name="mavlink-connection">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Connection name" />
  </div>

  <div class="form-row">
    <label for="node-config-input-mode"><i class="fa fa-exchange"></i> Transport</label>
    <select id="node-config-input-mode">
      <option value="udp">UDP</option>
      <option value="tcp">TCP</option>
      <option value="serial">Serial</option>
    </select>
  </div>

  <div class="form-tips" id="mav-conn-tcp-tip" style="margin-bottom:8px;display:none;">
    TCP with a remote host/port is a <b>client</b>. With only bind host/port it is a
    <b>server</b> that accepts peers (send follows the peer-table endpoint, or the sole client).
  </div>
  <div class="form-tips" id="mav-conn-serial-tip" style="margin-bottom:8px;display:none;">
    Requires optional dependency <code>serialport</code>. Peer-table endpoints use the device path.
  </div>

  <div class="form-row" id="row-conn-bindHost">
    <label for="node-config-input-bindHost"><i class="fa fa-sign-in"></i> Bind host</label>
    <input type="text" id="node-config-input-bindHost" placeholder="0.0.0.0" />
  </div>
  <div class="form-row" id="row-conn-bindPort">
    <label for="node-config-input-bindPort"><i class="fa fa-sign-in"></i> Bind port</label>
    <input type="text" id="node-config-input-bindPort" placeholder="14550" />
  </div>

  <div class="form-row" id="row-conn-remoteHost">
    <label for="node-config-input-remoteHost"><i class="fa fa-sign-out"></i> Remote host</label>
    <input type="text" id="node-config-input-remoteHost" placeholder="(optional default target)" />
  </div>
  <div class="form-row" id="row-conn-remotePort">
    <label for="node-config-input-remotePort"><i class="fa fa-sign-out"></i> Remote port</label>
    <input type="text" id="node-config-input-remotePort" placeholder="(optional)" />
  </div>

  <div class="form-row" id="row-conn-serialPath">
    <label for="node-config-input-serialPath"><i class="fa fa-usb"></i> Serial path</label>
    <input type="text" id="node-config-input-serialPath" placeholder="/dev/ttyUSB0 or COM3" />
  </div>
  <div class="form-row" id="row-conn-baudRate">
    <label for="node-config-input-baudRate"><i class="fa fa-tachometer"></i> Baud</label>
    <input type="number" id="node-config-input-baudRate" placeholder="57600" step="1" />
  </div>

  <hr />

  <div class="form-row">
    <label for="node-config-input-vehicle"><i class="fa fa-rocket"></i> Vehicle</label>
    <input type="text" id="node-config-input-vehicle" style="width:70%" />
  </div>
  <div class="form-row">
    <label for="node-config-input-localIdentity"><i class="fa fa-id-card"></i> Identity</label>
    <input type="text" id="node-config-input-localIdentity" style="width:70%" />
  </div>

  <hr />

  <div class="form-row">
    <label><i class="fa fa-lock"></i> Signing</label>
    <span>Off by default — all combinations are legal (§7).</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-signOutbound">&nbsp;</label>
    <input type="checkbox" id="node-config-input-signOutbound" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Sign outbound (requires a passphrase, or the connection fails closed)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-requireSigned">&nbsp;</label>
    <input type="checkbox" id="node-config-input-requireSigned" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Require signed inbound (RADIO_STATUS still accepted unsigned)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-acceptInvalid">&nbsp;</label>
    <input type="checkbox" id="node-config-input-acceptInvalid" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Accept invalid signatures (recovery only — untrusted, advisory)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-signingPassphrase"><i class="fa fa-key"></i> Passphrase</label>
    <input type="password" id="node-config-input-signingPassphrase" />
  </div>
  <div class="form-row">
    <label for="node-config-input-linkId"><i class="fa fa-link"></i> Link ID</label>
    <input type="text" id="node-config-input-linkId" placeholder="0" />
  </div>

  <hr />

  <div class="form-row">
    <label for="node-config-input-staleMs"><i class="fa fa-clock-o"></i> Stale (ms)</label>
    <input type="text" id="node-config-input-staleMs" placeholder="5000" />
  </div>
  <div class="form-row">
    <label for="node-config-input-expireMs"><i class="fa fa-clock-o"></i> Expire (ms)</label>
    <input type="text" id="node-config-input-expireMs" placeholder="15000" />
  </div>

  <div class="form-row">
    <label for="node-config-input-disabled"><i class="fa fa-ban"></i> Disable</label>
    <input type="checkbox" id="node-config-input-disabled" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Construct no runtime (Node-RED cannot disable config nodes)</span>
  </div>
</script>

<script type="text/html" data-help-name="mavlink-connection">
  <p>A MAVLink <b>Connection</b>: how traffic moves and stays channel-correct.
  Owns the transport, the peer table, the bound Vehicle Profile, the outbound
  queue and its bands, and the signing link state (DESIGN.md §7, §8).</p>

  <h3>Transport</h3>
  <p><b>UDP</b>, <b>TCP</b>, and <b>serial</b> share the same driver-side scheduling
  contract. UDP binds a local port and may set an optional remote default target.
  TCP with a remote host/port is a client; with only bind settings it is a server.
  Serial opens a device path (optional <code>serialport</code> dependency) at the
  configured baud; peer-table endpoints are that path.</p>

  <h3>Bands and scheduling</h3>
  <p>Every outbound message carries a priority band (emergency, liveness,
  control, streaming, bulk). The driver holds queue depth itself and keeps the
  socket buffer shallow, so priority is not defeated at the kernel boundary.
  DSCP marking is an optional optimisation on links you control and is never
  relied upon.</p>

  <h3>Signing</h3>
  <p>Optional and off by default. <i>Sign outbound</i> and <i>require signed
  inbound</i> are independent; <i>accept invalid signatures</i> is a recovery
  override whose traffic is untrusted and advisory only. The passphrase is
  stored in Node-RED encrypted credentials, never in exported flow JSON.</p>

  <h3>Disable</h3>
  <p>Disabling constructs no runtime at all — no listening or timers — since
  Node-RED cannot disable config nodes directly.</p>
</script>
