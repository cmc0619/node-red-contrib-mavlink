<!--
  mavlink-connection — Connection config node editor (DESIGN.md §3, §6, §7).

  Vehicle / Identity use Node-RED's standard config-node select with edit
  (pencil) and add (+) buttons — never a free-form id and never a buttonless
  <select> fallback.
-->

<script type="text/javascript">
  (function () {
  // Serial baud rates, as strings because that is what a <select> saves. A
  // closed list, not a suggestion list: the standard rates are a fixed
  // vocabulary, so nothing outside them needs to stay typeable.
  const SERIAL_BAUDS = ['9600', '19200', '38400', '57600', '115200', '230400', '460800', '921600'];

  // Remote host and port are a pair — both blank (listen-only) or both set.
  // The runtime trusts this: a half-configured remote never deploys, so the
  // UDP send path treats any missing half as no destination and drops quietly.
  function remotePairReason(v, other) {
    if (RED.mavlink.isBlank(v) === RED.mavlink.isBlank(other)) return true;
    return 'Remote host and port are a pair — set both or neither';
  }

  // The two signing credentials are mutually exclusive (§7): both set is an
  // ambiguous deploy and which key wins would be a silent guess, so each side
  // asks whether the other is present. Saved password credentials surface as
  // `has_*` booleans rather than values, so the check reads the live entry
  // first — own dialog only, and an emptied box is the operator's answer —
  // then either saved spelling.
  function signingSiblingPresent(node, selector, valueKey, hasKey) {
    const $f = RED.mavlink.ownDialogField(node, selector);
    if ($f) return !RED.mavlink.isBlank($f.val());
    const creds = node.credentials || {};
    let v = creds[valueKey];
    if (v === undefined) v = creds[hasKey];
    return Boolean(v);
  }

  function companionBoundElsewhere(node, identityIds) {
    let conflict = null;
    RED.nodes.eachConfig((other) => {
      if (conflict || other.type !== 'mavlink-connection' || other.id === node.id) return;
      const bound = [other.localIdentity].concat(other.additionalIdentities || []);
      (identityIds || []).some((identityId) => {
        const identity = RED.nodes.node(identityId);
        if (identity && identity.role === 'companion' && bound.indexOf(identityId) !== -1) {
          conflict = other;
          return true;
        }
        return false;
      });
    });
    if (!conflict) return true;
    return `Companion identity is already bound to ‘${conflict.name || conflict.id}’ — a Companion may have one Connection`;
  }

  function identityFree(conn, identityId) {
    return companionBoundElsewhere(conn, [identityId]) === true;
  }

  // The Connection whose dialog is open. Node-RED hands the Identity picker's
  // filter no node — `filter.call(null, config)` on the first build, the edit
  // context on the rebuild after the pencil returns — so the owner is read
  // off the edit stack, nearest Connection first: an identity opened through
  // the pencil sits above it.
  function editingConnection() {
    const stack = RED.editor.getEditStack();
    for (let i = stack.length - 1; i >= 0; i--) {
      if (stack[i].type === 'mavlink-connection') return stack[i];
    }
    return null;
  }

  // Ports are 16-bit, and 0 is a silent trap rather than a port: binding 0
  // asks the OS for a random port no vehicle can be pointed at, and a remote
  // or swarm port 0 reads as "no destination" on the send path (§14 audit:
  // bindPort 0 is protector-side work). The shared validateIntRange(1, 65535)
  // ring owns the range; blank is each field's own business.

  RED.nodes.registerType('mavlink-connection', {
    category: 'config',
    defaults: {
      name: { value: '' },
      mode: { value: 'udp', required: true },
      // The runtime hands bindHost/bindPort to the socket as saved, so both
      // must be present for the IP transports — blanking the host would bind
      // nothing nameable, not "all interfaces" (that is what 0.0.0.0 says).
      bindHost: { value: '0.0.0.0', validate(v, _opt) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode === 'serial') return true;
        if (!RED.mavlink.isBlank(v)) return true;
        return 'bind host is required — 0.0.0.0 means all interfaces';
      } },
      bindPort: { value: 14550, validate(v, opt) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode === 'serial') return true;
        if (RED.mavlink.isBlank(v)) return 'bind port is required for UDP/TCP';
        return RED.mavlink.validateIntRange(1, 65535).call(this, v, opt);
      } },
      // Sibling reads go through ownDialogField, not `live || saved` (the
      // #284 lesson, same trap one node over): an emptied box is the
      // operator's answer, and a truthiness fallback would resurrect the
      // saved value — clearing both fields to go listen-only would red
      // forever, each blank vouched against by the other's ghost.
      remoteHost: { value: '', validate(v, _opt) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode === 'serial') return true;
        const $port = RED.mavlink.ownDialogField(this, '#node-config-input-remotePort');
        return remotePairReason(v, $port ? $port.val() : this.remotePort);
      } },
      remotePort: { value: '', validate(v, opt) {
        // Mode gate first: serial hides this field, and a stale value must
        // not red a control the operator cannot see (same gate as bindPort).
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode === 'serial') return true;
        const range = RED.mavlink.validateIntRange(1, 65535).call(this, v, opt);
        if (range !== true) return range;
        const $host = RED.mavlink.ownDialogField(this, '#node-config-input-remoteHost');
        return remotePairReason(v, $host ? $host.val() : this.remoteHost);
      } },
      broadcastHost: { value: '' },
      // UDP-only, like its row: TCP and serial hide the field, and a stale
      // value must not red a control the operator cannot see. Required once a
      // swarm address is set — the runtime sends to this port as saved, and a
      // blank would reach the socket as port 0. Sibling read as remoteHost's.
      broadcastPort: { value: '', validate(v, opt) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode !== 'udp') return true;
        if (RED.mavlink.isBlank(v)) {
          const $host = RED.mavlink.ownDialogField(this, '#node-config-input-broadcastHost');
          if (RED.mavlink.isBlank($host ? $host.val() : this.broadcastHost)) return true;
          return 'swarm port is required with a swarm address — for multicast, the bind port';
        }
        return RED.mavlink.validateIntRange(1, 65535).call(this, v, opt);
      } },
      serialPath: { value: '', validate(v) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode !== 'serial') return true;
        return !RED.mavlink.isBlank(v);
      } },
      // The runtime opens the port at this rate as saved (§0) — the editor
      // owns the 57600 default and the membership ring. Gated on serial like
      // the path beside it: a stale value must not red a row the mode hides.
      baudRate: { value: '57600', validate(v, _opt) {
        const mode = RED.mavlink.liveOr(this, '#node-config-input-mode', this.mode, 'udp');
        if (mode !== 'serial') return true;
        return RED.mavlink.oneOf(SERIAL_BAUDS).call(this, String(v), _opt);
      } },
      // Config-node references (§6 — everything enumerable is a dropdown).
      vehicle: { value: '', type: 'mavlink-vehicle', required: true },
      // A companion another Connection holds is not offered: the stock picker
      // hands every Local Identity through `filter` and lists the ones it
      // returns true for. The one exception is this Connection's own saved
      // value — an identity re-roled to companion after two Connections bound
      // it as a GCS. Dropping it from the list would leave the select on some
      // other entry and the save would rewrite the binding silently (§9
      // ruling 6); kept in the list, it stays on screen and the validator
      // reds it with the other Connection's name.
      localIdentity: { value: '', type: 'mavlink-local-identity', required: true,
        filter(identity) {
          const conn = editingConnection();
          return identity.id === conn.localIdentity || identityFree(conn, identity.id);
        },
        validate(v, _opt) { return companionBoundElsewhere(this, [v]); } },
      // Every bound identity must send as its own (sysid, compid). Sharing the
      // pair is a wire collision the driver cannot report: the Connection runs
      // one heartbeat scheduler per identity, and ack attribution matches a
      // COMMAND_ACK's target ids against our own — so two identities on one
      // pair heartbeat indistinguishably and let a single ack satisfy both
      // waiters, silently (§0 rule 3, the one guard-shaped case §9 promotes).
      // `gcs` and `custom` both preset to 255/190, so adding a second station
      // is precisely how an operator lands here.
      //
      // Validating the list covers the whole bound set, primary included: the
      // additionals are the rows an operator can actually change. Siblings are
      // read live through liveOr so the check is scoped to this dialog (#217).
      additionalIdentities: { value: [], validate(v, _opt) {
        const $live = RED.mavlink.ownDialogField(this, '#node-config-input-additionalIdentities');
        if ($live) v = $live.val();
        const elsewhere = companionBoundElsewhere(this, v);
        if (elsewhere !== true) return elsewhere;
        const vehicleId = RED.mavlink.liveOr(this, '#node-config-input-vehicle', this.vehicle, '');
        const vehicleNode = vehicleId ? RED.nodes.node(vehicleId) : null;
        // No Vehicle resolved yet — its own required ring owns that, and a
        // companion's sysid cannot be derived without it.
        if (!vehicleNode) return true;
        const primary = RED.mavlink.liveOr(this, '#node-config-input-localIdentity', this.localIdentity, '');
        const bound = [primary].concat(Array.isArray(v) ? v : []);
        const clash = RED.mavlink.duplicateBoundIdentity(bound, vehicleNode.defaultTargetSystem);
        if (!clash) return true;
        return `‘${clash.a}’ and ‘${clash.b}’ both send as ${clash.sysid}/${clash.compid} — each bound identity needs its own SysID/CompID`;
      } },
      // Sign outbound needs a key to sign with (§7): checked with both
      // credential boxes blank is a deploy that cannot start, so it reds here.
      // The sibling reads follow the exclusivity ring's saved/live resolution.
      // Two args so the reason renders (§14).
      signOutbound: { value: false, validate(v, _opt) {
        if (v !== true && v !== 'true') return true;
        if (signingSiblingPresent(this, '#node-config-input-signingPassphrase',
          'signingPassphrase', 'has_signingPassphrase')) return true;
        if (signingSiblingPresent(this, '#node-config-input-signingKeyHex',
          'signingKeyHex', 'has_signingKeyHex')) return true;
        return 'requires a signing passphrase or raw key';
      } },
      requireSigned: { value: false },
      acceptInvalid: { value: false },
      // The signature block carries the link id as one byte on the wire.
      linkId: { value: 0, validate(v, _opt) {
        const n = RED.mavlink.isBlank(v) ? NaN : Number(v);
        if (Number.isInteger(n) && n >= 0 && n <= 255) return true;
        return 'the signing link id is a byte — 0 to 255';
      } },
      // The runtime sweeps on these as saved (§0), so the editor owns the
      // 5000/15000 defaults and blank reds; a set value must be a positive
      // interval, or staleness silently never fires.
      staleMs: { value: 5000, validate(v, opt) {
        if (RED.mavlink.isBlank(v)) return 'stale threshold is required';
        return RED.mavlink.validateAtLeast(1, { integer: true }).call(this, v, opt);
      } },
      // Cross-field (the dependency-between-fields case AGENTS.md names): a
      // peer must go stale before it expires, or the sweep drops it with the
      // stale event never fired. Read live through liveOr (#217).
      expireMs: { value: 15000, validate(v, opt) {
        if (RED.mavlink.isBlank(v)) return 'expire threshold is required';
        const shape = RED.mavlink.validateAtLeast(1, { integer: true }).call(this, v, opt);
        if (shape !== true) return shape;
        const staleMs = Number(RED.mavlink.liveOr(this, '#node-config-input-staleMs', this.staleMs, ''));
        if (Number(v) <= staleMs) return 'must be greater than the stale threshold';
        return true;
      } },
      disabled: { value: false },
    },
    credentials: {
      // Exclusivity mirror of signingKeyHex: the red must land on the field
      // the operator is touching, not only on the sibling. Blank is legal —
      // signing is optional. Two args so the reason renders (§14).
      signingPassphrase: {
        type: 'password',
        validate(v, _opt) {
          if (RED.mavlink.isBlank(v)) return true;
          if (signingSiblingPresent(this, '#node-config-input-signingKeyHex',
            'signingKeyHex', 'has_signingKeyHex')) {
            return 'cannot be set alongside a raw key — clear one; the connection '
              + 'will not guess which key to use';
          }
          return true;
        },
      },
      signingKeyHex: {
        type: 'password',
        /**
         * The two signing rules the driver no longer restates (§0): the wire
         * format, and the exclusivity against the passphrase — the
         * dependency-between-fields case AGENTS.md names by name.
         *
         * Two args so the reason renders (§14).
         */
        validate(v, _opt) {
          if (RED.mavlink.isBlank(v)) return true;
          // The exact saved value: the runtime hands it to Buffer.from(…, 'hex')
          // as saved, so surrounding whitespace reds here rather than
          // yielding a short key on the wire.
          const val = String(v);
          if (!/^[0-9a-fA-F]{64}$/.test(val)) {
            return 'must be exactly 64 hex characters (a raw 32-byte key)';
          }
          if (signingSiblingPresent(this, '#node-config-input-signingPassphrase',
            'signingPassphrase', 'has_signingPassphrase')) {
            return 'cannot be set alongside a passphrase — clear one; the connection '
              + 'will not guess which key to use';
          }
          return true;
        },
      },
    },
    label() {
      const mode = (this.mode || 'udp').toUpperCase();
      if (this.mode === 'serial') {
        return this.name || (`MAVLink SERIAL ${this.serialPath || ''}`);
      }
      const where = this.bindPort ? `:${this.bindPort}` : '';
      return this.name || `MAVLink ${mode}${where}`;
    },
    oneditprepare() {
      // Closed vocabulary, so the saved value is always one of the options.
      const $baud = $('#node-config-input-baudRate');
      SERIAL_BAUDS.forEach((baud) => {
        $('<option></option>').val(baud).text(baud).appendTo($baud);
      });
      $baud.val(String(this.baudRate === undefined ? '57600' : this.baudRate));

      RED.mavlink.ensureConfigNodePicker(this, 'vehicle', 'mavlink-vehicle', 'node-config-input');
      RED.mavlink.ensureConfigNodePicker(
        this,
        'localIdentity',
        'mavlink-local-identity',
        'node-config-input'
      );

      // Extra identities (issue #94): additionalIdentities is a *list* of
      // Local Identity config refs, and the stock config picker handles one
      // ref per property — so the list uses Node-RED's editableList with a
      // select per row. Options enumerate every Local Identity config node in
      // the workspace, including ones added this session but not yet deployed,
      // minus what this dialog cannot bind: a companion another Connection
      // holds, the primary Identity, and what the other rows hold. Every row
      // is refilled on every change, so a pick made in one control leaves the
      // others' menus at once, and a row whose pick the primary just took
      // shows the placeholder again rather than a value the save would omit.
      // A row's own saved value is the exception to the bound-elsewhere rule,
      // for the same reason as the primary's filter: an identity re-roled to
      // companion under two bindings has to stay on screen for the validator
      // to red, not vanish from the menu and from the save.
      const conn = this;
      const $idList = $('#mav-conn-additional-identities');
      function fillIdentityRow($sel, want) {
        const taken = [$('#node-config-input-localIdentity').val()];
        $idList.editableList('items').each(function () {
          const $other = $(this).find('select');
          if ($other[0] !== $sel[0]) taken.push($other.val());
        });
        $sel.empty().append($('<option></option>').val('').text('— select identity —'));
        RED.nodes.eachConfig((n) => {
          if (n.type !== 'mavlink-local-identity') return;
          if (taken.indexOf(n.id) !== -1) return;
          if (n.id !== want && !identityFree(conn, n.id)) return;
          $('<option></option>').val(n.id)
            .text(`${n.name || 'Local Identity'} (${n.role || 'gcs'})`)
            .appendTo($sel);
        });
        $sel.val(taken.indexOf(want) === -1 ? want : '');
      }
      function currentAdditionalIdentities() {
        const ids = [];
        $idList.editableList('items').each(function () {
          const id = $(this).find('select').val();
          if (id) ids.push(id);
        });
        return ids;
      }
      function syncAdditionalIdentities() {
        $idList.editableList('items').each(function () {
          const $sel = $(this).find('select');
          fillIdentityRow($sel, $sel.val());
        });
        const $input = $('#node-config-input-additionalIdentities').empty();
        currentAdditionalIdentities().forEach((id) => {
          $('<option></option>').val(id).prop('selected', true).appendTo($input);
        });
        $input.trigger('change');
      }
      $idList.editableList({
        addButton: 'add identity',
        removable: true,
        height: 'auto',
        removeItem: syncAdditionalIdentities,
        addItem(container, _index, data) {
          const $sel = $('<select>', { style: 'width:100%;' }).appendTo(container);
          fillIdentityRow($sel, data && data.id ? data.id : '');
          $sel.on('change', syncAdditionalIdentities);
        },
      });
      (this.additionalIdentities || []).forEach((id) => {
        $idList.editableList('addItem', { id });
      });
      $('#node-config-input-localIdentity').on('change', syncAdditionalIdentities);
      syncAdditionalIdentities();

      function refreshTransportRows() {
        const mode = $('#node-config-input-mode').val() || 'udp';
        const ip = mode === 'udp' || mode === 'tcp';
        $('#row-conn-bindHost, #row-conn-bindPort, #row-conn-remoteHost, #row-conn-remotePort').toggle(ip);
        // UDP only: TCP is connection-oriented unicast and has no broadcast at
        // all, and a TCP server reaches every client through the peer table.
        $('#row-conn-broadcastHost, #row-conn-broadcastPort').toggle(mode === 'udp');
        $('#row-conn-serialPath, #row-conn-baudRate').toggle(mode === 'serial');
        if (mode === 'serial') fillSerialPorts();
        $('#mav-conn-tcp-tip').toggle(mode === 'tcp');
        $('#mav-conn-serial-tip').toggle(mode === 'serial');
      }
      // Detected host ports, offered as suggestions on the path box. A
      // datalist rather than a second picker control: the field still takes
      // any path typed by hand, because a host cannot enumerate a
      // serial-over-network adapter or a symlink it has not seen — and a
      // suggestion list needs no saved-value sentinel, since the input holds
      // whatever was saved whether the host reports it or not. Fetched once
      // per dialog and only once serial is chosen, so UDP and TCP dialogs
      // never call the endpoint. A failed fetch leaves the list empty, which
      // reads the same as a host with no ports: the box still accepts a path.
      let portsRequested = false;
      function fillSerialPorts() {
        if (portsRequested) return;
        portsRequested = true;
        $.getJSON(RED.mavlink.adminApiUrl('/mavlink/serial-ports'), (data) => {
          const $list = $('#mav-conn-serial-ports').empty();
          ((data && data.ports) || []).forEach((port) => {
            $('<option></option>').val(port.path).text(port.manufacturer || '').appendTo($list);
          });
        });
      }

      $('#node-config-input-mode').on('change', refreshTransportRows);
      refreshTransportRows();
    },
    oneditsave() {
      this.additionalIdentities = $('#node-config-input-additionalIdentities').val() || [];
    },
  });
  })();
</script>

<script type="text/html" data-template-name="mavlink-connection">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Connection name" />
  </div>

  <div class="form-row">
    <label for="node-config-input-mode"><i class="fa fa-exchange"></i> Transport</label>
    <select id="node-config-input-mode">
      <option value="udp">UDP</option>
      <option value="tcp">TCP</option>
      <option value="serial">Serial</option>
    </select>
  </div>

  <div class="form-tips" id="mav-conn-tcp-tip" style="margin-bottom:8px;display:none;">
    TCP with a remote host/port is a <b>client</b>. With only bind host/port it is a
    <b>server</b> that accepts peers (send follows the peer-table endpoint, or the sole client).
  </div>
  <div class="form-tips" id="mav-conn-serial-tip" style="margin-bottom:8px;display:none;">
    Requires optional dependency <code>serialport</code>. Peer-table endpoints use the device path.
  </div>

  <div class="form-row" id="row-conn-bindHost">
    <label for="node-config-input-bindHost"><i class="fa fa-sign-in"></i> Bind host</label>
    <input type="text" id="node-config-input-bindHost" placeholder="0.0.0.0" />
  </div>
  <div class="form-row" id="row-conn-bindPort">
    <label for="node-config-input-bindPort"><i class="fa fa-sign-in"></i> Bind port</label>
    <input type="text" id="node-config-input-bindPort" placeholder="14550" />
  </div>

  <div class="form-row" id="row-conn-remoteHost">
    <label for="node-config-input-remoteHost"><i class="fa fa-sign-out"></i> Remote host</label>
    <input type="text" id="node-config-input-remoteHost" placeholder="(optional default target)" />
  </div>
  <div class="form-row" id="row-conn-remotePort">
    <label for="node-config-input-remotePort"><i class="fa fa-sign-out"></i> Remote port</label>
    <input type="text" id="node-config-input-remotePort" placeholder="(optional)" />
  </div>

  <div class="form-row" id="row-conn-broadcastHost">
    <label for="node-config-input-broadcastHost"><i class="fa fa-bullhorn"></i> Swarm address</label>
    <input type="text" id="node-config-input-broadcastHost"
      placeholder="(optional) 255.255.255.255 or a multicast group" />
  </div>
  <div class="form-row" id="row-conn-broadcastPort">
    <label for="node-config-input-broadcastPort"><i class="fa fa-bullhorn"></i> Swarm port</label>
    <input type="text" id="node-config-input-broadcastPort" placeholder="(with a swarm address; multicast: the bind port)" />
  </div>

  <div class="form-row" id="row-conn-serialPath">
    <label for="node-config-input-serialPath"><i class="fa fa-usb"></i> Serial path</label>
    <input type="text" id="node-config-input-serialPath" placeholder="/dev/ttyUSB0 or COM3"
      list="mav-conn-serial-ports" />
    <datalist id="mav-conn-serial-ports"></datalist>
  </div>
  <div class="form-row" id="row-conn-baudRate">
    <label for="node-config-input-baudRate"><i class="fa fa-tachometer"></i> Baud</label>
    <select id="node-config-input-baudRate"></select>
  </div>

  <hr />

  <div class="form-row">
    <label for="node-config-input-vehicle"><i class="fa fa-rocket"></i> Vehicle</label>
    <input type="text" id="node-config-input-vehicle" style="width:70%" />
  </div>
  <div class="form-row">
    <label for="node-config-input-localIdentity"><i class="fa fa-id-card"></i> Identity</label>
    <input type="text" id="node-config-input-localIdentity" style="width:70%" />
  </div>
  <div class="form-row" style="margin-bottom:0;">
    <label style="vertical-align:top;"><i class="fa fa-id-card-o"></i> Extra identities</label>
    <div style="display:inline-block; width:70%;">
      <select id="node-config-input-additionalIdentities" multiple style="display:none;"></select>
      <ol id="mav-conn-additional-identities"></ol>
    </div>
  </div>
  <div class="form-tips" style="margin-bottom:8px;">
    Optional further Local Identities bound to this connection. Each sends its own
    heartbeat and is selectable in the action nodes' Identity row.
  </div>

  <hr />

  <div class="form-row">
    <label><i class="fa fa-lock"></i> Signing</label>
    <span>Off by default — all combinations are legal.</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-signOutbound">&nbsp;</label>
    <input type="checkbox" id="node-config-input-signOutbound" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Sign outbound (requires a passphrase, or the connection fails closed)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-requireSigned">&nbsp;</label>
    <input type="checkbox" id="node-config-input-requireSigned" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Require signed inbound (RADIO_STATUS still accepted unsigned)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-acceptInvalid">&nbsp;</label>
    <input type="checkbox" id="node-config-input-acceptInvalid" style="display:inline-block; width:auto; vertical-align:top;" />
    <span>Accept invalid signatures (recovery only — untrusted, advisory)</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-signingPassphrase"><i class="fa fa-key"></i> Passphrase</label>
    <input type="password" id="node-config-input-signingPassphrase" />
  </div>
  <div class="form-row">
    <label for="node-config-input-signingKeyHex"><i class="fa fa-key"></i> Raw key (hex)</label>
    <input type="password" id="node-config-input-signingKeyHex" placeholder="64 hex characters" />
  </div>
  <div class="form-row">
    <label for="node-config-input-linkId"><i class="fa fa-link"></i> Link ID</label>
    <input type="text" id="node-config-input-linkId" placeholder="0" />
  </div>

  <hr />

  <div class="form-row">
    <label for="node-config-input-staleMs"><i class="fa fa-clock-o"></i> Stale (ms)</label>
    <input type="text" id="node-config-input-staleMs" placeholder="5000" />
  </div>
  <div class="form-row">
    <label for="node-config-input-expireMs"><i class="fa fa-clock-o"></i> Expire (ms)</label>

  <div class="form-row">
    <label for="node-config-input-disabled"><i class="fa fa-ban"></i> Disable</label>

<script type="text/html" data-help-name="mavlink-connection">
  <p>A MAVLink <b>Connection</b>: how traffic moves and stays channel-correct.
  Owns the transport, the peer table, the bound Vehicle Profile, the outbound
  queue and its bands, and the signing link state.</p>

  <h3>Transport</h3>
  <p><b>UDP</b>, <b>TCP</b>, and <b>serial</b> share the same driver-side scheduling
  contract. UDP binds a local port and may set an optional remote default target.
  TCP with a remote host/port is a client; with only bind settings it is a server.
  Serial opens a device path (optional <code>serialport</code> dependency) at the
  configured baud; peer-table endpoints are that path. The path box suggests the
  host's detected ports when that dependency is installed, and still accepts any
  path typed by hand.</p>

  <h3>Swarm address (UDP)</h3>
  <p>Optional, and only about <i>delivery</i>. A message reaches every vehicle
  because it carries <code>target_system = 0</code> — that is a field in the
  frame, not a setting here. Without a swarm address such a message is still
  delivered to everyone, by writing it once to each learned peer.</p>
  <p>Setting a swarm address collapses that to a single write, for media that
  can carry one. Two kinds work, and the address itself decides which:</p>
  <ul>
    <li><b>Multicast</b> (<code>224.0.0.0/4</code>, e.g. ArduPilot's
    <code>239.255.145.50</code>) — the group is joined on bind. Only vehicles
    that joined it hear the traffic, and each one must join explicitly;
    listening passively never works.</li>
    <li><b>Broadcast</b> (anything else, e.g. <code>255.255.255.255</code>) —
    every host on the link hears it. Vehicles must be bound as UDP servers on
    <code>0.0.0.0</code>; binding to a specific interface address does not
    receive broadcast traffic.</li>
  </ul>
  <p><b>Swarm port</b> is required alongside the address. For multicast it is
  the bind port — members join one group <i>and</i> port; set it to wherever the
  vehicles listen otherwise.</p>
  <p>Directed traffic never uses this address. TCP has no broadcast of any kind
  and does not need one: a TCP server writes to every connected vehicle already.</p>

  <h3>Identities</h3>
  <p><b>Identity</b> is the connection's default source identity. <b>Extra
  identities</b> optionally bind further Local Identity profiles to the same
  link: each sends its own heartbeat, and action nodes can pick any bound
  identity as their Identity row's source. Binding a second identity is what
  makes that row appear — with one identity there is nothing to choose, so the
  action nodes hide it and stamp this one.</p>
  <p>Bind as many as the flow needs — there is no per-role limit. What each one
  needs is its <i>own</i> source <b>SysID/CompID</b>: that pair is the identity
  on the wire, so two identities sharing it heartbeat indistinguishably and make
  a command ack impossible to attribute. The editor reds the pair rather than
  letting it reach the link. Two ground stations are two <i>systems</i>, so each
  takes its own <b>SysID</b> (<code>255</code>, <code>254</code>…) — MAVLink defines
  one ground-station component, <code>190</code>. Two companions are two components
  of one airframe, so each keeps the derived SysID and takes its own
  onboard-computer slot (<code>191</code>-<code>194</code>).</p>

  <h3>Bands and scheduling</h3>
  <p>Every outbound message carries a priority band (emergency, liveness,
  control, streaming, bulk). The driver holds queue depth itself and keeps the
  socket buffer shallow, so priority is not defeated at the kernel boundary.
  DSCP marking is an optional optimisation on links you control and is never
  relied upon.</p>

  <h3>Signing</h3>
  <p>Optional and off by default. <i>Sign outbound</i> and <i>require signed
  inbound</i> are independent; <i>accept invalid signatures</i> is a recovery
  override whose traffic is untrusted and advisory only. The passphrase is
  stored in Node-RED encrypted credentials, never in exported flow JSON.</p>

  <h3>Disable</h3>
  <p>Disabling constructs no runtime at all — no listening or timers — since
  Node-RED cannot disable config nodes directly.</p>
</script>
