<script type="text/javascript">
  (function () {
  // Validate a field only while its anchor mode is selected — other modes hide
  // the field, and a hidden field's stale value must not block the dialog.
  // The mode read goes through liveOr so it is scoped to the node that owns
  // the open dialog (#217): a raw selector read would apply one node's live
  // mode to every sibling being validated behind it.
  // Two args throughout so a returned reason renders as the ring's message
  // (§14: a one-arg validator's returned string is coerced truthy).
  function whenAnchorMode(mode, check) {
    return function (v, opt) {
      if (RED.mavlink.liveOr(this, '#node-input-anchorMode', this.anchorMode, 'leader') !== mode) {
        return true;
      }
      return check.call(this, v, opt);
    };
  }
  // A required finite number: blank must not silently become 0.
  function finiteRequired(v) {
    return !RED.mavlink.isBlank(v) && Number.isFinite(Number(v));
  }

  RED.nodes.registerType('mavlink-formation', {
    category: 'mavlink',
    paletteLabel: 'formation',
    color: '#ffe6cc',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'mavlink-connection', required: true },
      // Closed vocabularies red on membership (§5's editor half): the runtime
      // dispatches these tokens with affirmative cases only, so a hand-edited
      // stray value must be caught here, the only place that can see it.
      shape: { value: 'line', validate: RED.mavlink.oneOf(['line', 'column', 'grid', 'wedge', 'circle', 'sphere']) },
      spacing: {
        value: 10,
        validate(v, _opt) {
          // Spacing must be a positive distance: 0 stacks every vehicle on the
          // same point — a commanded collision, not a formation.
          const n = Number(v);
          if (Number.isFinite(n) && n > 0) return true;
          return 'must be a distance in metres > 0 — 0 stacks the fleet on one point';
        },
      },
      sysids: {
        value: '',
        validate(v, _opt) {
          if (RED.mavlink.isBlank(v)) return true;
          return String(v).split(',').every((part) => {
            part = part.trim();
            if (!part) return true;
            const n = Number(part);
            return Number.isInteger(n) && n >= 1 && n <= 255;
          }) || 'each entry must be a SysID 1–255, comma-separated';
        },
      },
      anchorMode: { value: 'leader', validate: RED.mavlink.oneOf(['leader', 'fixed']) },
      // Off by default: anchoring on a vehicle the flow did not name is a
      // substitution, and substitutions are chosen, never assumed.
      promoteLeader: { value: false },
      leader: {
        value: '',
        validate: whenAnchorMode('leader', (v, _opt) => {
          const n = Number(v);
          if (Number.isInteger(n) && n >= 1 && n <= 255) return true;
          return 'must be the leader\'s SysID (1–255)';
        }),
      },
      // A fixed anchor must be a place on the ellipsoid: latitude ±90,
      // longitude ±180. Out of range is a typo, not a position.
      lat: {
        value: '',
        validate: whenAnchorMode('fixed', (v, _opt) => (finiteRequired(v) && Number(v) >= -90 && Number(v) <= 90)
            || 'must be a latitude within ±90°'),
      },
      lon: {
        value: '',
        validate: whenAnchorMode('fixed', (v, _opt) => (finiteRequired(v) && Number(v) >= -180 && Number(v) <= 180)
            || 'must be a longitude within ±180°'),
      },
      // alt is required whenever set as the fixed anchor: a blank altitude
      // must not become 0 — that commands a descent to home level.
      alt: {
        value: '',
        validate: whenAnchorMode('fixed', (v, _opt) => finiteRequired(v) || 'needs an altitude — blank would ride as ground level'),
      },
      headingDeg: { value: '', validate: RED.mavlink.validateRange(0, 360) },
      pitchDeg: { value: 0, validate: RED.validators.number() },
      delivery: { value: 'build', validate: RED.mavlink.oneOf(['build', 'send', 'confirm']) },
      changeMode: { value: false },
      intervalMs: {
        value: 100,
        // The input's min="0" is not enforced on save, and the runtime reads a
        // present value as Number(): blank would ride as 0 and a negative
        // paces nothing — an unthrottled fleet send either way.
        validate(v, _opt) {
          return (finiteRequired(v) && Number(v) >= 0)
            || 'must be a number of milliseconds >= 0 — blank rides as an unthrottled 0';
        },
      },
      // Timeout and Retries rows are always on screen here.
      ...RED.mavlink.ackDefaults(() => true),
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['continue', 'status'],
    icon: 'font-awesome/fa-th',
    label() { return this.name || 'mavlink formation'; },
    oneditprepare() {
      const node = this;
      RED.mavlink.ensureConfigNodePicker(node, 'connection', 'mavlink-connection', 'node-input');

      function refreshAnchorRows() {
        const mode = $('#node-input-anchorMode').val() || 'leader';
        $('#row-formation-leader').toggle(mode === 'leader');
        $('#row-formation-promoteLeader').toggle(mode === 'leader');
        $('#row-formation-lat').toggle(mode === 'fixed');
        $('#row-formation-lon').toggle(mode === 'fixed');
        $('#row-formation-alt').toggle(mode === 'fixed');
      }
      $('#node-input-anchorMode').on('change', refreshAnchorRows);
      refreshAnchorRows();
    }
  });
  })();
</script>

<script type="text/html" data-template-name="mavlink-formation">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <div class="form-row"><label for="node-input-shape">Shape</label><select id="node-input-shape"><option value="line">Line (abreast)</option><option value="column">Column (single file)</option><option value="grid">Grid</option><option value="wedge">Wedge (V)</option><option value="circle">Circle</option><option value="sphere">Sphere</option></select></div>
  <div class="form-row"><label for="node-input-spacing">Spacing m</label><input type="number" id="node-input-spacing" min="0.1" step="any"></div>
  <div class="form-row"><label for="node-input-sysids">Sysids</label><input type="text" id="node-input-sysids" placeholder="1,2,3"></div>
  <div class="form-row"><label for="node-input-anchorMode">Anchor</label><select id="node-input-anchorMode"><option value="leader">Leader vehicle position</option><option value="fixed">Fixed position</option></select></div>
  <div class="form-row" id="row-formation-leader"><label for="node-input-leader">Leader sysid</label><input type="number" id="node-input-leader" min="1" max="255"></div>
  <div class="form-row" id="row-formation-promoteLeader"><label for="node-input-promoteLeader">Promote on loss</label><input type="checkbox" id="node-input-promoteLeader" style="display:inline-block;width:auto;"></div>
  <div class="form-row" id="row-formation-lat"><label for="node-input-lat">Latitude</label><input type="number" id="node-input-lat"></div>
  <div class="form-row" id="row-formation-lon"><label for="node-input-lon">Longitude</label><input type="number" id="node-input-lon"></div>
  <div class="form-row" id="row-formation-alt"><label for="node-input-alt">Altitude m</label><input type="number" id="node-input-alt"></div>
  <div class="form-row"><label for="node-input-headingDeg">Heading deg</label><input type="number" id="node-input-headingDeg" placeholder="blank = leader's heading"></div>
  <div class="form-row"><label for="node-input-pitchDeg">Pitch deg</label><input type="number" id="node-input-pitchDeg" step="any"></div>
  <div class="form-row"><label for="node-input-delivery">Delivery</label><select id="node-input-delivery"><option value="build">Build</option><option value="send">Send</option><option value="confirm">Send and confirm</option></select></div>
  <div class="form-row"><label for="node-input-changeMode">Change mode</label><input type="checkbox" id="node-input-changeMode" style="display:inline-block;width:auto;"></div>
  <div class="form-row"><label for="node-input-intervalMs">Interval ms</label><input type="number" id="node-input-intervalMs" min="0"></div>
  <div class="form-row"><label for="node-input-timeoutMs">Timeout ms</label><input type="number" id="node-input-timeoutMs" min="1"></div>
  <div class="form-row"><label for="node-input-maxRetries">Retries</label><input type="number" id="node-input-maxRetries" min="0"></div>
</script>

<script type="text/html" data-help-name="mavlink-formation">
  <p>Positions a group of vehicles into a geometric formation: computes one absolute
  target per sysid (lib/formation) and fans a <b>Go To / Reposition</b>
  (<code>MAV_CMD_DO_REPOSITION</code>) out sequentially with each vehicle's own
  lat/lon/alt as per-member params 5/6/7. Slot 0 sits exactly on the anchor;
  slots are assigned in sorted sysid order. Members hold their commanded
  position indefinitely — <code>DO_REPOSITION</code> is one-shot, the node
  maintains nothing after the fan-out settles, and there is no TTL; re-send a
  new formation, or use Move to displace individual members.</p>
  <h3>Anchor</h3>
  <p><b>Leader vehicle position</b> reads the leader's live position from the
  Connection peer table. An anchor leader that has not reported a position
  fails the message.
  <b>Fixed position</b> takes lat/lon/alt from the node (or
  <code>msg.payload.anchor</code>, which overrides either mode).</p>
  <p><b>Promote on loss</b> lets the pattern survive losing its leader. With it off — the
  default — the configured leader anchors the formation whatever state it is in.
  A leader that has gone quiet still anchors it, from the last position it
  reported; only one that has <i>never</i> reported a position fails the
  message. With it on, a leader that has gone quiet or never reported hands the
  pattern to the next vehicle that can carry it: the
  lowest live sysid above the configured one, wrapping round to the lowest live
  sysid overall. <i>Live</i> is the peer table's own reckoning — still
  heartbeating, and carrying a position — the same test Fan-out selects members
  by. Nothing is remembered: the promotion is re-decided on every message, so
  the configured leader takes the pattern back on the first message after it
  reports again. Off by default because anchoring on a vehicle the flow did not
  name is a substitution, and the flow has to ask for it.</p>
  <p>Altitudes are metres above home (<code>MAV_FRAME_GLOBAL_RELATIVE_ALT</code>,
  the carrier's default frame): a leader anchor uses the leader's relative
  altitude. Slot 0 sits on the anchor altitude; planar shapes keep every
  follower level with it. <b>Sphere</b> places followers on a Fibonacci lattice
  of radius = spacing, so their altitudes differ (<code>alt − ned.down</code>).
  Pick an anchor high enough that the lowest sphere slot stays clear of the
  ground.</p>
  <h3>Heading and pitch</h3>
  <p>Heading yaws the pattern in the horizontal plane (0 = north). If blank, a
  leader anchor uses the leader's reported heading; if that is unknown too, the
  pattern faces north (0). Unlike a coordinate or altitude, an unknown heading
  is safe to default: any heading yields a fully separated formation — it
  orients the pattern, it cannot collapse it. <b>Pitch</b> tumbles the whole
  pattern around body +Y (right): positive pitch lifts the nose (forward toward
  −down). Use pitch steps to rotate a 3-D formation as a rigid group. Vehicle
  noses are not commanded: reposition yaw is sent as <code>NaN</code> (hold
  current heading), and speed as −1 (default) — the zero-fill for either would
  command yaw-to-north / zero ground speed.</p>
  <p><b>Change mode</b> sets <code>MAV_DO_REPOSITION_FLAGS_CHANGE_MODE</code> on
  every member's reposition, and the flag is the gate on both stacks
  (measured, DESIGN.md §14.108): the reposition is accepted iff the flag is set
  or the vehicle is already in GUIDED (ArduPilot) / Hold (PX4), else it answers
  denied (2). It flies each vehicle into guided mode — a mode change, and
  therefore an explicit opt-in, as on mavlink-move.</p>
  <h3>Input overrides</h3>
  <p><code>msg.payload.sysids</code> (comma list or array),
  <code>msg.payload.anchor</code> (<code>{lat, lon, alt}</code>),
  <code>msg.payload.headingDeg</code> and <code>msg.payload.pitchDeg</code>
  override the configured values per message. Shape and spacing are design-time
  choices.</p>
  <h3>Outputs</h3>
  <p>Output 0 fires only when every member succeeded, carrying the fan-out
  aggregate under <code>msg.payload</code>. Output 1 always carries the
  aggregate with per-vehicle detail. An anchor leader that has not reported
  position fails the input. On a leader anchor both records carry
  <code>leader</code>, the sysid the pattern actually hung off — compare it with
  the configured leader to see whether a promotion happened.</p>
</script>
