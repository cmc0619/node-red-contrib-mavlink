<!--
  Shared MAVLink editor helpers live in resources/mavlink-editor.js and are
  loaded via the stock Node-RED resource mechanism (DESIGN.md §6,
  https://nodered.org/docs/creating-nodes/resources). Node-RED's appendConfig
  defers every inline node script until this relative-`src` script's onload
  fires, so RED.mavlink.* is defined before any registerType runs. Local
  Identity is listed first in package.json so its resource tag leads the module.
-->
<script src="resources/@cmc0619/node-red-contrib-mavlink/mavlink-editor.js"></script>

<script type="text/javascript">
  (function () {
    function positiveNumberValidator(v, _opt) {
      // Blank reds: the runtime opens the heartbeat timer at this value as
      // saved (§0), and Number('') is 0 — a zero-interval timer, not 1 Hz.
      // The 1000 default is this dialog's, not the runtime's.
      var n = RED.mavlink.isBlank(v) ? NaN : Number(v);
      if (!Number.isFinite(n) || n <= 0) return 'must be a positive number of milliseconds';
      return true;
    }

    /**
     * A required uint8 identity id. CompID uses this in every role — the field
     * is the operator's everywhere — so its reason must not claim the
     * requirement is role-conditional; SysID's caller supplies one that does.
     */
    function mavIdentityIdValidator(min, reason) {
      var rangeCheck = RED.mavlink.validateUint8(min);
      return function (v, opt) {
        if (RED.mavlink.isBlank(v)) return reason;
        return rangeCheck.call(this, v, opt);
      };
    }

    /**
     * SysID's validator. The companion role derives this one field from the
     * vehicle on the bound Connection, so blank is its correct saved state;
     * every other role requires a value.
     *
     * The live role read goes through liveOr so it is scoped to this node's
     * own dialog (#217): a bare $('#node-config-input-role') read would trust
     * whatever dialog happens to be open, and a foreign read here poisons
     * `valid` on a node whose blank sysid is legal — sticky until reopened,
     * and the Connection reds with it through Node-RED's config cascade.
     */
    function mavSourceSysidValidator(min) {
      var required = mavIdentityIdValidator(min, 'required for this role');
      var rangeCheck = RED.mavlink.validateUint8(min);
      return function (v, opt) {
        var role = RED.mavlink.liveOr(this, '#node-config-input-role', this.role, 'gcs');
        if (role !== 'companion') return required.call(this, v, opt);
        return RED.mavlink.isBlank(v) ? true : rangeCheck.call(this, v, opt);
      };
    }

    /**
     * Role presets: suggested identity values per role. Switching roles
     * pre-fills blank fields; an explicitly customized value is never rewritten.
     *
     * `compIdSuggest` floats the components the role plausibly means to the top
     * of the CompID select — a substring matched against MAV_COMPONENT's own
     * names, the same mechanism the Payload node's topic hint uses. Suggested,
     * never filtered: custom names none and gets the flat list, and every
     * component stays reachable in all three roles.
     */
    var ROLE_PRESETS = {
      gcs:       { sysid: 255, compid: 190, heartbeatType: 'MAV_TYPE_GCS', compIdSuggest: 'MISSIONPLANNER' },
      companion: { sysid: null, compid: 191, heartbeatType: 'MAV_TYPE_ONBOARD_CONTROLLER', compIdSuggest: 'ONBOARD_COMPUTER' },
      custom:    { sysid: 255, compid: 190, heartbeatType: 'MAV_TYPE_GENERIC', compIdSuggest: '' }
    };

    RED.nodes.registerType('mavlink-local-identity', {
      category: 'config',
      defaults: {
        name:              { value: '' },
        role:              { value: 'gcs', required: true },
        /**
         * SysID is NOT `required`: the companion role derives it from the
         * vehicle, so blank is the correct saved state in that role, and its
         * validator carries that one allowance. CompID is required in every
         * role — the operator picks the component in all three.
         */
        sourceSystemId:    { value: 255, validate: mavSourceSysidValidator(1) },
        sourceComponentId: { value: 190, validate: mavIdentityIdValidator(1, 'required — a blank CompID names no component') },
        heartbeatType:     { value: '' },
        heartbeatAutopilot:{ value: 'MAV_AUTOPILOT_INVALID' },
        heartbeatIntervalMs:{ value: 1000, validate: positiveNumberValidator }
      },
      label: function () {
        if (this.role === 'companion') {
          return (this.name || 'MAVLink Local Identity') + ' (vehicle SysID)';
        }
        var sysid = this.sourceSystemId;
        var compid = this.sourceComponentId;
        var ids = (sysid !== undefined && compid !== undefined) ? ' ' + sysid + '/' + compid : '';
        return (this.name || 'MAVLink Local Identity') + ids;
      },
      oneditprepare: function () {
        var node = this;
        var $role   = $('#node-config-input-role');
        var $sysid  = $('#node-config-input-sourceSystemId');
        var $compid = $('#node-config-input-sourceComponentId');
        var $hbType = $('#node-config-input-heartbeatType');
        var $hbAp   = $('#node-config-input-heartbeatAutopilot');
        var prevRole = $role.val() || 'gcs';
        var enumLoadToken = { cancelled: false };
        node._mavEnumLoadToken = enumLoadToken;

        // CompID is an empty <select> until /mavlink/enums returns. Node-RED
        // validates immediately after oneditprepare — seed the saved numeric
        // id first so GCS/custom do not flash `required for this role`.
        RED.mavlink.fillCompIdSelect($compid, [], {
          saved: $compid.val() || node.sourceComponentId
        });

        // Local Identity has no Connection/Dialect row — request `common`
        // explicitly (owns MAV_TYPE / MAV_AUTOPILOT). CompID fetches its own,
        // per role, in refillCompIds below.
        RED.mavlink.loadEnumsCatalog(['MAV_TYPE', 'MAV_AUTOPILOT'], function (catalog) {
          var enums = (catalog && catalog.enums) || {};
          // Prefer live dialog values so a role change before the catalog
          // resolves is not overwritten by the pre-edit saved snapshot.
          RED.mavlink.fillEnumSelect($hbType, enums.MAV_TYPE || [], {
            valueKey: 'name',
            allowEmpty: true,
            saved: $hbType.val() || node.heartbeatType
          });
          RED.mavlink.fillEnumSelect($hbAp, enums.MAV_AUTOPILOT || [], {
            valueKey: 'name',
            saved: $hbAp.val() || node.heartbeatAutopilot
          });
        }, enumLoadToken, { dialect: 'common' });

        /**
         * Fill the CompID select with the current role's suggestions on top.
         * The role is read in the callback, so a response that lands after a
         * further role change still paints the role now selected.
         *
         * No sequence counter here. `enumLoadToken` already drops responses
         * that land after the dialog closed, which is the reachable case and
         * the one Fan-out's MAV_TYPE counter exists for — it has no per-open
         * token. What a counter would add is ordering between two fetches
         * inside one open dialog, and the only caller that can start a second
         * one is the role select: an operator would have to change it twice
         * within a localhost round trip. Nothing fires that change
         * programmatically.
         */
        function refillCompIds(desired) {
          RED.mavlink.loadEnumsCatalog(['MAV_COMPONENT'], function (catalog) {
            // `desired === null` rather than truthiness: component 0 is
            // MAV_COMP_ID_ALL, a real member of the enum.
            RED.mavlink.fillCompIdSelect($compid, ((catalog || {}).enums || {}).MAV_COMPONENT || [], {
              saved: desired === null || desired === undefined
                ? ($compid.val() || node.sourceComponentId)
                : desired,
              suggest: preset($role.val()).compIdSuggest
            });
          }, enumLoadToken, { dialect: 'common' });
        }
        // No seeding on open: 190 is a legal companion CompID, so rewriting it
        // to 191 would silently retype an identity the operator chose. A saved
        // companion from before this field was visible shows the 190 it saved,
        // and picking a slot is the operator's (pre-1.0: re-pick, not migrate).
        refillCompIds();

        function preset(role) {
          return ROLE_PRESETS[role] || ROLE_PRESETS.custom;
        }

        /**
         * Apply role hint visibility and re-suggest values for the newly picked
         * role. A field is rewritten only when blank or still equal to the
         * previous role's suggestion — an explicit edit is never reverted.
         */
        function applyRole() {
          var role = $role.val();
          var prev = preset(prevRole);
          var next = preset(role);

          /* sysid */
          if (next.sysid !== null) {
            var curSys = String($sysid.val()).trim();
            if (curSys === '' || Number($sysid.val()) === prev.sysid) {
              $sysid.val(next.sysid);
            }
          }
          /* compid */
          var pickedCompId = null;
          if (next.compid !== null) {
            var curCmp = String($compid.val()).trim();
            if (curCmp === '' || Number($compid.val()) === prev.compid) {
              pickedCompId = next.compid;
              $compid.val(pickedCompId);
              $compid.trigger('change');
            }
          }
          /* heartbeat type */
          var hb = String($hbType.val()).trim();
          if (hb === '' || hb === prev.heartbeatType) {
            $hbType.val(next.heartbeatType);
            $hbType.trigger('change');
          }

          // The role names a different family of components, so the select's
          // "Suggested" group is repainted with it — same entries, new order.
          // The new suggestion rides along: switching role before the catalog
          // lands leaves the select empty, where `.val()` sets nothing and the
          // repaint would otherwise fall back to the pre-switch saved id.
          refillCompIds(pickedCompId);
          applyVisibility(role);
          prevRole = role;
        }

        /**
         * §6 rule: role reshapes the dialog. Companion derives its SysID from
         * the vehicle on the bound Connection, so that row hides and a note
         * says where the value comes from. CompID stays: MAV_COMPONENT carries
         * four onboard-computer slots, so it is a real choice (§14.135).
         */
        function applyVisibility(role) {
          var isCompanion = (role === 'companion');
          $sysid.closest('.form-row').toggle(!isCompanion);
          $('#mav-companion-ids-note').toggle(isCompanion);
          $('.mav-role-hint').hide();
          $('#mav-role-hint-' + role).show();
        }

        $role.on('change', applyRole);

        /* Show hint for saved role without rewriting saved values */
        $('.mav-role-hint').hide();
        $('#mav-role-hint-' + prevRole).show();
        applyVisibility(prevRole);
      },
      oneditsave: function () {
        if (this._mavEnumLoadToken) this._mavEnumLoadToken.cancelled = true;
        /**
         * Companion role: SysID is derived from the vehicle, so a value a
         * previous role left behind reads as a contradiction next to it —
         * clear the editor field, since Node-RED copies these onto the node
         * after oneditsave returns. CompID is NOT cleared: the operator picks
         * the onboard slot in this role too, and the runtime reads what is
         * saved. Blanking it would reach the wire as component 0.
         */
        if ($('#node-config-input-role').val() === 'companion') {
          $('#node-config-input-sourceSystemId').val('');
        }
      },
      oneditcancel: function () {
        if (this._mavEnumLoadToken) this._mavEnumLoadToken.cancelled = true;
      }
    });
  })();
</script>

<script type="text/html" data-template-name="mavlink-local-identity">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Node-RED GCS">
  </div>
  <div class="form-row">
    <label for="node-config-input-role">Role</label>
    <select id="node-config-input-role">
      <option value="gcs">GCS (ground control station)</option>
      <option value="companion">Onboard companion (shares vehicle SysID)</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div class="form-tips mav-role-hint" id="mav-role-hint-gcs" style="margin-bottom:8px;display:none;">
    A <b>GCS</b> conventionally uses Source SysID <code>255</code> and CompID <code>190</code>,
    and advertises <code>MAV_TYPE_GCS</code> in its heartbeat.
  </div>
  <div class="form-tips mav-role-hint" id="mav-role-hint-companion" style="margin-bottom:8px;display:none;">
    Only if Node-RED runs <b>on the airframe</b> — an off-vehicle controller is a <b>GCS</b>.
  </div>
  <div class="form-tips mav-role-hint" id="mav-role-hint-custom" style="margin-bottom:8px;display:none;">
    <b>Custom</b> sets no conventions — pick the SysID/CompID and heartbeat type yourself.
  </div>
  <div class="form-row">
    <label for="node-config-input-sourceSystemId">Source SysID</label>
    <input type="number" id="node-config-input-sourceSystemId" min="1" max="255">
  </div>
  <div class="form-row">
    <label for="node-config-input-sourceComponentId">Source CompID</label>
    <select id="node-config-input-sourceComponentId"></select>
  </div>
  <div class="form-tips" id="mav-companion-ids-note" style="margin-bottom:8px;display:none;">
    <b>Source SysID</b> is derived from the Vehicle Profile on the bound Connection —
    a companion is a component of the vehicle's system. Use the <b>Custom</b> role to
    set it yourself. <b>CompID</b> is yours to pick: MAVLink reserves
    <code>191</code>-<code>194</code> for onboard computers, so a second companion on
    the same Connection takes the next slot.
  </div>
  <div class="form-row">
    <label for="node-config-input-heartbeatType">HB Type</label>
    <select id="node-config-input-heartbeatType"></select>
  </div>
  <div class="form-row">
    <label for="node-config-input-heartbeatAutopilot">HB Autopilot</label>
    <select id="node-config-input-heartbeatAutopilot"></select>
  </div>
  <div class="form-row">
    <label for="node-config-input-heartbeatIntervalMs">HB Interval (ms)</label>
    <input type="number" id="node-config-input-heartbeatIntervalMs" min="1" placeholder="1000">
  </div>
</script>

<script type="text/html" data-help-name="mavlink-local-identity">
  <p>A <b>Local MAVLink Identity</b> is who this Node-RED runtime <em>is</em> when it transmits:
  the source SysID/CompID stamped into outbound frames, the HEARTBEAT identity it advertises,
  and that heartbeat's interval. The default interval is <code>1000 ms</code>, the usual 1 Hz
  MAVLink convention.</p>
  <p>Three independent concerns:</p>
  <ul>
    <li><b>Local Identity</b> (this node) — who Node-RED is on the wire.</li>
    <li><b>Vehicle Profile</b> — what vehicle is being addressed (dialect, firmware, modes, params).</li>
    <li><b>Connection</b> — how traffic moves, which identities are permitted on that link.</li>
  </ul>
  <h3>Roles</h3>
  <ul>
    <li><b>GCS</b> — ground control station. Suggested SysID <code>255</code> / CompID <code>190</code>,
    heartbeat <code>MAV_TYPE_GCS</code> with <code>MAV_AUTOPILOT_INVALID</code>.</li>
    <li><b>Onboard companion</b> — a computer riding on the airframe. SysID is derived from the
    Vehicle Profile on the Connection (it IS a component of that vehicle's system); CompID is
    yours, suggested from MAVLink's four onboard-computer slots <code>191</code>-<code>194</code>.
    Heartbeat <code>MAV_TYPE_ONBOARD_CONTROLLER</code>.</li>
    <li><b>Custom</b> — set everything yourself (test rigs, simulated components, unusual stacks).</li>
  </ul>
  <p>A role is a starting point, not a quota. Nothing limits how many identities of a role you
  create or how many one Connection binds. The one rule the Connection enforces is that no two
  identities it binds share a source SysID/CompID pair, because that pair is the identity on the
  wire.</p>
  <p>Which half you vary follows what the thing <i>is</i>. A SysID names a system, a CompID a
  component within it. Two ground stations are two systems: each is a <b>GCS</b> with its own SysID
  (<code>255</code>, <code>254</code>…), since MAVLink defines a single ground-station component,
  <code>190</code>. Two companions are two components of one airframe: each keeps the SysID it derives
  from the vehicle and takes its own onboard-computer slot. Same SysID with different CompIDs says
  "one station, several components" — right for a GCS app beside a co-located logger, wrong for two
  operators.</p>
  <h3>MAVLink 2 signing</h3>
  <p>Signing is configured on the <b>Connection</b>, not here. A MAVLink link has one shared key,
  so the credential and sign/verify/require policy belong to the secured link — one identity can
  talk signed on one connection and unsigned on another.</p>
</script>
